name: Feature request
description: Propose a feature or a change to how Halo works.
labels: [enhancement]
body:
  - type: textarea
    id: problem
    attributes:
      label: Problem
      description: What you are trying to do, and why Halo does not let you do it today.
    validations:
      required: true
  - type: textarea
    id: proposal
    attributes:
      label: Proposal
      description: How you would like it to work. Name the standard, or the product you know it from, if there is one.
  - type: textarea
    id: workaround
    attributes:
      label: Workaround
      description: What you do today instead.
