{{- if .Values.ingress.enabled }}
{{- $host := (urlParse (required "publicUrl is required" .Values.publicUrl)).hostname -}}
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: {{ include "halo.fullname" . }}
  labels:
    {{- include "halo.labels" (dict "root" . "component" "web") | nindent 4 }}
  {{- with .Values.ingress.annotations }}
  annotations:
    {{- toYaml . | nindent 4 }}
  {{- end }}
spec:
  {{- with .Values.ingress.className }}
  ingressClassName: {{ . }}
  {{- end }}
  {{- with .Values.ingress.tlsSecretName }}
  tls:
    - hosts: [{{ $host | quote }}]
      secretName: {{ . }}
  {{- end }}
  rules:
    - host: {{ $host | quote }}
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: {{ include "halo.fullname" . }}-web
                port:
                  name: http
{{- end }}
