{{- $ctx := dict "root" . "component" "server" -}}
apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "halo.fullname" . }}-server
  labels:
    {{- include "halo.labels" $ctx | nindent 4 }}
spec:
  replicas: 1
  strategy:
    type: Recreate
  selector:
    matchLabels:
      {{- include "halo.selectorLabels" $ctx | nindent 6 }}
  template:
    metadata:
      labels:
        {{- include "halo.labels" $ctx | nindent 8 }}
    spec:
      {{- with .Values.imagePullSecrets }}
      imagePullSecrets:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      enableServiceLinks: false
      securityContext:
        {{- toYaml .Values.server.podSecurityContext | nindent 8 }}
      containers:
        - name: server
          image: {{ include "halo.image" (dict "root" . "image" .Values.server.image) }}
          imagePullPolicy: {{ .Values.server.image.pullPolicy }}
          args: [serve]
          env:
            - name: HALO_PUBLIC_URL
              value: {{ required "publicUrl is required, for example https://auth.example.com" .Values.publicUrl | quote }}
            {{- with .Values.organization }}
            - name: HALO_ORGANIZATION
              value: {{ . | quote }}
            {{- end }}
            {{- with .Values.trustedProxies }}
            - name: HALO_TRUSTED_PROXIES
              value: {{ . | quote }}
            {{- end }}
            {{- if .Values.radius.enabled }}
            - name: HALO_RADIUS_LISTEN
              value: {{ printf ":%v" .Values.radius.port | quote }}
            {{- end }}
            {{- with .Values.vault.address }}
            - name: HALO_VAULT_ADDR
              value: {{ . | quote }}
            {{- end }}
            {{- with .Values.vault.namespace }}
            - name: HALO_VAULT_NAMESPACE
              value: {{ . | quote }}
            {{- end }}
            {{- with .Values.vault.transitMount }}
            - name: HALO_VAULT_TRANSIT_MOUNT
              value: {{ . | quote }}
            {{- end }}
            {{- with .Values.vault.wrappingKey }}
            - name: HALO_VAULT_WRAPPING_KEY
              value: {{ . | quote }}
            {{- end }}
            {{- if .Values.vault.signing }}
            - name: HALO_VAULT_SIGNING
              value: "1"
            {{- end }}
            {{- if .Values.metrics.enabled }}
            - name: HALO_METRICS_LISTEN
              value: {{ printf ":%v" .Values.metrics.port | quote }}
            {{- end }}
            {{- range $name, $value := .Values.server.env }}
            - name: {{ $name }}
              value: {{ $value | quote }}
            {{- end }}
          envFrom:
            - secretRef:
                name: {{ required "existingSecret is required: a Secret holding HALO_SECRET_KEY and HALO_DATABASE_URL" .Values.existingSecret }}
          ports:
            - name: http
              containerPort: 8080
            {{- if .Values.radius.enabled }}
            - name: radius
              containerPort: {{ .Values.radius.port }}
              protocol: UDP
            {{- end }}
            {{- if .Values.metrics.enabled }}
            - name: metrics
              containerPort: {{ .Values.metrics.port }}
            {{- end }}
          startupProbe:
            httpGet:
              path: /healthz
              port: http
            periodSeconds: 5
            failureThreshold: 60
          readinessProbe:
            httpGet:
              path: /healthz
              port: http
            periodSeconds: 10
          livenessProbe:
            tcpSocket:
              port: http
            periodSeconds: 20
          resources:
            {{- toYaml .Values.server.resources | nindent 12 }}
          securityContext:
            {{- toYaml .Values.server.securityContext | nindent 12 }}
      {{- with .Values.server.nodeSelector }}
      nodeSelector:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.server.tolerations }}
      tolerations:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.server.affinity }}
      affinity:
        {{- toYaml . | nindent 8 }}
      {{- end }}
---
apiVersion: v1
kind: Service
metadata:
  name: halo-server
  labels:
    {{- include "halo.labels" $ctx | nindent 4 }}
spec:
  selector:
    {{- include "halo.selectorLabels" $ctx | nindent 4 }}
  ports:
    - name: http
      port: 8080
      targetPort: http
    {{- if .Values.metrics.enabled }}
    - name: metrics
      port: {{ .Values.metrics.port }}
      targetPort: metrics
    {{- end }}
{{- if .Values.radius.enabled }}
---
apiVersion: v1
kind: Service
metadata:
  name: {{ include "halo.fullname" . }}-radius
  labels:
    {{- include "halo.labels" $ctx | nindent 4 }}
spec:
  type: {{ .Values.radius.serviceType }}
  {{- if ne .Values.radius.serviceType "ClusterIP" }}
  externalTrafficPolicy: Local
  {{- end }}
  selector:
    {{- include "halo.selectorLabels" $ctx | nindent 4 }}
  ports:
    - name: radius
      port: {{ .Values.radius.port }}
      targetPort: radius
      protocol: UDP
    - name: radius-accounting
      port: {{ add .Values.radius.port 1 }}
      targetPort: radius
      protocol: UDP
{{- end }}
