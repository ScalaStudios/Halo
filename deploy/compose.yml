name: halo

services:
  postgres:
    image: postgres:17-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: halo
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD in .env}
      POSTGRES_DB: halo
    volumes:
      - postgres:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U halo -d halo"]
      interval: 5s
      timeout: 5s
      retries: 30
    networks: [halo]

  halo-server:
    image: ghcr.io/scalastudios/halo-server:0.1.1
    restart: unless-stopped
    env_file: .env
    environment:
      HALO_PUBLIC_URL: https://${HALO_DOMAIN}
      HALO_DATABASE_URL: postgres://halo:${POSTGRES_PASSWORD}@postgres:5432/halo
      HALO_TRUSTED_PROXIES: 172.31.250.0/24
    depends_on:
      postgres:
        condition: service_healthy
    networks: [halo]

  halo-web:
    image: ghcr.io/scalastudios/halo-web:0.1.1
    restart: unless-stopped
    environment:
      HALO_API_URL: http://halo-server:8080
    depends_on:
      - halo-server
    healthcheck:
      test: ["CMD", "wget", "-q", "-O", "/dev/null", "http://halo-server:8080/healthz"]
      interval: 10s
      timeout: 5s
      retries: 30
    networks: [halo]

  caddy:
    image: caddy:2
    restart: unless-stopped
    environment:
      HALO_DOMAIN: ${HALO_DOMAIN:?set HALO_DOMAIN in .env}
    ports:
      - "80:80"
      - "443:443"
      - "443:443/udp"
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy-data:/data
      - caddy-config:/config
    depends_on:
      halo-web:
        condition: service_healthy
    networks: [halo]

networks:
  halo:
    ipam:
      config:
        - subnet: 172.31.250.0/24

volumes:
  postgres:
  caddy-data:
  caddy-config:
