        '400': {$ref: '#/components/responses/BadJSON'}
        '401': {$ref: '#/components/responses/Unauthenticated'}
        '403': {$ref: '#/components/responses/Forbidden'}
        '404': {$ref: '#/components/responses/NotFound'}
        '409': {$ref: '#/components/responses/Conflict'}
        '422': {$ref: '#/components/responses/Invalid'}
    delete:
      tags: [Identity providers]
      operationId: deleteIdentityProvider
      summary: Delete an identity provider and unlink its accounts
      description: 'Roles: security administrator.'
      responses:
        '204': {$ref: '#/components/responses/NoContent'}
        '401': {$ref: '#/components/responses/Unauthenticated'}
        '403': {$ref: '#/components/responses/Forbidden'}
        '404': {$ref: '#/components/responses/NotFound'}
  /identity-providers/{id}/enable:
    parameters:
      - {$ref: '#/components/parameters/Id'}
    post:
      tags: [Identity providers]
      operationId: enableIdentityProvider
      summary: Turn on sign-in with a provider
      description: 'Roles: security administrator.'
      responses:
        '200': {$ref: '#/components/responses/IdentityProviderResponse'}
        '401': {$ref: '#/components/responses/Unauthenticated'}
        '403': {$ref: '#/components/responses/Forbidden'}
        '404': {$ref: '#/components/responses/NotFound'}
  /identity-providers/{id}/disable:
    parameters:
      - {$ref: '#/components/parameters/Id'}
    post:
      tags: [Identity providers]
      operationId: disableIdentityProvider
      summary: Turn off sign-in with a provider
      description: 'Roles: security administrator. Linked accounts stay linked.'
      responses:
        '200': {$ref: '#/components/responses/IdentityProviderResponse'}
        '401': {$ref: '#/components/responses/Unauthenticated'}
        '403': {$ref: '#/components/responses/Forbidden'}
        '404': {$ref: '#/components/responses/NotFound'}
  /settings:
    get:
      tags: [Settings]
      operationId: getSettings
      summary: Get the organization settings
      description: 'Roles: any administrator.'
      responses:
        '200': {$ref: '#/components/responses/SettingsResponse'}
        '401': {$ref: '#/components/responses/Unauthenticated'}
        '403': {$ref: '#/components/responses/Forbidden'}
    patch:
      tags: [Settings]
      operationId: updateSettings
      summary: Change organization settings
      description: 'Roles: security administrator. Only a global administrator can change `organizationName`, `contactEmail` and `signInMessage`. Send only the fields to change. Token lifetimes apply to applications created afterwards.'
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: '#/components/schemas/Settings'}
      responses:
        '200': {$ref: '#/components/responses/SettingsResponse'}
        '400': {$ref: '#/components/responses/BadJSON'}
        '401': {$ref: '#/components/responses/Unauthenticated'}
        '403': {$ref: '#/components/responses/Forbidden'}
        '422': {$ref: '#/components/responses/Invalid'}
  /domains:
    get:
      tags: [Settings]
      operationId: listDomains
      summary: List domains and their verification state
      description: 'Roles: any administrator.'
      responses:
        '200':
          description: The domains.
          content:
            application/json:
              schema:
                type: array
                items: {$ref: '#/components/schemas/Domain'}
        '401': {$ref: '#/components/responses/Unauthenticated'}
        '403': {$ref: '#/components/responses/Forbidden'}
    post:
      tags: [Settings]
      operationId: addDomain
      summary: Add a domain to verify
      description: 'Roles: global administrator. Publish `halo-verification=<token>` as a TXT record on the domain, then verify it.'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [name]
              properties:
                name: {type: string, examples: [example.com]}
      responses:
        '201':
          description: The domain with its verification token.
          content:
            application/json:
              schema: {$ref: '#/components/schemas/Domain'}
        '400': {$ref: '#/components/responses/BadJSON'}
        '401': {$ref: '#/components/responses/Unauthenticated'}
        '403': {$ref: '#/components/responses/Forbidden'}
        '409': {$ref: '#/components/responses/Conflict'}
        '422': {$ref: '#/components/responses/Invalid'}
  /domains/{id}/verify:
    parameters:
      - {$ref: '#/components/parameters/Id'}
    post:
      tags: [Settings]
      operationId: verifyDomain
      summary: Check the domain's TXT record
      description: 'Roles: global administrator.'
      responses:
        '200':
          description: The verified domain.
          content:
            application/json:
              schema: {$ref: '#/components/schemas/Domain'}
        '401': {$ref: '#/components/responses/Unauthenticated'}
        '403': {$ref: '#/components/responses/Forbidden'}
        '404': {$ref: '#/components/responses/NotFound'}
        '422':
          description: '`ERR_NOT_VERIFIED`: no TXT record with the token was found.'
          content:
            application/json:
              schema: {$ref: '#/components/schemas/Error'}
  /domains/{id}:
    parameters:
      - {$ref: '#/components/parameters/Id'}
    delete:
      tags: [Settings]
      operationId: deleteDomain
      summary: Remove a domain
      description: 'Roles: global administrator.'
      responses:
        '204': {$ref: '#/components/responses/NoContent'}
        '401': {$ref: '#/components/responses/Unauthenticated'}
        '403': {$ref: '#/components/responses/Forbidden'}
        '404': {$ref: '#/components/responses/NotFound'}
  /export:
    get:
      tags: [Settings]
      operationId: exportOrganization
      summary: Download the organization as JSON
      description: 'Roles: global administrator. Streams the organization, settings, users, groups, memberships, roles, applications, policies, access packages and access reviews as one JSON document, without secrets. Writes an audit event.'
      responses:
        '200':
          description: A JSON attachment named `halo-export-YYYY-MM-DD.json`.
          content:
            application/json:
              schema:
                type: object
                properties:
                  exportedAt: {type: string, format: date-time}
                  organization: {$ref: '#/components/schemas/Organization'}
                  settings: {$ref: '#/components/schemas/Settings'}
                  users: {type: array, items: {type: object}}
                  groups: {type: array, items: {type: object}}
                  memberships: {type: array, items: {type: object}}
                  roles: {type: array, items: {type: object}}
                  applications: {type: array, items: {type: object}}
                  policies: {type: array, items: {type: object}}
                  accessPackages: {type: array, items: {type: object}}
                  accessReviews: {type: array, items: {type: object}}
        '401': {$ref: '#/components/responses/Unauthenticated'}
        '403': {$ref: '#/components/responses/Forbidden'}
  /signing-keys:
    get:
      tags: [Settings]
      operationId: listSigningKeys
      summary: List the OpenID Connect signing keys and SAML certificates
      description: 'Roles: any administrator.'
      responses:
        '200': {$ref: '#/components/responses/SigningKeysResponse'}
        '401': {$ref: '#/components/responses/Unauthenticated'}
        '403': {$ref: '#/components/responses/Forbidden'}
  /signing-keys/rotate:
    post:
      tags: [Settings]
      operationId: rotateSigningKey
      summary: Create a new OpenID Connect signing key
      description: 'Roles: global administrator. The new RS256 key signs tokens from now on. Previous keys stay in the JWKS for 7 days so tokens they signed still verify, then an hourly job retires them. Writes an audit event.'
      responses:
        '200': {$ref: '#/components/responses/SigningKeysResponse'}
        '401': {$ref: '#/components/responses/Unauthenticated'}
        '403': {$ref: '#/components/responses/Forbidden'}
  /saml/certificate/rotate:
    post:
      tags: [Settings]
      operationId: rotateSAMLCertificate
      summary: Create a new SAML signing certificate
      description: 'Roles: global administrator. The new key and certificate sign SAML responses from now on, and the previous certificate is listed with `retiredAt` until you remove it. Update every SAML application with the new certificate. Writes an audit event.'
      responses:
        '200': {$ref: '#/components/responses/SigningKeysResponse'}
        '401': {$ref: '#/components/responses/Unauthenticated'}
        '403': {$ref: '#/components/responses/Forbidden'}
  /saml/certificates/{id}:
    parameters:
      - {$ref: '#/components/parameters/Id'}
    delete:
      tags: [Settings]
      operationId: deleteSAMLCertificate
      summary: Remove a previous SAML certificate
      description: 'Roles: global administrator. Only certificates replaced by a rotation can be removed; the current one answers `404`. Writes an audit event.'
      responses:
        '204': {$ref: '#/components/responses/NoContent'}
        '401': {$ref: '#/components/responses/Unauthenticated'}
        '403': {$ref: '#/components/responses/Forbidden'}
        '404': {$ref: '#/components/responses/NotFound'}
  /webhooks:
    get:
      tags: [Webhooks]
      operationId: listWebhooks
      summary: List webhook endpoints
      description: 'Roles: any administrator.'
      responses:
        '200':
          description: The endpoints.
          content:
            application/json:
              schema:
                type: array
                items: {$ref: '#/components/schemas/Webhook'}
        '401': {$ref: '#/components/responses/Unauthenticated'}
        '403': {$ref: '#/components/responses/Forbidden'}
    post:
      tags: [Webhooks]
      operationId: createWebhook
      summary: Add a webhook endpoint
      description: 'Roles: security administrator. The signing secret is returned once.'
      requestBody: {$ref: '#/components/requestBodies/WebhookInput'}
      responses:
        '201':
          description: The endpoint and its signing secret.
          content:
            application/json:
              schema:
                type: object
                required: [webhook, secret]
                properties:
                  webhook: {$ref: '#/components/schemas/Webhook'}
                  secret: {type: string, examples: [whsec_…]}
        '400': {$ref: '#/components/responses/BadJSON'}
        '401': {$ref: '#/components/responses/Unauthenticated'}
        '403': {$ref: '#/components/responses/Forbidden'}
        '422': {$ref: '#/components/responses/Invalid'}
  /webhooks/event-types:
    get:
      tags: [Webhooks]
      operationId: listWebhookEventTypes
      summary: List the event families you can subscribe to
      description: 'Roles: any administrator.'
      responses:
        '200':
          description: Patterns such as `user.*` and `sign_in.*`.
          content:
            application/json:
              schema:
                type: array
                items: {type: string}
        '401': {$ref: '#/components/responses/Unauthenticated'}
        '403': {$ref: '#/components/responses/Forbidden'}
  /webhooks/{id}:
    parameters:
      - {$ref: '#/components/parameters/Id'}
    get:
      tags: [Webhooks]
      operationId: getWebhook
      summary: Get an endpoint with its 50 most recent deliveries
      description: 'Roles: any administrator.'
      responses:
        '200':
          description: The endpoint and its deliveries.
          content:
            application/json:
              schema:
                type: object
                required: [webhook, deliveries]
                properties:
                  webhook: {$ref: '#/components/schemas/Webhook'}
                  deliveries:
                    type: array
                    items: {$ref: '#/components/schemas/WebhookDelivery'}
        '401': {$ref: '#/components/responses/Unauthenticated'}
        '403': {$ref: '#/components/responses/Forbidden'}
        '404': {$ref: '#/components/responses/NotFound'}
    put:
      tags: [Webhooks]
      operationId: updateWebhook
      summary: Replace an endpoint's settings
      description: 'Roles: security administrator. Omitting `enabled` turns the endpoint on. The secret does not change.'
      requestBody: {$ref: '#/components/requestBodies/WebhookInput'}
      responses:
        '200':
          description: The endpoint.
          content:
            application/json:
              schema: {$ref: '#/components/schemas/Webhook'}
        '400': {$ref: '#/components/responses/BadJSON'}
        '401': {$ref: '#/components/responses/Unauthenticated'}
        '403': {$ref: '#/components/responses/Forbidden'}
        '404': {$ref: '#/components/responses/NotFound'}
        '422': {$ref: '#/components/responses/Invalid'}
    delete:
      tags: [Webhooks]
      operationId: deleteWebhook
      summary: Delete an endpoint and its delivery log
      description: 'Roles: security administrator.'
      responses:
        '204': {$ref: '#/components/responses/NoContent'}
        '401': {$ref: '#/components/responses/Unauthenticated'}
        '403': {$ref: '#/components/responses/Forbidden'}
        '404': {$ref: '#/components/responses/NotFound'}
  /webhooks/{id}/test:
    parameters:
      - {$ref: '#/components/parameters/Id'}
    post:
      tags: [Webhooks]
      operationId: testWebhook
      summary: Send a `webhook.test` event now
      description: 'Roles: security administrator. Answers with the delivery after the first attempt; a failed attempt is retried like any other delivery.'
      responses:
        '200':
          description: The delivery.
          content:
            application/json:
              schema: {$ref: '#/components/schemas/WebhookDelivery'}
        '401': {$ref: '#/components/responses/Unauthenticated'}
        '403': {$ref: '#/components/responses/Forbidden'}
        '404': {$ref: '#/components/responses/NotFound'}
  /api-resources:
    get:
      tags: [API resources]
      operationId: listApiResources
      summary: List API resources
      description: 'Roles: any administrator.'
      responses:
        '200':
          description: The resources with their scopes and grants.
          content:
            application/json:
              schema:
                type: array
                items: {$ref: '#/components/schemas/ApiResource'}
        '401': {$ref: '#/components/responses/Unauthenticated'}
        '403': {$ref: '#/components/responses/Forbidden'}
    post:
      tags: [API resources]
      operationId: createApiResource
      summary: Add an API resource
      description: 'Roles: application administrator.'
      requestBody: {$ref: '#/components/requestBodies/ApiResourceInput'}
      responses:
        '201': {$ref: '#/components/responses/ApiResourceResponse'}
        '400': {$ref: '#/components/responses/BadJSON'}
        '401': {$ref: '#/components/responses/Unauthenticated'}
        '403': {$ref: '#/components/responses/Forbidden'}
        '409': {$ref: '#/components/responses/Conflict'}
        '422': {$ref: '#/components/responses/Invalid'}
  /api-resources/{id}:
    parameters:
      - {$ref: '#/components/parameters/Id'}
    get:
      tags: [API resources]
      operationId: getApiResource
      summary: Get one API resource
      description: 'Roles: any administrator.'
      responses:
        '200': {$ref: '#/components/responses/ApiResourceResponse'}
        '401': {$ref: '#/components/responses/Unauthenticated'}
        '403': {$ref: '#/components/responses/Forbidden'}
        '404': {$ref: '#/components/responses/NotFound'}
    put:
      tags: [API resources]
      operationId: updateApiResource
      summary: Replace an API resource
      description: 'Roles: application administrator.'
      requestBody: {$ref: '#/components/requestBodies/ApiResourceInput'}
      responses:
        '200': {$ref: '#/components/responses/ApiResourceResponse'}
        '400': {$ref: '#/components/responses/BadJSON'}
        '401': {$ref: '#/components/responses/Unauthenticated'}
        '403': {$ref: '#/components/responses/Forbidden'}
        '404': {$ref: '#/components/responses/NotFound'}
        '409': {$ref: '#/components/responses/Conflict'}
        '422': {$ref: '#/components/responses/Invalid'}
    delete:
      tags: [API resources]
      operationId: deleteApiResource
      summary: Delete an API resource and its grants
      description: 'Roles: application administrator.'
      responses:
        '204': {$ref: '#/components/responses/NoContent'}
        '401': {$ref: '#/components/responses/Unauthenticated'}
        '403': {$ref: '#/components/responses/Forbidden'}
        '404': {$ref: '#/components/responses/NotFound'}
  /api-resources/{id}/grants/{appId}:
    parameters:
      - {$ref: '#/components/parameters/Id'}
      - name: appId
        in: path
        required: true
        schema: {type: string}
    put:
      tags: [API resources]
      operationId: setApiResourceGrant
      summary: Replace the scopes an application may request on an API
      description: 'Roles: application administrator. OpenID Connect and OAuth applications only. Send the complete list; an empty list removes the grant.'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [scopes]
              properties:
                scopes:
                  type: array
                  items: {type: string, examples: ['billing:read']}
      responses:
        '200': {$ref: '#/components/responses/ApiResourceResponse'}
        '400': {$ref: '#/components/responses/BadJSON'}
        '401': {$ref: '#/components/responses/Unauthenticated'}
        '403': {$ref: '#/components/responses/Forbidden'}
        '404': {$ref: '#/components/responses/NotFound'}
        '422': {$ref: '#/components/responses/Invalid'}
  /ssh/ca.pub:
    get:
      tags: [SSH]
      operationId: getSSHCAPublicKey
      summary: Get the SSH certificate authority's public key
      description: The line to put in sshd's `TrustedUserCAKeys` file. Halo creates the authority the first time it is needed.
      security: []
      responses:
        '200':
          description: One OpenSSH public key line.
          content:
            text/plain:
              schema: {type: string, examples: ['ssh-ed25519 AAAAC3NzaC1lZDI1NTE5AAAAI…']}
  /ssh/authority:
    get:
      tags: [SSH]
      operationId: getSSHAuthority
      summary: Get the SSH certificate authority
      description: 'Roles: any administrator.'
      responses:
        '200': {$ref: '#/components/responses/SSHAuthorityResponse'}
        '401': {$ref: '#/components/responses/Unauthenticated'}
        '403': {$ref: '#/components/responses/Forbidden'}
    put:
      tags: [SSH]
      operationId: setSSHCertificateLifetime
      summary: Set how long certificates last
      description: 'Roles: security administrator.'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [certificateLifetime]
              properties:
                certificateLifetime: {type: integer, minimum: 300, maximum: 86400, description: Seconds.}
      responses:
        '200': {$ref: '#/components/responses/SSHAuthorityResponse'}
        '400': {$ref: '#/components/responses/BadJSON'}
        '401': {$ref: '#/components/responses/Unauthenticated'}
        '403': {$ref: '#/components/responses/Forbidden'}
        '422': {$ref: '#/components/responses/Invalid'}
  /ssh/principal-mappings:
    get:
      tags: [SSH]
      operationId: listSSHPrincipalMappings
      summary: List group to principal mappings
      description: 'Roles: any administrator.'
      responses:
        '200':
          description: The mappings.
          content:
            application/json:
              schema:
                type: array
                items: {$ref: '#/components/schemas/SSHPrincipalMapping'}
        '401': {$ref: '#/components/responses/Unauthenticated'}
        '403': {$ref: '#/components/responses/Forbidden'}
    post:
      tags: [SSH]
      operationId: createSSHPrincipalMapping
      summary: Map a group to unix account names
      description: 'Roles: security administrator. One mapping per group.'
      requestBody: {$ref: '#/components/requestBodies/SSHPrincipalMappingInput'}
      responses:
        '201': {$ref: '#/components/responses/SSHPrincipalMappingResponse'}
        '400': {$ref: '#/components/responses/BadJSON'}
        '401': {$ref: '#/components/responses/Unauthenticated'}
        '403': {$ref: '#/components/responses/Forbidden'}
        '409': {$ref: '#/components/responses/Conflict'}
        '422': {$ref: '#/components/responses/Invalid'}
  /ssh/principal-mappings/{id}:
    parameters:
      - {$ref: '#/components/parameters/Id'}
    put:
      tags: [SSH]
      operationId: updateSSHPrincipalMapping
      summary: Replace a mapping
      description: 'Roles: security administrator.'
      requestBody: {$ref: '#/components/requestBodies/SSHPrincipalMappingInput'}
      responses:
        '200': {$ref: '#/components/responses/SSHPrincipalMappingResponse'}
        '400': {$ref: '#/components/responses/BadJSON'}
        '401': {$ref: '#/components/responses/Unauthenticated'}
        '403': {$ref: '#/components/responses/Forbidden'}
        '404': {$ref: '#/components/responses/NotFound'}
        '409': {$ref: '#/components/responses/Conflict'}
        '422': {$ref: '#/components/responses/Invalid'}
    delete:
      tags: [SSH]
      operationId: deleteSSHPrincipalMapping
      summary: Remove a mapping
      description: 'Roles: security administrator. Certificates already issued stay valid until they expire.'
      responses:
        '204': {$ref: '#/components/responses/NoContent'}
        '401': {$ref: '#/components/responses/Unauthenticated'}
        '403': {$ref: '#/components/responses/Forbidden'}
        '404': {$ref: '#/components/responses/NotFound'}
  /ssh/certificates:
    get:
      tags: [SSH]
      operationId: listSSHCertificates
      summary: List the 200 most recently issued certificates
      description: 'Roles: any administrator.'
      responses:
        '200':
          description: The certificates, newest first.
          content:
            application/json:
              schema:
                type: array
                items: {$ref: '#/components/schemas/SSHCertificate'}
        '401': {$ref: '#/components/responses/Unauthenticated'}
        '403': {$ref: '#/components/responses/Forbidden'}
  /dev/outbox:
    get:
      tags: [Development]
      operationId: listOutbox
      summary: List the 50 most recent emails in the outbox
      description: 'Roles: global administrator. Exists only when the server runs with `HALO_DEV=1`.'
      responses:
        '200':
          description: The messages, newest first, with their decrypted text.
          content:
            application/json:
              schema:
                type: array
                items: {$ref: '#/components/schemas/OutboxMessage'}
        '401': {$ref: '#/components/responses/Unauthenticated'}
        '403': {$ref: '#/components/responses/Forbidden'}
components:
  securitySchemes:
    session:
      type: apiKey
      in: cookie
      name: halo_session
      description: The session cookie Halo sets when a person signs in.
    apiKey:
      type: http
      scheme: bearer
      description: An API key of a service account, starting with `hlk_`, with the `api` scope. Requests act with the service account's roles.
    cliAccessToken:
      type: http
      scheme: bearer
      bearerFormat: JWT
      description: An access token that `halo login` obtained for the built-in Halo CLI application. Accepted only on routes under `/me/`.
  parameters:
    Id:
      name: id
      in: path
      required: true
      schema: {type: string}
    UserId:
      name: userId
      in: path
      required: true
      schema: {type: string, examples: [usr_01J9Z8Q4M2N5P7R9T1V3X5Z7B9]}
    DeviceCode:
      name: code
      in: path
      required: true
      description: The user code shown by the device, such as `BCDF-GHJK`. Case, spaces and the dash are ignored.
      schema: {type: string}
    Limit:
      name: limit
      in: query
      description: How many events to return, 1 to 1000. Defaults to 500.
      schema: {type: integer, minimum: 1, maximum: 1000, default: 500}
  requestBodies:
    CodeSignIn:
      required: true
      content:
        application/json:
          schema:
            type: object
            required: [email, code]
            properties:
              email: {type: string, format: email}
              code: {type: string}
              authRequest: {$ref: '#/components/schemas/AuthRequestId'}
    DecisionNote:
      content:
        application/json:
          schema:
            type: object
            properties:
              note: {type: string, maxLength: 2000, description: Shown to the requester.}
    AccessPackageInput:
      required: true
      content:
        application/json:
          schema:
            type: object
            required: [name, groupIds]
            properties:
              name: {type: string, maxLength: 200}
              description: {type: string, maxLength: 2000}
              ownerId: {type: [string, 'null']}
              groupIds:
                type: array
                minItems: 1
                description: Assigned groups only.
                items: {type: string}
              approverIds:
                type: array
                description: Without approvers, only a global administrator can decide requests.
                items: {type: string}
              maxDays:
                type: [integer, 'null']
                minimum: 1
                maximum: 365
                description: The longest duration people can request. `null` allows access until it is revoked.
              requireJustification: {type: boolean}
              archived: {type: boolean}
    LifecycleRuleInput:
      required: true
      content:
        application/json:
          schema:
            type: object
            required: [name, trigger, actions]
            properties:
              name: {type: string, maxLength: 200}
              trigger: {type: string, enum: [joiner, mover, leaver]}
              condition:
                type: [string, 'null']
                description: A group rule the person must match. Empty or null matches everyone.
                examples: ['user.department == "Engineering"']
              actions:
                type: array
                minItems: 1
                maxItems: 10
                items: {$ref: '#/components/schemas/LifecycleAction'}
              enabled: {type: boolean}
    PolicyInput:
      required: true
      content:
        application/json:
          schema:
            type: object
            required: [name, mode, effect, conditions]
            properties:
              name: {type: string, maxLength: 200}
              description: {type: string, maxLength: 2000}
              enabled: {type: boolean}
              mode: {type: string, enum: [enforce, report]}
              effect: {type: string, enum: [allow, require-phishing-resistant, block]}
              conditions: {$ref: '#/components/schemas/PolicyConditions'}
    NetworkZoneInput:
      required: true
      content:
        application/json:
          schema:
            type: object
            required: [name, kind, cidrs]
            properties:
              name: {type: string, maxLength: 200}
              kind: {type: string, enum: [trusted, risky]}
              cidrs:
                type: array
                minItems: 1
                maxItems: 500
                description: IPv4 or IPv6 ranges or single addresses. Halo normalizes them to CIDR notation.
                items: {type: string, examples: [203.0.113.0/24]}
    IdentityProviderInput:
      required: true
      content:
        application/json:
          schema:
            type: object
            required: [kind, name, clientId]
            properties:
              kind: {$ref: '#/components/schemas/ProviderKind'}
              name: {type: string, maxLength: 100, description: 'Shown on the button, as in "Continue with Google".'}
              issuer:
                type: string
                description: 'Ignored for Google. For Microsoft, `https://login.microsoftonline.com/<tenant id>/v2.0`. For GitHub, the GitHub Enterprise address, defaulting to https://github.com. For generic OpenID Connect, the issuer with discovery.'
              clientId: {type: string}
              clientSecret: {type: string, description: Required except for generic OpenID Connect providers. Omit on update to keep the saved secret.}
              scopes:
                type: array
                description: Defaults to openid, email and profile; read:user and user:email for GitHub. Halo adds openid for every kind except GitHub.
                items: {type: string}
              enabled: {type: boolean}
              showOnSignIn: {type: boolean}
              allowedDomains:
                type: array
                description: Email domains allowed to sign in with this provider. Empty allows every domain.
                items: {type: string, examples: [example.com]}
              jit: {type: boolean, description: Create an account on first sign-in. Requires at least one allowed domain.}
              jitGroupIds:
                type: array
                description: Assigned groups that accounts created on first sign-in join.
                items: {type: string}
    WebhookInput:
      required: true
      content:
        application/json:
          schema:
            type: object
            required: [url, events]
            properties:
              url: {type: string, format: uri, maxLength: 2048, description: 'https, or http for localhost while you test.'}
              description: {type: string, maxLength: 200}
              events:
                type: array
                minItems: 1
                maxItems: 50
                description: Event types such as `user.invite`, families such as `user.*`, or `*` for every event.
                items: {type: string}
              enabled: {type: boolean, default: true}
    ApiResourceInput:
      required: true
      content:
        application/json:
          schema:
            type: object
            required: [name, identifier, accessTokenTtl, scopes]
            properties:
              name: {type: string, maxLength: 200}
              identifier: {type: string, format: uri, maxLength: 300, description: 'The audience access tokens carry in `aud`.', examples: [https://billing.example.com]}
              description: {type: string, maxLength: 500}
              accessTokenTtl: {type: integer, minimum: 60, maximum: 86400}
              scopes:
                type: array
                minItems: 1
                maxItems: 100
                items: {$ref: '#/components/schemas/ApiScope'}
    SSHPrincipalMappingInput:
      required: true
      content:
        application/json:
          schema:
            type: object
            required: [groupId, principals]
            properties:
              groupId: {type: string}
              principals:
                type: array
                minItems: 1
                maxItems: 32
                items: {type: string, pattern: '^[a-z_][a-z0-9_.-]{0,31}$', examples: [ops]}
  responses:
    NoContent:
      description: Done. No body.
    BadJSON:
      description: '`ERR_INVALID_JSON`: the body is not valid JSON, is larger than 1 MiB, or has an unknown field.'
      content:
        application/json:
          schema: {$ref: '#/components/schemas/Error'}
    Unauthenticated:
      description: '`ERR_UNAUTHENTICATED`: no valid session or key.'
      content:
        application/json:
          schema: {$ref: '#/components/schemas/Error'}
    Forbidden:
      description: '`ERR_FORBIDDEN`: your roles do not allow this. `ERR_CROSS_SITE` on changes from another website.'
      content:
        application/json:
          schema: {$ref: '#/components/schemas/Error'}
    CrossSite:
      description: '`ERR_CROSS_SITE`: the request came from another website.'
      content:
        application/json:
          schema: {$ref: '#/components/schemas/Error'}
    NotFound:
      description: '`ERR_NOT_FOUND`: the item does not exist.'
      content:
        application/json:
          schema: {$ref: '#/components/schemas/Error'}
    Conflict:
      description: '`ERR_CONFLICT`: the change conflicts with the current state, such as a name that is already used.'
      content:
        application/json:
          schema: {$ref: '#/components/schemas/Error'}
    DynamicGroup:
      description: '`ERR_CONFLICT`: the group is dynamic, so its members come from its rule.'
      content:
        application/json:
          schema: {$ref: '#/components/schemas/Error'}
    Invalid:
      description: '`ERR_INVALID`: a field is missing or invalid. The message names it.'
      content:
        application/json:
          schema: {$ref: '#/components/schemas/Error'}
    NotConfigured:
      description: '`ERR_NOT_CONFIGURED`: provisioning is not set up for the application. `ERR_NOT_FOUND`: the application does not exist.'
      content:
        application/json:
          schema: {$ref: '#/components/schemas/Error'}
    LastMethod:
      description: '`ERR_LAST_METHOD`: it is your last way to sign in. Recovery codes do not count.'
      content:
        application/json:
          schema: {$ref: '#/components/schemas/Error'}
    AuthRequestExpired:
      description: '`ERR_AUTH_REQUEST_EXPIRED`: the application''s sign-in request expired or was already used.'
      content:
        application/json:
          schema: {$ref: '#/components/schemas/Error'}
    LinkExpired:
      description: '`ERR_LINK_EXPIRED`: the invite or reset link expired, was used, or was replaced by a newer one.'
      content:
        application/json:
          schema: {$ref: '#/components/schemas/Error'}
    Suspended:
      description: '`ERR_ACCOUNT_SUSPENDED`: the account is suspended or deprovisioned. Also `ERR_CROSS_SITE`.'
      content:
        application/json:
          schema: {$ref: '#/components/schemas/Error'}
    SignInRefused:
      description: '`ERR_ACCOUNT_SUSPENDED`, `ERR_NOT_ASSIGNED` (not in a group assigned to the application), `ERR_BLOCKED_BY_POLICY`, `ERR_STRONGER_AUTH_REQUIRED` (a policy requires a passkey or security key), or `ERR_CROSS_SITE`. Refused sign-ins are recorded in the sign-in log.'
      content:
        application/json:
          schema: {$ref: '#/components/schemas/Error'}
    CodeMismatch:
      description: '`ERR_CODE_MISMATCH`: the code did not match, was already used, or no account uses the address.'
      content:
        application/json:
          schema: {$ref: '#/components/schemas/Error'}
    TooManyAttempts:
      description: '`ERR_TOO_MANY_ATTEMPTS`: too many failed codes for this address within the lockout window.'
      content:
        application/json:
          schema: {$ref: '#/components/schemas/Error'}
    RegistrationFailed:
      description: '`ERR_CEREMONY_EXPIRED`: the setup step expired; start again. `ERR_REGISTRATION_FAILED`: Halo could not verify the new credential. `ERR_INVALID_JSON`.'
      content:
        application/json:
          schema: {$ref: '#/components/schemas/Error'}
    DecisionForbidden:
      description: '`ERR_SELF_APPROVAL`: you made the request yourself, which global administrators cannot decide either; the message names who can. `ERR_FORBIDDEN`: you are not an approver of the package. `ERR_CROSS_SITE`.'
      content:
        application/json:
          schema: {$ref: '#/components/schemas/Error'}
    DeviceCode:
      description: '`ERR_DEVICE_CODE`: the code is wrong, expired or already used.'
      content:
        application/json:
          schema: {$ref: '#/components/schemas/Error'}
    SignedIn:
      description: Signed in. Sets the `halo_session` cookie when a new session starts. `redirect` is the application's callback when the sign-in came from an application, otherwise `/account`.
      content:
        application/json:
          schema:
            type: object
            required: [redirect]
            properties:
              redirect: {type: string, examples: [/account, '/oauth2/authorize/callback?id=…']}
    Ceremony:
      description: A WebAuthn ceremony. Pass `options` to the browser's WebAuthn API and send the result with `ceremony` to the matching finish route within 5 minutes.
      content:
        application/json:
          schema:
            type: object
            required: [ceremony, options]
            properties:
              ceremony: {type: string}
              options: {type: object, description: WebAuthn credential request or creation options.}
    DeviceDecision:
      description: The decision was recorded.
      content:
        application/json:
          schema:
            type: object
            required: [approved, application]
            properties:
              approved: {type: boolean}
              application: {type: string, examples: [Halo CLI]}
    Revoked:
      description: The number of sessions ended.
      content:
        application/json:
          schema:
            type: object
            required: [revoked]
            properties:
              revoked: {type: integer}
    UserResponse:
      description: The person.
      content:
        application/json:
          schema: {$ref: '#/components/schemas/User'}
    ApplicationResponse:
      description: The application.
      content:
        application/json:
          schema: {$ref: '#/components/schemas/Application'}
    AccessPackageResponse:
      description: The package.
      content:
        application/json:
          schema: {$ref: '#/components/schemas/AccessPackage'}
    AccessRequestResponse:
      description: The request.
      content:
        application/json:
          schema: {$ref: '#/components/schemas/AccessRequest'}
    AccessReviewResponse:
      description: The review with its items.
      content:
        application/json:
          schema: {$ref: '#/components/schemas/AccessReview'}
    LifecycleRuleResponse:
      description: The rule.
      content:
        application/json:
          schema: {$ref: '#/components/schemas/LifecycleRule'}
    PolicyResponse:
      description: The policy. `activity` is zero in this response.
      content:
        application/json:
          schema: {$ref: '#/components/schemas/Policy'}
    NetworkZoneResponse:
      description: The zone.
      content:
        application/json:
          schema: {$ref: '#/components/schemas/NetworkZone'}
    RiskEventResponse:
      description: The risk event.
      content:
        application/json:
          schema: {$ref: '#/components/schemas/RiskEvent'}
    ServiceAccountResponse:
      description: The service account.
      content:
        application/json:
          schema: {$ref: '#/components/schemas/ServiceAccount'}
    AppProvisioningResponse:
      description: The provisioning configuration and the result of the last run.
      content:
        application/json:
          schema: {$ref: '#/components/schemas/AppProvisioning'}
    IdentityProviderResponse:
      description: The identity provider.
      content:
        application/json:
          schema: {$ref: '#/components/schemas/IdentityProvider'}
    SettingsResponse:
      description: The settings, the organization name from `HALO_ORGANIZATION` and the issuer.
      content:
        application/json:
          schema:
            type: object
            required: [settings, defaultOrganizationName, issuer]
            properties:
              settings: {$ref: '#/components/schemas/Settings'}
              defaultOrganizationName: {type: string}
              issuer: {type: string, format: uri}
    ApiResourceResponse:
      description: The API resource.
      content:
        application/json:
          schema: {$ref: '#/components/schemas/ApiResource'}
    SSHAuthorityResponse:
      description: The certificate authority.
      content:
        application/json:
          schema: {$ref: '#/components/schemas/SSHAuthority'}
    SSHPrincipalMappingResponse:
      description: The mapping.
      content:
        application/json:
          schema: {$ref: '#/components/schemas/SSHPrincipalMapping'}
    SigningKeysResponse:
      description: The OpenID Connect signing keys, newest first, and the SAML certificates, current first.
      content:
        application/json:
          schema:
            type: object
            required: [oidc, saml]
            properties:
              oidc:
                type: array
                items: {$ref: '#/components/schemas/SigningKey'}
              saml:
                type: array
                items: {$ref: '#/components/schemas/SAMLCertificate'}
  schemas:
    Error:
      type: object
      required: [error]
      properties:
        error:
          type: object
          required: [code, message]
          properties:
            code: {type: string, examples: [ERR_NOT_FOUND]}
            message: {type: string, examples: [This user was not found. It may have been deleted.]}
    AuthRequestId:
      type: string
      description: The id of an application's sign-in request, from the `authRequest` query parameter of the sign-in page. Omit it to sign in to Halo itself.
    MethodKind:
      type: string
      enum: [passkey, security-key, totp, magic-link, recovery-codes, federated]
    RoleKey:
      type: string
      enum: [global_admin, security_admin, user_admin, helpdesk_admin, app_admin, auditor]
    ProviderKind:
      type: string
      enum: [google, microsoft, github, oidc]
    NamedRef:
      type: object
      required: [id, name]
      properties:
        id: {type: string}
        name: {type: string}
        email: {type: string}
    Organization:
      type: object
      required: [name, issuer, contactEmail, signInMessage, logoUrl]
      properties:
        name: {type: string, examples: [Fernway Systems]}
        issuer: {type: string, format: uri, examples: [https://auth.example.com]}
        contactEmail: {type: string}
        signInMessage: {type: string}
        logoUrl: {type: [string, 'null'], examples: ['/api/v1/branding/logo?v=1791100000']}
    Method:
      type: object
      required: [id, kind, label, addedAt, lastUsedAt]
      properties:
        id: {type: string, description: '`recovery-codes` for the set of recovery codes.'}
        kind: {type: string, enum: [passkey, security-key, totp, recovery-codes]}
        label: {type: string, examples: [Passkey · Safari on iOS]}
        addedAt: {type: string, format: date-time}
        lastUsedAt: {type: [string, 'null'], format: date-time}
        detail: {type: string, examples: [8 of 10 remaining]}
    User:
      type: object
      required: [id, email, emailVerified, name, title, department, location, status, strength, methods, roles, groupIds, appIds, managerId, source, createdAt, lastSignInAt]
      properties:
        id: {type: string, examples: [usr_01J9Z8Q4M2N5P7R9T1V3X5Z7B9]}
        email: {type: string, format: email}
        emailVerified: {type: boolean, description: 'True once the person redeemed a magic link, finished setup from a link Halo emailed, or signed in through an identity provider that verified the same address. Changing the email clears it. With the `email` scope, ID tokens and userinfo carry it as `email_verified`.'}
        name: {type: string}
        title: {type: string}
        department: {type: string}
        location: {type: string}
        status: {type: string, enum: [invited, active, suspended, deprovisioned]}
        strength: {type: string, enum: [phishing-resistant, multi-factor, single-factor]}
        methods:
          type: array
          items: {$ref: '#/components/schemas/Method'}
        roles:
          type: array
          description: Role names, such as `Global administrator`. Assign roles with their keys.
          items: {type: string}
        groupIds:
          type: array
          description: Assigned and rule-based groups.
          items: {type: string}
        appIds:
          type: array
          description: Applications the person is assigned to through their groups.
          items: {type: string}
        managerId: {type: [string, 'null']}
        source: {type: string, examples: [Halo, 'SCIM · Okta', Google]}
        createdAt: {type: string, format: date-time}
        lastSignInAt: {type: [string, 'null'], format: date-time}
        avatarUrl: {type: [string, 'null'], description: 'Path of the profile picture, or null. With the `profile` scope, ID tokens and userinfo carry the absolute URL as `picture`.', examples: ['/api/v1/users/usr_01J9Z8Q4M2N5P7R9T1V3X5Z7B9/avatar?v=1790000000']}
    Group:
      type: object
      required: [id, name, description, kind, memberCount, source, createdAt]
      properties:
        id: {type: string, examples: [grp_01J9Z8Q4M2N5P7R9T1V3X5Z7B9]}
        name: {type: string}
        description: {type: string}
        kind: {type: string, enum: [assigned, dynamic]}
        rule: {type: string, description: Dynamic groups only., examples: ['user.department == "Engineering"']}
        memberCount: {type: integer}
        source: {type: string}
        createdAt: {type: string, format: date-time}
    Credential:
      type: object
      required: [id, kind, label, hint, createdAt, expiresAt, lastUsedAt]
      properties:
        id: {type: string}
        kind: {type: string, examples: [secret]}
        label: {type: string}
        hint: {type: string, description: The last characters of the secret.}
        createdAt: {type: string, format: date-time}
        expiresAt: {type: string, format: date-time}
        lastUsedAt: {type: [string, 'null'], format: date-time}
    TokenPolicy:
      type: object
      required: [accessTokenTtl, refreshTokenTtl, idTokenTtl, rotation]
      properties:
        accessTokenTtl: {type: integer, description: Seconds.}
        refreshTokenTtl: {type: integer, description: Seconds. 0 means no refresh tokens.}
        idTokenTtl: {type: integer, description: Seconds.}
        rotation: {type: boolean, description: Replace the refresh token on every use.}
    Claim:
      type: object
      required: [name, source]
      properties:
        name: {type: string}
        source: {type: string}
    Application:
      type: object
      required: [id, name, description, protocol, type, status, clientId, homepage, redirectUris, postLogoutUris, scopes, claims, groupIds, userCount, credentials, owner, createdAt, signIns7d, failureRate7d, tokenPolicy, setupGuide]
      properties:
        id: {type: string, examples: [app_01J9Z8Q4M2N5P7R9T1V3X5Z7B9]}
        name: {type: string}
        description: {type: string}
        protocol: {type: string, enum: [oidc, oauth, saml]}
        type: {type: string, enum: [web, spa, native, service]}
        status: {type: string, enum: [active, disabled]}
        clientId: {type: string, description: 'The client ID, such as `hl_…`, or the entity ID for SAML applications.'}
        homepage: {type: string}
        redirectUris:
          type: array
          description: For SAML applications, the ACS URLs.
          items: {type: string}
        postLogoutUris:
          type: array
          items: {type: string}
        scopes:
          type: array
          items: {type: string}
        claims:
          type: array
          items: {$ref: '#/components/schemas/Claim'}
        groupIds:
          type: array
          items: {type: string}
        userCount: {type: integer}
        credentials:
          type: array
          items: {$ref: '#/components/schemas/Credential'}
        owner: {type: [string, 'null'], description: Id of the person responsible.}
        createdAt: {type: string, format: date-time}
        signIns7d: {type: integer}
        failureRate7d: {type: number, description: Percentage of failed sign-ins in the past 7 days.}
        tokenPolicy: {$ref: '#/components/schemas/TokenPolicy'}
        setupGuide: {type: string}
        saml: {$ref: '#/components/schemas/SAMLView'}
    SAMLAttributes:
      type: object
      description: The attribute name Halo sends each value under. An empty name stops sending it.
      properties:
        email: {type: string, default: email}
        name: {type: string, default: name}
        givenName: {type: string, default: given_name}
        familyName: {type: string, default: family_name}
        groups: {type: string, default: groups}
    SAMLInput:
      type: object
      properties:
        entityId: {type: string, maxLength: 1024}
        acsUrls:
          type: array
          minItems: 1
          maxItems: 10
          items: {type: string, format: uri}
        nameIdFormat: {type: string, enum: [email, persistent, unspecified]}
        signResponse: {type: boolean, description: Sign the whole response as well as the assertion.}
        attributes: {$ref: '#/components/schemas/SAMLAttributes'}
        metadataXml: {type: string, description: The service provider's metadata. Halo reads the entity ID and ACS URLs from it.}
    SAMLView:
      type: object
      description: SAML applications only.
      properties:
        entityId: {type: string}
        acsUrls:
          type: array
          items: {type: string}
        nameIdFormat: {type: string}
        signResponse: {type: boolean}
        attributes: {$ref: '#/components/schemas/SAMLAttributes'}
        metadataXml: {type: string}
        idp:
          type: object
          description: What to enter in the service provider.
          properties:
            entityId: {type: string}
            metadataUrl: {type: string, format: uri}
            ssoUrl: {type: string, format: uri}
            certificateUrl: {type: string, format: uri}
            certificateFingerprint: {type: string}
            certificateExpiresAt: {type: string, format: date-time}
    MyApplication:
      type: object
      required: [id, name, description, homepage, launchUrl]
      properties:
        id: {type: string}
        name: {type: string}
        description: {type: string}
        homepage: {type: string}
        launchUrl: {type: string, description: 'The homepage, or `/saml/launch/{id}` for SAML applications.'}
    Session:
      type: object
      required: [id, userId, device, os, browser, ip, location, method, createdAt, lastActiveAt]
      properties:
        id: {type: string, examples: [ses_01J9Z8Q4M2N5P7R9T1V3X5Z7B9]}
        userId: {type: string}
        device: {type: string}
        os: {type: string}
        browser: {type: string}
        ip: {type: string}
        location: {type: string}
        method: {$ref: '#/components/schemas/MethodKind'}
        createdAt: {type: string, format: date-time}
        lastActiveAt: {type: string, format: date-time}
        current: {type: boolean, description: Present and true for the session making the request.}
        client: {type: string, enum: [halo-cli], description: 'Present for sessions that `halo login` started through the device flow. Ending such a session, or all of a person''s sessions, also revokes its access and refresh tokens.'}
    SignInEvent:
      type: object
      required: [id, time, userId, email, appId, result, method, ip, location, device, risk]
      properties:
        id: {type: string, examples: [evt_01J9Z8Q4M2N5P7R9T1V3X5Z7B9]}
        time: {type: string, format: date-time}
        userId: {type: [string, 'null']}
        email: {type: string}
        appId: {type: [string, 'null'], description: Null for sign-ins to Halo itself.}
        result: {type: string, enum: [success, failure, interrupted]}
        method: {type: string}
        ip: {type: string}
        location: {type: string}
        device: {type: string, examples: [Chrome 130 · macOS]}
        risk: {type: string, enum: [none, low, medium, high]}
        reason: {type: string, description: Why the sign-in failed.}
    AuditEvent:
      type: object
      required: [id, time, actorId, action, summary, targetType, targetId, target, ip]
      properties:
        id: {type: string, examples: [aud_01J9Z8Q4M2N5P7R9T1V3X5Z7B9]}
        time: {type: string, format: date-time}
        actorId: {type: [string, 'null'], description: 'Null for changes Halo made itself, such as lifecycle rules and expiring grants.'}
        action: {type: string, examples: [user.invite]}
        summary: {type: string}
        targetType: {type: string, examples: [user]}
        targetId: {type: string}
        target: {type: string, description: The target's name when the change happened.}
        ip: {type: string}
    Overview:
      type: object
      required: [weakAdmins, expiringCredentials, highRiskSignIns, recentSignIns, failureRates, counts]
      properties:
        weakAdmins:
          type: array
          items:
            type: object
            properties:
              id: {type: string}
              name: {type: string}
        expiringCredentials:
          type: array
          items:
            type: object
            properties:
              appId: {type: string}
              appName: {type: string}
              credentialId: {type: string}
              label: {type: string}
              expiresAt: {type: string, format: date-time}
              lastUsedAt: {type: [string, 'null'], format: date-time}
              daysLeft: {type: integer}
        highRiskSignIns:
          type: array
          items: {$ref: '#/components/schemas/SignInEvent'}
        recentSignIns:
          type: array
          items: {$ref: '#/components/schemas/SignInEvent'}
        failureRates:
          type: array
          items:
            type: object
            properties:
              appId: {type: string}
              appName: {type: string}
              failureRate7d: {type: number}
        counts:
          type: object
          properties:
            users: {type: integer}
            activeUsers: {type: integer}
            applications: {type: integer}
            activeApplications: {type: integer}
    AccessPackage:
      type: object
      required: [id, name, description, owner, groups, approvers, maxDays, requireJustification, archived, pendingRequests, activeGrants, createdAt]
      properties:
        id: {type: string, examples: [pkg_01J9Z8Q4M2N5P7R9T1V3X5Z7B9]}
        name: {type: string}
        description: {type: string}
        owner:
          oneOf:
            - {$ref: '#/components/schemas/NamedRef'}
            - {type: 'null'}
        groups:
          type: array
          items: {$ref: '#/components/schemas/NamedRef'}
        approvers:
          type: array
          items: {$ref: '#/components/schemas/NamedRef'}
        maxDays: {type: [integer, 'null']}
        requireJustification: {type: boolean}
        archived: {type: boolean}
        pendingRequests: {type: integer}
        activeGrants: {type: integer}
        createdAt: {type: string, format: date-time}
    AccessRequest:
      type: object
      required: [id, package, requester, justification, durationDays, status, decidedBy, decidedAt, decisionNote, expiresAt, endedAt, endReason, groups, approvers, createdAt, canDecide]
      properties:
        id: {type: string, examples: [req_01J9Z8Q4M2N5P7R9T1V3X5Z7B9]}
        package: {$ref: '#/components/schemas/NamedRef'}
        requester: {$ref: '#/components/schemas/NamedRef'}
        justification: {type: string}
        durationDays: {type: [integer, 'null']}
        status: {type: string, enum: [pending, approved, denied, cancelled]}
        decidedBy:
          oneOf:
            - {$ref: '#/components/schemas/NamedRef'}
            - {type: 'null'}
        decidedAt: {type: [string, 'null'], format: date-time}
        decisionNote: {type: string}
        expiresAt: {type: [string, 'null'], format: date-time, description: When an approved grant ends. Null for grants that last until revoked.}
        endedAt: {type: [string, 'null'], format: date-time}
        endReason: {type: [string, 'null'], enum: [expired, revoked, null]}
        groups:
          type: array
          items: {$ref: '#/components/schemas/NamedRef'}
        approvers:
          type: array
          items: {$ref: '#/components/schemas/NamedRef'}
        createdAt: {type: string, format: date-time}
        canDecide: {type: boolean}
    ReviewItem:
      type: object
      required: [user, title, decision, note, decidedBy, decidedAt, outcome]
      properties:
        user: {$ref: '#/components/schemas/NamedRef'}
        title: {type: string}
        decision: {type: [string, 'null'], enum: [keep, remove, null]}
        note: {type: string}
        decidedBy:
          oneOf:
            - {$ref: '#/components/schemas/NamedRef'}
            - {type: 'null'}
        decidedAt: {type: [string, 'null'], format: date-time}
        outcome: {type: [string, 'null'], enum: [kept, removed, not-removed, no-decision, null], description: Set when the review is completed.}
    AccessReview:
      type: object
      required: [id, name, group, reviewers, dueAt, autoApply, status, total, decided, removals, createdBy, createdAt, completedBy, completedAt, canDecide, canComplete]
      properties:
        id: {type: string, examples: [rev_01J9Z8Q4M2N5P7R9T1V3X5Z7B9]}
        name: {type: string}
        group:
          allOf:
            - {$ref: '#/components/schemas/NamedRef'}
          description: For a completed review whose group was deleted, `id` is empty and `name` is the group's name at deletion.
        reviewers:
          type: array
          items: {$ref: '#/components/schemas/NamedRef'}
        dueAt: {type: string, format: date-time}
        autoApply: {type: boolean}
        status: {type: string, enum: [in-progress, overdue, completed]}
        total: {type: integer}
        decided: {type: integer}
        removals: {type: integer}
        createdBy:
          oneOf:
            - {$ref: '#/components/schemas/NamedRef'}
            - {type: 'null'}
        createdAt: {type: string, format: date-time}
        completedBy:
          oneOf:
            - {$ref: '#/components/schemas/NamedRef'}
            - {type: 'null'}
        completedAt: {type: [string, 'null'], format: date-time}
        items:
          type: array
          description: Present when you get a single review.
          items: {$ref: '#/components/schemas/ReviewItem'}
        canDecide: {type: boolean}
        canComplete: {type: boolean}
    LifecycleAction:
      type: object
      required: [type]
      properties:
        type: {type: string, enum: [add-to-group, remove-from-group, revoke-sessions, suspend]}
        groupId: {type: string, description: Required for add-to-group and remove-from-group. Assigned groups only.}
    LifecycleRule:
      type: object
      required: [id, name, trigger, condition, actions, enabled, runs, lastRunAt, createdAt]
      properties:
        id: {type: string}
        name: {type: string}
        trigger: {type: string, enum: [joiner, mover, leaver]}
        condition: {type: [string, 'null']}
        actions:
          type: array
          items: {$ref: '#/components/schemas/LifecycleAction'}
        enabled: {type: boolean}
        runs: {type: integer}
        lastRunAt: {type: [string, 'null'], format: date-time}
        createdAt: {type: string, format: date-time}
    LifecycleRun:
      type: object
      required: [id, rule, user, trigger, change, steps, result, createdAt]
      properties:
        id: {type: string}
        rule: {$ref: '#/components/schemas/NamedRef'}
        user: {$ref: '#/components/schemas/NamedRef'}
        trigger: {type: string, enum: [joiner, mover, leaver]}
        change: {type: string, examples: [Department changed from Sales to Engineering]}
        steps:
          type: array
          items: {type: string, examples: [Added to Engineering]}
        result: {type: string, enum: [succeeded, failed]}
        createdAt: {type: string, format: date-time}
    PolicyConditions:
      type: object
      properties:
        allUsers: {type: boolean}
        groupIds:
          type: array
          items: {type: string}
        userIds:
          type: array
          items: {type: string}
        excludeGroupIds:
          type: array
          items: {type: string}
        excludeUserIds:
          type: array
          items: {type: string}
        allApps: {type: boolean}
        appIds:
          type: array
          description: Application ids, or `halo` for the console and account portal.
          items: {type: string}
        network: {type: string, enum: ['', any, in, not-in]}
        zoneIds:
          type: array
          items: {type: string}
        device: {type: string, enum: ['', any, trusted, untrusted]}
        risk:
          type: array
          description: Match only these risk levels. Empty matches every level.
          items: {type: string, enum: [none, low, medium, high]}
        methods:
          type: array
          description: Match only these sign-in methods. Empty matches every method.
          items: {$ref: '#/components/schemas/MethodKind'}
    AccessPolicy:
      type: object
      required: [id, name, description, priority, enabled, mode, effect, conditions, createdAt, updatedAt]
      properties:
        id: {type: string, examples: [pol_01J9Z8Q4M2N5P7R9T1V3X5Z7B9]}
        name: {type: string}
        description: {type: string}
        priority: {type: integer, description: Position in the saved order.}
        enabled: {type: boolean}
        mode: {type: string, enum: [enforce, report]}
        effect: {type: string, enum: [allow, require-phishing-resistant, block]}
        conditions: {$ref: '#/components/schemas/PolicyConditions'}
        createdAt: {type: string, format: date-time}
        updatedAt: {type: string, format: date-time}
    Policy:
      allOf:
        - {$ref: '#/components/schemas/AccessPolicy'}
        - type: object
          required: [activity]
          properties:
            activity:
              type: object
              required: [matched, stopped]
              properties:
                matched: {type: integer, description: Sign-ins the policy matched in the past 24 hours.}
                stopped: {type: integer, description: 'Matched sign-ins it blocked or would have blocked, or that needed a stronger method.'}
    Simulation:
      type: object
      required: [effect, outcome, policy, reason, risk, signals, policies]
      properties:
        effect: {type: string, enum: [allow, require-phishing-resistant, block]}
        outcome: {type: string, enum: [allow, require, block], description: '`require` when the effect requires a passkey or security key and the simulated method is neither.'}
        policy: {type: string, description: 'The name of the deciding policy, if any.'}
        reason: {type: string}
        risk: {type: string, enum: [none, low, medium, high]}
        signals:
          type: array
          items:
            type: object
            properties:
              type: {type: string, enum: [risky-network, failed-sign-ins, new-device, new-network]}
              level: {type: string, enum: [low, medium, high]}
              detail: {type: string}
        policies:
          type: array
          items:
            type: object
            properties:
              id: {type: string}
              name: {type: string}
              mode: {type: string, enum: [enforce, report]}
              effect: {type: string}
              matched: {type: boolean}
              outcome: {type: string, enum: ['', allow, require, block]}
              detail: {type: string, description: Why it matched or did not.}
    NetworkZone:
      type: object
      required: [id, name, kind, cidrs, createdAt, updatedAt]
      properties:
        id: {type: string}
        name: {type: string}
        kind: {type: string, enum: [trusted, risky]}
        cidrs:
          type: array
          items: {type: string}
        createdAt: {type: string, format: date-time}
        updatedAt: {type: string, format: date-time}
    MethodSetting:
      type: object
      required: [method, enabled, updatedAt, users, exclusive]
      properties:
        method: {$ref: '#/components/schemas/MethodKind'}
        enabled: {type: boolean}
        updatedAt: {type: string, format: date-time}
        users: {type: integer}
        exclusive: {type: integer}
    Device:
      type: object
      required: [id, userId, name, os, browser, trust, firstSeenAt, lastSeenAt, lastIp, signIns]
      properties:
        id: {type: string, examples: [dev_01J9Z8Q4M2N5P7R9T1V3X5Z7B9]}
        userId: {type: string}
        name: {type: string}
        os: {type: string}
        browser: {type: string}
        trust: {type: string, enum: [unknown, trusted, blocked]}
        firstSeenAt: {type: string, format: date-time}
        lastSeenAt: {type: string, format: date-time}
        lastIp: {type: string}
        signIns: {type: integer}
        current: {type: boolean}
    RiskEvent:
      type: object
      required: [id, time, type, level, status, userId, ip, deviceId, device, signInId, detail, resolvedBy, resolvedAt]
      properties:
        id: {type: string}
        time: {type: string, format: date-time}
        type: {type: string, enum: [risky-network, failed-sign-ins, new-device]}
        level: {type: string, enum: [medium, high]}
        status: {type: string, enum: [open, resolved, dismissed]}
        userId: {type: [string, 'null']}
        ip: {type: string}
        deviceId: {type: [string, 'null']}
        device: {type: string}
        signInId: {type: [string, 'null']}
        detail: {type: string}
        resolvedBy: {type: [string, 'null']}
        resolvedAt: {type: [string, 'null'], format: date-time}
    ApiKey:
      type: object
      required: [id, serviceAccountId, serviceAccountName, label, prefix, scopes, createdBy, createdAt, expiresAt, lastUsedAt, revokedAt]
      properties:
        id: {type: string, examples: [key_01J9Z8Q4M2N5P7R9T1V3X5Z7B9]}
        serviceAccountId: {type: string}
        serviceAccountName: {type: string}
        label: {type: string}
        prefix: {type: string, description: The first 12 characters of the key.}
        scopes:
          type: array
          items: {type: string, enum: [api, scim]}
        createdBy: {type: [string, 'null']}
        createdAt: {type: string, format: date-time}
        expiresAt: {type: [string, 'null'], format: date-time}
        lastUsedAt: {type: [string, 'null'], format: date-time}
        revokedAt: {type: [string, 'null'], format: date-time}
    ServiceAccount:
      type: object
      required: [id, name, email, description, ownerId, status, roles, keys, createdBy, createdAt]
      properties:
        id: {type: string, examples: [usr_01J9Z8Q4M2N5P7R9T1V3X5Z7B9]}
        name: {type: string}
        email: {type: string, examples: [terraform@service.halo.invalid]}
        description: {type: string}
        ownerId: {type: [string, 'null']}
        status: {type: string, enum: [active, suspended], description: '`suspended` when disabled.'}
        roles:
          type: array
          items: {$ref: '#/components/schemas/RoleKey'}
        keys:
          type: array
          items: {$ref: '#/components/schemas/ApiKey'}
        createdBy: {type: [string, 'null']}
        createdAt: {type: string, format: date-time}
    AppProvisioning:
      type: object
      required: [appId, baseUrl, enabled, lastSyncAt, lastError, created, updated, deactivated, provisioned, updatedAt]
      properties:
        appId: {type: string}
        baseUrl: {type: string, format: uri}
        enabled: {type: boolean}
        lastSyncAt: {type: [string, 'null'], format: date-time}
        lastError: {type: string}
        created: {type: integer, description: Users created in the last run.}
        updated: {type: integer}
        deactivated: {type: integer}
        provisioned: {type: integer, description: Users currently active in the application.}
        updatedAt: {type: string, format: date-time}
    IdentityProvider:
      type: object
      required: [id, kind, name, issuer, clientId, hasSecret, scopes, enabled, showOnSignIn, allowedDomains, jit, jitGroupIds, linkedCount, createdAt, updatedAt]
      properties:
        id: {type: string, examples: [idp_01J9Z8Q4M2N5P7R9T1V3X5Z7B9]}
        kind: {$ref: '#/components/schemas/ProviderKind'}
        name: {type: string}
        issuer: {type: string}
        clientId: {type: string}
        hasSecret: {type: boolean}
        scopes:
          type: array
          items: {type: string}
        enabled: {type: boolean}
        showOnSignIn: {type: boolean}
        allowedDomains:
          type: array
          items: {type: string}
        jit: {type: boolean}
        jitGroupIds:
          type: array
          items: {type: string}
        linkedCount: {type: integer}
        createdAt: {type: string, format: date-time}
        updatedAt: {type: string, format: date-time}
    FederatedIdentity:
      type: object
      required: [id, providerId, providerName, providerKind, email, createdAt, lastUsedAt]
      properties:
        id: {type: string}
        providerId: {type: string}
        providerName: {type: string}
        providerKind: {$ref: '#/components/schemas/ProviderKind'}
        email: {type: string}
        createdAt: {type: string, format: date-time}
        lastUsedAt: {type: [string, 'null'], format: date-time}
    Settings:
      type: object
      properties:
        organizationName: {type: string, maxLength: 100, description: 'Empty uses `HALO_ORGANIZATION`.'}
        contactEmail: {type: string}
        signInMessage: {type: string, maxLength: 500}
        sessionHours: {type: integer, minimum: 1, maximum: 72, default: 12}
        lockoutThreshold: {type: integer, minimum: 3, maximum: 20, default: 5}
        lockoutMinutes: {type: integer, minimum: 5, maximum: 1440, default: 15}
        inviteDays: {type: integer, minimum: 1, maximum: 30, default: 7}
        accessTokenMinutes: {type: integer, minimum: 5, maximum: 1440, default: 15}
        idTokenMinutes: {type: integer, minimum: 5, maximum: 1440, default: 15}
        refreshTokenHours: {type: integer, minimum: 1, maximum: 2160, default: 8}
    Domain:
      type: object
      required: [id, name, token, createdAt, verifiedAt]
      properties:
        id: {type: string}
        name: {type: string}
        token: {type: string, description: 'Publish `halo-verification=<token>` as a TXT record.'}
        createdAt: {type: string, format: date-time}
        verifiedAt: {type: [string, 'null'], format: date-time}
    Webhook:
      type: object
      required: [id, url, description, events, enabled, createdAt, updatedAt, lastStatus, lastDeliveryAt]
      properties:
        id: {type: string, examples: [whk_01J9Z8Q4M2N5P7R9T1V3X5Z7B9]}
        url: {type: string, format: uri}
        description: {type: string}
        events:
          type: array
          items: {type: string}
        enabled: {type: boolean}
        createdAt: {type: string, format: date-time}
        updatedAt: {type: string, format: date-time}
        lastStatus: {type: [string, 'null'], enum: [pending, delivered, failed, null]}
        lastDeliveryAt: {type: [string, 'null'], format: date-time}
    WebhookDelivery:
      type: object
      required: [id, endpointId, eventId, eventType, body, status, attempts, nextAttemptAt, lastAttemptAt, responseStatus, error, createdAt]
      properties:
        id: {type: string, examples: [whd_01J9Z8Q4M2N5P7R9T1V3X5Z7B9]}
        endpointId: {type: string}
        eventId: {type: string}
        eventType: {type: string}
        body: {type: string, description: The exact JSON body Halo sends.}
        status: {type: string, enum: [pending, delivered, failed]}
        attempts: {type: integer}
        nextAttemptAt: {type: string, format: date-time}
        lastAttemptAt: {type: [string, 'null'], format: date-time}
        responseStatus: {type: [integer, 'null']}
        error: {type: string}
        createdAt: {type: string, format: date-time}
    ApiScope:
      type: object
      required: [name]
      properties:
        name: {type: string, pattern: '^[a-z0-9][a-z0-9:._/-]{0,99}$', examples: ['billing:read']}
        description: {type: string, maxLength: 200}
    ApiResource:
      type: object
      required: [id, name, identifier, description, accessTokenTtl, scopes, grants, createdAt, updatedAt]
      properties:
        id: {type: string}
        name: {type: string}
        identifier: {type: string, format: uri}
        description: {type: string}
        accessTokenTtl: {type: integer}
        scopes:
          type: array
          items: {$ref: '#/components/schemas/ApiScope'}
        grants:
          type: array
          items:
            type: object
            required: [appId, scopes]
            properties:
              appId: {type: string}
              scopes:
                type: array
                items: {type: string}
        createdAt: {type: string, format: date-time}
        updatedAt: {type: string, format: date-time}
    SSHAuthority:
      type: object
      required: [publicKey, fingerprint, createdAt, certificateLifetime]
      properties:
        publicKey: {type: string}
        fingerprint: {type: string, examples: ['SHA256:…']}
        createdAt: {type: string, format: date-time}
        certificateLifetime: {type: integer, description: Seconds. Defaults to 28800 (8 hours).}
    SSHPrincipalMapping:
      type: object
      required: [id, groupId, principals, createdAt, updatedAt]
      properties:
        id: {type: string}
        groupId: {type: string}
        principals:
          type: array
          items: {type: string}
        createdAt: {type: string, format: date-time}
        updatedAt: {type: string, format: date-time}
    SSHCertificate:
      type: object
      required: [serial, keyId, userId, userName, principals, fingerprint, keyType, ip, validAfter, validBefore, createdAt]
      properties:
        serial: {type: integer}
        keyId: {type: string, examples: ['halo:usr_01J9Z8Q4M2N5P7R9T1V3X5Z7B9:42']}
        userId: {type: [string, 'null']}
        userName: {type: string}
        principals:
          type: array
          items: {type: string}
        fingerprint: {type: string}
        keyType: {type: string, examples: [ssh-ed25519]}
        ip: {type: string}
        validAfter: {type: string, format: date-time}
        validBefore: {type: string, format: date-time}
        createdAt: {type: string, format: date-time}
    SSHCertificateIssued:
      type: object
      required: [certificate, serial, keyId, principals, fingerprint, validAfter, validBefore]
      properties:
        certificate: {type: string, description: 'One line in OpenSSH format. Save it next to the key as `<key>-cert.pub`.'}
        serial: {type: integer}
        keyId: {type: string}
        principals:
          type: array
          items: {type: string}
        fingerprint: {type: string}
        validAfter: {type: string, format: date-time, description: '5 minutes before issue, to allow for clock skew.'}
        validBefore: {type: string, format: date-time}
    DeviceAuthorization:
      type: object
      required: [userCode, application, clientId, scopes, ip, userAgent, requestedAt, expiresAt]
      properties:
        userCode: {type: string, examples: [BCDF-GHJK]}
        application: {type: string}
        clientId: {type: string, examples: [halo-cli]}
        scopes:
          type: array
          items: {type: string}
        ip: {type: string, description: The address the device requested the code from.}
        userAgent: {type: string}
        requestedAt: {type: string, format: date-time}
        expiresAt: {type: string, format: date-time}
    OutboxMessage:
      type: object
      required: [id, to, subject, text, attempts, lastError, createdAt, sentAt]
      properties:
        id: {type: string, examples: [msg_01J9Z8Q4M2N5P7R9T1V3X5Z7B9]}
        to: {type: string}
        subject: {type: string}
        text: {type: string}
        attempts: {type: integer}
        lastError: {type: string}
        createdAt: {type: string, format: date-time}
        sentAt: {type: [string, 'null'], format: date-time}
    SigningKey:
      type: object
      required: [kid, algorithm, active, createdAt, retiresAt, retiredAt]
      properties:
        kid: {type: string, description: The key id in the JWKS and in the `kid` header of tokens.}
        algorithm: {type: string, examples: [RS256]}
        active: {type: boolean, description: True for the key that signs new tokens.}
        createdAt: {type: string, format: date-time}
        retiresAt: {type: [string, 'null'], format: date-time, description: 'For a replaced key, when it leaves the JWKS: 7 days after the next key was created.'}
        retiredAt: {type: [string, 'null'], format: date-time, description: When the key left the JWKS.}
    SAMLCertificate:
      type: object
      required: [id, fingerprint, notAfter, createdAt, retiredAt]
      properties:
        id: {type: string, examples: [key_01J9Z8Q4M2N5P7R9T1V3X5Z7B9]}
        fingerprint: {type: string, description: SHA-256 of the certificate as colon-separated uppercase hex.}
        notAfter: {type: string, format: date-time}
        createdAt: {type: string, format: date-time}
        retiredAt: {type: [string, 'null'], format: date-time, description: Set when a rotation replaced the certificate. Null for the current one.}
