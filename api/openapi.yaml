      responses:
        '200':
          description: The receiver and its deliveries, as `GET` returns them.
          content:
            application/json:
              schema:
                type: object
        '400': {$ref: '#/components/responses/BadJSON'}
        '401': {$ref: '#/components/responses/ReauthRequired'}
        '403': {$ref: '#/components/responses/Forbidden'}
        '404': {$ref: '#/components/responses/NotFound'}
        '422': {$ref: '#/components/responses/Invalid'}
    delete:
      tags: [Shared signals]
      operationId: deleteSharedSignals
      summary: Turn off shared signals for a service application
      description: 'Roles: security administrator, with a recent sign-in. Deletes the stream with its SETs. Recorded as `application.shared_signals.delete`.'
      responses:
        '204': {$ref: '#/components/responses/NoContent'}
        '401': {$ref: '#/components/responses/ReauthRequired'}
        '403': {$ref: '#/components/responses/Forbidden'}
        '404': {$ref: '#/components/responses/NotFound'}
