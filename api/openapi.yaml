        '403': {$ref: '#/components/responses/Forbidden'}
    post:
      tags: [Policies]
      operationId: createComplianceSource
      summary: Add a device compliance source
      description: 'Roles: security administrator, with a recent sign-in. An `intune` source reads managed devices and their compliance state from Microsoft Graph with an app registration that has the `DeviceManagementManagedDevices.Read.All` application permission. Halo syncs it when it is saved and every 30 minutes, through a client that only calls public addresses. An `agent` source receives signed reports at `POST /compliance-sources/{id}/reports`, and its signing secret is returned once. Client secrets and signing secrets are stored sealed.'
      requestBody: {$ref: '#/components/requestBodies/ComplianceSourceInput'}
      responses:
        '201':
          description: The source, and the signing secret for an `agent` source.
          content:
            application/json:
              schema: {$ref: '#/components/schemas/ComplianceSourceSaved'}
        '400': {$ref: '#/components/responses/BadJSON'}
        '401': {$ref: '#/components/responses/Unauthenticated'}
        '403': {$ref: '#/components/responses/Forbidden'}
        '409':
          description: '`ERR_CONFLICT`: a source with that name exists.'
          content:
            application/json:
              schema: {$ref: '#/components/schemas/Error'}
        '422': {$ref: '#/components/responses/Invalid'}
  /compliance-sources/{id}:
    parameters:
      - {$ref: '#/components/parameters/Id'}
    put:
      tags: [Policies]
      operationId: updateComplianceSource
      summary: Replace a source's settings
      description: 'Roles: security administrator, with a recent sign-in. The kind can''t change. Leave `clientSecret` empty to keep the current one. `rotateSecret` gives an `agent` source a new signing secret, returned once, and the old one stops working.'
      requestBody: {$ref: '#/components/requestBodies/ComplianceSourceInput'}
      responses:
        '200':
