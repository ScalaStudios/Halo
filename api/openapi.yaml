      description: 'Roles: security administrator.'
      requestBody: {$ref: '#/components/requestBodies/NetworkZoneInput'}
      responses:
        '200': {$ref: '#/components/responses/NetworkZoneResponse'}
        '400': {$ref: '#/components/responses/BadJSON'}
        '401': {$ref: '#/components/responses/Unauthenticated'}
        '403': {$ref: '#/components/responses/Forbidden'}
        '404': {$ref: '#/components/responses/NotFound'}
        '409': {$ref: '#/components/responses/Conflict'}
        '422': {$ref: '#/components/responses/Invalid'}
    delete:
      tags: [Policies]
      operationId: deleteNetworkZone
      summary: Delete a network zone
      description: 'Roles: security administrator. Refused with `409` while a policy uses the zone.'
      responses:
        '204': {$ref: '#/components/responses/NoContent'}
        '401': {$ref: '#/components/responses/Unauthenticated'}
        '403': {$ref: '#/components/responses/Forbidden'}
        '404': {$ref: '#/components/responses/NotFound'}
        '409': {$ref: '#/components/responses/Conflict'}
  /terms:
