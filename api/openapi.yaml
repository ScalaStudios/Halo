      tags: [SSH]
      operationId: getSSHKnownHosts
      summary: Get the known_hosts line for the host certificate authority
      description: 'An `@cert-authority` line for `~/.ssh/known_hosts` or `/etc/ssh/ssh_known_hosts`, scoped to each verified domain and its subdomains, so ssh trusts hosts Halo signed without a prompt. Empty until the host authority exists and a domain is verified.'
      security: []
      responses:
        '200':
          description: One known_hosts line, or an empty body.
          content:
            text/plain:
              schema: {type: string, examples: ['@cert-authority example.com,*.example.com ssh-ed25519 AAAAC3NzaC1lZDI1NTE5AAAAI…']}
  /ssh/revoked-hosts.krl:
    get:
      tags: [SSH]
      operationId: getSSHRevokedHosts
      summary: Get the revocation list of host keys
      description: An OpenSSH key revocation list (KRL) with the key of every revoked host, which also revokes every certificate for that key. Point `RevokedHostKeys` in the clients' `ssh_config` at a copy of it; ssh refuses every host when the file is missing.
      security: []
      responses:
        '200':
          description: The KRL.
          content:
            application/octet-stream:
              schema: {type: string, format: binary}
  /ssh/host-authority:
    get:
      tags: [SSH]
      operationId: getSSHHostAuthority
      summary: Get the SSH host certificate authority
      description: 'Roles: any administrator. A separate key from the authority that signs certificates for people. Halo creates it the first time it is needed.'
      responses:
        '200': {$ref: '#/components/responses/SSHHostAuthorityResponse'}
        '401': {$ref: '#/components/responses/Unauthenticated'}
        '403': {$ref: '#/components/responses/Forbidden'}
    put:
      tags: [SSH]
      operationId: setSSHHostCertificateLifetime
      summary: Set how long host certificates last
      description: 'Roles: security administrator. Recorded as `ssh.host.lifetime`.'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [certificateLifetime]
              properties:
                certificateLifetime: {type: integer, minimum: 86400, maximum: 31536000, description: Seconds.}
      responses:
        '200': {$ref: '#/components/responses/SSHHostAuthorityResponse'}
        '400': {$ref: '#/components/responses/BadJSON'}
        '401': {$ref: '#/components/responses/Unauthenticated'}
        '403': {$ref: '#/components/responses/Forbidden'}
        '422': {$ref: '#/components/responses/Invalid'}
  /ssh/hosts:
    get:
      tags: [SSH]
      operationId: listSSHHosts
      summary: List registered hosts
      description: 'Roles: any administrator. Revoked hosts come last.'
      responses:
        '200':
          description: The hosts, newest first.
          content:
            application/json:
              schema:
                type: array
                items: {$ref: '#/components/schemas/SSHHost'}
        '401': {$ref: '#/components/responses/Unauthenticated'}
        '403': {$ref: '#/components/responses/Forbidden'}
    post:
      tags: [SSH]
      operationId: createSSHHost
      summary: Register a host
      description: 'Roles: security administrator. Returns an enrollment token that works once, for an hour, with `halo ssh-host enroll`. Recorded as `ssh.host.create`.'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [hostnames]
              properties:
                hostnames:
                  type: array
                  minItems: 1
                  maxItems: 32
                  description: The names people connect with, which become the certificate's principals. Lowercase hostnames or IP addresses, without wildcards or ports.
                  items: {type: string, examples: [web1.example.com]}
      responses:
        '201': {$ref: '#/components/responses/SSHHostEnrollmentResponse'}
        '400': {$ref: '#/components/responses/BadJSON'}
        '401': {$ref: '#/components/responses/ReauthRequired'}
        '403': {$ref: '#/components/responses/Forbidden'}
        '422': {$ref: '#/components/responses/Invalid'}
  /ssh/hosts/{id}/host-group:
    parameters:
      - {$ref: '#/components/parameters/Id'}
    put:
      tags: [SSH]
      operationId: setSSHHostGroup
      summary: Move a host to a host group
      description: 'Roles: security administrator. The host group''s rules decide who `halo-hostd` lets log in to the host. A host in no host group lets nobody in. Recorded as `ssh.host.group`.'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [hostGroupId]
              properties:
                hostGroupId: {type: [string, 'null'], description: Null takes the host out of its host group.}
      responses:
        '200':
          description: The host.
          content:
            application/json:
              schema: {$ref: '#/components/schemas/SSHHost'}
        '400': {$ref: '#/components/responses/BadJSON'}
        '401': {$ref: '#/components/responses/ReauthRequired'}
        '403': {$ref: '#/components/responses/Forbidden'}
        '404': {$ref: '#/components/responses/NotFound'}
        '422': {$ref: '#/components/responses/Invalid'}
  /ssh/hosts/{id}/enrollment-token:
    parameters:
      - {$ref: '#/components/parameters/Id'}
    post:
      tags: [SSH]
      operationId: createSSHHostEnrollmentToken
      summary: Create a new enrollment token for a host
      description: 'Roles: security administrator. Replaces the host''s unused token. Recorded as `ssh.host.token`.'
      responses:
        '200': {$ref: '#/components/responses/SSHHostEnrollmentResponse'}
        '401': {$ref: '#/components/responses/ReauthRequired'}
        '403': {$ref: '#/components/responses/Forbidden'}
        '404': {$ref: '#/components/responses/NotFound'}
  /ssh/hosts/{id}/certificate:
    parameters:
      - {$ref: '#/components/parameters/Id'}
    post:
      tags: [SSH]
      operationId: signSSHHostKey
      summary: Sign a host key
      description: 'Roles: security administrator. Signs a pasted host public key for the host''s hostnames and makes it the host''s key, which then renews with `halo ssh-host renew`. Recorded as `ssh.host.certificate.issue`.'
      requestBody: {$ref: '#/components/requestBodies/SSHHostKeyInput'}
      responses:
        '201': {$ref: '#/components/responses/SSHHostCertificateResponse'}
        '400': {$ref: '#/components/responses/BadJSON'}
        '401': {$ref: '#/components/responses/ReauthRequired'}
        '403': {$ref: '#/components/responses/Forbidden'}
        '404': {$ref: '#/components/responses/NotFound'}
        '409': {$ref: '#/components/responses/Conflict'}
        '422': {$ref: '#/components/responses/Invalid'}
  /ssh/hosts/{id}/revoke:
    parameters:
      - {$ref: '#/components/parameters/Id'}
    post:
      tags: [SSH]
      operationId: revokeSSHHost
      summary: Revoke a host
      description: 'Roles: security administrator. The host can no longer renew or enroll, and its key joins `/ssh/revoked-hosts.krl`. A revoked host can''t be restored, and its key can''t be enrolled again. Recorded as `ssh.host.revoke`.'
      responses:
        '200':
          description: The revoked host.
          content:
            application/json:
              schema: {$ref: '#/components/schemas/SSHHost'}
        '401': {$ref: '#/components/responses/Unauthenticated'}
        '403': {$ref: '#/components/responses/Forbidden'}
        '404': {$ref: '#/components/responses/NotFound'}
  /ssh/hosts/enroll:
    post:
      tags: [SSH]
      operationId: enrollSSHHost
      summary: Get a host certificate with an enrollment token
      description: The host sends its public key and the token from the console. `halo ssh-host enroll` calls this route. Recorded as `ssh.host.certificate.issue` with no actor.
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [token, publicKey]
              properties:
                token: {type: string}
                publicKey: {type: string, examples: ['ssh-ed25519 AAAAC3NzaC1lZDI1NTE5AAAAI…']}
      responses:
        '201': {$ref: '#/components/responses/SSHHostCertificateResponse'}
        '400': {$ref: '#/components/responses/BadJSON'}
        '401':
          description: '`ERR_INVALID_TOKEN`: the token is unknown, used, expired or belongs to a revoked host.'
          content:
            application/json:
              schema: {$ref: '#/components/schemas/Error'}
        '409': {$ref: '#/components/responses/Conflict'}
        '422': {$ref: '#/components/responses/Invalid'}
  /ssh/hosts/renew:
    post:
      tags: [SSH]
      operationId: renewSSHHost
      summary: Renew a host certificate
      description: 'The host proves it holds its enrolled key by signing `halo ssh host certificate renewal <timestamp>` with it, within 5 minutes of the server''s clock. `halo ssh-host renew` calls this route. Recorded as `ssh.host.certificate.issue` with no actor.'
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [publicKey, timestamp, signature]
              properties:
                publicKey: {type: string, examples: ['ssh-ed25519 AAAAC3NzaC1lZDI1NTE5AAAAI…']}
                timestamp: {type: integer, description: Unix seconds.}
                signature: {type: string, description: The SSH signature in wire format, base64 encoded.}
      responses:
        '201': {$ref: '#/components/responses/SSHHostCertificateResponse'}
        '400': {$ref: '#/components/responses/BadJSON'}
        '401':
          description: '`ERR_INVALID_SIGNATURE`: the signature does not verify with the key, or the timestamp is more than 5 minutes off.'
          content:
            application/json:
              schema: {$ref: '#/components/schemas/Error'}
        '403':
          description: '`ERR_UNKNOWN_HOST`: no host has this key, or the host was revoked.'
          content:
            application/json:
              schema: {$ref: '#/components/schemas/Error'}
        '422': {$ref: '#/components/responses/Invalid'}
  /ssh/hosts/directory:
    post:
      tags: [SSH]
      operationId: getSSHHostDirectory
      summary: Get the people and groups allowed on a host
      description: 'The host proves it holds its enrolled key by signing `halo host directory <timestamp>` with it, within 5 minutes of the server''s clock. `halo-hostd` calls this route. Returns the active people in the groups of the host group''s rules, with their sudo commands, and the groups they belong to with only those people as members. A host in no host group gets empty lists.'
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [publicKey, timestamp, signature]
              properties:
                publicKey: {type: string, examples: ['ssh-ed25519 AAAAC3NzaC1lZDI1NTE5AAAAI…']}
                timestamp: {type: integer, description: Unix seconds.}
                signature: {type: string, description: The SSH signature in wire format, base64 encoded.}
      responses:
        '200':
          description: The directory for this host.
          content:
            application/json:
              schema: {$ref: '#/components/schemas/HostDirectory'}
        '400': {$ref: '#/components/responses/BadJSON'}
        '401':
          description: '`ERR_INVALID_SIGNATURE`: the signature does not verify with the key, or the timestamp is more than 5 minutes off.'
          content:
            application/json:
              schema: {$ref: '#/components/schemas/Error'}
        '403':
          description: '`ERR_UNKNOWN_HOST`: no host has this key, or the host was revoked.'
          content:
            application/json:
              schema: {$ref: '#/components/schemas/Error'}
        '422': {$ref: '#/components/responses/Invalid'}
  /ssh/host-groups:
    get:
      tags: [SSH]
      operationId: listHostGroups
      summary: List host groups
      description: 'Roles: any administrator.'
      responses:
        '200':
          description: The host groups by name.
          content:
            application/json:
              schema:
                type: array
                items: {$ref: '#/components/schemas/HostGroup'}
        '401': {$ref: '#/components/responses/Unauthenticated'}
        '403': {$ref: '#/components/responses/Forbidden'}
    post:
      tags: [SSH]
      operationId: createHostGroup
      summary: Create a host group
      description: 'Roles: security administrator. Recorded as `ssh.host_group.create`.'
      requestBody: {$ref: '#/components/requestBodies/HostGroupInput'}
      responses:
        '201': {$ref: '#/components/responses/HostGroupResponse'}
        '400': {$ref: '#/components/responses/BadJSON'}
        '401': {$ref: '#/components/responses/ReauthRequired'}
        '403': {$ref: '#/components/responses/Forbidden'}
        '409': {$ref: '#/components/responses/Conflict'}
        '422': {$ref: '#/components/responses/Invalid'}
  /ssh/host-groups/{id}:
    parameters:
      - {$ref: '#/components/parameters/Id'}
    put:
      tags: [SSH]
      operationId: updateHostGroup
      summary: Replace a host group and its rules
      description: 'Roles: security administrator. Send every rule; rules you leave out are removed. Hosts pick up the change at their next refresh. Recorded as `ssh.host_group.update`.'
      requestBody: {$ref: '#/components/requestBodies/HostGroupInput'}
      responses:
        '200': {$ref: '#/components/responses/HostGroupResponse'}
        '400': {$ref: '#/components/responses/BadJSON'}
        '401': {$ref: '#/components/responses/ReauthRequired'}
        '403': {$ref: '#/components/responses/Forbidden'}
        '404': {$ref: '#/components/responses/NotFound'}
        '409': {$ref: '#/components/responses/Conflict'}
        '422': {$ref: '#/components/responses/Invalid'}
    delete:
      tags: [SSH]
      operationId: deleteHostGroup
      summary: Delete a host group
      description: 'Roles: security administrator. Its hosts are left in no host group, so nobody logs in to them through `halo-hostd`. Recorded as `ssh.host_group.delete`.'
      responses:
        '204': {$ref: '#/components/responses/NoContent'}
        '401': {$ref: '#/components/responses/Unauthenticated'}
        '403': {$ref: '#/components/responses/Forbidden'}
        '404': {$ref: '#/components/responses/NotFound'}
  /ssh/posix:
    get:
      tags: [SSH]
      operationId: getPOSIXSettings
      summary: Get the POSIX number ranges
      description: 'Roles: any administrator.'
      responses:
        '200': {$ref: '#/components/responses/POSIXSettingsResponse'}
        '401': {$ref: '#/components/responses/Unauthenticated'}
        '403': {$ref: '#/components/responses/Forbidden'}
    put:
      tags: [SSH]
      operationId: setPOSIXSettings
      summary: Change the POSIX number ranges and default login shell
      description: 'Roles: security administrator. Applies to people and groups created from now on; numbers already handed out never change. Both ranges start at 65536 or above and must not overlap. People and groups still waiting for a number, because a range was used up, get one as soon as the range has room. Recorded as `ssh.posix`.'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [uidMin, uidMax, gidMin, gidMax, loginShell]
              properties:
                uidMin: {type: integer, minimum: 65536}
                uidMax: {type: integer, maximum: 2147483647}
                gidMin: {type: integer, minimum: 65536}
                gidMax: {type: integer, maximum: 2147483647}
                loginShell: {type: string, examples: [/bin/bash]}
      responses:
        '200': {$ref: '#/components/responses/POSIXSettingsResponse'}
        '400': {$ref: '#/components/responses/BadJSON'}
        '401': {$ref: '#/components/responses/Unauthenticated'}
        '403': {$ref: '#/components/responses/Forbidden'}
        '422': {$ref: '#/components/responses/Invalid'}
  /applications/{id}/remote:
    parameters:
      - {$ref: '#/components/parameters/Id'}
    put:
      tags: [Remote access]
      operationId: setApplicationRemote
      summary: Change where a remote access application connects
      description: 'Roles: application administrator. Send only the fields to change. Switching `auth` to `password` or `key` needs `credential`. The stored credential is never returned; `hasCredential` says whether there is one. Changes apply to sessions that start afterwards. Recorded as `application.remote.update`, without the credential.'
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: '#/components/schemas/RemoteSettings'}
      responses:
        '200': {$ref: '#/components/responses/ApplicationResponse'}
        '400': {$ref: '#/components/responses/BadJSON'}
        '401': {$ref: '#/components/responses/ReauthRequired'}
        '403': {$ref: '#/components/responses/Forbidden'}
        '404': {$ref: '#/components/responses/NotFound'}
        '422': {$ref: '#/components/responses/Invalid'}
  /outposts:
    get:
      tags: [Remote access]
      operationId: listOutposts
      summary: List outposts
      description: 'Roles: any administrator.'
      responses:
        '200':
          description: The outposts by name.
          content:
            application/json:
              schema:
                type: array
                items: {$ref: '#/components/schemas/Outpost'}
        '401': {$ref: '#/components/responses/Unauthenticated'}
        '403': {$ref: '#/components/responses/Forbidden'}
    post:
      tags: [Remote access]
      operationId: createOutpost
      summary: Register an outpost
      description: 'Roles: security administrator. Returns an enrollment token that works once, for 24 hours, with `halo-outpost --token`. Recorded as `outpost.create`.'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [name]
              properties:
                name: {type: string, maxLength: 100, examples: [Office LAN]}
      responses:
        '201': {$ref: '#/components/responses/OutpostEnrollmentResponse'}
        '400': {$ref: '#/components/responses/BadJSON'}
        '401': {$ref: '#/components/responses/ReauthRequired'}
        '403': {$ref: '#/components/responses/Forbidden'}
        '409': {$ref: '#/components/responses/Conflict'}
        '422': {$ref: '#/components/responses/Invalid'}
  /outposts/{id}:
    parameters:
      - {$ref: '#/components/parameters/Id'}
    delete:
      tags: [Remote access]
      operationId: deleteOutpost
      summary: Delete an outpost
      description: 'Roles: security administrator. Its key stops working at once, which disconnects it and ends its live sessions. Refused while remote access applications use it. Recorded as `outpost.delete`.'
      responses:
        '204': {description: Deleted.}
        '401': {$ref: '#/components/responses/ReauthRequired'}
        '403': {$ref: '#/components/responses/Forbidden'}
        '404': {$ref: '#/components/responses/NotFound'}
        '409':
          description: '`ERR_OUTPOST_IN_USE`: remote access applications still use the outpost.'
          content:
            application/json:
              schema: {$ref: '#/components/schemas/Error'}
  /outposts/{id}/enrollment-token:
    parameters:
      - {$ref: '#/components/parameters/Id'}
    post:
      tags: [Remote access]
      operationId: createOutpostEnrollmentToken
      summary: Create a new enrollment token for an outpost
      description: 'Roles: security administrator. Replaces the outpost''s unused token. Enrolling with it gives the outpost a new key, and the old key stops working. Recorded as `outpost.token`.'
      responses:
        '200': {$ref: '#/components/responses/OutpostEnrollmentResponse'}
        '401': {$ref: '#/components/responses/ReauthRequired'}
        '403': {$ref: '#/components/responses/Forbidden'}
        '404': {$ref: '#/components/responses/NotFound'}
  /remote-sessions:
    get:
      tags: [Remote access]
      operationId: listRemoteSessions
      summary: List remote sessions
      description: 'Roles: any administrator. The 200 most recent sessions, newest first. Entries older than the sign-in log retention are deleted with their recordings.'
      parameters:
        - {name: app, in: query, description: Only sessions of this application., schema: {type: string}}
      responses:
        '200':
          description: The sessions.
          content:
            application/json:
              schema:
                type: array
                items: {$ref: '#/components/schemas/RemoteSession'}
        '401': {$ref: '#/components/responses/Unauthenticated'}
        '403': {$ref: '#/components/responses/Forbidden'}
  /remote-sessions/{id}/terminate:
    parameters:
      - {$ref: '#/components/parameters/Id'}
    post:
      tags: [Remote access]
      operationId: terminateRemoteSession
      summary: End a remote session
      description: 'Roles: security or application administrator. Closes the remote session and the browser''s connection at once. Recorded as `remote.session.terminate`.'
      responses:
        '200':
          description: The session.
          content:
            application/json:
              schema: {$ref: '#/components/schemas/RemoteSession'}
        '401': {$ref: '#/components/responses/Unauthenticated'}
        '403': {$ref: '#/components/responses/Forbidden'}
        '409':
          description: '`ERR_SESSION_ENDED`: the session already ended.'
          content:
            application/json:
              schema: {$ref: '#/components/schemas/Error'}
  /remote-sessions/{id}/recording:
    parameters:
      - {$ref: '#/components/parameters/Id'}
    get:
      tags: [Remote access]
      operationId: downloadRemoteSessionRecording
      summary: Download the recording of a remote session
      description: 'Roles: security administrator or auditor. The terminal output in asciicast v2, which asciinema plays. Halo records output, not keystrokes, and stops after 8 MiB. Recorded as `remote.session.recording.download`.'
      responses:
        '200':
          description: The recording.
          content:
            application/x-asciicast:
              schema: {type: string}
        '401': {$ref: '#/components/responses/Unauthenticated'}
        '403': {$ref: '#/components/responses/Forbidden'}
        '404': {$ref: '#/components/responses/NotFound'}
  /me/remote-sessions:
    post:
      tags: [Remote access]
      operationId: startRemoteSession
      summary: Start a remote session
      description: 'Needs the session cookie: API keys, access tokens and impersonations can''t start sessions. Runs the checks of an application sign-in and records the result in the sign-in log. Open the returned session with `GET /me/remote-sessions/{id}/connect` within a minute.'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [applicationId]
              properties:
                applicationId: {type: string}
      responses:
        '201':
          description: The session, waiting for the browser to connect.
          content:
            application/json:
              schema: {$ref: '#/components/schemas/RemoteSession'}
        '400': {$ref: '#/components/responses/BadJSON'}
        '401':
          description: '`ERR_UNAUTHENTICATED`, or `ERR_SIGN_IN_AGAIN`: the Halo session is older than the application''s sign-in frequency. Sign in again, then start the session.'
          content:
            application/json:
              schema: {$ref: '#/components/schemas/Error'}
        '403':
          description: '`ERR_NOT_ASSIGNED`, `ERR_APP_DISABLED`, `ERR_BLOCKED_BY_POLICY`, `ERR_STRONGER_AUTH_REQUIRED` for a passkey requirement or an authentication context, `ERR_TERMS_REQUIRED`, or `ERR_NO_PRINCIPALS` when the application signs in with a certificate and none of the person''s groups maps to SSH principals.'
          content:
            application/json:
              schema: {$ref: '#/components/schemas/Error'}
        '404': {$ref: '#/components/responses/NotFound'}
        '503':
          description: '`ERR_OUTPOST_OFFLINE`: the outpost that reaches the host is not connected.'
          content:
            application/json:
              schema: {$ref: '#/components/schemas/Error'}
  /me/remote-sessions/{id}/connect:
    parameters:
      - {$ref: '#/components/parameters/Id'}
      - {name: cols, in: query, description: Terminal width in columns., schema: {type: integer, default: 80, minimum: 1, maximum: 1000}}
      - {name: rows, in: query, description: Terminal height in rows., schema: {type: integer, default: 24, minimum: 1, maximum: 1000}}
    get:
      tags: [Remote access]
      operationId: connectRemoteSession
      summary: Open a remote session as a WebSocket
      description: |
        A WebSocket upgrade from the page that started the session: the `Origin` must be Halo's own address, and the cookie must belong to the same Halo session. Each session connects once.

        Binary frames carry the terminal: keystrokes from the browser, output from the host. Text frames carry JSON. The browser sends `{"type": "resize", "cols": 120, "rows": 40}` and `{"type": "ping"}` at least every 75 seconds. Halo sends `status` with a `message` while it connects, `connected` with `username`, `address`, `endsAt` and `recording`, `ping` every 25 seconds, and `end` with the `message` the session log keeps, before it closes.
      responses:
        '101': {description: Switching to the WebSocket protocol.}
        '401': {$ref: '#/components/responses/Unauthenticated'}
        '403':
          description: '`ERR_CROSS_SITE`: the `Origin` is not Halo''s address, or `ERR_IMPERSONATING`.'
          content:
            application/json:
              schema: {$ref: '#/components/schemas/Error'}
  /outpost/enroll:
    post:
      tags: [Remote access]
      operationId: enrollOutpost
      summary: Get an outpost key with an enrollment token
      description: '`halo-outpost` calls this route on its first run. The key replaces any key the outpost had, which disconnects it. Recorded as `outpost.enroll` with no actor.'
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [token]
              properties:
                token: {type: string, examples: [hle_…]}
      responses:
        '201':
          description: The outpost and its key, shown once.
          content:
            application/json:
              schema:
                type: object
                required: [outpost, key]
                properties:
                  outpost: {$ref: '#/components/schemas/Outpost'}
                  key: {type: string, examples: [hlo_…]}
        '400': {$ref: '#/components/responses/BadJSON'}
        '401':
          description: '`ERR_INVALID_TOKEN`: the token is unknown, used or expired.'
          content:
            application/json:
              schema: {$ref: '#/components/schemas/Error'}
  /outpost/connect:
    get:
      tags: [Remote access]
      operationId: connectOutpost
      summary: Hold an outpost's control connection
      description: 'A WebSocket upgrade with `Authorization: Bearer hlo_…`. Halo sends `{"type": "ping"}` every 25 seconds and `{"type": "dial", "stream": "…", "address": "host:port"}` when a session starts. The outpost answers pings with `{"type": "pong"}`, and a dial it can''t complete with `{"type": "failed", "stream": "…", "message": "…"}`. A newer connection with the same key replaces this one.'
      security: []
      responses:
        '101': {description: Switching to the WebSocket protocol.}
        '401':
          description: '`ERR_INVALID_KEY`: the key is unknown, or the outpost was deleted or enrolled again.'
          content:
            application/json:
              schema: {$ref: '#/components/schemas/Error'}
  /outpost/streams/{stream}:
    parameters:
      - {name: stream, in: path, required: true, schema: {type: string}}
    get:
      tags: [Remote access]
      operationId: attachOutpostStream
      summary: Carry one session's bytes
      description: 'A WebSocket upgrade with the outpost''s key, after it connected to the address in a `dial` message. Binary frames carry the TCP stream both ways. Only the outpost that was asked can claim the stream, once, within 15 seconds.'
      security: []
      responses:
        '101': {description: Switching to the WebSocket protocol.}
        '401':
          description: '`ERR_INVALID_KEY`.'
          content:
            application/json:
              schema: {$ref: '#/components/schemas/Error'}
        '404': {$ref: '#/components/responses/NotFound'}
  /dev/outbox:
    get:
      tags: [Development]
      operationId: listOutbox
      summary: List the 50 most recent emails in the outbox
      description: 'Roles: global administrator. Exists only when the server runs with `HALO_DEV=1`.'
      responses:
        '200':
          description: The messages, newest first, with their decrypted text.
          content:
            application/json:
              schema:
                type: array
                items: {$ref: '#/components/schemas/OutboxMessage'}
        '401': {$ref: '#/components/responses/Unauthenticated'}
        '403': {$ref: '#/components/responses/Forbidden'}
components:
  securitySchemes:
    session:
      type: apiKey
      in: cookie
      name: halo_session
      description: The session cookie Halo sets when a person signs in.
    apiKey:
      type: http
      scheme: bearer
      description: An API key of a service account, starting with `hlk_`, with the `api` scope. Requests act with the service account's roles.
    initialAccessToken:
      type: http
      scheme: bearer
      description: An API key with the `registration` scope. Required by `/oauth2/register` when `clientRegistration` is `token`.
    registrationAccessToken:
      type: http
      scheme: bearer
      description: The `registration_access_token`, starting with `hlr_`, that `/oauth2/register` returned for the client.
    cliAccessToken:
      type: http
      scheme: bearer
      bearerFormat: JWT
      description: An access token that `halo login` obtained for the built-in Halo CLI application. Accepted only on routes under `/me/`.
    applicationClient:
      type: http
      scheme: basic
      description: The application's client ID as the user name and one of its client secrets as the password. Accepted only on routes under `/authz`, for active web and service applications with an authorization model.
    applicationAssertion:
      type: apiKey
      in: header
      name: Authorization
      description: 'For applications using private_key_jwt, send `Authorization: PrivateKeyJWT <assertion>`. The audience is the issuer or the requested endpoint URL. FAPI 2.0 applications send only the issuer as a string. Use a new assertion ID for each request.'
    receiverAccessToken:
      type: http
      scheme: bearer
      bearerFormat: JWT
      description: An access token a shared signals receiver obtained with the client credentials grant at `/oauth2/token`, addressed to itself rather than to an API.
  parameters:
    Id:
      name: id
      in: path
      required: true
      schema: {type: string}
    EmailTemplateKind:
      name: kind
      in: path
      required: true
      schema: {type: string, enum: [invite, reset, magic_link, magic_code, sign_up, access_request, access_approved, access_denied, access_pass, new_sign_in, method_added, method_removed, recovery_codes, email_changed, account_locked, account_locked_admin, impersonation]}
    UserId:
      name: userId
      in: path
      required: true
      schema: {type: string, examples: [usr_01J9Z8Q4M2N5P7R9T1V3X5Z7B9]}
    DeviceCode:
      name: code
      in: path
      required: true
      description: The user code shown by the device, such as `BCDF-GHJK`. Case, spaces and the dash are ignored.
      schema: {type: string}
    Limit:
      name: limit
      in: query
      description: How many events to return, 1 to 1000. Defaults to 500.
      schema: {type: integer, minimum: 1, maximum: 1000, default: 500}
    ReportFrom:
      name: from
      in: query
      description: Start of the period, as a date such as `2026-11-01` (midnight UTC) or an RFC 3339 time. Defaults to 30 days ago. A start before the sign-in log retention moves to the oldest kept time.
      schema: {type: string}
    ReportTo:
      name: to
      in: query
      description: End of the period, not included, in the same formats as `from`. Defaults to now.
      schema: {type: string}
    ReportGroup:
      name: group
      in: query
      description: Only members of this group.
      schema: {type: string}
    ReportFormat:
      name: format
      in: query
      description: '`csv` returns the rows as a CSV file instead of JSON.'
      schema: {type: string, enum: [json, csv], default: json}
  requestBodies:
    HostGroupInput:
      required: true
      content:
        application/json:
          schema:
            type: object
            required: [name]
            properties:
              name: {type: string, maxLength: 100, examples: [Production]}
              description: {type: string, maxLength: 500}
              rules:
                type: array
                description: Who may log in to the group's hosts. One rule per group.
                items: {$ref: '#/components/schemas/HostRule'}
    BulkUserIds:
      required: true
      content:
        application/json:
          schema:
            type: object
            required: [userIds]
            properties:
              userIds:
                type: array
                minItems: 1
                maxItems: 500
                description: Repeated ids are handled once.
                items: {type: string}
    CodeSignIn:
      required: true
      content:
        application/json:
          schema:
            type: object
            required: [email, code]
            properties:
              email: {type: string, format: email}
              code: {type: string}
              authRequest: {$ref: '#/components/schemas/AuthRequestId'}
              challenge: {$ref: '#/components/schemas/ChallengeToken'}
    Password:
      required: true
      content:
        application/json:
          schema:
            type: object
            required: [password]
            properties:
              password: {type: string, minLength: 15, maxLength: 256}
    DecisionNote:
      content:
        application/json:
          schema:
            type: object
            properties:
              note: {type: string, maxLength: 2000, description: Shown to the requester.}
    CollectionInput:
      required: true
      content:
        application/json:
          schema:
            type: object
            required: [name]
            properties:
              name: {type: string, maxLength: 100}
              applicationIds:
                type: array
                description: Any application or bookmark except OAuth services.
                items: {type: string}
              groupIds:
                type: array
                description: Assigned or rule-based groups whose members see the collection.
                items: {type: string}
    AccessPackageInput:
      required: true
      content:
        application/json:
          schema:
            type: object
            required: [name, groupIds]
            properties:
              name: {type: string, maxLength: 200}
              description: {type: string, maxLength: 2000}
              ownerId: {type: [string, 'null']}
              groupIds:
                type: array
                minItems: 1
                description: Assigned groups only.
                items: {type: string}
              approverIds:
                type: array
                description: 'Used only when `stages` is left out: one stage decided by these people. A package with other stages refuses it. Without approvers, only a global administrator can decide requests.'
                items: {type: string}
              stages:
                type: array
                minItems: 1
                maxItems: 3
                description: Approval stages in order. Each stage is decided by any one of its approvers, and a denial at any stage ends the request. Left out on an update, the stages stay as they are.
                items: {$ref: '#/components/schemas/AccessStageInput'}
              questions:
                type: array
                maxItems: 10
                description: Questions on the request form. Approvers see the answers, which are kept with each request. Left out on an update, the questions stay as they are. Leave `id` empty on a new question.
                items: {$ref: '#/components/schemas/AccessQuestion'}
              maxDays:
                type: [integer, 'null']
                minimum: 1
                maximum: 365
                description: The longest duration people can request. `null` allows access until it is revoked.
              requireJustification: {type: boolean}
              archived: {type: boolean}
    LifecycleRuleInput:
      required: true
      content:
        application/json:
          schema:
            type: object
            required: [name, trigger, actions]
            properties:
              name: {type: string, maxLength: 200}
              trigger:
                type: string
                enum: [joiner, mover, leaver, date, inactivity]
                description: '`joiner`, `mover` and `leaver` run within a minute of the change. `date` and `inactivity` are checked every hour and run once per person per occurrence: once per value of the date attribute, and once per last sign-in. Both catch up on dates and sign-ins already past, so preview a rule before enabling it.'
              condition:
                type: [string, 'null']
                description: A group rule the person must match. Empty or null matches everyone.
                examples: ['user.department == "Engineering"']
              attribute:
                type: [string, 'null']
                description: 'Required for `date`: the name of a date user attribute that only administrators can change, such as an end date.'
                examples: [endDate]
              days:
                type: [integer, 'null']
                description: 'For `date`, days from the date, from -3650 to 3650: negative runs before the date, positive after it, and 0 on it (UTC). For `inactivity`, days without a sign-in, from 1 to 3650; people who never signed in count from when they were created. Inactivity rules leave out guests, who have their own end date, service accounts, emergency access accounts, and anyone not active.'
                examples: [-7, 90]
              actions:
                type: array
                minItems: 1
                maxItems: 10
                items: {$ref: '#/components/schemas/LifecycleAction'}
              enabled: {type: boolean}
    PolicyInput:
      required: true
      content:
        application/json:
          schema:
            type: object
            required: [name, mode, effect, conditions]
            properties:
              name: {type: string, maxLength: 200}
              description: {type: string, maxLength: 2000}
              enabled: {type: boolean}
              mode: {type: string, enum: [enforce, report]}
              effect: {type: string, enum: [allow, require-phishing-resistant, require-terms, require-context, block]}
              termsId: {type: [string, 'null'], description: 'The terms of use to accept. Required when `effect` is `require-terms`, ignored otherwise.'}
              contextId: {type: [string, 'null'], description: 'The authentication context sign-ins must meet. Required when `effect` is `require-context`, ignored otherwise.'}
              conditions: {$ref: '#/components/schemas/PolicyConditions'}
    AuthenticationContextInput:
      required: true
      content:
        application/json:
          schema:
            type: object
            required: [name]
            properties:
              id: {type: string, pattern: '^[A-Za-z0-9][A-Za-z0-9._:-]{0,99}$', description: Required when adding. The value applications send in `acr_values` and read in the `acr` claim.}
              name: {type: string, maxLength: 200}
              methods:
                type: array
                description: Sign-in methods that meet the context. Empty accepts every method.
                items: {$ref: '#/components/schemas/MethodKind'}
              maxAge: {type: integer, description: 'Oldest sign-in that meets the context, in seconds: 0 for no limit, or 60 to 7776000. Set methods, a maximum age or both.'}
    TermsInput:
      required: true
      content:
        application/json:
          schema:
            type: object
            required: [name]
            properties:
              name: {type: string, maxLength: 200}
              text: {type: string, maxLength: 100000, description: Plain text. Give the text, the link, or both.}
              url: {type: string, format: uri, description: An http or https link to the full document.}
    NetworkZoneInput:
      required: true
      content:
        application/json:
          schema:
            type: object
            required: [name, kind, cidrs]
            properties:
              name: {type: string, maxLength: 200}
              kind: {type: string, enum: [trusted, risky]}
              cidrs:
                type: array
                minItems: 1
                maxItems: 500
                description: IPv4 or IPv6 ranges or single addresses. Halo normalizes them to CIDR notation.
                items: {type: string, examples: [203.0.113.0/24]}
    IdentityProviderInput:
      required: true
      content:
        application/json:
          schema:
            type: object
            required: [kind, name]
            properties:
              kind: {$ref: '#/components/schemas/ProviderKind'}
              name: {type: string, maxLength: 100, description: 'Shown on the button, as in "Continue with Google".'}
              issuer:
                type: string
                description: 'Ignored for Google. For Microsoft, `https://login.microsoftonline.com/<tenant id>/v2.0`. For GitHub, the GitHub Enterprise address, defaulting to https://github.com. For generic OpenID Connect, the issuer with discovery. For SAML, the identity provider''s entity ID when you enter `ssoUrl` and `certificate` instead of metadata; otherwise Halo reads it from the metadata.'
              clientId: {type: string, description: Required except for SAML.}
              clientSecret: {type: string, description: Required except for generic OpenID Connect and SAML providers. Omit on update to keep the saved secret.}
              metadataUrl: {type: string, format: uri, description: 'SAML only. An https:// URL Halo downloads the identity provider''s metadata from when it saves, refusing private, loopback and link-local addresses. When a held change is approved, Halo downloads it again.'}
              metadataXml: {type: string, description: 'SAML only, used when `metadataUrl` is empty. The identity provider''s EntityDescriptor, with an IDPSSODescriptor, a SingleSignOnService with the HTTP-Redirect or HTTP-POST binding at an https:// address, and a signing certificate that has not expired.'}
              ssoUrl: {type: string, format: uri, description: 'SAML only, used when `metadataUrl` and `metadataXml` are empty. The single sign-on URL for the HTTP-Redirect binding, sent with `issuer` and `certificate`. Omit all three on update to keep the saved metadata.'}
              certificate: {type: string, description: 'SAML only, with `ssoUrl`. The identity provider''s signing certificate in PEM.'}
              emailAttribute: {type: string, description: 'SAML only. The attribute, by name or friendly name, that holds the email address used to find the account. Empty uses the NameID.'}
              scopes:
                type: array
                description: Defaults to openid, email and profile; read:user and user:email for GitHub. Halo adds openid for every kind except GitHub.
                items: {type: string}
              enabled: {type: boolean}
              showOnSignIn: {type: boolean}
              routeByDomain: {type: boolean, description: 'Send people who enter an address at an allowed domain straight to this provider, even when its button is hidden. Requires at least one allowed domain, and each domain can be routed by one provider.'}
              allowedDomains:
                type: array
                description: Email domains allowed to sign in with this provider. Empty allows every domain.
                items: {type: string, examples: [example.com]}
              jit: {type: boolean, description: Create an account on first sign-in. Requires at least one allowed domain.}
              jitGroupIds:
                type: array
                description: Assigned groups that accounts created on first sign-in join.
                items: {type: string}
              mapping: {$ref: '#/components/schemas/ProviderMapping', description: Omitting it on update removes the mapping, as omitting jitGroupIds removes the groups for new accounts.}
    ComplianceSourceInput:
      required: true
      content:
        application/json:
          schema:
            type: object
            required: [name]
            properties:
              name: {type: string, maxLength: 100, examples: [Intune]}
              kind: {type: string, enum: [intune, agent], description: Required when adding a source.}
              tenantId: {type: string, description: 'The directory (tenant) ID or primary domain, for `intune`.'}
              clientId: {type: string, description: 'The application (client) ID, for `intune`.'}
              clientSecret: {type: string, maxLength: 1024, description: 'The client secret, for `intune`. Required when adding one.'}
              maxAgeMinutes: {type: integer, minimum: 60, maximum: 43200, default: 1440}
              rotateSecret: {type: boolean, description: 'Give an `agent` source a new signing secret.'}
    LDAPDirectoryInput:
      required: true
      content:
        application/json:
          schema:
            type: object
            required: [name, url, bindDn, userBaseDn, mapping]
            properties:
              name: {type: string, maxLength: 100, examples: [Active Directory]}
              url: {type: string, maxLength: 300, description: '`ldaps://host[:port]` for `ldaps`, `ldap://host[:port]` otherwise.', examples: ['ldaps://dc1.example.com']}
              security: {type: string, enum: [ldaps, starttls, none], default: ldaps, description: '`none` sends the bind password unencrypted. Choose it only for a directory on the same host or a test network.'}
              caCertificate: {type: string, maxLength: 65536, description: 'PEM certificate authorities to trust for this directory instead of the system ones.'}
              bindDn: {type: string, maxLength: 500, examples: ['CN=halo-sync,OU=Service Accounts,DC=example,DC=com']}
              password: {type: string, maxLength: 1024, writeOnly: true, description: The bind password. Required when adding a directory. Stored sealed and never returned.}
              userBaseDn: {type: string, maxLength: 500, examples: ['OU=Staff,DC=example,DC=com']}
              userFilter: {type: string, maxLength: 1000, default: '(&(objectClass=person)(mail=*))'}
              groupBaseDn: {type: string, maxLength: 500, description: Leave empty to sync people only.}
              groupFilter: {type: string, maxLength: 1000, default: '(|(objectClass=group)(objectClass=groupOfNames))'}
              mapping: {$ref: '#/components/schemas/LDAPMapping'}
              enabled: {type: boolean, default: false, description: Sync every `intervalMinutes`.}
              intervalMinutes: {type: integer, minimum: 15, maximum: 1440, default: 60}
    NotificationRuleInput:
      required: true
      content:
        application/json:
          schema:
            type: object
            required: [name, destination, events]
            properties:
              name: {type: string, maxLength: 100, examples: [New global administrator]}
              destination: {type: string, enum: [webhook, slack, discord], description: 'The message format: Halo''s signed event JSON, a Slack `text` message, or a Discord embed.'}
              url: {type: string, format: uri, maxLength: 2048, writeOnly: true, description: 'The https:// URL of the incoming webhook. Required to create a rule or change its destination. Stored encrypted and never returned. Empty on update keeps the current URL.'}
              events:
                type: array
                minItems: 1
                maxItems: 50
                description: Event types such as `role.update`, families such as `sign_in.*`, or `*` for every event.
                items: {type: string}
              minRisk: {type: string, enum: ['', low, medium, high], default: '', description: Only events whose `risk` is at least this level, such as sign-ins.}
              role: {type: string, enum: ['', global_admin, security_admin, user_admin, helpdesk_admin, app_admin, auditor], default: '', description: Only role changes that give someone this role.}
              threshold: {type: integer, minimum: 1, maximum: 100, default: 1, description: Send when this many events match within `windowMinutes`.}
              windowMinutes: {type: integer, minimum: 1, maximum: 1440, default: 10}
              quietMinutes: {type: integer, minimum: 1, maximum: 1440, default: 15, description: After a message, matching events are not sent for this long.}
              enabled: {type: boolean, default: true}
    WebhookInput:
      required: true
      content:
        application/json:
          schema:
            type: object
            required: [url, events]
            properties:
              url: {type: string, format: uri, maxLength: 2048, description: 'https, or http for localhost while you test.'}
              description: {type: string, maxLength: 200}
              events:
                type: array
                minItems: 1
                maxItems: 50
                description: Event types such as `user.invite`, families such as `user.*`, or `*` for every event.
                items: {type: string}
              enabled: {type: boolean, default: true}
    ApiResourceInput:
      required: true
      content:
        application/json:
          schema:
            type: object
            required: [name, identifier, accessTokenTtl, scopes]
            properties:
              name: {type: string, maxLength: 200}
              identifier: {type: string, format: uri, maxLength: 300, description: 'The audience access tokens carry in `aud`.', examples: [https://billing.example.com]}
              description: {type: string, maxLength: 500}
              accessTokenTtl: {type: integer, minimum: 60, maximum: 86400}
              accessTokenAlg: {type: string, enum: [RS256, ES256, EdDSA], description: 'The algorithm access tokens addressed to this API are signed with. Defaults to RS256 on create and keeps the current value on update. One token can''t be addressed to APIs with different algorithms; such a request fails with `invalid_target`.'}
              scopes:
                type: array
                minItems: 1
                maxItems: 100
                items: {$ref: '#/components/schemas/ApiScope'}
    SSHHostKeyInput:
      required: true
      content:
        application/json:
          schema:
            type: object
            required: [publicKey]
            properties:
              publicKey: {type: string, description: 'The host''s public key, such as `/etc/ssh/ssh_host_ed25519_key.pub`. RSA keys need at least 2048 bits.', examples: ['ssh-ed25519 AAAAC3NzaC1lZDI1NTE5AAAAI…']}
    SSHPrincipalMappingInput:
      required: true
      content:
        application/json:
          schema:
            type: object
            required: [groupId, principals]
            properties:
              groupId: {type: string}
              principals:
                type: array
                minItems: 1
                maxItems: 32
                items: {type: string, pattern: '^[a-z_][a-z0-9_.-]{0,31}$', examples: [ops]}
  responses:
    NoContent:
      description: Done. No body.
    BadJSON:
      description: '`ERR_INVALID_JSON`: the body is not valid JSON or is larger than 1 MiB. `ERR_UNKNOWN_FIELD`: the body has a field the endpoint does not accept; the message names it.'
      content:
        application/json:
          schema: {$ref: '#/components/schemas/Error'}
    RegistrationTokenInvalid:
      description: '`invalid_token`: the registration access token is missing or does not belong to this client.'
      content:
        application/json:
          schema: {$ref: '#/components/schemas/OAuthError'}
    RegistrationOff:
      description: '`invalid_request`: client registration is off.'
      content:
        application/json:
          schema: {$ref: '#/components/schemas/OAuthError'}
    ReceiverUnauthenticated:
      description: '`ERR_UNAUTHENTICATED`: no valid client credentials access token of a service application. Comes with `WWW-Authenticate: Bearer error="invalid_token"`.'
      content:
        application/json:
          schema: {$ref: '#/components/schemas/Error'}
    ReceiverForbidden:
      description: '`ERR_FORBIDDEN`: shared signals are not turned on for the application, or it is disabled.'
      content:
        application/json:
          schema: {$ref: '#/components/schemas/Error'}
    SignalInvalid:
      description: '`ERR_INVALID`: the body is not JSON, a property is invalid, or a transmitter-supplied property does not match. The message names it.'
      content:
        application/json:
          schema: {$ref: '#/components/schemas/Error'}
    Unauthenticated:
      description: '`ERR_UNAUTHENTICATED`: no valid session or key.'
      content:
        application/json:
          schema: {$ref: '#/components/schemas/Error'}
    OutpostEnrollmentResponse:
      description: The outpost and an enrollment token for `halo-outpost --token`, shown once.
      content:
        application/json:
          schema:
            type: object
            required: [outpost, token]
            properties:
              outpost: {$ref: '#/components/schemas/Outpost'}
              token: {type: string, examples: [hle_…]}
    ReauthRequired:
      description: '`ERR_UNAUTHENTICATED`: no valid session or key. `ERR_REAUTH_REQUIRED`: this sensitive change needs a recent strong sign-in; confirm it''s you through `/me/reauthenticate` and send the request again. A person without a passkey, security key or authenticator app gets `403` with `ERR_REAUTH_UNAVAILABLE`.'
      content:
        application/json:
          schema: {$ref: '#/components/schemas/Error'}
    ReauthUnavailable:
      description: '`ERR_REAUTH_UNAVAILABLE`: you have no passkey, security key or authenticator app to confirm with. `ERR_CROSS_SITE`: the request came from another website.'
      content:
        application/json:
          schema: {$ref: '#/components/schemas/Error'}
    Forbidden:
      description: '`ERR_FORBIDDEN`: your roles do not allow this. `ERR_OUT_OF_SCOPE`: the person is outside the groups your limited role covers. `ERR_CROSS_SITE` on changes from another website. `ERR_APPROVAL_REQUIRED`: the change needs approval, and an API key cannot ask for it. `ERR_IMPERSONATING`: the session is an impersonation, which can only read the account portal.'
      content:
        application/json:
          schema: {$ref: '#/components/schemas/Error'}
    CrossSite:
      description: '`ERR_CROSS_SITE`: the request came from another website.'
      content:
        application/json:
          schema: {$ref: '#/components/schemas/Error'}
    NotFound:
      description: '`ERR_NOT_FOUND`: the item does not exist.'
      content:
        application/json:
          schema: {$ref: '#/components/schemas/Error'}
    Conflict:
      description: '`ERR_CONFLICT`: the change conflicts with the current state, such as a name that is already used.'
      content:
        application/json:
          schema: {$ref: '#/components/schemas/Error'}
    DynamicGroup:
      description: '`ERR_CONFLICT`: the group is dynamic, so its members come from its rule.'
      content:
        application/json:
          schema: {$ref: '#/components/schemas/Error'}
    Invalid:
      description: '`ERR_INVALID`: a field is missing or invalid. The message names it.'
      content:
        application/json:
          schema: {$ref: '#/components/schemas/Error'}
    ApplicationUnauthenticated:
      description: '`ERR_UNAUTHENTICATED`: the configured client credentials are missing or invalid, or the application is disabled.'
      content:
        application/json:
          schema: {$ref: '#/components/schemas/Error'}
    NoModel:
      description: '`ERR_NO_MODEL`: the application has no authorization model.'
      content:
        application/json:
          schema: {$ref: '#/components/schemas/Error'}
    AuthorizationInvalid:
      description: '`ERR_INVALID`: the object, relation or subject is malformed or not in the model. `ERR_AUTHZ_DEPTH`: answering followed more than 25 relations in a row. `ERR_AUTHZ_WIDTH`: answering needed more tuples than Halo reads for one request, 1,000 reads or 1,000 subjects of one relation, and 10,000 reads to list objects.'
      content:
        application/json:
          schema: {$ref: '#/components/schemas/Error'}
    NotConfigured:
      description: '`ERR_NOT_CONFIGURED`: provisioning is not set up for the application. `ERR_NOT_FOUND`: the application does not exist.'
      content:
        application/json:
          schema: {$ref: '#/components/schemas/Error'}
    LastMethod:
      description: '`ERR_LAST_METHOD`: it is your last way to sign in. Recovery codes do not count.'
      content:
        application/json:
          schema: {$ref: '#/components/schemas/Error'}
    AuthRequestExpired:
      description: '`ERR_AUTH_REQUEST_EXPIRED`: the application''s sign-in request expired or was already used.'
      content:
        application/json:
          schema: {$ref: '#/components/schemas/Error'}
    LinkExpired:
      description: '`ERR_LINK_EXPIRED`: the invite or reset link expired, was used, or was replaced by a newer one.'
      content:
        application/json:
          schema: {$ref: '#/components/schemas/Error'}
    SignUpOff:
      description: '`ERR_SIGN_UP_OFF`: sign-up is turned off. `ERR_LINK_EXPIRED`: the sign-up link expired, was used, or was replaced by a newer one.'
      content:
        application/json:
          schema: {$ref: '#/components/schemas/Error'}
    SignUpRefused:
      description: '`ERR_SIGN_UP_DOMAIN`: the address is not at an allowed domain. `ERR_CHALLENGE_REQUIRED` or `ERR_CHALLENGE_FAILED` (see `ChallengeToken`); failed checks on sign-up are not recorded in the sign-in log. Also `ERR_CROSS_SITE`.'
      content:
        application/json:
          schema: {$ref: '#/components/schemas/Error'}
    Suspended:
      description: '`ERR_ACCOUNT_SUSPENDED`: the account is suspended or deprovisioned. Also `ERR_CROSS_SITE`.'
      content:
        application/json:
          schema: {$ref: '#/components/schemas/Error'}
    SignInRefused:
      description: '`ERR_ACCOUNT_SUSPENDED`, `ERR_IDENTITY_CHECK_REQUIRED` (the person is invited, `identityProofingInvites` applies to them and they have no successful identity check, so the account stays inactive), `ERR_NOT_ASSIGNED` (not in a group assigned to the application), `ERR_BLOCKED_BY_POLICY`, `ERR_BLOCKED_BY_HOOK` (the application''s hook denied the sign-in or failed and fails closed; `message` holds its reason), `ERR_STRONGER_AUTH_REQUIRED` (a policy requires a passkey or security key), `ERR_STEP_UP_REQUIRED` (the method does not meet an authentication context the application asked for or a policy requires; `message` names the methods that do), `ERR_SESSION_LIMIT` (the person holds as many sessions as the session limit allows), `ERR_CHALLENGE_REQUIRED` or `ERR_CHALLENGE_FAILED` (see `ChallengeToken`), or `ERR_CROSS_SITE`. Refused sign-ins are recorded in the sign-in log.'
      content:
        application/json:
          schema: {$ref: '#/components/schemas/Error'}
    TermsExpired:
      description: '`ERR_TERMS_EXPIRED`: the step expired after 15 minutes, was already used, or belongs to another session. Sign in again.'
      content:
        application/json:
          schema: {$ref: '#/components/schemas/Error'}
    CodeMismatch:
      description: '`ERR_CODE_MISMATCH`: the code did not match, was already used, or no account uses the address.'
      content:
        application/json:
          schema: {$ref: '#/components/schemas/Error'}
    ChallengeRefused:
      description: '`ERR_CHALLENGE_REQUIRED`: bot protection is on and the request has no `challenge`. `ERR_CHALLENGE_FAILED`: the provider did not confirm the check; failed checks are recorded in the sign-in log. Also `ERR_CROSS_SITE`.'
      content:
        application/json:
          schema: {$ref: '#/components/schemas/Error'}
    ChallengeUnavailable:
      description: '`ERR_CHALLENGE_UNAVAILABLE`: Halo could not verify the check with the bot protection provider, or the provider rejected the secret key, so the request was refused. Recorded in the sign-in log, except on `/auth/sign-up`. Passkeys are never checked.'
      content:
        application/json:
          schema: {$ref: '#/components/schemas/Error'}
    TooManyAttempts:
      description: '`ERR_TOO_MANY_ATTEMPTS`: too many failed passwords or codes for this address, or failed passwords from this IP address, within the lockout window.'
      content:
        application/json:
          schema: {$ref: '#/components/schemas/Error'}
    AuthenticatorRefused:
      description: '`ERR_AUTHENTICATOR_NOT_ALLOWED`: the key breaks the passkey rules in `authenticatorRules` for one of your groups, and the message names the group and the rule. Also `ERR_CROSS_SITE`.'
      content:
        application/json:
          schema: {$ref: '#/components/schemas/Error'}
    MetadataUnavailable:
      description: '`ERR_METADATA_UNAVAILABLE`: one of the person''s groups needs attestation and Halo could not download the FIDO Metadata Service list. Try again later.'
      content:
        application/json:
          schema: {$ref: '#/components/schemas/Error'}
    RegistrationFailed:
      description: '`ERR_CEREMONY_EXPIRED`: the setup step expired; start again. `ERR_REGISTRATION_FAILED`: Halo could not verify the new credential. `ERR_INVALID_JSON`.'
      content:
        application/json:
          schema: {$ref: '#/components/schemas/Error'}
    ApprovalPending:
      description: 'The change needs approval from another global administrator under `approvalActions`. Nothing changed yet: the change is saved as a pending approval request that expires after 72 hours. A service account asking for such a change gets `403 ERR_APPROVAL_REQUIRED` instead, because a person must ask for it.'
      content:
        application/json:
          schema: {$ref: '#/components/schemas/ApprovalRequest'}
    ApprovalResponse:
      description: The approval request.
      content:
        application/json:
          schema: {$ref: '#/components/schemas/ApprovalRequest'}
    ApprovalForbidden:
      description: '`ERR_SELF_APPROVAL`: you asked for the change yourself. `ERR_FORBIDDEN`: you are not a global administrator, or you used an API key. `ERR_CROSS_SITE`.'
      content:
        application/json:
          schema: {$ref: '#/components/schemas/Error'}
    DecisionForbidden:
      description: '`ERR_SELF_APPROVAL`: the request is for you or you made it, which global administrators cannot decide either; the message names who can. `ERR_FORBIDDEN`: you are not an approver of the current stage. `ERR_CROSS_SITE`.'
      content:
        application/json:
          schema: {$ref: '#/components/schemas/Error'}
    DeviceCode:
      description: '`ERR_DEVICE_CODE`: the code is wrong, expired or already used.'
      content:
        application/json:
          schema: {$ref: '#/components/schemas/Error'}
    SignedIn:
      description: Signed in. Sets the `halo_session` cookie when a new session starts. `redirect` is the application's callback when the sign-in came from an application, otherwise `/account`. When an enforced policy asks for terms of use the person has not accepted, no session starts yet; `terms` holds the step to finish with `GET /auth/terms/{ceremony}` and `POST /auth/terms`, and `redirect` is the sign-in page that shows them.
      content:
        application/json:
          schema:
            type: object
            required: [redirect]
            properties:
              redirect: {type: string, examples: [/account, '/oauth2/authorize/callback?id=…', '/sign-in?terms=cer_…']}
              terms: {type: string, description: Present only while terms of use wait to be accepted.}
    Ceremony:
      description: A WebAuthn ceremony. Pass `options` to the browser's WebAuthn API and send the result with `ceremony` to the matching finish route within 5 minutes.
      content:
        application/json:
          schema:
            type: object
            required: [ceremony, options]
            properties:
              ceremony: {type: string}
              options: {type: object, description: WebAuthn credential request or creation options.}
    DeviceDecision:
      description: The decision was recorded.
      content:
        application/json:
          schema:
            type: object
            required: [approved, application]
            properties:
              approved: {type: boolean}
              application: {type: string, examples: [Halo CLI]}
    BulkResults:
      description: One result per distinct id. `422` with `ERR_INVALID` when `userIds` is empty or has more than 500 ids.
      content:
        application/json:
          schema:
            type: object
            required: [succeeded, failed, results]
            properties:
              succeeded: {type: integer}
              failed: {type: integer}
              results:
                type: array
                items:
                  type: object
                  required: [id, ok]
                  properties:
                    id: {type: string}
                    ok: {type: boolean}
                    error: {$ref: '#/components/schemas/ItemError'}
    Revoked:
      description: The number of sessions ended.
      content:
        application/json:
          schema:
            type: object
            required: [revoked]
            properties:
              revoked: {type: integer}
    HostGroupResponse:
      description: The host group.
      content:
        application/json:
          schema: {$ref: '#/components/schemas/HostGroup'}
    POSIXSettingsResponse:
      description: The POSIX settings.
      content:
        application/json:
          schema: {$ref: '#/components/schemas/POSIXSettings'}
    UserResponse:
      description: The person.
      content:
        application/json:
          schema: {$ref: '#/components/schemas/User'}
    ApplicationResponse:
      description: The application.
      content:
        application/json:
          schema: {$ref: '#/components/schemas/Application'}
    CollectionResponse:
      description: The collection.
      content:
        application/json:
          schema: {$ref: '#/components/schemas/Collection'}
    AccessPackageResponse:
      description: The package.
      content:
        application/json:
          schema: {$ref: '#/components/schemas/AccessPackage'}
    AccessRequestResponse:
      description: The request.
      content:
        application/json:
          schema: {$ref: '#/components/schemas/AccessRequest'}
    AccessReviewResponse:
      description: The review with its items.
      content:
        application/json:
          schema: {$ref: '#/components/schemas/AccessReview'}
    LifecycleRuleResponse:
      description: The rule.
      content:
        application/json:
          schema: {$ref: '#/components/schemas/LifecycleRule'}
    PolicyResponse:
      description: The policy. `activity` is zero in this response.
      content:
        application/json:
          schema: {$ref: '#/components/schemas/Policy'}
    NetworkZoneResponse:
      description: The zone.
      content:
        application/json:
          schema: {$ref: '#/components/schemas/NetworkZone'}
    AuthenticationContextResponse:
      description: The authentication context.
      content:
        application/json:
          schema: {$ref: '#/components/schemas/AuthenticationContext'}
    TermsResponse:
      description: The terms of use.
      content:
        application/json:
          schema: {$ref: '#/components/schemas/Terms'}
    RiskEventResponse:
      description: The risk event.
      content:
        application/json:
          schema: {$ref: '#/components/schemas/RiskEvent'}
    ServiceAccountResponse:
      description: The service account.
      content:
        application/json:
          schema: {$ref: '#/components/schemas/ServiceAccount'}
    AppProvisioningResponse:
      description: The provisioning configuration and the result of the last run.
      content:
        application/json:
          schema: {$ref: '#/components/schemas/AppProvisioning'}
    IdentityProviderResponse:
      description: The identity provider.
      content:
        application/json:
          schema: {$ref: '#/components/schemas/IdentityProvider'}
    IdentityProofStarted:
      description: The address at the provider to send the person to.
      content:
        application/json:
          schema:
            type: object
            required: [url]
            properties:
              url: {type: string, format: uri}
    IdentityProofResponse:
      description: The identity check.
      content:
        application/json:
          schema: {$ref: '#/components/schemas/IdentityProof'}
    IdentityProofLimit:
      description: '`ERR_RATE_LIMITED`: the person started 5 identity checks in the last hour.'
      content:
        application/json:
          schema: {$ref: '#/components/schemas/Error'}
    IdentityProviderUnavailable:
      description: '`ERR_IDENTITY_PROVIDER_UNAVAILABLE`: the provider could not be reached or refused the API key. The details are in Halo''s log.'
      content:
        application/json:
          schema: {$ref: '#/components/schemas/Error'}
    SettingsResponse:
      description: The settings, the organization name from `HALO_ORGANIZATION` and the issuer.
      content:
        application/json:
          schema:
            type: object
            required: [settings, defaultOrganizationName, issuer, customCssDisabled, botProtectionSecretSet, bucketConfigured]
            properties:
              settings: {$ref: '#/components/schemas/Settings'}
              defaultOrganizationName: {type: string}
              issuer: {type: string, format: uri}
              customCssDisabled: {type: boolean, description: '`HALO_DISABLE_CUSTOM_CSS=1` is set, so no page uses `customCss`.'}
              botProtectionSecretSet: {type: boolean, description: A secret key for `botProtection` is stored.}
              identityProofingKeySet: {type: boolean, description: An `identityProofingApiKey` is stored.}
              identityProofingWebhookSecretSet: {type: boolean, description: An `identityProofingWebhookSecret` is stored.}
              bucketConfigured: {type: boolean, description: '`HALO_S3_ENDPOINT` and the related variables are set, so `exportSchedule` can be turned on.'}
    ApiResourceResponse:
      description: The API resource.
      content:
        application/json:
          schema: {$ref: '#/components/schemas/ApiResource'}
    SSHAuthorityResponse:
      description: The certificate authority.
      content:
        application/json:
          schema: {$ref: '#/components/schemas/SSHAuthority'}
    SSHHostAuthorityResponse:
      description: The host certificate authority.
      content:
        application/json:
          schema: {$ref: '#/components/schemas/SSHHostAuthority'}
    SSHHostEnrollmentResponse:
      description: The host and its enrollment token, which Halo shows once.
      content:
        application/json:
          schema:
            type: object
            required: [host, token]
            properties:
              host: {$ref: '#/components/schemas/SSHHost'}
              token: {type: string}
    SSHHostCertificateResponse:
      description: The host certificate. Save it as `<host key>-cert.pub` and name it in `HostCertificate` in `sshd_config`.
      content:
        application/json:
          schema: {$ref: '#/components/schemas/SSHCertificateIssued'}
    SSHPrincipalMappingResponse:
      description: The mapping.
      content:
        application/json:
          schema: {$ref: '#/components/schemas/SSHPrincipalMapping'}
    SigningKeysResponse:
      description: The OpenID Connect signing keys, newest first, and the SAML certificates, current first.
      content:
        application/json:
          schema:
            type: object
            required: [oidc, saml]
            properties:
              oidc:
                type: array
                items: {$ref: '#/components/schemas/SigningKey'}
              saml:
                type: array
                items: {$ref: '#/components/schemas/SAMLCertificate'}
  schemas:
    Error:
      type: object
      required: [error]
      properties:
        error:
          type: object
          required: [code, message]
          properties:
            code: {type: string, examples: [ERR_NOT_FOUND]}
            message: {type: string, examples: [This user was not found. It may have been deleted.]}
    ItemError:
      type: object
      description: Why this item was refused, with the same code and message the single-item request returns.
      required: [code, message]
      properties:
        code: {type: string, examples: [ERR_FORBIDDEN]}
        message: {type: string}
    ImportReport:
      type: object
      required: [applied, changes, secrets, skipped]
      properties:
        applied: {type: boolean, description: The changes were saved.}
        changes:
          type: array
          description: 'Every object that differs, in the order Halo applies them. Objects that are the same are left out.'
          items: {$ref: '#/components/schemas/ImportChange'}
        secrets:
          type: array
          description: New applications whose client ID and secret differ from the exported ones. Update them in each application's configuration, and create a client secret on the application's page.
          items: {$ref: '#/components/schemas/ImportChange'}
        skipped: {type: array, items: {type: string, enum: [users, applicationRoles, termsAcceptances, accessReviews, auditEvents]}, description: Sections of the file that are not imported.}
        error: {$ref: '#/components/schemas/ItemError'}
    ImportChange:
      type: object
      required: [section, action, id, label]
      properties:
        section: {type: string, enum: [settings, attributes, groups, memberships, roles, eligibleRoles, terms, applications, policies, accessPackages]}
        action: {type: string, enum: [create, change, remove]}
        id: {type: string, description: 'The id in the file, or the id here for objects to remove. Memberships are `<groupId>/<userId>`.'}
        label: {type: string}
        fields: {type: array, items: {type: string}, description: 'The fields that change, or for secrets the values that are new.'}
        error: {$ref: '#/components/schemas/ItemError'}
    ImportPerson:
      type: object
      required: [email, name]
      properties:
        email: {type: string, format: email, maxLength: 254}
        name: {type: string, maxLength: 200}
        title: {type: string, maxLength: 200}
        department: {type: string, maxLength: 200}
        location: {type: string, maxLength: 200}
        managerEmail: {type: string, description: A person already in Halo or another row of the same import.}
        groups:
          type: array
          description: Names or ids of assigned groups.
          items: {type: string}
    AuthRequestId:
      type: string
      description: The id of an application's sign-in request, from the `authRequest` query parameter of the sign-in page. Omit it to sign in to Halo itself.
    MethodKind:
      type: string
      enum: [passkey, security-key, totp, magic-link, recovery-codes, password, federated, certificate, kerberos]
    RoleKey:
      type: string
      enum: [global_admin, security_admin, user_admin, helpdesk_admin, app_admin, auditor]
    ProviderKind:
      type: string
      enum: [google, microsoft, github, oidc, saml]
    SignInProvider:
      type: object
      required: [id, name, kind]
      properties:
        id: {type: string, examples: [idp_01J9Z8Q4M2N5P7R9T1V3X5Z7B9]}
        name: {type: string, examples: [Google]}
        kind: {$ref: '#/components/schemas/ProviderKind'}
    NamedRef:
      type: object
      required: [id, name]
      properties:
        id: {type: string}
        name: {type: string}
        email: {type: string}
    ReportPeriod:
      type: object
      required: [from, to, retentionDays, limitedByRetention]
      properties:
        from: {type: string, format: date-time}
        to: {type: string, format: date-time}
        retentionDays: {type: integer, description: Days the sign-in log keeps. 0 keeps everything.}
        limitedByRetention: {type: boolean, description: True when `from` was moved later because older sign-ins are no longer kept.}
    SignInCount:
      type: object
      required: [signIns, people, lastSignInAt]
      properties:
        signIns: {type: integer}
        people: {type: integer}
        lastSignInAt: {type: [string, 'null'], format: date-time, description: The latest sign-in in the period.}
    MethodRegistrationReport:
      type: object
      required: [people, methods, counts]
      properties:
        people:
          type: array
          items:
            type: object
            required: [id, name, email, department, methods, strength, lastSignInAt]
            properties:
              id: {type: string}
              name: {type: string}
              email: {type: string}
              department: {type: string}
              methods: {type: array, items: {type: string, enum: [passkey, security-key, totp, password, recovery-codes]}}
              strength: {type: string, enum: [phishing-resistant, multi-factor, single-factor]}
              lastSignInAt: {type: [string, 'null'], format: date-time}
        methods:
          type: array
          description: How many people have registered each method.
          items:
            type: object
            required: [method, people]
            properties:
              method: {type: string}
              people: {type: integer}
        counts:
          type: object
          required: [people, filters]
          properties:
            people: {type: integer}
            filters: {type: object, description: People matching each filter., additionalProperties: {type: integer}}
    Organization:
      type: object
      required: [name, issuer, contactEmail, signInMessage, logoUrl, theme, customCss, consoleBranding, featuresOff, locale]
      properties:
        name: {type: string, examples: [Fernway Systems]}
        issuer: {type: string, format: uri, examples: [https://auth.example.com]}
        contactEmail: {type: string}
        signInMessage: {type: string}
        logoUrl: {type: [string, 'null'], examples: ['/api/v1/branding/logo?v=1791100000']}
        theme: {$ref: '#/components/schemas/Theme'}
        customCss: {type: string, description: 'Empty while `HALO_DISABLE_CUSTOM_CSS=1` is set.'}
        consoleBranding: {type: boolean}
        featuresOff: {type: array, items: {$ref: '#/components/schemas/FeatureId'}, description: Features that are turned off. The console and account portal hide their pages.}
        locale: {allOf: [{$ref: '#/components/schemas/Locale'}], description: 'The organization''s default language, for people who chose none and whose browser asks for no language Halo has.'}
    Theme:
      type: object
      description: Colours for the sign-in, setup and account pages. An empty string keeps Halo's colour.
      properties:
        accent: {type: string, pattern: '^(#[0-9a-f]{6})?$', examples: ['#2563eb']}
        background: {type: string, pattern: '^(#[0-9a-f]{6})?$'}
        surface: {type: string, pattern: '^(#[0-9a-f]{6})?$'}
        border: {type: string, pattern: '^(#[0-9a-f]{6})?$'}
        text: {type: string, pattern: '^(#[0-9a-f]{6})?$'}
        link: {type: string, pattern: '^(#[0-9a-f]{6})?$'}
    Method:
      type: object
      required: [id, kind, label, addedAt, lastUsedAt]
      properties:
        id: {type: string, description: '`recovery-codes` for the set of recovery codes, `password` for the password, `access-pass` for an active temporary access pass.'}
        kind: {type: string, enum: [passkey, security-key, totp, recovery-codes, password, access-pass]}
        label: {type: string, examples: [Passkey · Safari on iOS]}
        addedAt: {type: string, format: date-time}
        lastUsedAt: {type: [string, 'null'], format: date-time}
        detail: {type: string, examples: [8 of 10 remaining]}
    RoleScopes:
      type: object
      description: 'Group ids per role key. Only `user_admin` and `helpdesk_admin` can be limited, to assigned or rule-based groups. An empty list makes the role apply to the whole organization.'
      propertyNames: {$ref: '#/components/schemas/RoleKey'}
      additionalProperties:
        type: array
        items: {type: string}
      examples: [{helpdesk_admin: [grp_01J9Z8Q4M2N5P7R9T1V3X5Z7B9]}]
    User:
      type: object
      required: [id, email, emailVerified, name, title, department, location, status, strength, methods, roles, eligibleRoles, activations, roleScopes, eligibleScopes, groupIds, appIds, managerId, source, createdAt, lastSignInAt]
      properties:
        id: {type: string, examples: [usr_01J9Z8Q4M2N5P7R9T1V3X5Z7B9]}
        email: {type: string, format: email}
        emailVerified: {type: boolean, description: 'True once the person redeemed a magic link, finished setup from a link Halo emailed, or signed in through an identity provider that verified the same address. Changing the email clears it. With the `email` scope, ID tokens and userinfo carry it as `email_verified`.'}
        name: {type: string}
        title: {type: string}
        department: {type: string}
        location: {type: string}
        status: {type: string, enum: [invited, active, suspended, deprovisioned]}
        strength: {type: string, enum: [phishing-resistant, multi-factor, single-factor]}
        methods:
          type: array
          items: {$ref: '#/components/schemas/Method'}
        roles:
          type: array
          description: Role names, such as `Global administrator`, including roles activated for a limited time. Assign roles with their keys.
          items: {type: string}
        eligibleRoles:
          type: array
          description: Roles the person can activate for a limited time.
          items: {$ref: '#/components/schemas/RoleKey'}
        activations:
          type: array
          description: Eligible roles that are active now. They are also listed in `roles`.
          items: {$ref: '#/components/schemas/RoleActivation'}
        roleScopes:
          allOf: [{$ref: '#/components/schemas/RoleScopes'}]
          description: Roles in `roles` that are limited to groups, with the group ids. An activated role has the groups of its eligibility.
        eligibleScopes:
          allOf: [{$ref: '#/components/schemas/RoleScopes'}]
          description: Roles in `eligibleRoles` that are limited to groups, with the group ids.
        groupIds:
          type: array
          description: Assigned and rule-based groups.
          items: {type: string}
        posix: {oneOf: [{$ref: '#/components/schemas/POSIXAccount'}, {type: 'null'}], description: Null for service accounts and while the POSIX range is used up.}
        appIds:
          type: array
          description: Applications the person is assigned to through their groups.
          items: {type: string}
        managerId: {type: [string, 'null']}
        source: {type: string, examples: [Halo, 'SCIM · Okta', 'LDAP · Active Directory', Google]}
        directory:
          oneOf: [{$ref: '#/components/schemas/NamedRef'}, {type: 'null'}]
          description: The LDAP directory this person is synced from. Their profile can't be changed in Halo while it is set.
        createdAt: {type: string, format: date-time}
        lastSignInAt: {type: [string, 'null'], format: date-time}
        avatarUrl: {type: [string, 'null'], description: 'Path of the profile picture, or null. With the `profile` scope, ID tokens and userinfo carry the absolute URL as `picture`.', examples: ['/api/v1/users/usr_01J9Z8Q4M2N5P7R9T1V3X5Z7B9/avatar?v=1790000000']}
        guest: {type: boolean, description: 'True for a guest: an external person with a sponsor and an end date. Guests never hold administrator roles, are left out of rule-based groups and lifecycle rules that add to groups, and cannot join open groups by themselves.'}
        sponsor:
          description: The person responsible for a guest. Null for members.
          oneOf:
            - {$ref: '#/components/schemas/NamedRef'}
            - {type: 'null'}
        expiresAt: {type: [string, 'null'], format: date-time, description: 'When a guest''s access ends. From then on `status` is `suspended`, sign-in and sessions stop working, and a background job records the suspension.'}
        attributes:
          type: object
          description: Values of custom attributes, by attribute name. Attributes without a value are left out.
          additionalProperties: {$ref: '#/components/schemas/AttributeValue'}
        locale:
          oneOf: [{$ref: '#/components/schemas/Locale'}, {type: 'null'}]
          description: 'The language the person chose for Halo''s pages and emails. Null follows the browser''s language, then the organization''s `locale`.'
    AttributeType:
      type: string
      enum: [string, number, boolean, date, list]
      description: '`date` values are `YYYY-MM-DD` strings and `list` values are arrays of strings.'
    AttributeValue:
      description: 'Text up to 500 characters, a number between -2^53 and 2^53, a boolean, a `YYYY-MM-DD` date, or up to 50 strings for a list.'
      oneOf:
        - {type: string}
        - {type: number}
        - {type: boolean}
        - {type: array, items: {type: string}}
    AttributeValues:
      type: object
      description: 'Values by attribute name. Each must match the attribute''s type. `null`, an empty string or an empty list clears the value; attributes you leave out are not changed.'
      additionalProperties:
        oneOf:
          - {$ref: '#/components/schemas/AttributeValue'}
          - {type: 'null'}
    Attribute:
      type: object
      required: [id, name, label, type, selfService, createdAt, people]
      properties:
        id: {type: string, examples: [atr_01J9Z8Q4M2N5P7R9T1V3X5Z7B9]}
        name: {type: string, examples: [employeeNumber]}
        label: {type: string, examples: [Employee number]}
        type: {$ref: '#/components/schemas/AttributeType'}
        selfService: {type: boolean, description: People can change their own value in the account portal.}
        createdAt: {type: string, format: date-time}
        people: {type: integer, description: How many people have a value.}
    RoleActivation:
      type: object
      required: [id, role, justification, activatedAt, expiresAt]
      properties:
        id: {type: string, examples: [rla_01J9Z8Q4M2N5P7R9T1V3X5Z7B9]}
        role: {$ref: '#/components/schemas/RoleKey'}
        justification: {type: string}
        activatedAt: {type: string, format: date-time}
        expiresAt: {type: string, format: date-time, description: Halo removes the role at this time.}
    Group:
      type: object
      required: [id, name, description, kind, joinPolicy, owners, memberCount, source, createdAt]
      properties:
        id: {type: string, examples: [grp_01J9Z8Q4M2N5P7R9T1V3X5Z7B9]}
        name: {type: string}
        description: {type: string}
        kind: {type: string, enum: [assigned, dynamic]}
        rule: {type: string, description: Dynamic groups only., examples: ['user.department == "Engineering"']}
        joinPolicy: {$ref: '#/components/schemas/JoinPolicy'}
        owners:
          type: array
          description: People who manage the members of this assigned group.
          items: {$ref: '#/components/schemas/NamedRef'}
        memberCount: {type: integer}
        source: {type: string}
        createdAt: {type: string, format: date-time}
        posix: {oneOf: [{$ref: '#/components/schemas/POSIXGroup'}, {type: 'null'}]}
    JoinPolicy:
      type: string
      enum: [closed, request, open]
      description: '`closed`: only owners and administrators add members. `request`: people ask and an owner approves. `open`: anyone can join. Rule-based groups are always `closed`.'
    OwnedGroup:
      allOf:
        - {$ref: '#/components/schemas/Group'}
        - type: object
          required: [requestCount]
          properties:
            requestCount: {type: integer, description: Pending requests to join.}
    JoinableGroup:
      allOf:
        - {$ref: '#/components/schemas/Group'}
        - type: object
          required: [requested]
          properties:
            requested: {type: boolean, description: You asked to join and an owner has not decided yet.}
    JoinRequest:
      type: object
      required: [user, createdAt]
      properties:
        user: {$ref: '#/components/schemas/NamedRef'}
        createdAt: {type: string, format: date-time}
    Credential:
      type: object
      required: [id, kind, label, hint, createdAt, expiresAt, lastUsedAt]
      properties:
        id: {type: string}
        kind: {type: string, examples: [secret]}
        label: {type: string}
        hint: {type: string, description: The last characters of the secret.}
        createdAt: {type: string, format: date-time}
        expiresAt: {type: string, format: date-time}
        lastUsedAt: {type: [string, 'null'], format: date-time}
    TokenPolicy:
      type: object
      required: [accessTokenTtl, refreshTokenTtl, idTokenTtl, idTokenAlg, rotation, exchange, exchangeFrom]
      properties:
        accessTokenTtl: {type: integer, description: Seconds.}
        refreshTokenTtl: {type: integer, description: Seconds. 0 means no refresh tokens.}
        idTokenTtl: {type: integer, description: Seconds.}
        idTokenAlg: {type: string, enum: [RS256, ES256, EdDSA], description: 'The algorithm ID tokens are signed with. Halo creates the first key of an algorithm when it first signs with it.'}
        rotation: {type: boolean, description: Replace the refresh token on every use.}
        exchange: {type: boolean, description: 'Allow the urn:ietf:params:oauth:grant-type:token-exchange grant (RFC 8693). The application swaps a person''s access token for one to an API it has scopes on, with itself in the act claim.'}
        exchangeFrom:
          type: array
          items: {type: string}
          description: 'Ids of the API resources whose access tokens the application accepts as subject_token. The subject token''s aud must contain one of their identifiers, otherwise the exchange fails with invalid_request. Empty means no token is accepted.'
    Claim:
      type: object
      required: [name, source]
      properties:
        name: {type: string}
        source: {type: string}
    ClaimMapping:
      type: object
      required: [name, source]
      properties:
        name: {type: string, maxLength: 256, description: 'The claim or SAML attribute name, without spaces. OpenID Connect applications can''t map `sub`, `iss`, `aud`, `exp`, `iat`, `nbf`, `jti`, `nonce`, `azp`, `acr`, `amr`, `sid`, `auth_time`, `at_hash`, `c_hash`, `act`, `client_id` or `scope`.', examples: [employee_id]}
        source:
          type: string
          description: '`user.id`, `user.email`, `user.emailVerified`, `user.name`, `user.givenName`, `user.familyName`, `user.title`, `user.department`, `user.location`, `user.groups` (group names), `user.roles` (keys of the application roles the person holds), `attribute.<name>` for a custom attribute, or `none` to leave out a claim Halo would otherwise send under this name.'
          examples: [attribute.employeeNumber]
    AuthorizationRelation:
      type: object
      description: Who holds the relation. Each list adds to the others.
      properties:
        subjects:
          type: array
          description: 'The subjects tuples may name directly: `user`, `group` (its members), a type for parents read with `from`, or `type#relation` for everyone with that relation on an object.'
          items: {type: string, examples: [user, group, folder, 'team#member']}
        union:
          type: array
          description: Other relations on the same object whose holders hold this one too.
          items: {type: string, examples: [owner]}
        roles:
          type: array
          description: Keys of the application's roles whose holders have this relation on every object of the type.
          items: {type: string, examples: [editor]}
        from:
          type: array
          description: Relations read from parent objects. `via` is a relation on this type whose subjects are the parents, and `relation` is the relation to hold on them.
          items:
            type: object
            required: [via, relation]
            properties:
              via: {type: string, examples: [parent]}
              relation: {type: string, examples: [viewer]}
    AuthorizationTypes:
      type: object
      description: Types by name, each holding its relations by name.
      additionalProperties:
        type: object
        additionalProperties: {$ref: '#/components/schemas/AuthorizationRelation'}
      examples:
        - folder: {viewer: {subjects: [user, group]}}
          document:
            parent: {subjects: [folder]}
            owner: {subjects: [user]}
            editor: {subjects: [user, group], union: [owner], roles: [editor]}
            viewer: {subjects: [user, group], union: [editor], from: [{via: parent, relation: viewer}]}
    AuthorizationModel:
      type: object
      required: [types, updatedAt]
      properties:
        types: {$ref: '#/components/schemas/AuthorizationTypes'}
        updatedAt: {type: [string, 'null'], format: date-time}
    AuthorizationTarget:
      type: object
      required: [object, relation]
      properties:
        object: {type: string, examples: ['document:readme']}
        relation: {type: string, examples: [viewer]}
    AuthorizationCheck:
      type: object
      required: [object, relation, subject]
      properties:
        object: {type: string, examples: ['document:readme']}
        relation: {type: string, examples: [viewer]}
        subject: {type: string, description: 'The person as `user:id`, with the Halo user ID that is the `sub` claim of their tokens.', examples: ['user:usr_01J9Z8Q4M2N5P7R9T1V3X5Z7B9']}
    AuthorizationAnswer:
      type: object
      required: [allowed, path]
      properties:
        allowed: {type: boolean}
        path:
          type: array
          description: Empty when denied.
          items: {type: string}
    AuthorizationNode:
      type: object
      required: [object, relation, users, groups, roles, children]
      properties:
        object: {type: string}
        relation: {type: string}
        users:
          type: array
          items: {type: string}
        groups:
          type: array
          items: {type: string}
        roles:
          type: array
          items: {type: string}
        children:
          type: array
          items: {$ref: '#/components/schemas/AuthorizationNode'}
    TupleKey:
      type: object
      required: [object, relation, subject]
      properties:
        object: {type: string, pattern: '^[a-z][a-z0-9_-]{0,63}:[A-Za-z0-9_.:@|/+=-]{1,256}$', examples: ['document:readme']}
        relation: {type: string, pattern: '^[a-z][a-z0-9_-]{0,63}$', examples: [viewer]}
        subject: {type: string, description: '`user:id`, `group:id`, `type:id` or `type:id#relation`.', examples: ['user:usr_01J9Z8Q4M2N5P7R9T1V3X5Z7B9', 'team:design#member']}
    Tuple:
      allOf:
        - {$ref: '#/components/schemas/TupleKey'}
        - type: object
          required: [createdAt]
          properties:
            createdAt: {type: string, format: date-time}
    PersonRelationship:
      type: object
      required: [applicationId, application, object, relation, createdAt]
      properties:
        applicationId: {type: string}
        application: {type: string}
        object: {type: string, examples: ['document:readme']}
        relation: {type: string, examples: [owner]}
        groupId: {type: string, description: Set when the tuple names one of the person's groups.}
        createdAt: {type: string, format: date-time}
    ApplicationRole:
      type: object
      required: [id, key, name, description, groupIds, userIds]
      properties:
        id: {type: string, examples: [arl_01J9Z8Q4M2N5P7R9T1V3X5Z7B9]}
        key: {type: string, description: The value sent in the `roles` claim and SAML attribute., examples: [billing.admin]}
        name: {type: string}
        description: {type: string}
        groupIds:
          type: array
          description: Members of these groups hold the role.
          items: {type: string}
        userIds:
          type: array
          description: People who hold the role directly.
          items: {type: string}
    Application:
      type: object
      required: [id, name, description, protocol, type, status, clientId, homepage, redirectUris, postLogoutUris, scopes, claims, claimMappings, groupIds, userCount, credentials, owner, createdAt, signIns7d, failureRate7d, tokenPolicy, maxAuthAge, setupGuide, logoUrl, registeredDynamically, awaitingApproval, requiresConsent, backchannelLogoutUri, backchannelLogoutSessionRequired, requirePar, requirePkce, requireDpop, kerberosSignIn, tokenEndpointAuthMethod, jwksUri, fapi2Profile, roles]
      properties:
        id: {type: string, examples: [app_01J9Z8Q4M2N5P7R9T1V3X5Z7B9]}
        name: {type: string}
        description: {type: string}
        protocol: {type: string, enum: [oidc, oauth, saml, forward-auth, radius, ldap, remote, bookmark]}
        type: {type: string, enum: [web, spa, native, service]}
        status: {type: string, enum: [active, disabled]}
        clientId: {type: string, description: 'The client ID, such as `hl_…`, or the entity ID for SAML applications.'}
        homepage: {type: string}
        redirectUris:
          type: array
          description: For SAML applications, the ACS URLs. For forward-auth applications, the protected addresses. For RADIUS clients, the IP addresses and CIDR ranges Halo answers RADIUS requests from.
          items: {type: string}
        postLogoutUris:
          type: array
          items: {type: string}
        scopes:
          type: array
          items: {type: string}
        claims:
          type: array
          description: What the application receives, after claim mappings.
          items: {$ref: '#/components/schemas/Claim'}
        claimMappings:
          type: array
          description: Claims added, renamed or left out for this application, in ID tokens and userinfo, SAML assertions, or forward-auth headers. A mapping replaces a claim Halo would send under the same name. Empty values are not sent, except forward-auth headers, which are sent empty. Forward-auth header names are letters, digits and hyphens, written as canonical headers, and can't be `Set-Cookie`, `Location`, `Content-*`, `X-Forwarded-*` or another header that proxies or browsers set themselves.
          items: {$ref: '#/components/schemas/ClaimMapping'}
        roles:
          type: array
          description: Roles defined in the application, by name. Separate from Halo's administrator roles.
          items: {$ref: '#/components/schemas/ApplicationRole'}
        groupIds:
          type: array
          items: {type: string}
        userCount: {type: integer}
        credentials:
          type: array
          items: {$ref: '#/components/schemas/Credential'}
        owner: {type: [string, 'null'], description: Id of the person responsible.}
        createdAt: {type: string, format: date-time}
        signIns7d: {type: integer}
        failureRate7d: {type: number, description: Percentage of failed sign-ins in the past 7 days.}
        tokenPolicy: {$ref: '#/components/schemas/TokenPolicy'}
        maxAuthAge: {type: integer, description: 'Sign-in frequency in seconds, 0 when off. A person who signed in to Halo longer ago signs in again before the application gets a code, assertion or device approval, `prompt=none` returns `login_required`, and refresh tokens are refused with `invalid_grant`. A shorter `max_age` in the request still applies. Access tokens already issued last until they expire. RADIUS clients get it as Session-Timeout, or the organization''s session lifetime when it is 0.'}
        radiusPort: {type: integer, description: 'RADIUS clients only: the UDP port of Halo''s RADIUS server for authentication and accounting, from `HALO_RADIUS_LISTEN`, or 0 when the server is off.'}
        setupGuide: {type: string}
        logoUrl: {type: [string, 'null'], description: Path of the logo, or null., examples: ['/api/v1/applications/app_01J9Z8Q4M2N5P7R9T1V3X5Z7B9/logo?v=1790000000']}
        registeredDynamically: {type: boolean, description: The client registered itself at `/oauth2/register` and can change or delete its registration with its registration access token.}
        awaitingApproval: {type: boolean, description: 'The client registered while `clientRegistration` is `approval`, or changed its registration while it is `approval` or while the client is assigned to groups. Its status stays `disabled` until an application administrator enables it.'}
        requiresConsent: {type: boolean, description: 'People see the requested scopes and allow them before their first sign-in, and again when the application asks for scopes they have not allowed. `prompt=none` then fails with `consent_required`. On for clients that registered themselves, off for applications created in the console. Any OpenID Connect application that sends `prompt=consent` gets the screen regardless.'}
        backchannelLogoutUri: {type: string, description: 'OpenID Connect Back-Channel Logout. When a Halo session the application got tokens in ends, by sign-out, revocation, the session limit, a device block, suspension, an authentication reset, the end of an impersonation, expiry or deletion of the person, Halo posts `logout_token` to this URL. The token is a JWT typed `logout+jwt`, signed like the application''s ID tokens, with `iss`, `aud`, `iat`, `exp`, `jti`, `sub`, `sid` and the back-channel logout event. Empty when off.'}
        backchannelLogoutSessionRequired: {type: boolean, description: 'The application needs `sid` in logout tokens. Halo always sends it, so this only records what the application expects.'}
        requirePar: {type: boolean, description: 'Authorization requests must be pushed to `/oauth2/par` first (RFC 9126) and reach `/oauth2/authorize` with only `client_id` and `request_uri`. Any other authorization request ends with `invalid_request`.'}
        requirePkce: {type: boolean, description: 'Every authorization request must send `code_challenge` with `code_challenge_method=S256`. Single-page and native applications always must, whatever this says.'}
        requireDpop: {type: boolean, description: 'Every token request must carry a DPoP proof (RFC 9449), so its access and refresh tokens only work with the key that signed the proof. A token request without one ends with `invalid_dpop_proof`. Refresh tokens issued without a proof stop working once this is on, and access tokens already issued last until they expire.'}
        kerberosSignIn: {type: boolean, description: 'Whether people can reach this application with Windows sign-in (Kerberos). On by default. When off, a Kerberos sign-in to it, or single sign-on from a session that started with one, is blocked like an access policy block, and the sign-in page doesn''t offer or try Windows sign-in for it.'}
        tokenEndpointAuthMethod: {type: string, enum: [client_secret_basic, private_key_jwt], description: '`client_secret_basic` accepts the application''s client secrets with HTTP Basic or `client_secret_post`. `private_key_jwt` accepts only client assertions signed by its `jwks` or `jwksUri` keys. Single-page and native applications have no client authentication, whatever this says.'}
        jwks: {type: object, description: 'The JSON Web Key Set that signs the application''s client assertions. Absent when it has none.'}
        jwksUri: {type: string, description: 'Where Halo fetches the keys that sign the application''s client assertions. Empty when it has none.'}
        fapi2Profile: {type: boolean, description: 'The application follows the FAPI 2.0 security profile. See Applications.'}
        saml: {$ref: '#/components/schemas/SAMLView'}
        ldap:
          type: object
          description: 'LDAP applications only. Where the application finds its directory. `url` is empty while `HALO_LDAP_LISTEN` is unset.'
          required: [url, baseDn, bindDn, peopleDn, groupsDn]
          properties:
            url: {type: string, examples: ['ldaps://auth.example.com:636']}
            baseDn: {type: string, examples: ['ou=app_01J9Z8Q4M2N5P7R9T1V3X5Z7B9,dc=auth,dc=example,dc=com']}
            bindDn: {type: string, examples: ['cn=bind,ou=app_01J9Z8Q4M2N5P7R9T1V3X5Z7B9,dc=auth,dc=example,dc=com']}
            peopleDn: {type: string}
            groupsDn: {type: string}
        remote: {$ref: '#/components/schemas/RemoteTarget'}
    SAMLAttributes:
      type: object
      description: The attribute name Halo sends each value under. An empty name stops sending it.
      properties:
        email: {type: string, default: email}
        name: {type: string, default: name}
        givenName: {type: string, default: given_name}
        familyName: {type: string, default: family_name}
        groups: {type: string, default: groups}
    SAMLInput:
      type: object
      properties:
        entityId: {type: string, maxLength: 1024}
        acsUrls:
          type: array
          minItems: 1
          maxItems: 10
          items: {type: string, format: uri}
        nameIdFormat: {type: string, enum: [email, persistent, unspecified]}
        signResponse: {type: boolean, description: Sign the whole response as well as the assertion.}
        attributes: {$ref: '#/components/schemas/SAMLAttributes'}
        metadataXml: {type: string, description: 'The service provider''s metadata. Halo reads the entity ID and ACS URLs from it, and the encryption certificate from a `KeyDescriptor use="encryption"`: the one that expires last, skipping expired certificates. It doesn''t turn on encryption.'}
        encryption:
          type: string
          enum: ['off', aes256-gcm, aes256-cbc]
          description: Encrypt the signed assertion for the service provider with AES-256-GCM, or AES-256-CBC for service providers that don't support GCM. The AES key is sent with RSA-OAEP (`rsa-oaep-mgf1p`, SHA-1). Needs `encryptionCertificate`.
        encryptionCertificate:
          type: string
          description: The service provider's encryption certificate, in PEM or base64. It must hold an RSA key of at least 2048 bits and not have expired when you save it. Halo returns it in PEM.
    SAMLView:
      type: object
      description: SAML applications only.
      properties:
        entityId: {type: string}
        acsUrls:
          type: array
          items: {type: string}
        nameIdFormat: {type: string}
        signResponse: {type: boolean}
        attributes: {$ref: '#/components/schemas/SAMLAttributes'}
        metadataXml: {type: string}
        encryption: {type: string, enum: ['off', aes256-gcm, aes256-cbc]}
        encryptionCertificate: {type: string, description: The service provider's encryption certificate in PEM, or an empty string.}
        idp:
          type: object
          description: What to enter in the service provider.
          properties:
            entityId: {type: string}
            metadataUrl: {type: string, format: uri}
            ssoUrl: {type: string, format: uri}
            certificateUrl: {type: string, format: uri}
            certificateFingerprint: {type: string}
            certificateExpiresAt: {type: string, format: date-time}
    MyApplication:
      type: object
      required: [id, name, description, homepage, launchUrl, logoUrl, favourite, roles]
      properties:
        id: {type: string}
        name: {type: string}
        description: {type: string}
        homepage: {type: string}
        launchUrl: {type: string, description: 'The homepage, or `/saml/launch/{id}` for SAML applications.'}
        logoUrl: {type: [string, 'null']}
        favourite: {type: boolean}
        roles:
          type: array
          description: Names of the roles you hold in the application.
          items: {type: string}
    Collection:
      type: object
      required: [id, name, applicationIds, groupIds, createdAt]
      properties:
        id: {type: string, examples: [col_01J9Z8Q4M2N5P7R9T1V3X5Z7B9]}
        name: {type: string, maxLength: 100}
        applicationIds:
          type: array
          items: {type: string}
        groupIds:
          type: array
          items: {type: string}
        createdAt: {type: string, format: date-time}
    Session:
      type: object
      required: [id, userId, device, os, browser, ip, location, method, createdAt, lastActiveAt]
      properties:
        id: {type: string, examples: [ses_01J9Z8Q4M2N5P7R9T1V3X5Z7B9]}
        userId: {type: string}
        device: {type: string}
        os: {type: string}
        browser: {type: string}
        ip: {type: string}
        location: {type: string}
        method: {$ref: '#/components/schemas/MethodKind'}
        createdAt: {type: string, format: date-time}
        lastActiveAt: {type: string, format: date-time}
        current: {type: boolean, description: Present and true for the session making the request.}
        client: {type: string, enum: [halo-cli], description: 'Present for sessions that `halo login` started through the device flow. Ending such a session, or all of a person''s sessions, also revokes its access and refresh tokens.'}
        impersonationId: {type: string, description: Present when an administrator holds this session through an impersonation. It does not count toward the session limit.}
    SignInEvent:
      type: object
      required: [id, time, userId, email, appId, result, method, ip, location, device, risk]
      properties:
        id: {type: string, examples: [evt_01J9Z8Q4M2N5P7R9T1V3X5Z7B9]}
        time: {type: string, format: date-time}
        userId: {type: [string, 'null']}
        email: {type: string}
        appId: {type: [string, 'null'], description: Null for sign-ins to Halo itself.}
        result: {type: string, enum: [success, failure, interrupted, ended], description: '`ended` records a session that Halo ended to stay within the session limit.'}
        method: {type: string, description: '`token` records a token request that called the application''s hook. `device` then holds the grant type.'}
        ip: {type: string}
        location: {type: string}
        device: {type: string, examples: [Chrome 130 · macOS]}
        risk: {type: string, enum: [none, low, medium, high]}
        reason: {type: string, description: Why the sign-in failed or the session ended.}
        challenge: {type: string, enum: [passed, failed, unavailable], description: The result of the bot protection check. Absent when no check was asked for.}
        hook: {type: string, enum: [allowed, denied, failed_open, failed_closed], description: The decision of the application's hook. Absent when the application has no hook.}
        impersonatorId: {type: string, description: 'Present when an administrator started an impersonation session as this person. `reason` then names them and says why.'}
    AuditEvent:
      type: object
      required: [id, time, actorId, action, summary, targetType, targetId, target, ip, changes]
      properties:
        id: {type: string, examples: [aud_01J9Z8Q4M2N5P7R9T1V3X5Z7B9]}
        time: {type: string, format: date-time}
        actorId: {type: [string, 'null'], description: 'Null for changes Halo made itself, such as lifecycle rules and expiring grants.'}
        action: {type: string, examples: [user.invite]}
        summary: {type: string}
        targetType: {type: string, examples: [user]}
        targetId: {type: string}
        target: {type: string, description: The target's name when the change happened.}
        ip: {type: string}
        changes:
          type: array
          description: 'The fields an update changed, with their old and new values, for changes to users, roles, groups, applications, access policies and settings. Empty for other events and for events recorded before Halo kept changes.'
          items: {$ref: '#/components/schemas/AuditChange'}
    AuditChange:
      type: object
      required: [field]
      properties:
        field: {type: string, description: 'The field''s name, with nested fields joined by dots.', examples: [tokenPolicy.accessTokenTtl]}
        before: {description: The value before the change. Absent when the field did not exist.}
        after: {description: The value after the change. Absent when the field was removed.}
        redacted: {type: boolean, description: 'True when the field holds a secret, such as a client secret, key or hash. Halo records that it changed but never its value, so `before` and `after` are absent.'}
    Overview:
      type: object
      required: [weakAdmins, expiringCredentials, highRiskSignIns, recentSignIns, failureRates, counts]
      properties:
        weakAdmins:
          type: array
          items:
            type: object
            properties:
              id: {type: string}
              name: {type: string}
        expiringCredentials:
          type: array
          items:
            type: object
            properties:
              appId: {type: string}
              appName: {type: string}
              credentialId: {type: string}
              label: {type: string}
              expiresAt: {type: string, format: date-time}
              lastUsedAt: {type: [string, 'null'], format: date-time}
              daysLeft: {type: integer}
        highRiskSignIns:
          type: array
          items: {$ref: '#/components/schemas/SignInEvent'}
        recentSignIns:
          type: array
          items: {$ref: '#/components/schemas/SignInEvent'}
        failureRates:
          type: array
          items:
            type: object
            properties:
              appId: {type: string}
              appName: {type: string}
              failureRate7d: {type: number}
        counts:
          type: object
          properties:
            users: {type: integer}
            activeUsers: {type: integer}
            applications: {type: integer}
            activeApplications: {type: integer}
    Recommendation:
      type: object
      required: [id, title, status, detail, href, action, dismissal]
      properties:
        id:
          type: string
          enum: [admin-sign-in, global-admins, global-admin-approval, emergency-access, password-everyone, lockout, session-lifetime, bot-protection, api-key-expiry, api-key-unused, report-only-policies, signing-key-age, unassigned-apps, log-retention]
        title: {type: string, examples: [Limit password sign-in to the groups that need it]}
        status: {type: string, enum: [pass, attention, fail], description: '`fail` for administrators without a passkey or security key, `attention` for every other check that does not pass.'}
        detail: {type: string, description: 'What Halo found, naming the people, keys, policies or applications involved.'}
        href: {type: string, description: The console page that fixes it., examples: [/admin/methods]}
        action: {type: string, description: The label of the link to `href`., examples: [Open sign-in methods]}
        dismissal:
          oneOf:
            - type: object
              required: [reason, by, at]
              properties:
                reason: {type: string}
                by:
                  oneOf:
                    - {$ref: '#/components/schemas/NamedRef'}
                    - {type: 'null'}
                at: {type: string, format: date-time}
            - {type: 'null'}
    AccessStageInput:
      type: object
      required: [approver]
      properties:
        approver:
          type: string
          enum: [people, manager, group-owners]
          description: '`people`: the people in `approverIds`. `manager`: the beneficiary''s manager, or a guest''s sponsor when the guest has no manager. `group-owners`: the owners of `groupId`.'
        approverIds: {type: array, items: {type: string}, description: Only for `people`.}
        groupId: {type: [string, 'null'], description: An assigned group. Required for `group-owners`.}
        fallbackIds:
          type: array
          items: {type: string}
          description: Decide the stage when nobody above can, such as a beneficiary without a manager, and get the stage when its deadline passes. Without fallback approvers, global administrators decide a stage nobody else can.
        timeoutDays:
          type: [integer, 'null']
          minimum: 1
          maximum: 30
          description: Days the stage waits. Then it goes to the fallback approvers once, for the same number of days, and after that, or straight away without fallback approvers, the request expires. `null` waits until someone decides.
    AccessStage:
      type: object
      required: [approver, approvers, group, fallback, timeoutDays]
      properties:
        approver: {type: string, enum: [people, manager, group-owners]}
        approvers:
          type: array
          items: {$ref: '#/components/schemas/NamedRef'}
        group:
          oneOf:
            - {$ref: '#/components/schemas/NamedRef'}
            - {type: 'null'}
        fallback:
          type: array
          items: {$ref: '#/components/schemas/NamedRef'}
        timeoutDays: {type: [integer, 'null']}
    AccessQuestion:
      type: object
      required: [text, kind]
      properties:
        id: {type: string, maxLength: 40}
        text: {type: string, maxLength: 200, examples: [Ticket number]}
        kind: {type: string, enum: [text, choice]}
        choices: {type: array, minItems: 2, maxItems: 20, items: {type: string, maxLength: 100}, description: Only for `choice`.}
        required: {type: boolean}
    AccessPackage:
      type: object
      required: [id, name, description, owner, groups, approvers, stages, questions, maxDays, requireJustification, archived, pendingRequests, activeGrants, createdAt]
      properties:
        id: {type: string, examples: [pkg_01J9Z8Q4M2N5P7R9T1V3X5Z7B9]}
        name: {type: string}
        description: {type: string}
        owner:
          oneOf:
            - {$ref: '#/components/schemas/NamedRef'}
            - {type: 'null'}
        groups:
          type: array
          items: {$ref: '#/components/schemas/NamedRef'}
        approvers:
          type: array
          description: Everyone named as an approver in any stage, without fallback approvers.
          items: {$ref: '#/components/schemas/NamedRef'}
        stages:
          type: array
          items: {$ref: '#/components/schemas/AccessStage'}
        questions:
          type: array
          items: {$ref: '#/components/schemas/AccessQuestion'}
        maxDays: {type: [integer, 'null']}
        requireJustification: {type: boolean}
        archived: {type: boolean}
        pendingRequests: {type: integer}
        activeGrants: {type: integer}
        createdAt: {type: string, format: date-time}
    AccessRequest:
      type: object
      required: [id, package, requester, requestedBy, extends, justification, answers, durationDays, status, stage, stages, stageDueAt, stageApprovals, decidedBy, decidedAt, decisionNote, expiresAt, endedAt, endReason, groups, approvers, createdAt, canDecide]
      properties:
        id: {type: string, examples: [req_01J9Z8Q4M2N5P7R9T1V3X5Z7B9]}
        package: {$ref: '#/components/schemas/NamedRef'}
        requester: {$ref: '#/components/schemas/NamedRef', description: The person who gets the access.}
        requestedBy:
          description: The manager or sponsor who asked on the requester's behalf. Null when the requester asked themselves.
          oneOf:
            - {$ref: '#/components/schemas/NamedRef'}
            - {type: 'null'}
        extends: {type: [string, 'null'], description: The id of the grant this request extends.}
        justification: {type: string}
        answers:
          type: array
          description: The answers given, with each question's text as it was asked.
          items:
            type: object
            required: [questionId, question, answer]
            properties:
              questionId: {type: string}
              question: {type: string}
              answer: {type: string}
        durationDays: {type: [integer, 'null']}
        status: {type: string, enum: [pending, approved, denied, cancelled, expired], description: '`expired`: nobody decided before the deadline.'}
        stage: {type: integer, description: The current stage, or the last one for a decided request.}
        stages: {type: integer}
        stageDueAt: {type: [string, 'null'], format: date-time, description: When the current stage of a pending request reaches its deadline.}
        stageApprovals:
          type: array
          items:
            type: object
            required: [stage, by, note, at]
            properties:
              stage: {type: integer}
              by:
                oneOf:
                  - {$ref: '#/components/schemas/NamedRef'}
                  - {type: 'null'}
              note: {type: string}
              at: {type: string, format: date-time}
        decidedBy:
          oneOf:
            - {$ref: '#/components/schemas/NamedRef'}
            - {type: 'null'}
        decidedAt: {type: [string, 'null'], format: date-time}
        decisionNote: {type: string}
        expiresAt: {type: [string, 'null'], format: date-time, description: When an approved grant ends. Null for grants that last until revoked.}
        endedAt: {type: [string, 'null'], format: date-time}
        endReason: {type: [string, 'null'], enum: [expired, revoked, extended, null]}
        groups:
          type: array
          items: {$ref: '#/components/schemas/NamedRef'}
        approvers:
          type: array
          description: Who can decide the current stage of a pending request. Empty when only a global administrator can, and for decided requests.
          items: {$ref: '#/components/schemas/NamedRef'}
        createdAt: {type: string, format: date-time}
        canDecide: {type: boolean}
    Impersonation:
      type: object
      required: [id, actor, user, reason, status, createdAt, startedAt, expiresAt]
      properties:
        id: {type: string, examples: [imp_01J9Z8Q4M2N5P7R9T1V3X5Z7B9]}
        actor: {$ref: '#/components/schemas/NamedRef', description: The administrator who impersonates.}
        user: {$ref: '#/components/schemas/NamedRef', description: The person they see Halo as.}
        reason: {type: string}
        status: {type: string, enum: [ready, active, ended, expired], description: '`ready` until started, `expired` if never started in time, `active` while its session lasts, then `ended`.'}
        createdAt: {type: string, format: date-time}
        startedAt: {type: [string, 'null'], format: date-time}
        expiresAt: {type: string, format: date-time, description: When it must be started by, or when its session ends once started.}
    PersonalData:
      type: object
      description: 'Everything Halo stores about one person, without secrets. `signIns` includes failed attempts with their email address, and `auditEvents` the entries where they are the target.'
      properties:
        exportedAt: {type: string, format: date-time}
        person: {$ref: '#/components/schemas/User'}
        groups: {type: array, items: {type: object}}
        ownedGroups: {type: array, items: {type: object}}
        groupJoinRequests: {type: array, items: {type: object}}
        linkedAccounts: {type: array, items: {type: object}}
        sessions: {type: array, items: {type: object}}
        devices: {type: array, items: {type: object}}
        signIns: {type: array, items: {type: object}}
        auditEvents: {type: array, items: {type: object}}
        consents: {type: array, items: {type: object}}
        tokens: {type: array, items: {type: object}}
        accessRequests: {type: array, items: {type: object}}
        accessReviews: {type: array, items: {type: object}}
        termsAcceptances: {type: array, items: {type: object}}
        impersonations: {type: array, items: {type: object}}
        provisionedAccounts: {type: array, items: {type: object}}
        lifecycleRuns: {type: array, items: {type: object}}
        sshCertificates: {type: array, items: {type: object}}
        riskEvents: {type: array, items: {type: object}}
        applicationPreferences: {type: array, items: {type: object}}
        securityEmails: {type: array, items: {type: object}, description: 'Security emails Halo sent, with what each was about: the IP address of a new sign-in, a sign-in method, a new email address or a temporary access pass expiry.'}
        securityEmailOptOuts: {type: array, items: {type: object}, description: Security emails the person turned off.}
        identityProofs: {type: array, items: {type: object}, description: 'Identity checks: the method, provider, provider session id, result, document kind and note, who checked the person in person, and the dates.'}
    ApprovalRequest:
      type: object
      required: [id, action, summary, targetType, targetId, targetLabel, requester, createdAt, expiresAt, status, decidedBy, decidedAt, outcome, canDecide]
      properties:
        id: {type: string, examples: [apr_01J9Z8Q4M2N5P7R9T1V3X5Z7B9]}
        action: {type: string, enum: [global-admin, policy-disable, password-sign-in, identity-providers, impersonation, user-deletion, approval-settings, configuration-import, features]}
        summary: {type: string, examples: [Set roles to Global administrator]}
        targetType: {type: string, enum: [user, service_account, policy, method, identity_provider, settings]}
        targetId: {type: string, description: Empty for a new identity provider and for settings.}
        targetLabel: {type: string}
        requester: {$ref: '#/components/schemas/NamedRef'}
        createdAt: {type: string, format: date-time}
        expiresAt: {type: string, format: date-time}
        status: {type: string, enum: [pending, approved, rejected, failed, expired]}
        decidedBy:
          oneOf:
            - {$ref: '#/components/schemas/NamedRef'}
            - {type: 'null'}
        decidedAt: {type: [string, 'null'], format: date-time}
        outcome: {type: string, description: Why an approved change was not applied. Empty otherwise.}
        canDecide: {type: boolean}
    ReviewItem:
      type: object
      required: [user, title, decision, note, decidedBy, decidedAt, outcome]
      properties:
        user: {$ref: '#/components/schemas/NamedRef'}
        title: {type: string}
        guest: {type: boolean}
        decision: {type: [string, 'null'], enum: [keep, remove, null]}
        note: {type: string}
        decidedBy:
          oneOf:
            - {$ref: '#/components/schemas/NamedRef'}
            - {type: 'null'}
        decidedAt: {type: [string, 'null'], format: date-time}
        outcome: {type: [string, 'null'], enum: [kept, removed, not-removed, no-decision, null], description: Set when the review is completed.}
    AccessReview:
      type: object
      required: [id, name, group, reviewers, dueAt, autoApply, status, total, decided, removals, createdBy, createdAt, completedBy, completedAt, canDecide, canComplete]
      properties:
        id: {type: string, examples: [rev_01J9Z8Q4M2N5P7R9T1V3X5Z7B9]}
        name: {type: string}
        group:
          allOf:
            - {$ref: '#/components/schemas/NamedRef'}
          description: For a completed review whose group was deleted, `id` is empty and `name` is the group's name at deletion.
        reviewers:
          type: array
          items: {$ref: '#/components/schemas/NamedRef'}
        dueAt: {type: string, format: date-time}
        autoApply: {type: boolean}
        status: {type: string, enum: [in-progress, overdue, completed]}
        total: {type: integer}
        decided: {type: integer}
        removals: {type: integer}
        createdBy:
          oneOf:
            - {$ref: '#/components/schemas/NamedRef'}
            - {type: 'null'}
        createdAt: {type: string, format: date-time}
        completedBy:
          oneOf:
            - {$ref: '#/components/schemas/NamedRef'}
            - {type: 'null'}
        completedAt: {type: [string, 'null'], format: date-time}
        items:
          type: array
          description: Present when you get a single review.
          items: {$ref: '#/components/schemas/ReviewItem'}
        canDecide: {type: boolean}
        canComplete: {type: boolean}
    LifecycleAction:
      type: object
      required: [type]
      properties:
        type: {type: string, enum: [add-to-group, remove-from-group, revoke-sessions, suspend], description: '`suspend` also ends every session, and never suspends an emergency access account or the last active global administrator; the run records a failed step instead.'}
        groupId: {type: string, description: Required for add-to-group and remove-from-group. Assigned groups only.}
    LifecycleRule:
      type: object
      required: [id, name, trigger, condition, attribute, days, actions, enabled, runs, lastRunAt, createdAt]
      properties:
        id: {type: string}
        name: {type: string}
        trigger: {type: string, enum: [joiner, mover, leaver, date, inactivity]}
        condition: {type: [string, 'null']}
        attribute: {type: [string, 'null']}
        days: {type: [integer, 'null']}
        actions:
          type: array
          items: {$ref: '#/components/schemas/LifecycleAction'}
        enabled: {type: boolean}
        runs: {type: integer}
        lastRunAt: {type: [string, 'null'], format: date-time}
        createdAt: {type: string, format: date-time}
    LifecycleRun:
      type: object
      required: [id, rule, user, trigger, change, steps, result, createdAt]
      properties:
        id: {type: string}
        rule: {$ref: '#/components/schemas/NamedRef'}
        user: {$ref: '#/components/schemas/NamedRef'}
        trigger: {type: string, enum: [joiner, mover, leaver, date, inactivity]}
        change: {type: string, examples: [Department changed from Sales to Engineering]}
        steps:
          type: array
          items: {type: string, examples: [Added to Engineering]}
        result: {type: string, enum: [succeeded, failed]}
        createdAt: {type: string, format: date-time}
    PolicyConditions:
      type: object
      properties:
        allUsers: {type: boolean}
        groupIds:
          type: array
          items: {type: string}
        userIds:
          type: array
          items: {type: string}
        excludeGroupIds:
          type: array
          items: {type: string}
        excludeUserIds:
          type: array
          items: {type: string}
        allApps: {type: boolean}
        appIds:
          type: array
          description: Application ids, or `halo` for the console and account portal.
          items: {type: string}
        network: {type: string, enum: ['', any, in, not-in]}
        zoneIds:
          type: array
          items: {type: string}
        device: {type: string, enum: ['', any, trusted, untrusted]}
        compliance: {type: string, enum: ['', any, compliant, not-compliant], description: '`not-compliant` matches non-compliant devices, devices whose state is unknown or older than their source''s freshness limit, and devices no source reports on.'}
        risk:
          type: array
          description: Match only these risk levels. Empty matches every level.
          items: {type: string, enum: [none, low, medium, high]}
        methods:
          type: array
          description: Match only these sign-in methods. Empty matches every method.
          items: {$ref: '#/components/schemas/MethodKind'}
    AccessPolicy:
      type: object
      required: [id, name, description, priority, enabled, mode, effect, termsId, contextId, conditions, createdAt, updatedAt]
      properties:
        id: {type: string, examples: [pol_01J9Z8Q4M2N5P7R9T1V3X5Z7B9]}
        name: {type: string}
        description: {type: string}
        priority: {type: integer, description: Position in the saved order.}
        enabled: {type: boolean}
        mode: {type: string, enum: [enforce, report]}
        effect: {type: string, enum: [allow, require-phishing-resistant, require-terms, require-context, block]}
        termsId: {type: [string, 'null'], description: 'The terms of use a `require-terms` policy asks for.'}
        contextId: {type: [string, 'null'], description: 'The authentication context a `require-context` policy asks for. Every enforced matching `require-context` policy applies, whichever policy decides the effect.'}
        conditions: {$ref: '#/components/schemas/PolicyConditions'}
        createdAt: {type: string, format: date-time}
        updatedAt: {type: string, format: date-time}
    Policy:
      allOf:
        - {$ref: '#/components/schemas/AccessPolicy'}
        - type: object
          required: [activity]
          properties:
            activity:
              type: object
              required: [matched, stopped]
              properties:
                matched: {type: integer, description: Sign-ins the policy matched in the past 24 hours.}
                stopped: {type: integer, description: 'Matched sign-ins it blocked or would have blocked, or that needed a stronger method or unaccepted terms of use.'}
    Simulation:
      type: object
      required: [effect, outcome, policy, reason, risk, signals, policies]
      properties:
        effect: {type: string, enum: [allow, require-phishing-resistant, require-terms, require-context, block]}
        outcome: {type: string, enum: [allow, require, terms, block], description: '`require` when the effect requires a passkey or security key and the simulated method is neither, or when an enforced policy requires an authentication context whose methods leave out the simulated method. `terms` when an enforced policy asks for terms of use the person has not accepted.'}
        policy: {type: string, description: 'The name of the deciding policy, if any.'}
        reason: {type: string}
        risk: {type: string, enum: [none, low, medium, high]}
        signals:
          type: array
          items:
            type: object
            properties:
              type: {type: string, enum: [risky-network, failed-sign-ins, new-device, new-network, password]}
              level: {type: string, enum: [low, medium, high]}
              detail: {type: string}
        policies:
          type: array
          items:
            type: object
            properties:
              id: {type: string}
              name: {type: string}
              mode: {type: string, enum: [enforce, report]}
              effect: {type: string}
              matched: {type: boolean}
              outcome: {type: string, enum: ['', allow, require, terms, block]}
              detail: {type: string, description: Why it matched or did not.}
    AuthenticationContext:
      type: object
      required: [id, name, methods, maxAge, createdAt, updatedAt]
      properties:
        id: {type: string, examples: [passkey-recent], description: The value applications send in `acr_values` and read in the `acr` claim.}
        name: {type: string}
        methods:
          type: array
          description: Sign-in methods that meet the context. Empty accepts every method.
          items: {$ref: '#/components/schemas/MethodKind'}
        maxAge: {type: integer, description: 'Oldest sign-in that meets the context, in seconds. 0 for no limit.'}
        createdAt: {type: string, format: date-time}
        updatedAt: {type: string, format: date-time}
    Terms:
      type: object
      required: [id, name, version, text, url, createdAt, updatedAt]
      properties:
        id: {type: string, examples: [tou_01J9Z8Q4M2N5P7R9T1V3X5Z7B9]}
        name: {type: string}
        version: {type: integer, minimum: 1, description: Goes up by one each time the text or link changes.}
        text: {type: string}
        url: {type: string}
        createdAt: {type: string, format: date-time}
        updatedAt: {type: string, format: date-time}
    TermsAcceptance:
      type: object
      required: [termsId, name, version, acceptedAt]
      properties:
        termsId: {type: string}
        name: {type: string, description: The name of the terms when they were accepted.}
        version: {type: integer}
        acceptedAt: {type: string, format: date-time}
    CertificateAuthority:
      type: object
      required: [id, name, mapping, certificates, createdAt]
      properties:
        id: {type: string}
        name: {type: string}
        mapping: {type: string, enum: [email, upn, subject]}
        certificates:
          type: array
          items:
            type: object
            required: [subject, expiresAt]
            properties:
              subject: {type: string, examples: ['CN=Corporate Issuing CA,O=Example']}
              expiresAt: {type: string, format: date-time}
        createdAt: {type: string, format: date-time}
    KerberosRealm:
      type: object
      required: [realm, domain]
      properties:
        realm: {type: string, examples: [CORP.EXAMPLE.COM]}
        domain: {type: string, examples: [example.com], description: 'The email domain for this realm: `ada@CORP.EXAMPLE.COM` signs in the person whose email address is `ada@example.com`.'}
    KerberosSource:
      type: object
      required: [servicePrincipal, realms, zoneIds, keys, updatedAt]
      properties:
        servicePrincipal: {type: string, examples: [HTTP/auth.example.com@CORP.EXAMPLE.COM]}
        realms: {type: array, items: {$ref: '#/components/schemas/KerberosRealm'}}
        zoneIds: {type: array, items: {type: string}}
        keys:
          type: array
          description: The keys Halo kept from the keytab, without their values.
          items:
            type: object
            required: [version, type, createdAt]
            properties:
              version: {type: integer, description: The key version number (kvno).}
              type: {type: string, examples: [aes256-cts-hmac-sha1-96]}
              createdAt: {type: string, format: date-time}
        updatedAt: {type: string, format: date-time}
    NetworkZone:
      type: object
      required: [id, name, kind, cidrs, createdAt, updatedAt]
      properties:
        id: {type: string}
        name: {type: string}
        kind: {type: string, enum: [trusted, risky]}
        cidrs:
          type: array
          items: {type: string}
        createdAt: {type: string, format: date-time}
        updatedAt: {type: string, format: date-time}
    MethodSetting:
      type: object
      required: [method, enabled, updatedAt, users, exclusive]
      properties:
        method: {$ref: '#/components/schemas/MethodKind'}
        enabled: {type: boolean}
        updatedAt: {type: string, format: date-time}
        users: {type: integer}
        exclusive: {type: integer}
    Device:
      type: object
      required: [id, userId, name, os, browser, trust, firstSeenAt, lastSeenAt, lastIp, signIns]
      properties:
        id: {type: string, examples: [dev_01J9Z8Q4M2N5P7R9T1V3X5Z7B9]}
        userId: {type: string}
        name: {type: string}
        os: {type: string}
        browser: {type: string}
        trust: {type: string, enum: [unknown, trusted, blocked]}
        firstSeenAt: {type: string, format: date-time}
        lastSeenAt: {type: string, format: date-time}
        lastIp: {type: string}
        signIns: {type: integer}
        compliance:
          description: The compliance state from the linked source record, or null when the device is not linked.
          oneOf:
            - type: 'null'
            - type: object
              required: [state, sourceId, source, externalId, record, reportedAt, stale]
              properties:
                state: {type: string, enum: [compliant, non-compliant, unknown], description: '`unknown` when the last report is older than the source''s `maxAgeMinutes`.'}
                sourceId: {type: string}
                source: {type: string}
                externalId: {type: string}
                record: {type: string, description: The device name in the source.}
                reportedAt: {type: string, format: date-time}
                stale: {type: boolean}
        current: {type: boolean}
    ComplianceSource:
      type: object
      required: [id, name, kind, tenantId, clientId, maxAgeMinutes, reportedAt, syncError, createdAt, updatedAt, records, linked]
      properties:
        id: {type: string}
        name: {type: string}
        kind: {type: string, enum: [intune, agent]}
        tenantId: {type: string}
        clientId: {type: string}
        maxAgeMinutes: {type: integer, description: How long a report counts as fresh. Older reports count as unknown.}
        reportedAt: {type: [string, 'null'], format: date-time, description: The last successful sync or report.}
        syncError: {type: string, description: 'Why the last Intune sync failed, empty after a successful one.'}
        createdAt: {type: string, format: date-time}
        updatedAt: {type: string, format: date-time}
        records: {type: integer, description: Devices the source reported.}
        linked: {type: integer, description: Halo devices linked to its records.}
    ComplianceSourceSaved:
      type: object
      required: [source]
      properties:
        source: {$ref: '#/components/schemas/ComplianceSource'}
        secret: {type: string, description: 'An agent source''s signing secret, only when created or rotated.', examples: [hcs_…]}
    ComplianceRecord:
      type: object
      required: [id, name, owner, state, osVersion, encrypted, patchLevel, reportedAt]
      properties:
        id: {type: string}
        name: {type: string}
        owner: {type: string}
        state: {type: string, enum: [compliant, non-compliant, unknown]}
        osVersion: {type: string}
        encrypted: {type: [boolean, 'null']}
        patchLevel: {type: string}
        reportedAt: {type: string, format: date-time}
    RiskEvent:
      type: object
      required: [id, time, type, level, status, userId, ip, deviceId, device, signInId, detail, resolvedBy, resolvedAt]
      properties:
        id: {type: string}
        time: {type: string, format: date-time}
        type: {type: string, enum: [risky-network, failed-sign-ins, new-device]}
        level: {type: string, enum: [medium, high]}
        status: {type: string, enum: [open, resolved, dismissed]}
        userId: {type: [string, 'null']}
        ip: {type: string}
        deviceId: {type: [string, 'null']}
        device: {type: string}
        signInId: {type: [string, 'null']}
        detail: {type: string}
        resolvedBy: {type: [string, 'null']}
        resolvedAt: {type: [string, 'null'], format: date-time}
    ApiKey:
      type: object
      required: [id, serviceAccountId, serviceAccountName, label, prefix, scopes, createdBy, createdAt, expiresAt, lastUsedAt, revokedAt, rateLimitHits]
      properties:
        id: {type: string, examples: [key_01J9Z8Q4M2N5P7R9T1V3X5Z7B9]}
        serviceAccountId: {type: string}
        serviceAccountName: {type: string}
        label: {type: string}
        prefix: {type: string, description: The first 12 characters of the key.}
        scopes:
          type: array
          items: {type: string, enum: [api, scim, registration]}
        createdBy: {type: [string, 'null']}
        createdAt: {type: string, format: date-time}
        expiresAt: {type: [string, 'null'], format: date-time}
        lastUsedAt: {type: [string, 'null'], format: date-time}
        revokedAt: {type: [string, 'null'], format: date-time}
        rateLimitHits: {type: integer, description: Requests with this key that were rejected with `429` in the last 24 hours.}
    ServiceAccount:
      type: object
      required: [id, name, email, description, ownerId, status, rateLimit, roles, keys, federatedCredentials, createdBy, createdAt]
      properties:
        id: {type: string, examples: [usr_01J9Z8Q4M2N5P7R9T1V3X5Z7B9]}
        name: {type: string}
        email: {type: string, examples: [terraform@service.halo.invalid]}
        description: {type: string}
        ownerId: {type: [string, 'null']}
        status: {type: string, enum: [active, suspended], description: '`suspended` when disabled.'}
        rateLimit: {type: integer, examples: [600], description: Requests per minute that each of the account's API keys may send to the management API.}
        roles:
          type: array
          items: {$ref: '#/components/schemas/RoleKey'}
        keys:
          type: array
          items: {$ref: '#/components/schemas/ApiKey'}
        federatedCredentials:
          type: array
          items: {$ref: '#/components/schemas/FederatedCredential'}
        createdBy: {type: [string, 'null']}
        createdAt: {type: string, format: date-time}
    FederatedCredential:
      type: object
      required: [id, serviceAccountId, name, issuer, subject, audience, conditions, scopes, createdBy, createdAt, lastUsedAt]
      properties:
        id: {type: string, examples: [fic_01J9Z8Q4M2N5P7R9T1V3X5Z7B9]}
        serviceAccountId: {type: string}
        name: {type: string}
        issuer: {type: string, format: uri}
        subject: {type: string}
        audience: {type: string}
        conditions:
          type: object
          additionalProperties: {type: string}
        scopes:
          type: array
          items: {type: string, enum: [api, scim, registration]}
        createdBy: {type: [string, 'null']}
        createdAt: {type: string, format: date-time}
        lastUsedAt: {type: [string, 'null'], format: date-time, description: The last time a workload exchanged a token through it.}
    LDAPMapping:
      type: object
      required: [id, email, name]
      description: The directory attribute for each Halo field. Leave an optional field empty to leave it out of the sync.
      properties:
        id: {type: string, description: 'A stable entry ID that survives renames and moves.', examples: [objectGUID, entryUUID]}
        email: {type: string, examples: [mail]}
        name: {type: string, examples: [displayName, cn]}
        title: {type: string, examples: [title]}
        department: {type: string, examples: [department]}
        location: {type: string, examples: [l]}
        manager: {type: string, description: An attribute holding the manager's DN. The manager must be synced from the same directory., examples: [manager]}
        groupName: {type: string, default: cn}
        member: {type: string, default: member, description: An attribute holding member DNs.}
        attributes:
          type: object
          description: 'Custom user attribute names to directory attributes. Self-service attributes can''t be mapped. Dates are read as YYYY-MM-DD or LDAP generalized time, booleans as TRUE or FALSE.'
          additionalProperties: {type: string}
          examples: [{employeeNumber: employeeNumber}]
    LDAPDirectory:
      type: object
      required: [id, name, url, security, caCertificate, bindDn, userBaseDn, userFilter, groupBaseDn, groupFilter, mapping, enabled, intervalMinutes, syncedAt, syncError, createdAt, updatedAt, people, groups]
      properties:
        id: {type: string}
        name: {type: string}
        url: {type: string}
        security: {type: string, enum: [ldaps, starttls, none]}
        caCertificate: {type: string}
        bindDn: {type: string}
        userBaseDn: {type: string}
        userFilter: {type: string}
        groupBaseDn: {type: string}
        groupFilter: {type: string}
        mapping: {$ref: '#/components/schemas/LDAPMapping'}
        enabled: {type: boolean}
        intervalMinutes: {type: integer}
        syncedAt: {type: [string, 'null'], format: date-time, description: When the last sync started.}
        syncError: {type: string, description: Why the last sync failed, empty after a successful one.}
        createdAt: {type: string, format: date-time}
        updatedAt: {type: string, format: date-time}
        people: {type: integer, description: People synced from the directory.}
        groups: {type: integer, description: Groups synced from the directory.}
    LDAPSync:
      type: object
      required: [id, startedAt, finishedAt, result, error, counts, skipped]
      properties:
        id: {type: string}
        startedAt: {type: string, format: date-time}
        finishedAt: {type: string, format: date-time}
        result: {type: string, enum: [succeeded, failed]}
        error: {type: string}
        counts:
          type: object
          required: [created, updated, suspended, restored, groupsCreated, groupsRenamed, membersAdded, membersRemoved]
          properties:
            created: {type: integer}
            updated: {type: integer}
            suspended: {type: integer}
            restored: {type: integer}
            groupsCreated: {type: integer}
            groupsRenamed: {type: integer}
            membersAdded: {type: integer}
            membersRemoved: {type: integer}
        skipped:
          type: array
          description: Up to 100 entries Halo left alone, and why.
          items: {type: string}
    LDAPSyncReport:
      allOf:
        - {$ref: '#/components/schemas/LDAPSync'}
        - type: object
          required: [dryRun, changes]
          properties:
            dryRun: {type: boolean}
            changes:
              type: array
              description: Up to 1,000 changes the sync made, or would make in a dry run.
              items:
                type: object
                required: [action, target, detail]
                properties:
                  action: {type: string, enum: [user.create, user.update, user.suspend, user.restore, group.create, group.update]}
                  target: {type: string, description: The person or group.}
                  detail: {type: string}
    AppProvisioning:
      type: object
      required: [appId, baseUrl, enabled, lastSyncAt, lastError, created, updated, deactivated, provisioned, groupIds, groupsCreated, groupsUpdated, groupsDeleted, updatedAt]
      properties:
        appId: {type: string}
        baseUrl: {type: string, format: uri}
        enabled: {type: boolean}
        lastSyncAt: {type: [string, 'null'], format: date-time}
        lastError: {type: string}
        created: {type: integer, description: Users created in the last run.}
        updated: {type: integer}
        deactivated: {type: integer}
        provisioned: {type: integer, description: Users currently active in the application.}
        groupIds:
          type: array
          description: Groups pushed to the application, ordered by name.
          items: {type: string}
        groupsCreated: {type: integer, description: Groups created in the last run.}
        groupsUpdated: {type: integer}
        groupsDeleted: {type: integer}
        updatedAt: {type: string, format: date-time}
    IdentityProvider:
      type: object
      required: [id, kind, name, issuer, clientId, hasSecret, scopes, enabled, showOnSignIn, routeByDomain, allowedDomains, jit, jitGroupIds, mapping, metadataXml, emailAttribute, linkedCount, createdAt, updatedAt]
      properties:
        id: {type: string, examples: [idp_01J9Z8Q4M2N5P7R9T1V3X5Z7B9]}
        kind: {$ref: '#/components/schemas/ProviderKind'}
        name: {type: string}
        issuer: {type: string, description: The issuer, or the entity ID of a SAML identity provider.}
        clientId: {type: string}
        hasSecret: {type: boolean}
        scopes:
          type: array
          items: {type: string}
        enabled: {type: boolean}
        showOnSignIn: {type: boolean}
        routeByDomain: {type: boolean}
        allowedDomains:
          type: array
          items: {type: string}
        jit: {type: boolean}
        jitGroupIds:
          type: array
          items: {type: string}
        mapping: {$ref: '#/components/schemas/ProviderMapping'}
        metadataXml: {type: string, description: 'The SAML identity provider''s metadata. Empty for other kinds. Halo''s own metadata for the provider is at `/saml/sp/{id}/metadata`.'}
        emailAttribute: {type: string, description: SAML only. Empty uses the NameID.}
        linkedCount: {type: integer}
        createdAt: {type: string, format: date-time}
        updatedAt: {type: string, format: date-time}
    ProviderMapping:
      type: object
      required: [profile, groupClaim, groups]
      description: 'Applied on every sign-in through the provider, including the first. A claim the provider leaves out changes nothing. A claim that is present but empty clears the field or removes the person from every mapped group, except that the name is never cleared. Mapping never changes email, roles, or groups that are not mapped here. Each change is written to the audit log with Halo as the actor and the provider named in the summary. GitHub sends no claims, so its mapping must be empty. For SAML, claims are the assertion''s attributes, by name or friendly name, and an attribute with several values is a list.'
      properties:
        profile:
          type: array
          items:
            type: object
            required: [claim, field]
            properties:
              claim: {type: string, examples: [department], description: 'A string claim, or the first entry of a list claim.'}
              field: {type: string, enum: [name, title, department, location], description: Each field can be mapped from one claim.}
        groupClaim: {type: string, examples: [groups], description: 'The claim that lists the person''s groups, as a list of strings or one string. Required when groups has entries.'}
        groups:
          type: array
          maxItems: 100
          description: The person joins each listed group while the group claim contains one of its values, and leaves it when none is present. Several values can map to the same group.
          items:
            type: object
            required: [value, groupId]
            properties:
              value: {type: string, examples: [3f2504e0-4f89-11d3-9a0c-0305e82c3301]}
              groupId: {type: string, description: An assigned group.}
    FederatedIdentity:
      type: object
      required: [id, providerId, providerName, providerKind, email, createdAt, lastUsedAt]
      properties:
        id: {type: string}
        providerId: {type: string}
        providerName: {type: string}
        providerKind: {$ref: '#/components/schemas/ProviderKind'}
        email: {type: string}
        createdAt: {type: string, format: date-time}
        lastUsedAt: {type: [string, 'null'], format: date-time}
    Settings:
      type: object
      properties:
        organizationName: {type: string, maxLength: 100, description: 'Empty uses `HALO_ORGANIZATION`.'}
        contactEmail: {type: string}
        signInMessage: {type: string, maxLength: 500}
        locale: {allOf: [{$ref: '#/components/schemas/Locale'}], default: en, description: 'The default language of pages and emails, for people who chose none. On pages, a language the browser asks for comes first.'}
        theme: {$ref: '#/components/schemas/Theme'}
        customCss: {type: string, description: 'At most 32 KB, without `</`. Added after Halo''s stylesheet on the sign-in, setup and account pages.'}
        consoleBranding: {type: boolean, default: false, description: 'Also use `theme` and `customCss` in the admin console.'}
        sessionHours: {type: integer, minimum: 1, maximum: 72, default: 12}
        lockoutThreshold: {type: integer, minimum: 3, maximum: 20, default: 5}
        lockoutMinutes: {type: integer, minimum: 5, maximum: 1440, default: 15}
        inviteDays: {type: integer, minimum: 1, maximum: 30, default: 7}
        accessTokenMinutes: {type: integer, minimum: 5, maximum: 1440, default: 15}
        idTokenMinutes: {type: integer, minimum: 5, maximum: 1440, default: 15}
        refreshTokenHours: {type: integer, minimum: 1, maximum: 2160, default: 8}
        passwordSecondFactor: {type: boolean, default: true, description: Ask for an authenticator app code with every password sign-in.}
        passwordGroupIds: {type: array, items: {type: string}, description: Only members of these groups may use a password. Empty allows everyone.}
        passwordBreachCheck: {type: boolean, default: true, description: 'Refuse new passwords that the Have I Been Pwned range API reports as breached. Only the first 5 characters of the password''s SHA-1 hash leave Halo. Turn it off for installations without internet access; when the API is unreachable, Halo accepts the password and logs a warning.'}
        emailSignIn: {$ref: '#/components/schemas/EmailSignIn'}
        sessionLimit: {type: integer, minimum: 0, maximum: 100, default: 0, description: 'The most sessions a person may hold at once. 0 sets no limit. While a limit applies, signing in again in a browser that holds one of the person''s sessions ends that session and revokes its tokens first, so it is not counted.'}
        sessionLimitAction: {type: string, enum: [refuse, end-oldest], default: refuse, description: 'At the limit, `refuse` turns the new sign-in away with `ERR_SESSION_LIMIT`; `end-oldest` ends the oldest sessions, revokes their tokens and records each in the sign-in log with the result `ended`.'}
        sessionLimitCli: {type: boolean, default: false, description: 'Also limit sessions that `halo login` starts through the device flow. They are counted separately from browser sessions, against the same limit, and checked when the sign-in is approved. When false they are not limited.'}
        sessionLimitGroups:
          type: array
          description: Limits that replace `sessionLimit` for members of these groups. A person in several of these groups gets the lowest of their limits.
          items:
            type: object
            required: [groupId, limit]
            properties:
              groupId: {type: string}
              limit: {type: integer, minimum: 1, maximum: 100}
        authenticatorRules:
          type: array
          default: []
          description: 'Passkey rules for members of these groups, checked whenever a member registers a passkey or security key through the account portal, a setup link or sign-up. A person in several of these groups must meet every rule that applies. Keys registered before a rule keep working.'
          items:
            type: object
            required: [groupId]
            properties:
              groupId: {type: string}
              deviceBound: {type: boolean, default: false, description: 'Refuse passkeys that can sync between devices, such as those kept in iCloud Keychain or Google Password Manager, by their backup eligible flag.'}
              attestation: {type: boolean, default: false, description: 'Ask for direct attestation and refuse keys whose attestation does not verify against the FIDO Metadata Service, including self attestation and none. Halo downloads the service''s list when it first needs it and again each day, so it needs internet access.'}
              aaguids: {type: array, maxItems: 100, default: [], items: {type: string, format: uuid}, description: 'Approved models by AAGUID. Empty accepts any model listed in the FIDO Metadata Service. Needs `attestation`.'}
              minimum: {type: integer, minimum: 0, maximum: 10, default: 0, description: 'Passkeys and security keys that meet the rule a member must keep. Removing a key from your own account below it is refused with `ERR_KEY_MINIMUM`. 0 sets no minimum.'}
        approvalActions:
          type: array
          default: []
          items: {type: string, enum: [global-admin, policy-disable, password-sign-in, identity-providers, impersonation, user-deletion]}
          description: 'Changes that wait for a second global administrator: `global-admin` grants the global administrator role or makes someone eligible to activate it, `policy-disable` turns off, switches to report-only or deletes an enforced access policy, `password-sign-in` turns on password sign-in, `identity-providers` adds, changes, turns on or off or deletes an identity provider, `impersonation` lets a helpdesk administrator see Halo as someone. While any is on, changing this list or `emergencyAccessIds` also needs approval. Turning approval on needs a second active global administrator.'
        emergencyAccessIds:
          type: array
          default: []
          maxItems: 5
          items: {type: string}
          description: People that policies with the `block` effect never apply to and whose changes skip approval. Each skipped approval is recorded as `approval.bypass` and each sign-in as `emergency_access.sign_in` in the audit log, and both are emailed to the other global administrators.
        impersonationGroupIds:
          type: array
          default: []
          items: {type: string}
          description: Helpdesk administrators can impersonate active members of these groups who hold no administrator role and are not eligible for one. Empty turns impersonation off.
        reauthMinutes: {type: integer, minimum: 1, maximum: 1440, default: 10, description: 'How long a sign-in with a passkey, security key or recovery code, or a confirmation through `/me/reauthenticate`, lets a person make sensitive changes before Halo asks them to confirm it''s them again. Only a global administrator can change it.'}
        clientRegistration: {type: string, enum: ['off', open, token, approval], default: 'off', description: 'Who can register OAuth clients at `/oauth2/register`: nobody, anyone, clients that send an API key with the `registration` scope as the initial access token, or anyone with each new or changed client disabled until an application administrator approves it.'}
        clientPolicies:
          type: [array, 'null']
          description: OAuth client rules. Global administrators can set one rule for all clients and one per application type. A client must satisfy every applicable rule when saved or enabled. Changes leave existing active clients as configured until they are saved. New applications inherit required protections and capped lifetimes.
          maxItems: 5
          items:
            type: object
            required: [applicationType]
            properties:
              applicationType: {type: string, enum: [all, web, spa, native, service]}
              requirePar: {type: boolean, description: Applies to clients using the authorization code flow.}
              requirePkce: {type: boolean, description: Applies to clients using the authorization code flow. Public clients already require PKCE.}
              requireDpop: {type: boolean}
              allowedAuthMethods:
                type: array
                description: 'An empty list allows any method. The client_secret_basic setting includes both Basic and form-body shared-secret authentication. Use none for public clients.'
                items: {type: string, enum: [none, client_secret_basic, private_key_jwt]}
              maxAccessTokenTtl: {type: integer, anyOf: [{const: 0}, {minimum: 60, maximum: 86400}], description: 'Maximum configured lifetime in seconds. Use 0 for no cap.'}
              maxIdTokenTtl: {type: integer, anyOf: [{const: 0}, {minimum: 60, maximum: 86400}], description: 'Maximum configured lifetime in seconds. Use 0 for no cap.'}
              maxRefreshTokenTtl: {type: integer, minimum: 0, maximum: 7776000, description: 'Maximum configured lifetime in seconds. Use 0 for no cap.'}
        emailTemplates:
          type: object
          readOnly: true
          additionalProperties: {$ref: '#/components/schemas/EmailTemplateText'}
          description: Custom email subjects and bodies by template kind, left out when there are none. Change them through `/email-templates/{kind}`.
        botProtection: {type: string, enum: ['', turnstile, hcaptcha], default: '', description: 'Ask for a check from Cloudflare Turnstile or hCaptcha on `/auth/magic-link` and `/auth/sign-up`, and on `/auth/password`, `/auth/totp`, `/auth/recovery`, `/auth/magic-link/code` and `/auth/access-pass` once the client IP address has `lockoutThreshold` failed sign-ins within the lockout window. Passkeys are never checked. Empty turns it off. Turning it on needs `botProtectionSiteKey` and a stored `botProtectionSecret`.'}
        botProtectionSiteKey: {type: string, pattern: '^[A-Za-z0-9_-]{1,100}$', description: The public site key from the provider. The sign-in page uses it to show the check.}
        signUp: {type: string, enum: ['off', open, approval], default: 'off', description: 'Who can create an account at `/auth/sign-up`: nobody, anyone at an allowed domain once they confirm their address and create a passkey, or the same people after a user administrator approves them under `/sign-ups`. Turning it on with an empty `signUpDomains` needs a verified domain.'}
        signUpDomains: {type: array, default: [], maxItems: 100, items: {type: string, examples: [example.com]}, description: 'Email domains people can sign up with, matched exactly and without case. Empty allows the verified domains under `/domains`.'}
        signUpGroupIds: {type: array, default: [], items: {type: string}, description: 'Assigned groups that new accounts from sign-up join. Dynamic groups are skipped.'}
        identityProofingInvites: {type: boolean, default: false, description: 'Invited people need a successful identity check before their account is activated: an in-person check through `POST /users/{id}/identity-proofs`, or a check with the provider from their setup page. Until then their setup link and every sign-in are refused with `ERR_IDENTITY_CHECK_REQUIRED`.'}
        identityProofingSignUps: {type: boolean, default: false, description: 'People who sign up need a successful identity check before their sign-up becomes an account, also when `signUp` is `open`.'}
        identityProofingGroupIds: {type: array, default: [], maxItems: 100, items: {type: string}, description: 'Limit identity checks to people in these groups, or to sign-ups whose `signUpGroupIds` include one. Empty applies them to everyone. A listed group can''t be deleted.'}
        identityProofingProvider: {type: string, enum: ['', generic, stripe], default: '', description: 'The identity verification service people can use from their setup page. Empty means administrators check identities in person only. Connecting one needs `identityProofingApiKey`. Halo calls it only at public addresses.'}
        identityProofingName: {type: string, maxLength: 60, description: 'The name people see on their setup page, for `generic` only.'}
        identityProofingEndpoint: {type: string, format: uri, maxLength: 500, description: 'The https address where Halo creates verification sessions, for `generic` only. See `POST /identity-proofing/webhook` for what Halo sends and expects.'}
        identityProofingApiKey: {type: string, maxLength: 500, writeOnly: true, description: 'The provider''s API key, sent as a bearer token. For Stripe, a secret or restricted key starting with `sk_` or `rk_`. Stored encrypted and never returned. Omit it to keep the stored one.'}
        identityProofingWebhookSecret: {type: string, maxLength: 500, writeOnly: true, description: 'The secret the provider signs result webhooks with. For Stripe, the endpoint''s signing secret starting with `whsec_`. Stored encrypted and never returned. Omit it to keep the stored one.'}
        securityEmailsOff:
          type: array
          default: []
          items: {type: string, enum: [new_sign_in, method_added, method_removed, recovery_codes, email_changed, account_locked, access_pass, impersonation, risk_response]}
          description: 'Security emails Halo does not send. The others go to the person when their account signs in from a device or network it has not used before (the `new-device` and `new-network` risk signals), when a passkey, security key, authenticator app or password is added or removed, when recovery codes are replaced, when the email address changes (to the old and the new address), when incorrect passwords or codes lock the account, when an administrator creates a temporary access pass, when an impersonation starts, and when a `notify` risk response tells them about a risky sign-in. They link to the account portal, never to a sign-in page, and never contain a code or a pass. Halo sends one email of a kind about the same thing within 15 minutes, and one lockout email within the lockout window. People can turn off `new_sign_in` for themselves at `/me/security-emails`.'
        lockoutEmailAdmins: {type: boolean, default: false, description: 'Also email the active global administrators when incorrect passwords or codes lock someone''s account.'}
        riskResponses:
          type: array
          default: []
          maxItems: 20
          description: 'What Halo does on its own, within about 20 seconds, when a sign-in raises a risk event. Each response applies to risk events of its `signal`, or of any signal when empty, at `level` or above. Every risk event is acted on once: `suspend` suspends the person, unless they are the last active global administrator, and ends their sessions; `revoke-sessions` ends their sessions and revokes their tokens; `require-passkey` does the same and refuses their next sign-in unless it uses a passkey or security key, while a temporary access pass still works; `notify` sends the person the `risk_response` security email. Responses never act on emergency access accounts. Each risk event that was acted on is recorded as `risk_event.respond` in the audit log, which notification rules can send on.'
          items:
            type: object
            required: [signal, level, action]
            properties:
              signal: {type: string, enum: ['', risky-network, failed-sign-ins, new-device]}
              level: {type: string, enum: [medium, high]}
              action: {type: string, enum: [revoke-sessions, require-passkey, suspend, notify]}
        botProtectionSecret: {type: string, maxLength: 200, writeOnly: true, description: The secret key from the provider. Stored encrypted and never returned; `botProtectionSecretSet` in the response says whether one is stored. Omit it or send an empty string to keep the stored one.}
        signInLogDays: {type: integer, minimum: 0, maximum: 3650, default: 0, description: 'Days to keep sign-in log entries, between 7 and 3,650. 0 keeps them forever. Once a day Halo deletes older entries in batches and records the count as `log.prune` in the audit log. Only a global administrator can change it.'}
        auditLogDays: {type: integer, minimum: 0, maximum: 3650, default: 0, description: 'Days to keep audit log entries, between 30 and 3,650. 0 keeps them forever. Once a day Halo deletes older entries in batches and records the count as `log.prune` in the audit log. Only a global administrator can change it.'}
        exportSchedule: {type: string, enum: ['off', daily, weekly], default: 'off', description: 'How often Halo saves the `GET /export` document to the S3-compatible bucket, as `exports/halo-export-<time>.json`, and records `organization.export` in the audit log. Turning it on needs `HALO_S3_ENDPOINT` and the related variables. Only a global administrator can change it.'}
        exportKeep: {type: integer, minimum: 1, maximum: 365, default: 7, description: 'Scheduled exports to keep in the bucket. Older ones are deleted after each new one is saved. Only a global administrator can change it.'}
        featuresOff: {type: array, items: {$ref: '#/components/schemas/FeatureId'}, default: [], description: 'Features that are turned off. Turning one off that is in use answers `409` with `ERR_FEATURE_IN_USE` unless `confirmFeatures` is set. Needs approval from a second global administrator while any approvals are required. Only a global administrator can change it.'}
        confirmFeatures: {type: boolean, writeOnly: true, description: Turn off the features in `featuresOff` even though they are in use.}
    FeatureId:
      type: string
      enum: [saml, scim, provisioning, ssh, governance, webhooks, forward-auth, radius, ldap, kerberos, remote-access, log-streaming]
    Feature:
      type: object
      required: [id, name, description, enabled, usage]
      properties:
        id: {$ref: '#/components/schemas/FeatureId'}
        name: {type: string, examples: [SAML identity provider]}
        description: {type: string}
        enabled: {type: boolean}
        usage: {type: array, items: {type: string}, description: What stops working when the feature is turned off. Empty when nothing uses it., examples: [[1 application signs in with SAML]]}
    SecurityEmail:
      type: object
      required: [kind, label, 'on', canTurnOff]
      properties:
        kind: {type: string, examples: [new_sign_in]}
        label: {type: string, examples: [New sign-in]}
        'on': {type: boolean, description: Whether Halo sends it to you.}
        canTurnOff: {type: boolean, description: Whether you can turn it off. Only `new_sign_in` can be.}
    EmailTemplateText:
      type: object
      required: [subject, body]
      properties:
        subject: {type: string, maxLength: 200, description: 'One line.', examples: ['Welcome to {{.Organization}}']}
        body: {type: string, maxLength: 10000, description: 'Plain text. Halo adds a footer with the organization name.', examples: ['Hi {{if .Name}}{{.Name}}{{else}}there{{end}}, set up your account: {{.Link}}']}
    EmailTemplate:
      type: object
      required: [kind, label, description, variables, default, custom]
      properties:
        kind: {type: string, enum: [invite, reset, magic_link, magic_code, sign_up, access_request, access_approved, access_denied, access_pass, new_sign_in, method_added, method_removed, recovery_codes, email_changed, account_locked, account_locked_admin, impersonation, risk_response]}
        label: {type: string, examples: [Invitation]}
        description: {type: string}
        variables:
          type: array
          items:
            type: object
            required: [name, description, example]
            properties:
              name: {type: string, examples: [Link]}
              description: {type: string}
              example: {type: string, description: The value previews and the check on save use.}
        required: {type: string, description: 'A variable the body must use, such as `Link` for an invitation or `Code` for a sign-in code.'}
        security: {type: boolean, description: 'A security email to the person about their own account, which `securityEmailsOff` can turn off. Left out for other emails.'}
        default: {$ref: '#/components/schemas/EmailTemplateText'}
        custom:
          oneOf:
            - {$ref: '#/components/schemas/EmailTemplateText'}
            - {type: 'null'}
          description: The saved subject and body, or null when Halo sends its default.
    ChallengeToken:
      type: string
      description: 'The token from the bot protection check on the sign-in page. Needed only while `botProtection` is on: always for `/auth/magic-link` and `/auth/sign-up`, and for password and code sign-ins once the client IP address has `lockoutThreshold` failed sign-ins within the lockout window. Without it the request is refused with `ERR_CHALLENGE_REQUIRED`; Halo verifies it with the provider, and the result is recorded in the sign-in log as `challenge`. If the provider cannot be reached, the request is refused with `ERR_CHALLENGE_UNAVAILABLE`.'
    ClientMetadata:
      type: object
      description: 'Client metadata from RFC 7591. Halo ignores fields it does not list here. Requests are at most 16 KB.'
      properties:
        client_name: {type: string, maxLength: 200, description: One line. Defaults to the host of the first redirect URI.}
        client_uri: {type: string, format: uri, maxLength: 200}
        redirect_uris:
          type: array
          minItems: 1
          maxItems: 10
          items: {type: string, format: uri, description: 'An absolute https:// address without a fragment; http:// only for localhost and 127.0.0.1.'}
        post_logout_redirect_uris:
          type: array
          maxItems: 10
          items: {type: string, format: uri}
        grant_types:
          type: array
          items: {type: string, enum: [authorization_code, refresh_token]}
          description: Must include `authorization_code`. Any other grant type is refused with `invalid_client_metadata`.
        response_types:
          type: array
          items: {type: string, enum: [code]}
        token_endpoint_auth_method: {type: string, enum: [client_secret_basic, client_secret_post, private_key_jwt, none], default: client_secret_basic, description: '`none` registers a public client that must use PKCE. `private_key_jwt` registers a web client without a client secret that authenticates with client assertions signed by `jwks` or `jwks_uri`.'}
        jwks: {type: object, description: 'For `private_key_jwt`, supply 1 to 20 public signing keys instead of `jwks_uri`. Ignored for other client authentication methods.'}
        jwks_uri: {type: string, format: uri, description: 'For `private_key_jwt`, supply an HTTPS URL on a public address instead of `jwks`. Ignored for other client authentication methods.'}
        dpop_bound_access_tokens: {type: boolean, description: 'RFC 9449. Every token request must carry a DPoP proof. A client can turn this on in an update but not off.'}
        require_pushed_authorization_requests: {type: boolean, description: 'RFC 9126. Every authorization request must be pushed to `/oauth2/par`. A client can turn this on in an update but not off.'}
        application_type: {type: string, enum: [web, native], default: web, description: '`native` needs `token_endpoint_auth_method` `none`.'}
        scope: {type: string, description: 'Space-separated. Halo keeps only `openid`, `profile` and `email` and always includes `openid`.', examples: [openid profile email]}
        id_token_signed_response_alg: {type: string, enum: [RS256, ES256, EdDSA], default: RS256, description: 'Any other value is refused with `invalid_client_metadata`.'}
    ClientRegistration:
      allOf:
        - {$ref: '#/components/schemas/ClientMetadata'}
        - type: object
          required: [client_id, client_id_issued_at, registration_client_uri, redirect_uris, grant_types, response_types, token_endpoint_auth_method, application_type, scope]
          properties:
            client_id: {type: string, examples: [hl_01J9Z8Q4M2N5P7R9T1V3X5Z7B9]}
            client_id_issued_at: {type: integer, description: Unix time.}
            client_secret: {type: string, description: 'Only in the registration response, for confidential clients.'}
            client_secret_expires_at: {type: integer, description: 'Unix time, with `client_secret`.'}
            registration_access_token: {type: string, description: 'Only in the registration response. Send it as a bearer token to `registration_client_uri`.'}
            registration_client_uri: {type: string, format: uri}
    OAuthError:
      type: object
      required: [error, error_description]
      properties:
        error: {type: string, enum: [invalid_request, invalid_client, invalid_token, invalid_redirect_uri, invalid_client_metadata, temporarily_unavailable, server_error]}
        error_description: {type: string}
    Locale:
      type: string
      enum: [en, es]
      description: 'A language Halo''s pages and emails are written in: `en` for English, `es` for Spanish.'
    EmailSignIn:
      type: string
      enum: [link, code, both]
      default: link
      description: 'What sign-in emails from `/auth/magic-link` contain: a link, a six-digit code to enter on the sign-in page that asked for it, or both. A code works when the email is read on another device, and a mail scanner that opens the link does not use up the code.'
    SignUp:
      type: object
      required: [id, email, name, createdAt, verifiedAt]
      properties:
        id: {type: string}
        email: {type: string}
        name: {type: string}
        createdAt: {type: string, format: date-time, description: When the person last asked for the sign-up link.}
        verifiedAt: {type: string, format: date-time, description: When the person confirmed the address and created the passkey.}
        identityProof: {type: string, enum: ['', pending, verified, failed], description: 'The best identity check result: `verified` when any check succeeded, otherwise the newest one. Empty when there is none.'}
    IdentityProofState:
      type: object
      required: [required, status, provider]
      properties:
        required: {type: boolean, description: The person needs a successful identity check before the account is activated.}
        status: {type: string, enum: ['', pending, verified, failed], description: 'The best result, as for `SignUp.identityProof`. A pending check with the provider is refreshed first.'}
        provider: {type: string, description: 'The name of the connected verification provider, or empty when only in-person checks are possible.'}
    IdentityProof:
      type: object
      required: [id, method, provider, reference, status, document, note, checkedBy, createdAt, completedAt]
      properties:
        id: {type: string, examples: [idp_01JD6Z4Q8M2X3Y4Z5A6B7C8D9E]}
        method: {type: string, enum: [in-person, provider]}
        provider: {type: string, enum: ['', generic, stripe]}
        reference: {type: string, description: 'The provider''s session id. Empty for in-person checks.'}
        status: {type: string, enum: [pending, verified, failed]}
        document: {type: string, enum: ['', passport, national-id, driving-licence, residence-permit, other], description: The kind of document an administrator checked in person.}
        note: {type: string, description: How the administrator checked the person.}
        checkedBy:
          oneOf: [{$ref: '#/components/schemas/NamedRef'}, {type: 'null'}]
          description: The administrator who checked the person in person.
        createdAt: {type: string, format: date-time}
        completedAt: {type: [string, 'null'], format: date-time}
    InPersonCheck:
      type: object
      required: [document, note]
      properties:
        document: {type: string, enum: [passport, national-id, driving-licence, residence-permit, other]}
        note: {type: string, minLength: 1, maxLength: 500, description: 'How you checked the person, such as where you met and what you compared. Leave out the document number: a note with five or more digits in a row is refused.', examples: [Met at the Lisbon office and compared the photo]}
    Domain:
      type: object
      required: [id, name, token, createdAt, verifiedAt]
      properties:
        id: {type: string}
        name: {type: string}
        token: {type: string, description: 'Publish `halo-verification=<token>` as a TXT record.'}
        createdAt: {type: string, format: date-time}
        verifiedAt: {type: [string, 'null'], format: date-time}
    LogExport:
      type: object
      required: [protocol, endpoint, allowPrivate, headersSet, failures, nextAttemptAt, lastSentAt, lastError, updatedAt]
      properties:
        protocol: {type: string, enum: [syslog-tls, syslog-udp, otlp-http]}
        endpoint: {type: string}
        allowPrivate: {type: boolean}
        headersSet: {type: boolean}
        failures: {type: integer, description: Failed sends in a row. Halo waits longer after each one, up to 5 minutes.}
        nextAttemptAt: {type: string, format: date-time}
        lastSentAt: {type: [string, 'null'], format: date-time}
        lastError: {type: string}
        updatedAt: {type: string, format: date-time}
    Webhook:
      type: object
      required: [id, url, description, events, enabled, createdAt, updatedAt, lastStatus, lastDeliveryAt]
      properties:
        id: {type: string, examples: [whk_01J9Z8Q4M2N5P7R9T1V3X5Z7B9]}
        url: {type: string, format: uri}
        description: {type: string}
        events:
          type: array
          items: {type: string}
        enabled: {type: boolean}
        createdAt: {type: string, format: date-time}
        updatedAt: {type: string, format: date-time}
        lastStatus: {type: [string, 'null'], enum: [pending, delivered, failed, null]}
        lastDeliveryAt: {type: [string, 'null'], format: date-time}
    ApplicationHook:
      type: object
      required: [appId, host, claims, failOpen]
      properties:
        appId: {type: string}
        host: {type: string, examples: [checks.example.com], description: The host of the hook URL. The URL and the signing secret are never returned.}
        claims:
          type: array
          items: {type: string}
          description: The claims the hook may add to tokens.
        failOpen: {type: boolean, description: Allow the sign-in when the hook fails, instead of blocking it.}
    ApplicationHookInput:
      type: object
      properties:
        url: {type: string, format: uri, maxLength: 2048, description: 'An https:// URL at a public address. Required when adding the hook.'}
        secret: {type: string, minLength: 32, maxLength: 256, description: The signing secret for requests and answers. Required when adding the hook, never returned.}
        claims:
          type: array
          maxItems: 20
          items: {type: string, pattern: '^[A-Za-z][A-Za-z0-9_.:/-]{0,99}$'}
        failOpen: {type: boolean, default: false}
    NotificationRule:
      type: object
      required: [id, name, destination, host, events, minRisk, role, threshold, windowMinutes, quietMinutes, enabled, createdAt, updatedAt, lastSentAt, lastStatus]
      properties:
        id: {type: string, examples: [ntf_01J9Z8Q4M2N5P7R9T1V3X5Z7B9]}
        name: {type: string}
        destination: {type: string, enum: [webhook, slack, discord]}
        host: {type: string, examples: [hooks.slack.com], description: The host of the destination URL. The URL itself is never returned.}
        events:
          type: array
          items: {type: string}
        minRisk: {type: string, enum: ['', low, medium, high]}
        role: {type: string}
        threshold: {type: integer}
        windowMinutes: {type: integer}
        quietMinutes: {type: integer}
        enabled: {type: boolean}
        createdAt: {type: string, format: date-time}
        updatedAt: {type: string, format: date-time}
        lastSentAt: {type: [string, 'null'], format: date-time, description: The time of the last event the rule sent a message for.}
        lastStatus: {type: [string, 'null'], enum: [pending, delivered, failed, null]}
    WebhookDelivery:
      type: object
      required: [id, eventId, eventType, body, status, attempts, nextAttemptAt, lastAttemptAt, responseStatus, error, createdAt]
      properties:
        id: {type: string, examples: [whd_01J9Z8Q4M2N5P7R9T1V3X5Z7B9]}
        endpointId: {type: string, description: Set for deliveries to a webhook endpoint.}
        ruleId: {type: string, description: Set for messages sent by a notification rule.}
        appId: {type: string, description: Set for back-channel logouts and shared signals sent to an application.}
        eventId: {type: string}
        eventType: {type: string}
        body: {type: string, description: 'The exact JSON body Halo sends, or for a back-channel logout the session the logout token is made for.'}
        status: {type: string, enum: [pending, delivered, failed]}
        attempts: {type: integer}
        nextAttemptAt: {type: string, format: date-time}
        lastAttemptAt: {type: [string, 'null'], format: date-time}
        responseStatus: {type: [integer, 'null']}
        error: {type: string}
        createdAt: {type: string, format: date-time}
    SignalReceiver:
      type: object
      required: [appId, subjectFormat, createdAt, stream]
      properties:
        appId: {type: string}
        subjectFormat: {type: string, enum: [iss_sub, email, opaque]}
        createdAt: {type: string, format: date-time}
        stream:
          oneOf:
            - type: object
              required: [id, appId, description, eventsRequested, deliveryMethod, endpointUrl, status, reason, createdAt, updatedAt]
              properties:
                id: {type: string, examples: [sst_01J9Z8Q4M2N5P7R9T1V3X5Z7B9]}
                appId: {type: string}
                description: {type: string}
                eventsRequested:
                  type: array
                  items: {type: string}
                deliveryMethod: {type: string, enum: ['urn:ietf:rfc:8935', 'urn:ietf:rfc:8936']}
                endpointUrl: {type: string, description: The push endpoint. Empty for poll.}
                status: {type: string, enum: [enabled, paused, disabled]}
                reason: {type: string}
                createdAt: {type: string, format: date-time}
                updatedAt: {type: string, format: date-time}
            - {type: 'null'}
    SignalStreamConfiguration:
      type: object
      required: [stream_id, iss, aud, events_supported, events_delivered, delivery, min_verification_interval]
      properties:
        stream_id: {type: string, examples: [sst_01J9Z8Q4M2N5P7R9T1V3X5Z7B9]}
        iss: {type: string}
        aud: {type: string, description: The receiver's client ID.}
        events_supported:
          type: array
          items: {type: string}
        events_requested:
          type: array
          items: {type: string}
        events_delivered:
          type: array
          items: {type: string}
        delivery:
          type: object
          required: [method, endpoint_url]
          properties:
            method: {type: string, enum: ['urn:ietf:rfc:8935', 'urn:ietf:rfc:8936']}
            endpoint_url: {type: string, description: The receiver's push endpoint, or the poll endpoint Halo assigned.}
        min_verification_interval: {type: integer, examples: [30]}
        description: {type: string}
    SignalStreamInput:
      type: object
      properties:
        stream_id: {type: string, description: Required for PATCH and PUT.}
        events_requested:
          type: array
          maxItems: 50
          items: {type: string}
        delivery:
          type: object
          properties:
            method: {type: string, enum: ['urn:ietf:rfc:8935', 'urn:ietf:rfc:8936'], default: 'urn:ietf:rfc:8936'}
            endpoint_url: {type: string, description: 'For push, a public `https://` URL under 2,048 characters.'}
            authorization_header: {type: string, maxLength: 1024, description: For push, sent as the `Authorization` header of every request. Sealed and never returned.}
        description: {type: string, maxLength: 200}
    SignalStreamStatus:
      type: object
      required: [stream_id, status]
      properties:
        stream_id: {type: string}
        status: {type: string, enum: [enabled, paused, disabled]}
        reason: {type: string, maxLength: 200}
    ConsentScope:
      type: object
      required: [name, description]
      properties:
        name: {type: string, examples: [email]}
        description: {type: string, description: 'The API resource''s description of the scope, or empty for the standard OpenID Connect scopes.'}
    Consent:
      type: object
      required: [appId, name, homepage, logoUrl, scopes, grantedAt]
      properties:
        appId: {type: string}
        name: {type: string}
        homepage: {type: string}
        logoUrl: {type: [string, 'null']}
        scopes:
          type: array
          items: {$ref: '#/components/schemas/ConsentScope'}
        grantedAt: {type: string, format: date-time, description: When you last allowed more scopes.}
    ApiScope:
      type: object
      required: [name]
      properties:
        name: {type: string, pattern: '^[a-z0-9][a-z0-9:._/-]{0,99}$', examples: ['billing:read']}
        description: {type: string, maxLength: 200}
    ApiResource:
      type: object
      required: [id, name, identifier, description, accessTokenTtl, accessTokenAlg, scopes, grants, createdAt, updatedAt]
      properties:
        id: {type: string}
        name: {type: string}
        identifier: {type: string, format: uri}
        description: {type: string}
        accessTokenTtl: {type: integer}
        accessTokenAlg: {type: string, enum: [RS256, ES256, EdDSA]}
        scopes:
          type: array
          items: {$ref: '#/components/schemas/ApiScope'}
        grants:
          type: array
          items:
            type: object
            required: [appId, scopes]
            properties:
              appId: {type: string}
              scopes:
                type: array
                items: {type: string}
        createdAt: {type: string, format: date-time}
        updatedAt: {type: string, format: date-time}
    SSHAuthority:
      type: object
      required: [publicKey, fingerprint, createdAt, certificateLifetime]
      properties:
        publicKey: {type: string}
        fingerprint: {type: string, examples: ['SHA256:…']}
        createdAt: {type: string, format: date-time}
        certificateLifetime: {type: integer, description: Seconds. Defaults to 28800 (8 hours).}
    SSHPrincipalMapping:
      type: object
      required: [id, groupId, principals, createdAt, updatedAt]
      properties:
        id: {type: string}
        groupId: {type: string}
        principals:
          type: array
          items: {type: string}
        createdAt: {type: string, format: date-time}
        updatedAt: {type: string, format: date-time}
    SSHCertificate:
      type: object
      required: [serial, keyId, userId, userName, principals, fingerprint, keyType, ip, validAfter, validBefore, createdAt]
      properties:
        serial: {type: integer}
        keyId: {type: string, examples: ['halo:usr_01J9Z8Q4M2N5P7R9T1V3X5Z7B9:42']}
        userId: {type: [string, 'null']}
        userName: {type: string}
        principals:
          type: array
          items: {type: string}
        fingerprint: {type: string}
        keyType: {type: string, examples: [ssh-ed25519]}
        ip: {type: string}
        validAfter: {type: string, format: date-time}
        validBefore: {type: string, format: date-time}
        createdAt: {type: string, format: date-time}
    SSHCertificateIssued:
      type: object
      required: [certificate, serial, keyId, principals, fingerprint, validAfter, validBefore]
      properties:
        certificate: {type: string, description: 'One line in OpenSSH format. Save it next to the key as `<key>-cert.pub`.'}
        serial: {type: integer}
        keyId: {type: string}
        principals:
          type: array
          items: {type: string}
        fingerprint: {type: string}
        validAfter: {type: string, format: date-time, description: '5 minutes before issue, to allow for clock skew.'}
        validBefore: {type: string, format: date-time}
        knownHosts: {type: string, description: 'Certificates for people only: the `@cert-authority` line from `/ssh/known_hosts`, or empty.'}
    SSHHostAuthority:
      type: object
      required: [publicKey, fingerprint, createdAt, certificateLifetime, knownHosts]
      properties:
        publicKey: {type: string}
        fingerprint: {type: string, examples: ['SHA256:…']}
        createdAt: {type: string, format: date-time}
        certificateLifetime: {type: integer, description: Seconds. Defaults to 2592000 (30 days).}
        knownHosts: {type: string, description: 'The `@cert-authority` line for clients, empty until a domain is verified.'}
    RemoteSettings:
      type: object
      description: Where a remote access application connects and how Halo signs in. On create, `outpostId` and `host` are required.
      properties:
        outpostId: {type: string, description: The outpost that reaches the host.}
        protocol: {type: string, enum: [ssh, rdp, vnc], default: ssh}
        host: {type: string, description: 'Host name or IP address as the outpost resolves it, without a port.', examples: [db1.internal]}
        port: {type: integer, minimum: 1, maximum: 65535, description: 'Defaults to 22 for SSH, 3389 for RDP, and 5900 for VNC.'}
        username: {type: string, description: 'The account to sign in as. Optional for VNC. With SSH `certificate`, empty means the person''s first SSH principal.'}
        auth: {type: string, enum: [certificate, password, key], default: certificate, description: '`certificate` signs a one-minute certificate from Halo''s SSH CA for the person''s principals, so nothing is stored. `password` and `key` use the stored credential.'}
        credential: {type: string, writeOnly: true, description: 'The password, or an unencrypted OpenSSH or PEM private key. Stored encrypted, never returned. Leave it out to keep the stored one.'}
        hostKey: {type: string, description: 'SSH public key or RDP certificate SHA-256 fingerprint. For SSH, leave empty to use a Halo host certificate.'}
        rdpSecurity: {type: string, enum: [nla, tls], default: nla, description: RDP security mode.}
        sessionLimit: {type: integer, minimum: 60, maximum: 86400, default: 3600, description: Seconds after which Halo ends a session.}
        record: {type: boolean, default: false, description: Keep an asciicast recording of SSH terminal output.}
    RemoteTarget:
      type: object
      description: 'Remote access applications only.'
      required: [outpostId, protocol, host, port, username, auth, hasCredential, hostKey, rdpSecurity, sessionLimit, record]
      properties:
        outpostId: {type: string}
        protocol: {type: string, enum: [ssh, rdp, vnc]}
        host: {type: string}
        port: {type: integer}
        username: {type: string}
        auth: {type: string, enum: [certificate, password, key]}
        hasCredential: {type: boolean, description: A password or private key is stored. Halo never returns it.}
        hostKey: {type: string}
        rdpSecurity: {type: string, enum: [nla, tls]}
        sessionLimit: {type: integer}
        record: {type: boolean}
    Outpost:
      type: object
      required: [id, name, enrolledAt, enrollmentExpiresAt, lastSeenAt, lastIp, version, createdAt, targets, connected]
      properties:
        id: {type: string, examples: [out_01J9Z8Q4M2N5P7R9T1V3X5Z7B9]}
        name: {type: string}
        enrolledAt: {type: [string, 'null'], format: date-time}
        enrollmentExpiresAt: {type: [string, 'null'], format: date-time, description: When the unused enrollment token stops working.}
        lastSeenAt: {type: [string, 'null'], format: date-time, description: When the outpost last connected or disconnected.}
        lastIp: {type: string}
        version: {type: string, description: The platform halo-outpost reported.}
        createdAt: {type: string, format: date-time}
        targets: {type: integer, description: Remote access applications that use the outpost.}
        connected: {type: boolean}
    RemoteSession:
      type: object
      required: [id, createdAt, applicationId, applicationName, userId, email, outpostId, protocol, address, username, ip, limitSeconds, record, status, startedAt, endedAt, endReason, bytesIn, bytesOut, recorded, terminatedBy]
      properties:
        id: {type: string, examples: [rs_01J9Z8Q4M2N5P7R9T1V3X5Z7B9]}
        createdAt: {type: string, format: date-time}
        applicationId: {type: [string, 'null']}
        applicationName: {type: string}
        userId: {type: [string, 'null']}
        email: {type: string}
        outpostId: {type: [string, 'null']}
        protocol: {type: string, enum: [ssh, rdp, vnc]}
        address: {type: string, examples: ['db1.internal:22']}
        username: {type: string}
        ip: {type: string}
        limitSeconds: {type: integer}
        record: {type: boolean}
        status: {type: string, enum: [pending, active, ended]}
        startedAt: {type: [string, 'null'], format: date-time}
        endedAt: {type: [string, 'null'], format: date-time}
        endReason: {type: string, examples: [The shell on the host exited.]}
        bytesIn: {type: integer, description: Bytes the person typed.}
        bytesOut: {type: integer, description: Bytes of terminal output.}
        recorded: {type: boolean}
        terminatedBy: {type: [string, 'null'], description: Id of the administrator who ended the session.}
    SSHHost:
      type: object
      required: [id, hostnames, publicKey, fingerprint, keyType, serial, validBefore, enrollmentExpiresAt, revokedAt, createdAt]
      properties:
        id: {type: string, examples: [hst_01J9Z8Q4M2N5P7R9T1V3X5Z7B9]}
        hostnames:
          type: array
          items: {type: string}
        publicKey: {type: [string, 'null'], description: The key of the last certificate. Null until the host enrolls.}
        fingerprint: {type: string}
        keyType: {type: string, examples: [ssh-ed25519]}
        serial: {type: [integer, 'null'], description: The serial of the last certificate. Its key ID is `halo:<host id>:<serial>`.}
        validBefore: {type: [string, 'null'], format: date-time}
        enrollmentExpiresAt: {type: [string, 'null'], format: date-time, description: When the unused enrollment token stops working.}
        revokedAt: {type: [string, 'null'], format: date-time}
        createdAt: {type: string, format: date-time}
        hostGroupId: {type: [string, 'null'], description: The host group whose rules decide who halo-hostd lets log in.}
    POSIXAccount:
      type: object
      required: [username, uidNumber, gidNumber, loginShell, homeDirectory]
      description: The person's Linux account. Halo allocates the numbers from the POSIX ranges, and they never change. The person's private group has their user name and `gidNumber`, which equals `uidNumber`.
      properties:
        username: {type: string, examples: [ada]}
        uidNumber: {type: integer, examples: [1000001]}
        gidNumber: {type: integer, examples: [1000001]}
        loginShell: {type: string, examples: [/bin/bash]}
        homeDirectory: {type: string, examples: [/home/ada]}
    POSIXGroup:
      type: object
      required: [name, gidNumber]
      properties:
        name: {type: string, description: Lowercase name derived from the group's name when it was created., examples: [ops]}
        gidNumber: {type: integer, examples: [2000001]}
    POSIXSettings:
      type: object
      required: [uidMin, uidMax, gidMin, gidMax, nextUid, nextGid, loginShell]
      properties:
        uidMin: {type: integer}
        uidMax: {type: integer}
        gidMin: {type: integer}
        gidMax: {type: integer}
        nextUid: {type: integer, description: The number the next person gets. Above `uidMax` when the range is used up.}
        nextGid: {type: integer, description: The number the next group gets. Above `gidMax` when the range is used up.}
        loginShell: {type: string, description: The login shell new people get.}
    HostRule:
      type: object
      required: [groupId, sudo]
      properties:
        groupId: {type: string}
        sudo:
          type: array
          description: 'Empty: members may log in. `ALL`: full sudo as root, without a password. Otherwise the absolute paths, with plain arguments, they may run as root, such as `/usr/bin/systemctl restart nginx`.'
          items: {type: string}
    HostGroup:
      type: object
      required: [id, name, description, rules, hostCount, createdAt, updatedAt]
      properties:
        id: {type: string, examples: [hgr_01J9Z8Q4M2N5P7R9T1V3X5Z7B9]}
        name: {type: string}
        description: {type: string}
        rules:
          type: array
          items: {$ref: '#/components/schemas/HostRule'}
        hostCount: {type: integer, description: Hosts in the group that are not revoked.}
        createdAt: {type: string, format: date-time}
        updatedAt: {type: string, format: date-time}
    HostDirectory:
      type: object
      required: [users, groups]
      properties:
        users:
          type: array
          items:
            type: object
            required: [name, uid, gid, gecos, home, shell, sudo]
            properties:
              name: {type: string}
              uid: {type: integer}
              gid: {type: integer}
              gecos: {type: string}
              home: {type: string}
              shell: {type: string}
              sudo: {type: array, items: {type: string}}
        groups:
          type: array
          items:
            type: object
            required: [name, gid, members]
            properties:
              name: {type: string}
              gid: {type: integer}
              members: {type: array, items: {type: string}}
    DeviceAuthorization:
      type: object
      required: [userCode, application, logoUrl, clientId, scopes, ip, userAgent, requestedAt, expiresAt]
      properties:
        userCode: {type: string, examples: [BCDF-GHJK]}
        application: {type: string}
        logoUrl: {type: [string, 'null']}
        clientId: {type: string, examples: [halo-cli]}
        scopes:
          type: array
          items: {type: string}
        ip: {type: string, description: The address the device requested the code from.}
        userAgent: {type: string}
        requestedAt: {type: string, format: date-time}
        expiresAt: {type: string, format: date-time}
    OutboxMessage:
      type: object
      required: [id, to, subject, text, attempts, lastError, createdAt, sentAt]
      properties:
        id: {type: string, examples: [msg_01J9Z8Q4M2N5P7R9T1V3X5Z7B9]}
        to: {type: string}
        subject: {type: string}
        text: {type: string}
        attempts: {type: integer}
        lastError: {type: string}
        createdAt: {type: string, format: date-time}
        sentAt: {type: [string, 'null'], format: date-time}
    SigningKey:
      type: object
      required: [kid, algorithm, active, createdAt, retiresAt, retiredAt]
      properties:
        kid: {type: string, description: The key id in the JWKS and in the `kid` header of tokens.}
        algorithm: {type: string, enum: [RS256, ES256, EdDSA]}
        active: {type: boolean, description: True for the newest key of its algorithm, which signs new tokens.}
        createdAt: {type: string, format: date-time}
        retiresAt: {type: [string, 'null'], format: date-time, description: 'For a replaced key, when it leaves the JWKS: 7 days after the next key was created.'}
        retiredAt: {type: [string, 'null'], format: date-time, description: When the key left the JWKS.}
    SAMLCertificate:
      type: object
      required: [id, fingerprint, notAfter, createdAt, retiredAt]
      properties:
        id: {type: string, examples: [key_01J9Z8Q4M2N5P7R9T1V3X5Z7B9]}
        fingerprint: {type: string, description: SHA-256 of the certificate as colon-separated uppercase hex.}
        notAfter: {type: string, format: date-time}
        createdAt: {type: string, format: date-time}
        retiredAt: {type: [string, 'null'], format: date-time, description: Set when a rotation replaced the certificate. Null for the current one.}
