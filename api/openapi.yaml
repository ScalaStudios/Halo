        '409': {$ref: '#/components/responses/Conflict'}
        '422': {$ref: '#/components/responses/Invalid'}
  /applications/{id}/hook:
    parameters:
      - {$ref: '#/components/parameters/Id'}
    get:
      tags: [Applications]
      operationId: getApplicationHook
      summary: Get an application's sign-in hook
      description: 'Roles: any administrator. The hook''s URL and signing secret are never returned.'
      responses:
        '200':
          description: The hook, or null when the application has none.
          content:
            application/json:
              schema:
                oneOf:
                  - {$ref: '#/components/schemas/ApplicationHook'}
                  - {type: 'null'}
        '401': {$ref: '#/components/responses/Unauthenticated'}
        '403': {$ref: '#/components/responses/Forbidden'}
        '404': {$ref: '#/components/responses/NotFound'}
    put:
      tags: [Applications]
      operationId: setApplicationHook
      summary: Add or change an application's sign-in hook
      description: |
        Roles: application administrator, with a recent sign-in. Only OpenID Connect applications that people sign in to can have a hook; service applications, SAML applications, bookmarks and the Halo CLI can't.

        Halo calls the hook when a person finishes signing in to the application (`type` is `sign_in`) and before every ID or access token it issues to them, including refreshes and token exchanges (`type` is `token`, with `grantType`). It sends `POST` with `{"type", "time", "user": {"id", "email", "name"}, "application": {"id", "clientId", "name"}, "scopes", "grantType"}` and a `Halo-Signature: t=<unix time>,v1=<hex HMAC-SHA256 of "<t>.<body>">` header made with the signing secret, the same scheme as webhooks.

        The hook answers `200` within 3 seconds with `{"decision": "allow" | "deny", "reason": "…", "claims": {…}}`, signed the same way in its own `Halo-Signature` header and no older than 5 minutes. `deny` blocks the sign-in or the token request and shows `reason`, up to 200 characters, to the person or in the token error's `error_description`. On `allow`, Halo adds to the ID token and to JWT access tokens only the claims named in `claims` of the hook's settings, and never `sub`, `iss`, `aud`, `exp`, `roles` or another claim Halo sets itself. A timeout, an unreachable or private address, another status, a missing or wrong signature, or an unreadable answer is a failure: the sign-in is blocked when `failOpen` is false and allowed without extra claims when it is true. Every call is recorded in the sign-in log with its decision in `hook`.

        Leave `url` or `secret` empty to keep the current value.
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: '#/components/schemas/ApplicationHookInput'}
      responses:
        '200':
          description: The hook.
          content:
            application/json:
              schema: {$ref: '#/components/schemas/ApplicationHook'}
        '400': {$ref: '#/components/responses/BadJSON'}
        '401': {$ref: '#/components/responses/ReauthRequired'}
        '403': {$ref: '#/components/responses/Forbidden'}
        '404': {$ref: '#/components/responses/NotFound'}
        '422': {$ref: '#/components/responses/Invalid'}
    delete:
      tags: [Applications]
      operationId: deleteApplicationHook
      summary: Remove an application's sign-in hook
      description: 'Roles: application administrator, with a recent sign-in.'
      responses:
        '204': {$ref: '#/components/responses/NoContent'}
        '401': {$ref: '#/components/responses/ReauthRequired'}
        '403': {$ref: '#/components/responses/Forbidden'}
        '404': {$ref: '#/components/responses/NotFound'}
  /applications/{id}/logout-deliveries:
    parameters:
