      tags: [Policies]
      operationId: getPolicy
      summary: Get one access policy
      description: 'Roles: any administrator.'
      responses:
        '200':
          description: The policy, without activity.
          content:
            application/json:
              schema: {$ref: '#/components/schemas/AccessPolicy'}
        '401': {$ref: '#/components/responses/Unauthenticated'}
        '403': {$ref: '#/components/responses/Forbidden'}
        '404': {$ref: '#/components/responses/NotFound'}
    put:
      tags: [Policies]
      operationId: updatePolicy
      summary: Replace an access policy
      description: 'Roles: security administrator. Refused with `ERR_LOCKOUT` like creating a policy, also when an approved change is applied.'
      requestBody: {$ref: '#/components/requestBodies/PolicyInput'}
      responses:
        '200': {$ref: '#/components/responses/PolicyResponse'}
        '202': {$ref: '#/components/responses/ApprovalPending'}
        '400': {$ref: '#/components/responses/BadJSON'}
        '401': {$ref: '#/components/responses/ReauthRequired'}
        '403': {$ref: '#/components/responses/Forbidden'}
        '404': {$ref: '#/components/responses/NotFound'}
        '409': {$ref: '#/components/responses/Conflict'}
        '422': {$ref: '#/components/responses/Invalid'}
    delete:
      tags: [Policies]
      operationId: deletePolicy
      summary: Delete an access policy
      description: 'Roles: security administrator.'
      responses:
        '204': {$ref: '#/components/responses/NoContent'}
        '202': {$ref: '#/components/responses/ApprovalPending'}
        '401': {$ref: '#/components/responses/ReauthRequired'}
        '403': {$ref: '#/components/responses/Forbidden'}
        '404': {$ref: '#/components/responses/NotFound'}
  /network-zones:
