openapi: 3.1.0
info:
  title: Halo management API
  version: 0.1.0
  license:
    name: Apache-2.0
    identifier: Apache-2.0
  description: |
    The JSON API behind the Halo console and account portal. Anything the web interface does, a script can do with the same requests.

    **Authentication.** Send either the `halo_session` cookie of a signed-in person, or an API key of a service account as `Authorization: Bearer hlk_…`. API keys work only when they have the `api` scope, act with the roles of their service account, and are ignored on the personal routes under `/me` and on the sign-in routes under `/auth`. A workload with a federated credential on a service account trades a token from its own identity provider for an API key that expires after an hour at `POST /oauth2/token`. The personal routes under `/me/` (with a trailing segment, not `/me` itself) also accept an access token that `halo login` obtained for the built-in Halo CLI application.

    **Re-authentication.** Sensitive operations need a recent strong sign-in when a person calls them with a session: a sign-in with a passkey, security key or recovery code, or a confirmation through `/me/reauthenticate`, within the last `reauthMinutes` (10 by default). Otherwise they answer `401` with `ERR_REAUTH_REQUIRED`; confirm with `/me/reauthenticate/begin` and `/me/reauthenticate`, then send the same request again. A person with no passkey, security key or authenticator app gets `403` with `ERR_REAUTH_UNAVAILABLE` instead. API keys are not affected, and an approved change applies without asking the requester again. The sensitive operations are the ones whose `401` response lists `ERR_REAUTH_REQUIRED`: granting or activating administrator roles, creating service accounts and API keys, rotating signing keys, SAML certificates and client secrets, changing access policies, authentication contexts, sign-in methods and organization settings, resetting or changing another person's sign-in methods, extending a guest's access or changing their sponsor, changing identity providers, exporting the configuration and approving a held change. Adding or removing your own passkey, security key or authenticator app, creating recovery codes, and choosing your security emails, need it too once you have a passkey, security key or authenticator app.
    **Re-authentication.** Sensitive operations need a recent strong sign-in when a person calls them with a session: a sign-in with a passkey, security key or recovery code, or a confirmation through `/me/reauthenticate`, within the last `reauthMinutes` (10 by default). Otherwise they answer `401` with `ERR_REAUTH_REQUIRED`; confirm with `/me/reauthenticate/begin` and `/me/reauthenticate`, then send the same request again. A person with no passkey, security key or authenticator app gets `403` with `ERR_REAUTH_UNAVAILABLE` instead. API keys are not affected, and an approved change applies without asking the requester again. The sensitive operations are the ones whose `401` response lists `ERR_REAUTH_REQUIRED`: granting or activating administrator roles, creating service accounts, API keys and federated credentials, removing federated credentials, rotating signing keys, SAML certificates and client secrets, changing access policies, authentication contexts, sign-in methods and organization settings, resetting or changing another person's sign-in methods, changing identity providers, exporting the configuration and approving a held change. Adding or removing your own passkey, security key or authenticator app, creating recovery codes, and choosing your security emails, need it too once you have a passkey, security key or authenticator app.

    **Step-up authentication.** An application asks for a stronger sign-in for one action by sending `acr_values` with the identifier of an authentication context to `/oauth2/authorize`, such as `acr_values=passkey-recent`, or an `acr` claim in the `claims` parameter, such as `{"id_token":{"acr":{"essential":true,"values":["passkey-recent"]}}}`. Discovery lists the identifiers in `acr_values_supported`. A sign-in meets a context when it used one of the context's `methods` and is no older than its `maxAge`, measured from `auth_time`. Halo uses the first requested context the session meets and names it in the ID token's `acr` claim, next to `amr` and `auth_time`; otherwise the sign-in page asks the person to sign in again, `/auth/continue` and the sign-in routes answer `403` with `ERR_STEP_UP_REQUIRED`, and `prompt=none` returns `login_required`. Values Halo does not know are skipped. When `claims` marks `acr` essential and Halo knows none of its values, the request ends with `access_denied`. An access policy with the effect `require-context` makes every matching sign-in meet the context too. Only ID tokens from the authorization code flow carry `acr`: refreshed ID tokens, access tokens and introspection do not. A resource server can ask the client for a step-up with RFC 9470: it answers `401` with `WWW-Authenticate: Bearer error="insufficient_user_authentication", error_description="A passkey sign-in in the last 5 minutes is required", acr_values="passkey-recent"` (or `max_age=300`, which it can check against `auth_time` in introspection), and the client sends the person to `/oauth2/authorize` with those values, checks `acr` in the new ID token and calls again with the new access token.

    **Roles.** Each operation states the roles it requires. A global administrator passes every role check. "Any administrator" means security, user, helpdesk or application administrator, or auditor.

    **Limited roles.** A global administrator can limit a user or helpdesk administrator role, held or eligible, to a set of assigned or rule-based groups with `scopes` on `PUT /users/{id}/roles` and `PUT /users/{id}/eligible-roles`. A limited role counts only on the operations marked "Limited roles apply"; everywhere else it counts as not held. There, people outside the role's groups are left out of lists, answer `404` on reads and `403` with `ERR_OUT_OF_SCOPE` on changes. An activated role keeps the groups of its eligibility. Only a global administrator assigns roles, so a limited administrator cannot grant a role or widen their own groups.

    **Errors.** Every error is `{"error": {"code": "ERR_…", "message": "…"}}`. Match on `code`; show `message` to people. Besides the codes listed per operation, any request can fail with `500` and `ERR_INTERNAL`, requests over the rate limit get `429` with `ERR_RATE_LIMITED`, and unknown routes answer `404` with `ERR_NO_ROUTE`. Requests with a method other than GET, HEAD or OPTIONS that come from another website get `403` with `ERR_CROSS_SITE`.

    **Rate limits.** Requests with an API key or a session are counted in one-minute windows that start on the minute: up to 600 per API key by default, set per service account with `rateLimit`, and up to 1,200 per session. SCIM requests under `/scim/v2` are counted apart, up to 3,000 per API key. Authorization requests under `/authz` are counted per application under `authz`, up to 6,000. Imports and bulk actions, `/users/import`, `/users/bulk/*` and `/groups/{id}/members/bulk/*`, are also counted apart under `bulk`, up to 20 requests per session or API key. Counted responses carry the `RateLimit-Policy` and `RateLimit` fields of draft-ietf-httpapi-ratelimit-headers, such as `RateLimit-Policy: "api";q=600;w=60` and `RateLimit: "api";r=598;t=42`. Over the limit, the response is `429` with `ERR_RATE_LIMITED` and `Retry-After` in seconds.

    **Conventions.** Bodies are JSON with camelCase names, at most 1 MiB, and unknown fields are rejected. Times are RFC 3339. Ids are a prefix and a 26-character ULID, such as `usr_01J9Z…`.
servers:
  - url: /api/v1
security:
  - session: []
  - apiKey: []
tags:
  - name: Organization
    description: Public information about the organization.
  - name: Sign-in
    description: Passkey, code, magic link, federated and enrollment sign-in. These routes work without a session unless noted, and ignore API keys.
  - name: Device sign-in
    description: The confirmation page of the device flow that `halo login` uses.
  - name: Account
    description: The signed-in person's own profile, sign-in methods, sessions, access and certificates. API keys cannot use these routes.
  - name: Users
    description: Invitations, profiles, suspension, sign-in methods and roles of the people in the directory.
  - name: Groups
    description: Assigned and rule-based groups and their members.
  - name: Applications
    description: |
      OpenID Connect, OAuth, SAML, forward-auth, RADIUS and LDAP applications, bookmarks, their secrets and group assignments, and the collections that group them in the account portal.

      **private_key_jwt.** A web or service application with `tokenEndpointAuthMethod` `private_key_jwt` authenticates at `/oauth2/token`, `/oauth2/par`, `/oauth2/introspect` and `/oauth2/revoke` with `client_assertion_type` `urn:ietf:params:oauth:client-assertion-type:jwt-bearer` and a `client_assertion` (RFC 7523), never with a client secret, and never with both. The assertion is a JWT signed with one of `token_endpoint_auth_signing_alg_values_supported` from discovery (never `none` or HMAC) by a key in the application's `jwks`, or published at its `jwksUri`, which Halo fetches from public addresses only, caches for an hour and fetches again when an assertion names a key it doesn't know, at most once a minute. `iss` and `sub` are the client ID; `aud` is the issuer, `{issuer}/oauth2/token` or the URL of the endpoint called; `exp` is at most an hour away; `nbf` and `iat`, if present, are not in the future, with a minute of clock skew; and `jti` is new. Halo keeps each `jti` until the assertion expires, shared by every Halo instance, and refuses it a second time.

      **FAPI 2.0 security profile.** `fapi2Profile` makes a web or service application follow the FAPI 2.0 Security Profile: private_key_jwt with `aud` the issuer as a single string and PS256, ES256 or EdDSA signatures (5.3.2.1, 5.4.1), pushed authorization requests, PKCE with S256 and https redirect URIs (5.3.2.2), DPoP-bound tokens (5.3.2.1), ES256 or EdDSA ID tokens (5.4.1), and authorization codes that expire a minute after they are issued (5.3.2.1). Refresh token rotation is disabled while the profile is active. Turning it on also turns on `requirePar`, `requirePkce` and `requireDpop` and moves RS256 ID tokens to ES256; while it is on, Halo enforces these even if those fields say otherwise, and refuses a change that loosens them. The authorization code flow is the only one Halo offers, and every authorization response carries `iss` (RFC 9207), in the query, the fragment or the `form_post` form. A code is bound to a DPoP key when the pushed request carries a DPoP proof or the authorization request carries `dpop_jkt`, and the token request must then prove that key.
  - name: Authorization
    description: 'Relationship-based permissions for applications, in the style of Zanzibar. An application administrator gives a web or service application a model of types and relations. The application then writes tuples such as `document:readme#viewer@user:usr_…` and asks whether a person has a relation on an object. Groups expand to their members, relations combine other relations, application roles and relations of a parent object, and suspended or deprovisioned people are always denied. Tuples can name only the people and groups assigned to the application, the same ones who can sign in to it, and a person or group that is later unassigned is ignored until assigned again, so an application never learns about anyone outside it. Routes under `/authz` use the application''s configured client authentication method and only see that application''s tuples. Tuples that name a person or group are deleted with them. Model changes are in the audit log; tuple writes are not.'
  - name: Forward auth
    description: 'The check that Traefik `forwardAuth`, nginx `auth_request` and Caddy `forward_auth` run before every request to a forward-auth application, outside `/api/v1`, and the sign-in it sends people to.'
  - name: Activity
    description: Sessions, the sign-in log, the audit log, the overview and security recommendations.
  - name: Reports
    description: 'Sign-in method registration and usage, inactive people and application usage, as JSON or, with `format=csv`, as a CSV file. Usage counts successful sign-ins by people in the sign-in log, including sign-ins to applications with an existing Halo session, and leaves out impersonation and service accounts. Cells that start with `=`, `+`, `-`, `@`, a tab or a carriage return get a leading `''` so spreadsheets do not run them as formulas.'
  - name: Access packages
    description: Bundles of groups that people can request.
  - name: Access requests
    description: Requests for access packages and the grants they create.
  - name: Approvals
    description: Changes that wait for a second global administrator before they apply.
  - name: Access reviews
    description: Periodic reviews of who stays in an assigned group.
  - name: Lifecycle
    description: Joiner, mover and leaver rules.
  - name: Policies
    description: Conditional access policies, network zones, terms of use, authentication contexts, sign-in methods, devices, device compliance sources and risk events.
  - name: Service accounts
    description: Non-human accounts, their API keys and the federated credentials that let workloads sign in without one.
  - name: Provisioning
    description: Outbound SCIM provisioning to applications, and LDAP directory sync into Halo.
  - name: Identity providers
    description: Google, Microsoft Entra, GitHub and generic OpenID Connect providers people sign in with.
  - name: Settings
    description: Organization settings, branding, domains and data export.
  - name: Webhooks
    description: Signed HTTP delivery of audit and sign-in events, streaming them to syslog or OpenTelemetry, and notification rules that send chosen events to Slack, Discord or a webhook. An audit event's `data` has the fields of an `AuditEvent`, including `changes`.
  - name: API resources
    description: |
      Your own APIs, their scopes, and which applications may request them.

      **Revoked access tokens.** Halo issues JWT access tokens for APIs. Introspection at `/oauth2/introspect` reports a token inactive as soon as its session ends, the person is suspended or loses the application, consent is removed or the token is revoked. An API that checks tokens itself against `/oauth2/keys` sees none of that and keeps accepting a token until it expires. Keep `accessTokenTtl` at 5 to 15 minutes for such APIs, and either poll `GET /oauth2/revoked` or subscribe a webhook to `token.revoke`, then refuse tokens whose `jti` is listed.

      **DPoP-bound tokens.** An application binds its tokens to a key it holds by sending a DPoP proof (RFC 9449) in the `DPoP` header of each token request: a JWT with `typ` `dpop+jwt`, the public key in `jwk`, signed with one of `dpop_signing_alg_values_supported` from discovery, with a new `jti`, `htm` and `htu` matching the request and an `iat` within a minute. Halo refuses a `jti` it has seen. The token response then says `token_type: DPoP`, JWT access tokens carry `cnf.jkt`, the key's SHA-256 thumbprint (RFC 7638), and introspection reports `token_type: DPoP` and `cnf`. A refresh token issued with a proof refreshes only with a proof from the same key, and one issued without a proof only without one. At `/oauth2/userinfo` the application sends `Authorization: DPoP <token>` with a proof that also has `ath`, the base64url SHA-256 hash of the token, and Halo refuses a bound token sent as a bearer token. An API that receives bound tokens checks the proof the same way and compares the thumbprint of its `jwk` with `cnf.jkt`.
  - name: SSH
    description: The SSH certificate authorities for people and hosts, principal mappings, issued certificates and registered hosts.
  - name: Remote access
    description: |
      Browser SSH, RDP and VNC sessions to hosts on private networks. A remote access application defines a host, port, protocol and outpost. SSH can use a short-lived Halo certificate, a password or a private key. RDP and VNC use a password. Halo encrypts all stored credentials and keeps them out of the browser.

      **Outposts.** `halo-outpost` runs inside the private network. It enrolls once with a token from `POST /outposts`, receives a key, and holds a WebSocket open at `/outpost/connect`. For SSH the outpost relays TCP to the registered host over a second WebSocket at `/outpost/streams/{stream}`. For RDP and VNC the outpost relays to its configured loopback Guacamole proxy. Halo supplies the registered connection details and stored password to that proxy.

      **Sessions.** `POST /me/remote-sessions` checks assignment, application status, the sign-in frequency, and access policies, including passkey requirements, network zones and authentication contexts. The result appears in the sign-in log. The browser opens `GET /me/remote-sessions/{id}/connect` as a WebSocket within a minute. All protocols enforce the configured session limit and use the same session log. SSH checks the host key or Halo host certificate and supports optional asciicast recording.
  - name: Development
    description: Routes that exist only with HALO_DEV=1.
  - name: Shared signals
    description: |
      Security events sent as signed Security Event Tokens (RFC 8417) under the OpenID Shared Signals Framework 1.0, outside `/api/v1`. A receiver is a service application that a security administrator turned on with `PUT /applications/{id}/shared-signals`. It authenticates every call with a client credentials access token from `/oauth2/token` addressed to itself, finds the endpoints at `/.well-known/ssf-configuration` and creates one stream. Errors are `{"error": {"code", "message"}}`.

      **Events.** CAEP `session-revoked` when a Halo session ends before it expires (not impersonations), `credential-change` when a password, passkey (`fido2-platform`), security key (`fido2-roaming`) or authenticator app (`app`) is added, changed, removed (`delete`) or reset by an administrator (`revoke`), and `device-compliance-change` when a compliance source moves a linked device between compliant and not compliant. RISC `account-disabled` and `account-enabled` when a person is suspended or deprovisioned and restored, whether by an administrator, SCIM, LDAP sync, a lifecycle rule, a risk response or guest expiry, `account-purged` when a person is deleted, and `identifier-changed` when their email address changes, for streams with `email` subjects only. Service accounts send no events. Every SET carries `iss`, `aud` (the receiver's client ID), `jti`, `iat` and `sub_id`, never `sub` or `exp`, and has the header `typ: secevent+jwt`; CAEP and RISC SETs also carry `txn`, and their event carries `event_timestamp`. Verify it against `/oauth2/keys`.

      **Subjects.** The receiver's `subjectFormat` sets `sub_id`: `iss_sub` (Halo's issuer and the person's ID, the `sub` of their ID tokens), `email`, or `opaque` (the person's ID). `session-revoked` and `device-compliance-change` use a `complex` subject with `user` and an opaque `session` (the ID token's `sid`) or `device`. Verification events use an opaque subject holding the stream ID.

      **Delivery.** Push (`urn:ietf:rfc:8935`) posts each SET to the receiver's public `https://` endpoint with `Content-Type: application/secevent+jwt` and its `authorization_header`, and retries any answer other than 2xx after 30 seconds, then 1, 2, 4, 8, 16 and 32 minutes, like webhooks. Private, loopback and link-local addresses are refused when the stream is saved and again when Halo connects. Poll (`urn:ietf:rfc:8936`) keeps each SET until the receiver acknowledges its `jti`, and serves unacknowledged SETs again. Halo keeps SETs, delivered or not, for 30 days.
  - name: Client registration
    description: 'OAuth dynamic client registration (RFC 7591) and management (RFC 7592) at `/oauth2/register`, outside `/api/v1`. Off unless `clientRegistration` allows it. Errors are `{"error": "…", "error_description": "…"}`. Registered clients use the authorization code flow with the `openid`, `profile` and `email` scopes, get no groups, API grants or token exchange, and sign nobody in until an application administrator assigns groups.'
paths:
  /oauth2/register:
    servers:
      - url: /
    post:
      tags: [Client registration]
      operationId: registerClient
      summary: Register an OAuth client
      description: 'Anonymous when `clientRegistration` is `open` or `approval`; needs an initial access token when it is `token`. Limited to 20 requests from one IP address per clock hour, rejected ones included. With `approval`, the client is created disabled with `awaitingApproval`. Recorded as `application.register`.'
      security:
        - {}
        - initialAccessToken: []
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: '#/components/schemas/ClientMetadata'}
      responses:
        '201':
          description: The registered client, its secret and its registration access token. They are shown only once.
          content:
            application/json:
              schema: {$ref: '#/components/schemas/ClientRegistration'}
        '400':
          description: '`invalid_redirect_uri` or `invalid_client_metadata`.'
          content:
            application/json:
              schema: {$ref: '#/components/schemas/OAuthError'}
        '401':
          description: '`invalid_token`: the initial access token is missing, unknown, or lacks the `registration` scope.'
          content:
            application/json:
              schema: {$ref: '#/components/schemas/OAuthError'}
        '404':
          description: '`invalid_request`: client registration is off.'
          content:
            application/json:
              schema: {$ref: '#/components/schemas/OAuthError'}
        '429':
          description: '`temporarily_unavailable`, with `Retry-After` in seconds.'
          content:
            application/json:
              schema: {$ref: '#/components/schemas/OAuthError'}
  /oauth2/register/{clientId}:
    servers:
      - url: /
    parameters:
      - {name: clientId, in: path, required: true, schema: {type: string}}
    get:
      tags: [Client registration]
      operationId: readClientRegistration
      summary: Read a client's registration
      security:
        - registrationAccessToken: []
      responses:
        '200':
          description: The client's current metadata, without its secret or registration access token.
          content:
            application/json:
              schema: {$ref: '#/components/schemas/ClientRegistration'}
        '401': {$ref: '#/components/responses/RegistrationTokenInvalid'}
        '404': {$ref: '#/components/responses/RegistrationOff'}
    put:
      tags: [Client registration]
      operationId: updateClientRegistration
      summary: Replace a client's metadata
      description: 'Send every field, with `client_id`; omitted fields are cleared. The client keeps its `token_endpoint_auth_method` and `application_type` but can replace `jwks` or `jwks_uri`, and its scopes can only narrow to `openid`, `profile`, `email` and those an administrator added. When `clientRegistration` is `approval` or the client is assigned to groups, a change disables the client and sets `awaitingApproval` until an application administrator approves it again. Recorded as `application.registration.update`.'
      security:
        - registrationAccessToken: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              allOf:
                - {$ref: '#/components/schemas/ClientMetadata'}
                - {type: object, required: [client_id, redirect_uris], properties: {client_id: {type: string}}}
      responses:
        '200':
          description: The updated metadata.
          content:
            application/json:
              schema: {$ref: '#/components/schemas/ClientRegistration'}
        '400':
          description: '`invalid_request`, `invalid_redirect_uri` or `invalid_client_metadata`.'
          content:
            application/json:
              schema: {$ref: '#/components/schemas/OAuthError'}
        '401': {$ref: '#/components/responses/RegistrationTokenInvalid'}
        '404': {$ref: '#/components/responses/RegistrationOff'}
    delete:
      tags: [Client registration]
      operationId: deleteClientRegistration
      summary: Delete a client
      description: Deletes the application, its credentials and group assignments. Recorded as `application.registration.delete`.
      security:
        - registrationAccessToken: []
      responses:
        '204': {description: Deleted.}
        '401': {$ref: '#/components/responses/RegistrationTokenInvalid'}
        '404': {$ref: '#/components/responses/RegistrationOff'}
  /oauth2/token:
    servers:
      - url: /
    post:
      tags: [Service accounts]
      operationId: exchangeWorkloadToken
      summary: Exchange a workload's token for a short-lived API key
      description: 'The client credentials grant at `/oauth2/token` with a JWT client assertion (RFC 7523) from an issuer that one of the service account''s federated credentials trusts, as in Microsoft Entra workload identity federation. When `client_id` is an application''s client ID or is left out, the assertion is that application''s private_key_jwt authentication instead (see Applications). The assertion''s `sub` is the workload, not the client. Halo reads the issuer''s signing keys from its discovery document, caches them for an hour and fetches them again when a token names a key it doesn''t know, at most once a minute. The token must be signed with RS256, RS384, RS512, PS256, PS384, PS512, ES256, ES384 or ES512, have `exp` and `iat`, be valid within one minute of clock skew, and match the credential''s issuer, subject, audience and claim conditions exactly. The API key acts with the service account''s current roles, carries the credential''s scopes, expires after one hour, counts toward one rate limit with the other keys of the same credential, and stops working when the credential is removed or the account is disabled. Each exchange is recorded as `federated_credential.exchange` and in the sign-in log with the method `federated`, and so are refusals of tokens whose signature and subject checked out.'
      security:
        - {}
      requestBody:
        required: true
        content:
          application/x-www-form-urlencoded:
            schema:
              type: object
              required: [grant_type, client_id, client_assertion_type, client_assertion]
              properties:
                grant_type: {type: string, enum: [client_credentials]}
                client_id: {type: string, description: The ID of the service account.}
                client_assertion_type: {type: string, enum: ['urn:ietf:params:oauth:client-assertion-type:jwt-bearer']}
                client_assertion: {type: string, description: 'The workload''s token, such as a GitHub Actions ID token or a projected Kubernetes service account token.'}
      responses:
        '200':
          description: The API key.
          content:
            application/json:
              schema:
                type: object
                required: [access_token, token_type, expires_in, scope]
                properties:
                  access_token: {type: string, examples: [hlk_…]}
                  token_type: {type: string, enum: [Bearer]}
                  expires_in: {type: integer, examples: [3600]}
                  scope: {type: string, examples: [api], description: The credential's scopes separated by spaces.}
        '400':
          description: '`invalid_request`: `client_id` or `client_assertion` is missing.'
          content:
            application/json:
              schema: {$ref: '#/components/schemas/OAuthError'}
        '401':
          description: '`invalid_client`: `client_id` is not a service account, the account is disabled, or the token is unsigned, signed with another algorithm or key, expired, not valid yet, or matches no federated credential of the account.'
          content:
            application/json:
              schema: {$ref: '#/components/schemas/OAuthError'}
        '500':
          description: '`server_error`: Halo could not fetch the issuer''s signing keys.'
          content:
            application/json:
              schema: {$ref: '#/components/schemas/OAuthError'}
  /oauth2/par:
    servers:
      - url: /
    post:
      tags: [Applications]
      operationId: pushAuthorizationRequest
      summary: Push an authorization request
      description: 'Pushed authorization requests (RFC 9126). The application posts the parameters it would send to `/oauth2/authorize`, authenticated like at the token endpoint, optionally with a `DPoP` proof for `POST {issuer}/oauth2/par` that binds the code to its key, and Halo checks them as the authorization endpoint does. It then sends the person to `/oauth2/authorize?client_id=…&request_uri=…`. Halo uses only the pushed parameters, ignores any others in that URL, and accepts each `request_uri` once, within 60 seconds. A used, expired or unknown `request_uri`, or one sent with another `client_id`, ends with a `400` page and no redirect. Discovery lists the endpoint in `pushed_authorization_request_endpoint`.'
      security:
        - {}
      requestBody:
        required: true
        content:
          application/x-www-form-urlencoded:
            schema:
              type: object
              required: [response_type, redirect_uri, scope]
              properties:
                client_id: {type: string, description: Required unless the application authenticates with HTTP Basic or a client assertion.}
                client_secret: {type: string, description: 'Web applications authenticate with this or with HTTP Basic. Single-page and native applications send only `client_id`.'}
                client_assertion_type: {type: string, enum: ['urn:ietf:params:oauth:client-assertion-type:jwt-bearer'], description: 'With `client_assertion`, for applications using `private_key_jwt`.'}
                client_assertion: {type: string, description: 'A JWT signed by the application''s key. Its `aud` may also be `{issuer}/oauth2/par`, except under the FAPI 2.0 profile.'}
                dpop_jkt: {type: string, description: 'The JWK SHA-256 thumbprint of the DPoP key the code will be bound to (RFC 9449). A `DPoP` header on this request binds the code to its key instead, and `dpop_jkt` must then match it.'}
                response_type: {type: string, enum: [code]}
                redirect_uri: {type: string}
                scope: {type: string, examples: [openid email offline_access]}
                state: {type: string}
                nonce: {type: string}
                code_challenge: {type: string}
                code_challenge_method: {type: string, enum: [S256]}
              additionalProperties: {type: string}
      responses:
        '201':
          description: The reference to send to `/oauth2/authorize`.
          content:
            application/json:
              schema:
                type: object
                required: [request_uri, expires_in]
                properties:
                  request_uri: {type: string, examples: ['urn:ietf:params:oauth:request_uri:…']}
                  expires_in: {type: integer, examples: [60]}
        '400':
          description: '`invalid_request`: a parameter would fail at `/oauth2/authorize`, such as an unregistered `redirect_uri`, missing PKCE or a malformed `dpop_jkt`, the body has `request_uri` or a `client_id` other than the authenticated one, or the client sent a client assertion together with a secret. `invalid_dpop_proof`: the `DPoP` proof is invalid or names another key than `dpop_jkt`. `unauthorized_client`: the HTTP Basic secret is wrong, or the application uses `private_key_jwt`.'
          content:
            application/json:
              schema: {$ref: '#/components/schemas/OAuthError'}
        '401':
          description: '`invalid_client`: a web or service application did not authenticate, its `client_secret` is wrong or not accepted, or its client assertion is invalid, expired, replayed, or signed with another algorithm or key.'
          content:
            application/json:
              schema: {$ref: '#/components/schemas/OAuthError'}
  /oauth2/revoked:
    servers:
      - url: /
    get:
      tags: [API resources]
      operationId: listRevokedAccessTokens
      summary: List access tokens revoked before they expired
      description: 'No authentication: the list holds only token identifiers and expiry times, which are useless without the tokens themselves. Lists, newest expiry first and at most 10,000, the access tokens Halo revoked that have not expired yet, whether a session ended, the person was suspended, their password or sign-in methods were reset, consent was removed, an automatic risk response acted, an application was turned off or a client revoked the token at `/oauth2/revoke`. A token replaced through a refresh is not listed, though introspection reports it inactive. Poll it from APIs that validate JWT access tokens themselves, and refuse a token whose `jti` is listed until its `exp`.'
      security:
        - {}
      responses:
        '200':
          description: The revoked tokens.
          headers:
            Cache-Control:
              schema: {type: string, enum: [no-store]}
          content:
            application/json:
              schema:
                type: object
                required: [revoked]
                properties:
                  revoked:
                    type: array
                    maxItems: 10000
                    items:
                      type: object
                      required: [jti, exp]
                      properties:
                        jti: {type: string, examples: [atk_01J9Z8Q4M2N5P7R9T1V3X5Z7B9]}
                        exp: {type: integer, description: The token's `exp`, in seconds since the Unix epoch., examples: [1767225600]}
  /.well-known/ssf-configuration:
    servers:
      - url: /
    get:
      tags: [Shared signals]
      operationId: getTransmitterConfiguration
      summary: Get the Shared Signals transmitter configuration
      description: No authentication. `issuer` is Halo's issuer, the `iss` of every SET.
      security:
        - {}
      responses:
        '200':
          description: The transmitter configuration.
          content:
            application/json:
              schema:
                type: object
                required: [spec_version, issuer, jwks_uri, delivery_methods_supported, configuration_endpoint, status_endpoint, verification_endpoint, authorization_schemes, default_subjects]
                properties:
                  spec_version: {type: string, enum: ['1_0']}
                  issuer: {type: string, examples: ['https://halo.example.com']}
                  jwks_uri: {type: string, examples: ['https://halo.example.com/oauth2/keys']}
                  delivery_methods_supported:
                    type: array
                    items: {type: string, enum: ['urn:ietf:rfc:8935', 'urn:ietf:rfc:8936']}
                  configuration_endpoint: {type: string, examples: ['https://halo.example.com/oauth2/ssf/stream']}
                  status_endpoint: {type: string, examples: ['https://halo.example.com/oauth2/ssf/status']}
                  verification_endpoint: {type: string, examples: ['https://halo.example.com/oauth2/ssf/verify']}
                  authorization_schemes:
                    type: array
                    items:
                      type: object
                      properties:
                        spec_urn: {type: string, enum: ['urn:ietf:rfc:6749']}
                  default_subjects: {type: string, enum: [ALL]}
  /oauth2/ssf/stream:
    servers:
      - url: /
    get:
      tags: [Shared signals]
      operationId: readSignalStream
      summary: Read the receiver's stream
      description: With `stream_id`, the stream; without it, a list holding the receiver's stream or nothing.
      security:
        - receiverAccessToken: []
      parameters:
        - {name: stream_id, in: query, schema: {type: string}}
      responses:
        '200':
          description: The stream, or a list of streams without `stream_id`.
          content:
            application/json:
              schema:
                oneOf:
                  - {$ref: '#/components/schemas/SignalStreamConfiguration'}
                  - {type: array, maxItems: 1, items: {$ref: '#/components/schemas/SignalStreamConfiguration'}}
        '401': {$ref: '#/components/responses/ReceiverUnauthenticated'}
        '403': {$ref: '#/components/responses/ReceiverForbidden'}
        '404': {$ref: '#/components/responses/NotFound'}
    post:
      tags: [Shared signals]
      operationId: createSignalStream
      summary: Create the receiver's stream
      description: Halo keeps one stream per receiver. Without `delivery`, the receiver polls. Event types Halo does not send are kept in `events_requested` and left out of `events_delivered`. Recorded as `ssf_stream.create`.
      security:
        - receiverAccessToken: []
      requestBody:
        content:
          application/json:
            schema: {$ref: '#/components/schemas/SignalStreamInput'}
      responses:
        '201':
          description: The stream.
          content:
            application/json:
              schema: {$ref: '#/components/schemas/SignalStreamConfiguration'}
        '400': {$ref: '#/components/responses/SignalInvalid'}
        '401': {$ref: '#/components/responses/ReceiverUnauthenticated'}
        '403': {$ref: '#/components/responses/ReceiverForbidden'}
        '409': {description: '`ERR_CONFLICT`: the receiver already has a stream.', content: {application/json: {schema: {$ref: '#/components/schemas/Error'}}}}
    patch:
      tags: [Shared signals]
      operationId: updateSignalStream
      summary: Change the receiver's stream
      description: Changes the receiver-supplied properties that are present and keeps the others. `delivery` is replaced as a whole, including `authorization_header`. Transmitter-supplied properties may be sent but must match. Recorded as `ssf_stream.update`.
      security:
        - receiverAccessToken: []
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: '#/components/schemas/SignalStreamInput'}
      responses:
        '200':
          description: The stream.
          content:
            application/json:
              schema: {$ref: '#/components/schemas/SignalStreamConfiguration'}
        '400': {$ref: '#/components/responses/SignalInvalid'}
        '401': {$ref: '#/components/responses/ReceiverUnauthenticated'}
        '403': {$ref: '#/components/responses/ReceiverForbidden'}
        '404': {$ref: '#/components/responses/NotFound'}
    put:
      tags: [Shared signals]
      operationId: replaceSignalStream
      summary: Replace the receiver's stream
      description: Like `PATCH`, but receiver-supplied properties that are left out are cleared, and a missing `delivery` means poll. Recorded as `ssf_stream.update`.
      security:
        - receiverAccessToken: []
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: '#/components/schemas/SignalStreamInput'}
      responses:
        '200':
          description: The stream.
          content:
            application/json:
              schema: {$ref: '#/components/schemas/SignalStreamConfiguration'}
        '400': {$ref: '#/components/responses/SignalInvalid'}
        '401': {$ref: '#/components/responses/ReceiverUnauthenticated'}
        '403': {$ref: '#/components/responses/ReceiverForbidden'}
        '404': {$ref: '#/components/responses/NotFound'}
    delete:
      tags: [Shared signals]
      operationId: deleteSignalStream
      summary: Delete the receiver's stream
      description: Deletes the stream with its SETs, delivered or not. Recorded as `ssf_stream.delete`.
      security:
        - receiverAccessToken: []
      parameters:
        - {name: stream_id, in: query, required: true, schema: {type: string}}
      responses:
        '204': {$ref: '#/components/responses/NoContent'}
        '401': {$ref: '#/components/responses/ReceiverUnauthenticated'}
        '403': {$ref: '#/components/responses/ReceiverForbidden'}
        '404': {$ref: '#/components/responses/NotFound'}
  /oauth2/ssf/status:
    servers:
      - url: /
    get:
      tags: [Shared signals]
      operationId: getSignalStreamStatus
      summary: Get the stream's status
      security:
        - receiverAccessToken: []
      parameters:
        - {name: stream_id, in: query, required: true, schema: {type: string}}
      responses:
        '200':
          description: The status.
          content:
            application/json:
              schema: {$ref: '#/components/schemas/SignalStreamStatus'}
        '401': {$ref: '#/components/responses/ReceiverUnauthenticated'}
        '403': {$ref: '#/components/responses/ReceiverForbidden'}
        '404': {$ref: '#/components/responses/NotFound'}
    post:
      tags: [Shared signals]
      operationId: setSignalStreamStatus
      summary: Enable, pause or disable the stream
      description: A paused stream keeps its events and sends them once enabled again. A disabled stream drops its undelivered events and queues no new ones. Recorded as `ssf_stream.status`.
      security:
        - receiverAccessToken: []
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: '#/components/schemas/SignalStreamStatus'}
      responses:
        '200':
          description: The status.
          content:
            application/json:
              schema: {$ref: '#/components/schemas/SignalStreamStatus'}
        '400': {$ref: '#/components/responses/SignalInvalid'}
        '401': {$ref: '#/components/responses/ReceiverUnauthenticated'}
        '403': {$ref: '#/components/responses/ReceiverForbidden'}
        '404': {$ref: '#/components/responses/NotFound'}
  /oauth2/ssf/verify:
    servers:
      - url: /
    post:
      tags: [Shared signals]
      operationId: requestSignalVerification
      summary: Ask for a verification event
      description: Queues a `https://schemas.openid.net/secevent/ssf/event-type/verification` SET carrying `state`, delivered like the stream's other events. At most one request every `min_verification_interval` seconds.
      security:
        - receiverAccessToken: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [stream_id]
              properties:
                stream_id: {type: string}
                state: {type: string, maxLength: 1024}
      responses:
        '204': {$ref: '#/components/responses/NoContent'}
        '400': {$ref: '#/components/responses/SignalInvalid'}
        '401': {$ref: '#/components/responses/ReceiverUnauthenticated'}
        '403': {$ref: '#/components/responses/ReceiverForbidden'}
        '404': {$ref: '#/components/responses/NotFound'}
        '429':
          description: '`ERR_RATE_LIMITED`: the last verification request was too recent.'
          headers:
            Retry-After:
              schema: {type: integer}
          content:
            application/json:
              schema: {$ref: '#/components/schemas/Error'}
  /oauth2/ssf/poll/{id}:
    servers:
      - url: /
    parameters:
      - {$ref: '#/components/parameters/Id'}
    post:
      tags: [Shared signals]
      operationId: pollSignals
      summary: Poll for SETs and acknowledge received ones
      description: 'RFC 8936 poll delivery for a stream with `urn:ietf:rfc:8936`, at the `endpoint_url` Halo returned. Acknowledges `ack` and records `setErrs` as failed first, then returns up to `maxEvents` (at most 100) unacknowledged SETs, oldest first. With `returnImmediately` false or left out, Halo waits up to 20 seconds for a SET. A paused stream returns none.'
      security:
        - receiverAccessToken: []
      requestBody:
        content:
          application/json:
            schema:
              type: object
              properties:
                maxEvents: {type: integer, minimum: 0}
                returnImmediately: {type: boolean, default: false}
                ack:
                  type: array
                  items: {type: string}
                setErrs:
                  type: object
                  additionalProperties:
                    type: object
                    properties:
                      err: {type: string}
                      description: {type: string}
      responses:
        '200':
          description: The SETs, by `jti`.
          content:
            application/json:
              schema:
                type: object
                required: [sets, moreAvailable]
                properties:
                  sets:
                    type: object
                    additionalProperties: {type: string, description: A signed SET.}
                  moreAvailable: {type: boolean}
        '400': {$ref: '#/components/responses/SignalInvalid'}
        '401': {$ref: '#/components/responses/ReceiverUnauthenticated'}
        '403': {$ref: '#/components/responses/ReceiverForbidden'}
        '404': {$ref: '#/components/responses/NotFound'}
  /organization:
    get:
      tags: [Organization]
      operationId: getOrganization
      summary: Get the organization name, issuer and branding
      security: []
      responses:
        '200':
          description: The organization.
          content:
            application/json:
              schema: {$ref: '#/components/schemas/Organization'}
  /openapi.yaml:
    get:
      tags: [Organization]
      operationId: getOpenAPI
      summary: Get this OpenAPI document
      security: []
      responses:
        '200':
          description: The OpenAPI document.
          content:
            application/yaml:
              schema: {type: string}
  /branding/logo:
    get:
      tags: [Organization]
      operationId: getLogo
      summary: Get the sign-in logo
      security: []
      responses:
        '200':
          description: The logo image. Cached for 5 minutes.
          content:
            image/png:
              schema: {type: string, contentMediaType: image/png}
            image/jpeg:
              schema: {type: string, contentMediaType: image/jpeg}
            image/webp:
              schema: {type: string, contentMediaType: image/webp}
        '404': {$ref: '#/components/responses/NotFound'}
    put:
      tags: [Settings]
      operationId: uploadLogo
      summary: Upload the sign-in logo
      description: 'Roles: global administrator. Send the image bytes as the body: PNG, JPEG or WebP, at most 256 KB. Halo detects the type from the content.'
      requestBody:
        required: true
        content:
          image/png:
            schema: {type: string, contentMediaType: image/png}
          image/jpeg:
            schema: {type: string, contentMediaType: image/jpeg}
          image/webp:
            schema: {type: string, contentMediaType: image/webp}
      responses:
        '200':
          description: The organization with its new `logoUrl`.
          content:
            application/json:
              schema: {$ref: '#/components/schemas/Organization'}
        '401': {$ref: '#/components/responses/Unauthenticated'}
        '403': {$ref: '#/components/responses/Forbidden'}
        '413':
          description: '`ERR_TOO_LARGE`: the image is larger than 256 KB.'
          content:
            application/json:
              schema: {$ref: '#/components/schemas/Error'}
        '422': {$ref: '#/components/responses/Invalid'}
    delete:
      tags: [Settings]
      operationId: deleteLogo
      summary: Remove the sign-in logo
      description: 'Roles: global administrator.'
      responses:
        '204': {$ref: '#/components/responses/NoContent'}
        '401': {$ref: '#/components/responses/Unauthenticated'}
        '403': {$ref: '#/components/responses/Forbidden'}
        '404': {$ref: '#/components/responses/NotFound'}
  /auth/methods:
    get:
      tags: [Sign-in]
      operationId: listEnabledMethods
      summary: List the sign-in methods that are turned on
      security: []
      responses:
        '200':
          description: The enabled methods.
          content:
            application/json:
              schema:
                type: object
                required: [methods, emailSignIn, challenge, signUp]
                properties:
                  signUp: {type: boolean, description: 'Whether people can create an account at `/auth/sign-up`.'}
                  methods:
                    type: array
                    items: {$ref: '#/components/schemas/MethodKind'}
                  emailSignIn: {$ref: '#/components/schemas/EmailSignIn'}
                  challenge:
                    type: [object, 'null']
                    description: The bot protection check to show, or null when bot protection is off.
                    required: [provider, siteKey]
                    properties:
                      provider: {type: string, enum: [turnstile, hcaptcha]}
                      siteKey: {type: string}
  /auth/providers:
    get:
      tags: [Sign-in]
      operationId: listSignInProviders
      summary: List the identity providers shown on the sign-in page
      description: Only providers that are enabled and set to show on the sign-in page.
      security: []
      responses:
        '200':
          description: The providers.
          content:
            application/json:
              schema:
                type: array
                items: {$ref: '#/components/schemas/SignInProvider'}
  /auth/request/{id}:
    parameters:
      - {$ref: '#/components/parameters/Id'}
    get:
      tags: [Sign-in]
      operationId: getAuthRequest
      summary: Get the application behind a sign-in request
      security: []
      responses:
        '200':
          description: The application's name, homepage and logo, and the hints the application sent.
          content:
            application/json:
              schema:
                type: object
                required: [application, loginHint]
                properties:
                  loginHint: {type: string, description: 'The `login_hint` from the authorization request, empty when there was none.'}
                  provider:
                    $ref: '#/components/schemas/SignInProvider'
                    description: Present when the request's `domain_hint`, or the domain of its `login_hint` when there is no `domain_hint`, is sent straight to an identity provider. The sign-in page goes there without showing the other options.
                  application:
                    type: object
                    required: [name, homepage, logoUrl, kerberosSignIn]
                    properties:
                      name: {type: string}
                      homepage: {type: string}
                      logoUrl: {type: [string, 'null']}
                      kerberosSignIn: {type: boolean, description: 'Whether the application allows Windows sign-in. When it doesn''t, the sign-in page neither offers nor tries it.'}
        '404': {$ref: '#/components/responses/AuthRequestExpired'}
  /auth/passkey/begin:
    post:
      tags: [Sign-in]
      operationId: beginPasskeySignIn
      summary: Start a passkey sign-in
      security: []
      responses:
        '200': {$ref: '#/components/responses/Ceremony'}
        '403': {$ref: '#/components/responses/CrossSite'}
  /auth/passkey/finish:
    post:
      tags: [Sign-in]
      operationId: finishPasskeySignIn
      summary: Complete a passkey sign-in
      description: Sets the `halo_session` cookie on success.
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [ceremony, credential]
              properties:
                ceremony: {type: string, description: The ceremony id from the begin step.}
                credential: {type: object, description: 'The browser''s PublicKeyCredential response, as JSON.'}
                authRequest: {$ref: '#/components/schemas/AuthRequestId'}
      responses:
        '200': {$ref: '#/components/responses/SignedIn'}
        '400': {$ref: '#/components/responses/BadJSON'}
        '401':
          description: '`ERR_PASSKEY_REJECTED`: the prompt expired, the passkey is not registered, its signature did not verify, or its counter went backwards.'
          content:
            application/json:
              schema: {$ref: '#/components/schemas/Error'}
        '403': {$ref: '#/components/responses/SignInRefused'}
        '404': {$ref: '#/components/responses/AuthRequestExpired'}
  /auth/identify:
    post:
      tags: [Sign-in]
      operationId: identify
      summary: List the methods to offer for an email address
      description: Answers `["passkey", "totp"]` for addresses without an account, so the response does not reveal whether an account exists. For an address at a domain that an identity provider takes straight to it, answers no methods and that provider, the same for every address at the domain.
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [email]
              properties:
                email: {type: string, format: email}
      responses:
        '200':
          description: The methods the person has, out of access-pass, passkey, security-key, totp, password and recovery-codes. `access-pass` comes first while an administrator's temporary access pass is active. A password is listed only when the person may sign in with one.
          content:
            application/json:
              schema:
                type: object
                required: [methods]
                properties:
                  methods:
                    type: array
                    items: {type: string, enum: [access-pass, passkey, security-key, totp, password, recovery-codes]}
                  provider:
                    $ref: '#/components/schemas/SignInProvider'
                    description: The identity provider to send the person to. Present only when the address's domain is routed.
        '400': {$ref: '#/components/responses/BadJSON'}
  /auth/totp:
    post:
      tags: [Sign-in]
      operationId: signInWithTOTP
      summary: Sign in with an authenticator code
      security: []
      requestBody: {$ref: '#/components/requestBodies/CodeSignIn'}
      responses:
        '200': {$ref: '#/components/responses/SignedIn'}
        '400': {$ref: '#/components/responses/BadJSON'}
        '401': {$ref: '#/components/responses/CodeMismatch'}
        '403': {$ref: '#/components/responses/SignInRefused'}
        '404': {$ref: '#/components/responses/AuthRequestExpired'}
        '429': {$ref: '#/components/responses/TooManyAttempts'}
        '503': {$ref: '#/components/responses/ChallengeUnavailable'}
  /auth/recovery:
    post:
      tags: [Sign-in]
      operationId: signInWithRecoveryCode
      summary: Sign in with a recovery code
      description: Uses up the code. Case, dashes and spaces are ignored.
      security: []
      requestBody: {$ref: '#/components/requestBodies/CodeSignIn'}
      responses:
        '200': {$ref: '#/components/responses/SignedIn'}
        '400': {$ref: '#/components/responses/BadJSON'}
        '401': {$ref: '#/components/responses/CodeMismatch'}
        '403': {$ref: '#/components/responses/SignInRefused'}
        '404': {$ref: '#/components/responses/AuthRequestExpired'}
        '429': {$ref: '#/components/responses/TooManyAttempts'}
        '503': {$ref: '#/components/responses/ChallengeUnavailable'}
  /auth/access-pass:
    post:
      tags: [Sign-in]
      operationId: signInWithAccessPass
      summary: Use a temporary access pass to set up a passkey
      description: Send the pass an administrator created as `code`; case, dashes and spaces are ignored. Each request uses up one of the pass's uses. The pass doesn't start a session or complete `authRequest`, which is ignored. Instead `redirect` is a setup link that expires in 15 minutes, where the person creates a passkey and is then signed in with it. Access policies, the sign-in log and the lockout shared with `/auth/password`, `/auth/totp`, `/auth/recovery` and `/auth/magic-link/code` apply. A policy that requires a passkey or security key allows the pass, because the session that follows starts with the new passkey.
      security: []
      requestBody: {$ref: '#/components/requestBodies/CodeSignIn'}
      responses:
        '200':
          description: The pass matched.
          content:
            application/json:
              schema:
                type: object
                required: [redirect]
                properties:
                  redirect: {type: string, examples: ['/enroll?token=…']}
        '400': {$ref: '#/components/responses/BadJSON'}
        '401': {$ref: '#/components/responses/CodeMismatch'}
        '403': {$ref: '#/components/responses/SignInRefused'}
        '429': {$ref: '#/components/responses/TooManyAttempts'}
        '503': {$ref: '#/components/responses/ChallengeUnavailable'}
  /auth/certificate:
    post:
      tags: [Sign-in]
      operationId: signInWithCertificate
      summary: Sign in with a client certificate
      description: 'Works while client certificates are turned on under `/methods`. Halo doesn''t terminate TLS, so the reverse proxy asks the browser for a certificate, checks it, and passes it in the header that `HALO_CLIENT_CERT_HEADER` names, such as `Client-Cert`: base64 DER between colons as in RFC 9440, or URL-escaped PEM such as nginx''s `$ssl_client_escaped_cert`. Halo reads no certificates while `HALO_CLIENT_CERT_HEADER` is unset, and reads the header only from addresses in `HALO_TRUSTED_PROXIES`, so the proxy must replace that header when the browser sends it. The certificate must be valid now, allow client authentication and chain to a certificate authority under `/certificate-authorities`, whose `mapping` picks the field matched to a person''s email address. When the certificate names an OCSP responder or a CRL distribution point, Halo asks the first one over HTTP and refuses revoked certificates. It refuses the sign-in when it can''t get a current, signed answer, or when the certificate names only responders and CRLs it can''t reach over HTTP, such as LDAP. Sets the `halo_session` cookie on success. Access policies and the sign-in log apply.'
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                authRequest: {$ref: '#/components/schemas/AuthRequestId'}
      responses:
        '200': {$ref: '#/components/responses/SignedIn'}
        '400': {$ref: '#/components/responses/BadJSON'}
        '401':
          description: '`ERR_CERTIFICATE_MISSING`: `HALO_CLIENT_CERT_HEADER` is unset, or no certificate came from a trusted proxy. `ERR_CERTIFICATE_REJECTED`: the certificate could not be read, expired, was revoked, isn''t from a trusted certificate authority, or matches no person. The sign-in log records the reason.'
          content:
            application/json:
              schema: {$ref: '#/components/schemas/Error'}
        '403': {$ref: '#/components/responses/SignInRefused'}
        '404': {$ref: '#/components/responses/AuthRequestExpired'}
        '503':
          description: '`ERR_REVOCATION_UNAVAILABLE`: the OCSP responder or CRL named in the certificate did not give a valid, current answer.'
          content:
            application/json:
              schema: {$ref: '#/components/schemas/Error'}
  /auth/kerberos:
    post:
      tags: [Sign-in]
      operationId: signInWithKerberos
      summary: Sign in with Windows (Kerberos)
      description: 'Works while Windows sign-in is turned on under `/methods`, set up under `/kerberos`, and the `kerberos` feature is on. Implements SPNEGO HTTP authentication (RFC 4559): without an `Authorization: Negotiate` header Halo answers `401` with `WWW-Authenticate: Negotiate`, and a browser on a computer joined to the domain sends the request again with a Kerberos ticket for Halo''s service principal. Halo decrypts the ticket with the uploaded keytab, checks its lifetime and the authenticator time with 5 minutes of clock skew, refuses an authenticator it already accepted on any instance, and refuses NTLM. The ticket''s client principal must be a single name in one of the configured realms. A principal linked to a person signs that person in; otherwise `name@REALM` becomes `name@<domain>` for that realm''s email domain, and the person with that email address signs in and the principal is linked to them. Halo never matches by display name or PAC. Sets the `halo_session` cookie on success. The account status, group assignment, access policies, risk, lockout and the sign-in log apply, and an application can turn Windows sign-in off with `kerberosSignIn`.'
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                authRequest: {$ref: '#/components/schemas/AuthRequestId'}
                automatic: {type: boolean, description: 'Set by the sign-in page when it tries Windows sign-in without a click. Halo answers `204` without a challenge unless the client address is in one of the trusted network zones in `zoneIds` and the application allows Windows sign-in, so browsers elsewhere never see a challenge.'}
      responses:
        '200': {$ref: '#/components/responses/SignedIn'}
        '204':
          description: An automatic attempt from outside the configured network zones, or for an application with Windows sign-in turned off. Halo did not ask for a ticket.
        '400': {$ref: '#/components/responses/BadJSON'}
        '401':
          description: '`ERR_KERBEROS_NO_TICKET` with `WWW-Authenticate: Negotiate`: send the request again with a ticket. A browser that can''t get one passes this response to the page.'
          headers:
            WWW-Authenticate:
              schema: {type: string, const: Negotiate}
          content:
            application/json:
              schema: {$ref: '#/components/schemas/Error'}
        '403':
          description: '`ERR_KERBEROS_REJECTED`: the token isn''t a Kerberos ticket for Halo''s service principal, can''t be decrypted with the keytab, expired, came from a clock more than 5 minutes off, replays an authenticator, or names a principal that matches no person. Also the refusals in `SignInRefused`. The sign-in log records the reason.'
          content:
            application/json:
              schema: {$ref: '#/components/schemas/Error'}
        '404':
          description: '`ERR_KERBEROS_UNAVAILABLE`: Windows sign-in is turned off or not set up. Also `ERR_AUTH_REQUEST_EXPIRED`.'
          content:
            application/json:
              schema: {$ref: '#/components/schemas/Error'}
        '429': {$ref: '#/components/responses/TooManyAttempts'}
  /auth/password:
    post:
      tags: [Sign-in]
      operationId: signInWithPassword
      summary: Sign in with a password
      description: Works only while passwords are turned on under `/methods` and, when `passwordGroupIds` is set, for members of those groups. When `passwordSecondFactor` is on, send the code from the person's authenticator app as `code`. A temporary password set by an administrator must be replaced by sending `newPassword`. Every request checks the password again, and failed passwords and codes count toward the lockout shared with `/auth/totp`, `/auth/recovery`, `/auth/magic-link/code` and `/auth/access-pass`. Passwords from a client IP address are also refused with `ERR_TOO_MANY_ATTEMPTS` once it has 4 times the lockout threshold of failed passwords within the lockout window, across all accounts.
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [email, password]
              properties:
                email: {type: string, format: email}
                password: {type: string}
                code: {type: string, description: The current code from the person's authenticator app.}
                newPassword: {type: string, minLength: 15, maxLength: 256, description: Replaces a temporary password.}
                authRequest: {$ref: '#/components/schemas/AuthRequestId'}
                challenge: {$ref: '#/components/schemas/ChallengeToken'}
      responses:
        '200': {$ref: '#/components/responses/SignedIn'}
        '400': {$ref: '#/components/responses/BadJSON'}
        '401':
          description: '`ERR_PASSWORD_MISMATCH`: the email and password don''t match, passwords are turned off, or the person may not use one. `ERR_SECOND_FACTOR_REQUIRED`: the password was right; send it again with `code`. `ERR_CODE_MISMATCH`: the code did not match or was already used. `ERR_PASSWORD_CHANGE_REQUIRED`: the password is temporary; send it again with `newPassword`.'
          content:
            application/json:
              schema: {$ref: '#/components/schemas/Error'}
        '403':
          description: '`ERR_SECOND_FACTOR_MISSING`: a second factor is required and the account has no authenticator app. Also `ERR_ACCOUNT_SUSPENDED`, `ERR_NOT_ASSIGNED`, `ERR_BLOCKED_BY_POLICY`, `ERR_BLOCKED_BY_HOOK`, `ERR_STRONGER_AUTH_REQUIRED`, `ERR_STEP_UP_REQUIRED`, `ERR_SESSION_LIMIT`, `ERR_CHALLENGE_REQUIRED`, `ERR_CHALLENGE_FAILED` and `ERR_CROSS_SITE`, as for other sign-in methods.'
          content:
            application/json:
              schema: {$ref: '#/components/schemas/Error'}
        '404': {$ref: '#/components/responses/AuthRequestExpired'}
        '422': {$ref: '#/components/responses/Invalid'}
        '429': {$ref: '#/components/responses/TooManyAttempts'}
        '503': {$ref: '#/components/responses/ChallengeUnavailable'}
  /auth/magic-link:
    post:
      tags: [Sign-in]
      operationId: requestMagicLink
      summary: Email a sign-in link or code
      description: Emails a link, a six-digit code for `/auth/magic-link/code`, or both, as `emailSignIn` in the settings chooses. Each works once for 10 minutes, and emails are sent to active accounts only, at most 5 times per person in 15 minutes, and only while magic links are turned on under `/methods`. Answers `202` the same way whether or not the account exists or magic links are on. While `botProtection` is on, every request needs `challenge`.
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [email]
              properties:
                email: {type: string, format: email}
                authRequest: {$ref: '#/components/schemas/AuthRequestId'}
                challenge: {$ref: '#/components/schemas/ChallengeToken'}
      responses:
        '202':
          description: Accepted. The body is an empty object.
          content:
            application/json:
              schema: {type: object}
        '400': {$ref: '#/components/responses/BadJSON'}
        '403': {$ref: '#/components/responses/ChallengeRefused'}
        '404': {$ref: '#/components/responses/AuthRequestExpired'}
        '503': {$ref: '#/components/responses/ChallengeUnavailable'}
  /auth/magic-link/redeem:
    post:
      tags: [Sign-in]
      operationId: redeemMagicLink
      summary: Sign in with an emailed link
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [token]
              properties:
                token: {type: string, description: The token query parameter of the link.}
      responses:
        '200': {$ref: '#/components/responses/SignedIn'}
        '400': {$ref: '#/components/responses/BadJSON'}
        '403': {$ref: '#/components/responses/SignInRefused'}
        '404':
          description: '`ERR_LINK_EXPIRED`: the link expired or was already used. `ERR_AUTH_REQUEST_EXPIRED`: the application''s sign-in request expired.'
          content:
            application/json:
              schema: {$ref: '#/components/schemas/Error'}
  /auth/magic-link/code:
    post:
      tags: [Sign-in]
      operationId: signInWithEmailCode
      summary: Sign in with an emailed code
      description: Checks the code from the newest email that `/auth/magic-link` sent to the person. Each code allows 5 attempts, and failed codes count toward the lockout shared with `/auth/password`, `/auth/totp`, `/auth/recovery` and `/auth/access-pass`. A sign-in for an application completes `authRequest`, so enter the code in the browser that asked for it.
      security: []
      requestBody: {$ref: '#/components/requestBodies/CodeSignIn'}
      responses:
        '200': {$ref: '#/components/responses/SignedIn'}
        '400': {$ref: '#/components/responses/BadJSON'}
        '401':
          description: '`ERR_CODE_MISMATCH`: the code did not match, expired, was already used or had 5 wrong attempts, or no account uses the address.'
          content:
            application/json:
              schema: {$ref: '#/components/schemas/Error'}
        '403': {$ref: '#/components/responses/SignInRefused'}
        '404': {$ref: '#/components/responses/AuthRequestExpired'}
        '429': {$ref: '#/components/responses/TooManyAttempts'}
        '503': {$ref: '#/components/responses/ChallengeUnavailable'}
  /auth/continue:
    post:
      tags: [Sign-in]
      operationId: continueAuthRequest
      summary: Continue an application's sign-in request with the current session
      security:
        - session: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [authRequest]
              properties:
                authRequest: {$ref: '#/components/schemas/AuthRequestId'}
      responses:
        '200': {$ref: '#/components/responses/SignedIn'}
        '400': {$ref: '#/components/responses/BadJSON'}
        '401':
          description: '`ERR_UNAUTHENTICATED`: no session. `ERR_REAUTH_REQUIRED`: the application sent `prompt=login`, or the session is older than the request''s `max_age` or the application''s `maxAuthAge` allows.'
          content:
            application/json:
              schema: {$ref: '#/components/schemas/Error'}
        '403':
          description: '`ERR_STEP_UP_REQUIRED`: the session does not meet an authentication context the application asked for or a policy requires; sign in again with a method `message` names. Not recorded as a failed sign-in. Otherwise as for other sign-in routes: see `SignInRefused`.'
          content:
            application/json:
              schema: {$ref: '#/components/schemas/Error'}
        '404': {$ref: '#/components/responses/AuthRequestExpired'}
        '422': {$ref: '#/components/responses/Invalid'}
  /auth/terms/{ceremony}:
    get:
      tags: [Sign-in]
      operationId: getTermsToAccept
      summary: Read the terms of use a sign-in waits on
      security: []
      parameters:
        - {name: ceremony, in: path, required: true, schema: {type: string}, description: The `terms` value of a sign-in response.}
      responses:
        '200':
          description: The documents and the versions to accept.
          content:
            application/json:
              schema:
                type: object
                required: [terms]
                properties:
                  terms:
                    type: array
                    items: {$ref: '#/components/schemas/Terms'}
        '404': {$ref: '#/components/responses/TermsExpired'}
  /auth/terms:
    post:
      tags: [Sign-in]
      operationId: acceptTermsAndSignIn
      summary: Accept the terms of use a sign-in waits on, then finish signing in
      description: Records the acceptance of the versions shown, then checks the sign-in again and finishes it. A ceremony from an existing session only works with that same session.
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [ceremony]
              properties:
                ceremony: {type: string}
      responses:
        '200': {$ref: '#/components/responses/SignedIn'}
        '400': {$ref: '#/components/responses/BadJSON'}
        '403': {$ref: '#/components/responses/SignInRefused'}
        '404': {$ref: '#/components/responses/TermsExpired'}
  /auth/consent/{id}:
    parameters:
      - {$ref: '#/components/parameters/Id'}
    get:
      tags: [Sign-in]
      operationId: getConsentRequest
      summary: Read what an application asks a person to allow
      description: 'The sign-in page shows this at `/sign-in?consent={id}` when the authorization callback finds the application needs consent: it has `requiresConsent` and the person has not allowed every requested scope yet, or it sent `prompt=consent`. Only the session that completed the sign-in request can read it, until a decision is taken.'
      security:
        - session: []
      responses:
        '200':
          description: The application, the person signing in, and the requested scopes with the description of each API resource scope.
          content:
            application/json:
              schema:
                type: object
                required: [application, email, scopes]
                properties:
                  application:
                    type: object
                    required: [name, homepage, logoUrl]
                    properties:
                      name: {type: string}
                      homepage: {type: string}
                      logoUrl: {type: [string, 'null']}
                  email: {type: string}
                  scopes:
                    type: array
                    items: {$ref: '#/components/schemas/ConsentScope'}
        '401': {$ref: '#/components/responses/Unauthenticated'}
        '404': {$ref: '#/components/responses/AuthRequestExpired'}
  /auth/consent:
    post:
      tags: [Sign-in]
      operationId: decideConsent
      summary: Allow or decline what an application asks for
      description: 'Allowing remembers the scopes for the person and application, adding to any allowed before, and records `consent.grant`. Declining writes an `interrupted` event to the sign-in log, and the callback then returns `error=access_denied` to the application. A sign-in request takes one decision, from the session that completed it.'
      security:
        - session: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [authRequest, allow]
              properties:
                authRequest: {type: string}
                allow: {type: boolean}
      responses:
        '200':
          description: Continue at the authorization callback.
          content:
            application/json:
              schema:
                type: object
                required: [redirect]
                properties:
                  redirect: {type: string, examples: ['/oauth2/authorize/callback?id=…']}
        '400': {$ref: '#/components/responses/BadJSON'}
        '401': {$ref: '#/components/responses/Unauthenticated'}
        '403': {$ref: '#/components/responses/CrossSite'}
        '404': {$ref: '#/components/responses/AuthRequestExpired'}
  /auth/enroll:
    get:
      tags: [Sign-in]
      operationId: getEnrollment
      summary: Get the person a setup link belongs to
      security: []
      parameters:
        - name: token
          in: query
          required: true
          schema: {type: string}
      responses:
        '200':
          description: The person and the link's purpose.
          content:
            application/json:
              schema:
                type: object
                required: [user, purpose]
                properties:
                  user:
                    type: object
                    required: [name, email]
                    properties:
                      name: {type: string}
                      email: {type: string}
                  purpose: {type: string, enum: [invite, reset, access-pass], description: '`access-pass` for a link from `/auth/access-pass`.'}
                  identityProof: {$ref: '#/components/schemas/IdentityProofState'}
        '403': {$ref: '#/components/responses/Suspended'}
        '404': {$ref: '#/components/responses/LinkExpired'}
  /auth/enroll/begin:
    post:
      tags: [Sign-in]
      operationId: beginEnrollment
      summary: Start registering the first passkey or security key
      description: 'Refused with `403 ERR_IDENTITY_CHECK_REQUIRED` while the person is invited, `identityProofingInvites` applies to them and they have no successful identity check.'
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [token]
              properties:
                token: {type: string}
      responses:
        '200': {$ref: '#/components/responses/Ceremony'}
        '400': {$ref: '#/components/responses/BadJSON'}
        '403': {$ref: '#/components/responses/SignInRefused'}
        '404': {$ref: '#/components/responses/LinkExpired'}
  /auth/enroll/identity-proof:
    post:
      tags: [Sign-in]
      operationId: startEnrollmentIdentityProof
      summary: Start an identity check with the verification provider
      description: 'Works while the person is invited, `identityProofingInvites` applies to them and they have no successful check yet. Halo creates a verification session at the provider set in `identityProofingProvider` and answers with the address to send the person to; the provider sends them back to `/enroll?proofing=done`, without the setup link''s token. The result arrives by `POST /identity-proofing/webhook` or when Halo asks the provider, on `GET /auth/enroll` and every 10 minutes for 2 days. Halo stores only the provider''s session id, the result and the dates, never what the person showed the provider. At most 5 checks per person an hour. Recorded as `user.identity_proof.start`.'
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [token]
              properties:
                token: {type: string}
      responses:
        '200': {$ref: '#/components/responses/IdentityProofStarted'}
        '400': {$ref: '#/components/responses/BadJSON'}
        '403': {$ref: '#/components/responses/Suspended'}
        '404': {$ref: '#/components/responses/LinkExpired'}
        '409':
          description: '`ERR_NO_IDENTITY_PROVIDER`: no provider is connected, so an administrator checks identities in person. `ERR_CONFLICT`: the link needs no check, or the person already has a successful one.'
          content:
            application/json:
              schema: {$ref: '#/components/schemas/Error'}
        '429': {$ref: '#/components/responses/IdentityProofLimit'}
        '502': {$ref: '#/components/responses/IdentityProviderUnavailable'}
  /auth/enroll/finish:
    post:
      tags: [Sign-in]
      operationId: finishEnrollment
      summary: Save the first credential and sign in
      description: Uses up the link in the same transaction that saves the credential, and sets the `halo_session` cookie. A key that breaks the passkey rules of one of the person's groups is refused with `403 ERR_AUTHENTICATOR_NOT_ALLOWED`, and the link stays usable.
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [token, ceremony, credential]
              properties:
                token: {type: string}
                ceremony: {type: string}
                credential: {type: object, description: 'The browser''s PublicKeyCredential creation response, as JSON.'}
                label: {type: string, description: 'Defaults to the kind, browser and operating system, such as "Passkey · Chrome on macOS".'}
      responses:
        '200': {$ref: '#/components/responses/SignedIn'}
        '400': {$ref: '#/components/responses/RegistrationFailed'}
        '403': {$ref: '#/components/responses/SignInRefused'}
        '404': {$ref: '#/components/responses/LinkExpired'}
        '503': {$ref: '#/components/responses/MetadataUnavailable'}
  /auth/sign-up:
    post:
      tags: [Sign-in]
      operationId: signUp
      summary: Sign up with an email address
      description: 'Works while `signUp` in the settings is `open` or `approval`, for addresses at a domain in `signUpDomains`, or at a verified domain when that list is empty. Emails a link that works once for 24 hours, at most 3 times per address an hour; the person opens it to confirm the address and create a passkey with `/auth/sign-up/begin` and `/auth/sign-up/finish`. Answers `202` the same way whether or not the address already has an account, and sends nothing when it has. At most 10 requests per client IP address an hour. While `botProtection` is on, every request needs `challenge`. No account exists until the person finishes; nothing is recorded before that.'
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [email, name]
              properties:
                email: {type: string, format: email, maxLength: 254}
                name: {type: string, maxLength: 200}
                challenge: {$ref: '#/components/schemas/ChallengeToken'}
      responses:
        '202':
          description: Accepted. The body is an empty object.
          content:
            application/json:
              schema: {type: object}
        '400': {$ref: '#/components/responses/BadJSON'}
        '403': {$ref: '#/components/responses/SignUpRefused'}
        '404': {$ref: '#/components/responses/SignUpOff'}
        '422': {$ref: '#/components/responses/Invalid'}
        '429':
          description: '`ERR_RATE_LIMITED`: more than 10 sign-ups from this client IP address within the hour, with `Retry-After` in seconds.'
          content:
            application/json:
              schema: {$ref: '#/components/schemas/Error'}
        '503': {$ref: '#/components/responses/ChallengeUnavailable'}
    get:
      tags: [Sign-in]
      operationId: getSignUp
      summary: Get the name and address a sign-up link belongs to
      security: []
      parameters:
        - name: token
          in: query
          required: true
          schema: {type: string}
      responses:
        '200':
          description: The name and address, in the shape of `/auth/enroll`.
          content:
            application/json:
              schema:
                type: object
                required: [user, purpose]
                properties:
                  user:
                    type: object
                    required: [name, email]
                    properties:
                      name: {type: string}
                      email: {type: string}
                  purpose: {type: string, enum: [sign-up]}
                  identityProof: {$ref: '#/components/schemas/IdentityProofState'}
        '403': {$ref: '#/components/responses/SignUpRefused'}
        '404': {$ref: '#/components/responses/SignUpOff'}
  /auth/sign-up/begin:
    post:
      tags: [Sign-in]
      operationId: beginSignUp
      summary: Start creating the passkey for a sign-up
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [token]
              properties:
                token: {type: string}
      responses:
        '200': {$ref: '#/components/responses/Ceremony'}
        '400': {$ref: '#/components/responses/BadJSON'}
        '403': {$ref: '#/components/responses/SignUpRefused'}
        '404': {$ref: '#/components/responses/SignUpOff'}
  /auth/sign-up/identity-proof:
    post:
      tags: [Sign-in]
      operationId: startSignUpIdentityProof
      summary: Start an identity check for a sign-up
      description: 'Works like `/auth/enroll/identity-proof` while `identityProofingSignUps` applies to the groups in `signUpGroupIds`. The provider sends the person back to `/sign-up?proofing=done`. Asking `/auth/sign-up` for a new link under another name deletes the checks of the unconfirmed sign-up.'
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [token]
              properties:
                token: {type: string}
      responses:
        '200': {$ref: '#/components/responses/IdentityProofStarted'}
        '400': {$ref: '#/components/responses/BadJSON'}
        '403': {$ref: '#/components/responses/SignUpRefused'}
        '404': {$ref: '#/components/responses/SignUpOff'}
        '409':
          description: '`ERR_NO_IDENTITY_PROVIDER` or `ERR_CONFLICT`, as for `/auth/enroll/identity-proof`.'
          content:
            application/json:
              schema: {$ref: '#/components/schemas/Error'}
        '429': {$ref: '#/components/responses/IdentityProofLimit'}
        '502': {$ref: '#/components/responses/IdentityProviderUnavailable'}
  /auth/sign-up/finish:
    post:
      tags: [Sign-in]
      operationId: finishSignUp
      summary: Save the passkey and confirm the email address
      description: 'Uses up the link in the same transaction that confirms the address and keeps the passkey, and records `user.sign_up` in the audit log. When `signUp` is `open`, creates an active account with a confirmed address, adds it to the assigned groups in `signUpGroupIds` and no others, gives it no roles, and signs in like `/auth/enroll/finish`. When it is `approval`, no account or session exists yet: the sign-up waits under `/sign-ups` and the response is `{"pending": true}`. The passkey rules of the groups in `signUpGroupIds` apply, and a key that breaks them is refused with `403 ERR_AUTHENTICATOR_NOT_ALLOWED`. While `identityProofingSignUps` applies and the sign-up has no successful identity check, no account is created even when `signUp` is `open`: the sign-up waits under `/sign-ups` for an in-person check and the response is `{"pending": true, "identityCheck": true}`.'
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [token, ceremony, credential]
              properties:
                token: {type: string}
                ceremony: {type: string}
                credential: {type: object, description: 'The browser''s PublicKeyCredential creation response, as JSON.'}
                label: {type: string, description: 'Defaults to the kind, browser and operating system, such as "Passkey · Chrome on macOS".'}
      responses:
        '200':
          description: 'Signed in, as with `SignedIn`, or `{"pending": true}` while an administrator has to approve the sign-up.'
          content:
            application/json:
              schema:
                type: object
                properties:
                  redirect: {type: string}
                  terms: {type: string}
                  pending: {type: boolean}
                  identityCheck: {type: boolean, description: The sign-up waits for an identity check rather than for approval.}
        '400': {$ref: '#/components/responses/RegistrationFailed'}
        '403': {$ref: '#/components/responses/SignUpRefused'}
        '404': {$ref: '#/components/responses/SignUpOff'}
        '503': {$ref: '#/components/responses/MetadataUnavailable'}
        '409':
          description: '`ERR_ACCOUNT_EXISTS`: an account with the address was created after the sign-up started.'
          content:
            application/json:
              schema: {$ref: '#/components/schemas/Error'}
  /auth/sign-out:
    post:
      tags: [Sign-in]
      operationId: signOut
      summary: End the current session
      description: Ends the session, if there is one, and clears the cookie.
      security: []
      responses:
        '204': {$ref: '#/components/responses/NoContent'}
        '403': {$ref: '#/components/responses/CrossSite'}
  /auth/federated/{id}/start:
    parameters:
      - {$ref: '#/components/parameters/Id'}
    get:
      tags: [Sign-in]
      operationId: startFederatedSignIn
      summary: Redirect to an identity provider
      description: A browser navigation, not a JSON call. For a SAML provider Halo sends an AuthnRequest signed with its SAML certificate, with the HTTP-Redirect binding, or with the HTTP-POST binding as a page that submits itself when the provider only offers that. On failure Halo redirects to `/sign-in?error=CODE` with `ERR_PROVIDER_UNAVAILABLE`, `ERR_PROVIDER_UNREACHABLE` or `ERR_AUTH_REQUEST_EXPIRED`.
      security: []
      parameters:
        - name: authRequest
          in: query
          schema: {$ref: '#/components/schemas/AuthRequestId'}
        - name: next
          in: query
          description: A local path to open after signing in, when there is no `authRequest`.
          schema: {type: string, examples: [/account/security]}
      responses:
        '200':
          description: A page that posts the SAML AuthnRequest to the provider, for SAML providers that only offer the HTTP-POST binding.
          content:
            text/html:
              schema: {type: string}
        '302':
          description: Redirect to the provider's authorization or single sign-on endpoint, or to the sign-in page with an error.
  /auth/federated/callback:
    get:
      tags: [Sign-in]
      operationId: federatedCallback
      summary: Receive the identity provider's response
      description: The redirect URI to register at the provider. On success Halo sets the `halo_session` cookie and redirects to the application, `next` or `/account`. On failure it redirects to `/sign-in?error=CODE` with `ERR_FEDERATION_STATE`, `ERR_PROVIDER_UNAVAILABLE`, `ERR_FEDERATION_CANCELLED`, `ERR_FEDERATION_FAILED`, `ERR_FEDERATION_EMAIL`, `ERR_FEDERATION_DOMAIN`, `ERR_FEDERATION_NO_ACCOUNT`, or one of the codes that refuse any sign-in.
      security: []
      parameters:
        - {name: state, in: query, schema: {type: string}}
        - {name: code, in: query, schema: {type: string}}
        - {name: error, in: query, schema: {type: string}}
      responses:
        '302':
          description: Redirect after the sign-in or its failure.
  /auth/federated/{id}/acs:
    parameters:
      - {$ref: '#/components/parameters/Id'}
    post:
      tags: [Sign-in]
      operationId: samlAssertionConsumer
      summary: Receive a SAML response
      description: 'The page at `/saml/sp/{id}/acs` posts the identity provider''s response here from Halo''s own origin, so the browser sends the cookie of the sign-in it started. The response must answer the AuthnRequest of that sign-in, come from the provider''s entity ID, carry a valid signature from a signing certificate in its metadata on the response or on the assertion, name Halo''s entity ID for the provider as its audience and the ACS URL as its recipient, and as its destination when the response is signed or names one, be inside its validity window with three minutes of clock skew, and use an assertion ID that was not used before. The email address is the NameID, or the attribute in `emailAttribute`. Success and failure redirect as in `/auth/federated/callback`.'
      security: []
      requestBody:
        required: true
        content:
          application/x-www-form-urlencoded:
            schema:
              type: object
              required: [SAMLResponse, RelayState]
              properties:
                SAMLResponse: {type: string, description: The base64-encoded SAML response.}
                RelayState: {type: string}
      responses:
        '302':
          description: Redirect after the sign-in or its failure.
        '403': {$ref: '#/components/responses/CrossSite'}
  /forward-auth/{id}/verify:
    servers:
      - url: /
    parameters:
      - {$ref: '#/components/parameters/Id'}
      - {name: nginx, in: query, description: 'Present for nginx `auth_request`, which only accepts 2xx, 401 and 403: every redirect becomes a 401 with the same `Location` and `Set-Cookie`.', schema: {type: string}, allowEmptyValue: true}
      - {name: X-Forwarded-Uri, in: header, required: true, description: 'The path and query of the original request. Read only from addresses in `HALO_TRUSTED_PROXIES`.', schema: {type: string}}
      - {name: X-Forwarded-Host, in: header, description: 'The host of the original request, one of the protected addresses. Read only from addresses in `HALO_TRUSTED_PROXIES`. An application with one protected address uses it when the header names another host.', schema: {type: string}}
    get:
      tags: [Forward auth]
      operationId: verifyForwardAuth
      summary: Check a request to a forward-auth application
      description: 'The proxy calls this with the cookies of the original request. Identity comes only from the `__Host-halo_{id}` cookie on the protected address, which belongs to a Halo session: ending, revoking or limiting that session, suspending the person, removing them from the application or disabling it takes effect on the next request, and the cookie lasts at most an hour before Halo checks the access policies again. `/_halo/callback` on a protected address trades a one-time code for that cookie, only in the browser that started the sign-in, and `/_halo/sign-out` removes it and sends the person to the Halo sign-out page. Checks are not written to the sign-in log; the sign-in at `/forward-auth/{id}/start` is.'
      security: []
      responses:
        '200':
          description: 'Let the request through. Every header of the application''s `claims` is set, empty when the person has no value. List values, such as group names, are joined by commas, with any comma inside one of them sent as a space, and control characters are removed.'
          headers:
            X-Halo-User: {description: The person's id, unless the claim mappings change it., schema: {type: string}}
            X-Halo-Email: {schema: {type: string}}
            X-Halo-Name: {schema: {type: string}}
            X-Halo-Groups: {description: The names of the person's groups., schema: {type: string}}
            X-Halo-Roles: {description: The keys of the application roles the person holds. Only when the application has roles., schema: {type: string}}
        '302':
          description: 'Not signed in, signed in longer ago than the sign-in frequency allows, or a callback or sign-out. Unauthenticated requests go to `/forward-auth/{id}/start` with a state cookie for the protected address.'
        '401':
          description: The same as 302 when `nginx` is present.
        '403':
          description: The person isn't assigned or the application is disabled, the callback code is expired, used or from another browser, or the request didn't come from a trusted proxy with an address of the application.
          content:
            text/plain:
              schema: {type: string}
        '404':
          description: No forward-auth application has this id.
  /forward-auth/{id}/start:
    servers:
      - url: /
    parameters:
      - {$ref: '#/components/parameters/Id'}
      - {name: rd, in: query, required: true, description: 'The address to return to. Its scheme and host must match a protected address exactly, ignoring case; Halo rebuilds it from that address and the path and query.', schema: {type: string, format: uri}}
      - {name: state, in: query, required: true, description: The value of the state cookie the check set on the protected address., schema: {type: string}}
    get:
      tags: [Forward auth]
      operationId: startForwardAuth
      summary: Sign in to a forward-auth application
      description: 'Halo''s own origin, with the Halo session. Like a SAML sign-in, it checks that the application is active and assigned to the person, the sign-in frequency, and the access policies, then writes the sign-in log and redirects to `/_halo/callback` on the protected address with a code that works once for one minute.'
      security: []
      responses:
        '303':
          description: To the callback, to `/sign-in` when there is no Halo session or it is older than the sign-in frequency, or to the terms of use.
        '400':
          description: The return address isn't a protected address of the application, or the state is missing.
        '403':
          description: Disabled, not assigned or blocked by an access policy. Recorded in the sign-in log.
  /saml/sp/{id}/metadata:
    servers:
      - url: /
    parameters:
      - {$ref: '#/components/parameters/Id'}
    get:
      tags: [Identity providers]
      operationId: getSAMLServiceProviderMetadata
      summary: Halo's service provider metadata for a SAML identity provider
      description: 'Register this URL, or the document, at the identity provider. The entity ID is this URL. It lists the ACS URL with the HTTP-POST binding and the current SAML signing certificate, and says that AuthnRequests are signed and assertions must be. After the SAML certificate is rotated, the identity provider needs the metadata again. Its `validUntil` is 48 hours ahead.'
      security: []
      responses:
        '200':
          description: The EntityDescriptor.
          content:
            application/samlmetadata+xml:
              schema: {type: string}
        '404':
          description: No SAML identity provider has this ID.
  /saml/sp/{id}/acs:
    servers:
      - url: /
    parameters:
      - {$ref: '#/components/parameters/Id'}
    post:
      tags: [Sign-in]
      operationId: samlServiceProviderACS
      summary: The ACS URL for a SAML identity provider
      description: Takes the cross-site HTTP-POST from the identity provider and answers with a page that posts the same fields to `/api/v1/auth/federated/{id}/acs`, where they are checked.
      security: []
      requestBody:
        required: true
        content:
          application/x-www-form-urlencoded:
            schema:
              type: object
              properties:
                SAMLResponse: {type: string}
                RelayState: {type: string}
      responses:
        '200':
          description: The page that posts the response on.
          content:
            text/html:
              schema: {type: string}
  /device/{code}:
    parameters:
      - {$ref: '#/components/parameters/DeviceCode'}
    get:
      tags: [Device sign-in]
      operationId: getDeviceAuthorization
      summary: Show a pending device sign-in
      security:
        - session: []
      responses:
        '200':
          description: The pending request.
          content:
            application/json:
              schema: {$ref: '#/components/schemas/DeviceAuthorization'}
        '401': {$ref: '#/components/responses/Unauthenticated'}
        '404': {$ref: '#/components/responses/DeviceCode'}
  /device/{code}/approve:
    parameters:
      - {$ref: '#/components/parameters/DeviceCode'}
    post:
      tags: [Device sign-in]
      operationId: approveDeviceAuthorization
      summary: Approve a device sign-in
      description: Checks application assignment, the access policies and, when `sessionLimitCli` is on, the session limit against the current session, records a sign-in event, and lets the waiting device collect its tokens.
      security:
        - session: []
      responses:
        '200': {$ref: '#/components/responses/DeviceDecision'}
        '401':
          description: '`ERR_UNAUTHENTICATED`: no session. `ERR_REAUTH_REQUIRED`: the session is older than the application''s `maxAuthAge` allows; sign in again, then approve.'
          content:
            application/json:
              schema: {$ref: '#/components/schemas/Error'}
        '403':
          description: '`ERR_NOT_ASSIGNED`, `ERR_BLOCKED_BY_POLICY`, `ERR_STRONGER_AUTH_REQUIRED`, `ERR_STEP_UP_REQUIRED` (a policy requires an authentication context the session does not meet), `ERR_SESSION_LIMIT`, `ERR_TERMS_REQUIRED` (accept the terms of use with `POST /me/terms/{id}/accept` first) or `ERR_CROSS_SITE`.'
          content:
            application/json:
              schema: {$ref: '#/components/schemas/Error'}
        '404': {$ref: '#/components/responses/DeviceCode'}
  /device/{code}/deny:
    parameters:
      - {$ref: '#/components/parameters/DeviceCode'}
    post:
      tags: [Device sign-in]
      operationId: denyDeviceAuthorization
      summary: Deny a device sign-in
      security:
        - session: []
      responses:
        '200': {$ref: '#/components/responses/DeviceDecision'}
        '401': {$ref: '#/components/responses/Unauthenticated'}
        '403': {$ref: '#/components/responses/CrossSite'}
        '404': {$ref: '#/components/responses/DeviceCode'}
  /me:
    get:
      tags: [Account]
      operationId: getMe
      summary: Get your profile, sign-in methods, roles, groups and applications
      security:
        - session: []
      responses:
        '200':
          description: You.
          content:
            application/json:
              schema:
                allOf:
                  - {$ref: '#/components/schemas/User'}
                  - type: object
                    properties:
                      impersonation: {$ref: '#/components/schemas/Impersonation', description: 'Present when the session is an impersonation: an administrator is viewing Halo as you.'}
        '401': {$ref: '#/components/responses/Unauthenticated'}
  /me/passkeys/begin:
    post:
      tags: [Account]
      operationId: beginAddPasskey
      summary: Start registering another passkey or security key
      description: Asks the authenticator for direct attestation when one of your groups needs it under `authenticatorRules`.
      security: &personal
        - session: []
        - cliAccessToken: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [kind]
              properties:
                kind: {type: string, enum: [passkey, security-key]}
      responses:
        '200': {$ref: '#/components/responses/Ceremony'}
        '400': {$ref: '#/components/responses/BadJSON'}
        '401': {$ref: '#/components/responses/ReauthRequired'}
        '403': {$ref: '#/components/responses/CrossSite'}
        '422': {$ref: '#/components/responses/Invalid'}
  /me/passkeys/finish:
    post:
      tags: [Account]
      operationId: finishAddPasskey
      summary: Save the new passkey or security key
      security: *personal
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [ceremony, credential]
              properties:
                ceremony: {type: string}
                credential: {type: object}
                label: {type: string}
      responses:
        '200':
          description: The new sign-in method.
          content:
            application/json:
              schema: {$ref: '#/components/schemas/Method'}
        '400': {$ref: '#/components/responses/RegistrationFailed'}
        '401': {$ref: '#/components/responses/Unauthenticated'}
        '403': {$ref: '#/components/responses/AuthenticatorRefused'}
        '503': {$ref: '#/components/responses/MetadataUnavailable'}
  /me/methods/{id}:
    parameters:
      - {$ref: '#/components/parameters/Id'}
    delete:
      tags: [Account]
      operationId: removeMyMethod
      summary: Remove one of your sign-in methods
      description: The id `recovery-codes` removes your recovery codes, and `password` your password.
      security: *personal
      responses:
        '204': {$ref: '#/components/responses/NoContent'}
        '401': {$ref: '#/components/responses/ReauthRequired'}
        '403': {$ref: '#/components/responses/CrossSite'}
        '404': {$ref: '#/components/responses/NotFound'}
        '409':
          description: '`ERR_LAST_METHOD`: it is your last way to sign in. Recovery codes do not count. `ERR_KEY_MINIMUM`: removing this passkey or security key would leave fewer keys that meet your groups'' passkey rules than the highest `minimum` among them.'
          content:
            application/json:
              schema: {$ref: '#/components/schemas/Error'}
  /me/avatar:
    put:
      tags: [Account]
      operationId: uploadMyAvatar
      summary: Set your profile picture
      description: Send the image bytes as the body, PNG, JPEG or WebP, at most 512 KB. Halo detects the type from the content. Applications that request the `profile` scope receive the picture's URL as the `picture` claim, and SAML assertions include it as a `picture` attribute.
      security: *personal
      requestBody:
        required: true
        content:
          image/png:
            schema: {type: string, contentMediaType: image/png}
          image/jpeg:
            schema: {type: string, contentMediaType: image/jpeg}
          image/webp:
            schema: {type: string, contentMediaType: image/webp}
      responses:
        '200':
          description: The picture URL, including a version so caches fetch the new image.
          content:
            application/json:
              schema:
                type: object
                required: [avatarUrl]
                properties:
                  avatarUrl: {type: string, examples: ['/api/v1/users/usr_01J9Z8Q4M2N5P7R9T1V3X5Z7B9/avatar?v=1790000000']}
        '401': {$ref: '#/components/responses/Unauthenticated'}
        '403': {$ref: '#/components/responses/CrossSite'}
        '413':
          description: '`ERR_TOO_LARGE`: the image is larger than 512 KB.'
          content:
            application/json:
              schema: {$ref: '#/components/schemas/Error'}
        '422': {$ref: '#/components/responses/Invalid'}
    delete:
      tags: [Account]
      operationId: removeMyAvatar
      summary: Remove your profile picture
      security: *personal
      responses:
        '200':
          description: The picture was removed.
          content:
            application/json:
              schema:
                type: object
                required: [avatarUrl]
                properties:
                  avatarUrl: {type: 'null'}
        '401': {$ref: '#/components/responses/Unauthenticated'}
        '403': {$ref: '#/components/responses/CrossSite'}
        '404': {$ref: '#/components/responses/NotFound'}
  /me/totp/begin:
    post:
      tags: [Account]
      operationId: beginTOTP
      summary: Start adding an authenticator app
      security: *personal
      responses:
        '200':
          description: The ceremony, the shared secret and an otpauth URI for a QR code.
          content:
            application/json:
              schema:
                type: object
                required: [ceremony, secret, uri]
                properties:
                  ceremony: {type: string}
                  secret: {type: string, description: Base32 secret.}
                  uri: {type: string, examples: ['otpauth://totp/Halo:sam@example.com?issuer=Halo&secret=…']}
        '401': {$ref: '#/components/responses/ReauthRequired'}
        '403': {$ref: '#/components/responses/CrossSite'}
  /me/totp/confirm:
    post:
      tags: [Account]
      operationId: confirmTOTP
      summary: Confirm the authenticator app with a current code
      security: *personal
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [ceremony, code]
              properties:
                ceremony: {type: string}
                code: {type: string, examples: ['123456']}
                label: {type: string, default: Authenticator app}
      responses:
        '200':
          description: The new sign-in method.
          content:
            application/json:
              schema: {$ref: '#/components/schemas/Method'}
        '400':
          description: '`ERR_CEREMONY_EXPIRED` or `ERR_INVALID_JSON`.'
          content:
            application/json:
              schema: {$ref: '#/components/schemas/Error'}
        '401':
          description: '`ERR_UNAUTHENTICATED`, or `ERR_CODE_MISMATCH` when the code did not match.'
          content:
            application/json:
              schema: {$ref: '#/components/schemas/Error'}
        '403': {$ref: '#/components/responses/CrossSite'}
  /me/recovery-codes:
    post:
      tags: [Account]
      operationId: createRecoveryCodes
      summary: Create new recovery codes
      description: Replaces every earlier code. Halo shows the codes only in this response.
      security: *personal
      responses:
        '200':
          description: The new codes.
          content:
            application/json:
              schema:
                type: object
                required: [codes]
                properties:
                  codes:
                    type: array
                    items: {type: string}
        '401': {$ref: '#/components/responses/ReauthRequired'}
        '403': {$ref: '#/components/responses/CrossSite'}
  /me/reauthenticate/begin:
    post:
      tags: [Account]
      operationId: beginReauthentication
      summary: Start confirming it's you before a sensitive change
      description: With a passkey or security key, answers `passkey` with a WebAuthn ceremony limited to your own credentials. Without one, answers `totp`; send a current authenticator app code to `/me/reauthenticate`.
      security:
        - session: []
      responses:
        '200':
          description: How to confirm.
          content:
            application/json:
              schema:
                type: object
                required: [method]
                properties:
                  method: {type: string, enum: [passkey, totp]}
                  ceremony: {type: string}
                  options: {type: object, description: WebAuthn credential request options.}
        '401': {$ref: '#/components/responses/Unauthenticated'}
        '403': {$ref: '#/components/responses/ReauthUnavailable'}
  /me/reauthenticate:
    post:
      tags: [Account]
      operationId: reauthenticate
      summary: Confirm it's you before a sensitive change
      description: Send `ceremony` and `credential` after a `passkey` answer, or `code` after a `totp` answer. Marks the current session as recently confirmed for `reauthMinutes` and records `user.reauthenticate` in the audit log. Wrong codes count towards the lockout.
      security:
        - session: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                ceremony: {type: string}
                credential: {type: object}
                code: {type: string}
      responses:
        '204': {$ref: '#/components/responses/NoContent'}
        '400': {$ref: '#/components/responses/BadJSON'}
        '401':
          description: '`ERR_UNAUTHENTICATED`: no session. `ERR_PASSKEY_REJECTED`: the passkey did not match, or the ceremony expired or belongs to someone else. `ERR_CODE_MISMATCH`: the code did not match or was already used.'
          content:
            application/json:
              schema: {$ref: '#/components/schemas/Error'}
        '403': {$ref: '#/components/responses/ReauthUnavailable'}
        '429': {$ref: '#/components/responses/TooManyAttempts'}
  /me/password:
    get:
      tags: [Account]
      operationId: getMyPasswordAccess
      summary: Check whether you may use a password
      security: *personal
      responses:
        '200':
          description: Whether passwords are turned on and allowed for your groups, and whether a password sign-in also needs a code from your authenticator app.
          content:
            application/json:
              schema:
                type: object
                required: [allowed, secondFactor]
                properties:
                  allowed: {type: boolean}
                  secondFactor: {type: boolean}
        '401': {$ref: '#/components/responses/Unauthenticated'}
  /me/passkey-rules:
    get:
      tags: [Account]
      operationId: getMyPasskeyRules
      summary: See the passkey rules that apply to you
      description: Combines the `authenticatorRules` of every group you belong to. A new key has to meet the rules of each of them.
      security: *personal
      responses:
        '200':
          description: The combined rules, and how many of your passkeys and security keys meet them.
          content:
            application/json:
              schema:
                type: object
                required: [groups, deviceBound, attestation, approvedModels, minimum, keys]
                properties:
                  groups: {type: array, items: {type: string}, description: Names of your groups that have passkey rules.}
                  deviceBound: {type: boolean, description: New keys must stay on one device and can't be synced passkeys.}
                  attestation: {type: boolean, description: New keys must prove their make and model through attestation verified with the FIDO Metadata Service.}
                  approvedModels: {type: boolean, description: New keys must be one of the models a group approved.}
                  minimum: {type: integer, description: The most passkeys and security keys any of your groups asks you to keep. 0 when none do.}
                  keys: {type: integer, description: How many of your passkeys and security keys meet the rules. Keys added before a rule are counted when their stored flags, attestation type and model meet it.}
        '401': {$ref: '#/components/responses/Unauthenticated'}
    put:
      tags: [Account]
      operationId: setMyPassword
      summary: Set or change your password
      description: Between 15 and 256 characters, with no other composition rules. Passwords found in known data breaches are refused while `passwordBreachCheck` is on. Remove your password with `DELETE /me/methods/password`.
      security: *personal
      requestBody: {$ref: '#/components/requestBodies/Password'}
      responses:
        '204': {$ref: '#/components/responses/NoContent'}
        '400': {$ref: '#/components/responses/BadJSON'}
        '401': {$ref: '#/components/responses/Unauthenticated'}
        '403':
          description: '`ERR_FORBIDDEN`: passwords are turned off or not allowed for your groups. Also `ERR_CROSS_SITE`.'
          content:
            application/json:
              schema: {$ref: '#/components/schemas/Error'}
        '422': {$ref: '#/components/responses/Invalid'}
  /me/sessions:
    get:
      tags: [Account]
      operationId: listMySessions
      summary: List your active sessions
      security: *personal
      responses:
        '200':
          description: Your sessions. `current` marks the one making the request.
          content:
            application/json:
              schema:
                type: array
                items: {$ref: '#/components/schemas/Session'}
        '401': {$ref: '#/components/responses/Unauthenticated'}
  /me/sessions/{id}:
    parameters:
      - {$ref: '#/components/parameters/Id'}
    delete:
      tags: [Account]
      operationId: revokeMySession
      summary: End one of your sessions
      description: Ending the current session also clears its cookie.
      security: *personal
      responses:
        '204': {$ref: '#/components/responses/NoContent'}
        '401': {$ref: '#/components/responses/Unauthenticated'}
        '403': {$ref: '#/components/responses/CrossSite'}
        '404': {$ref: '#/components/responses/NotFound'}
  /me/sessions/revoke-others:
    post:
      tags: [Account]
      operationId: revokeMyOtherSessions
      summary: End every session except the current one
      security: *personal
      responses:
        '200': {$ref: '#/components/responses/Revoked'}
        '401': {$ref: '#/components/responses/Unauthenticated'}
        '403': {$ref: '#/components/responses/CrossSite'}
  /me/security-emails:
    get:
      tags: [Account]
      operationId: listMySecurityEmails
      summary: List the security emails Halo sends you
      description: The security emails your organization turned on, and whether you get each one. Only emails about a new sign-in can be turned off.
      security: *personal
      responses:
        '200':
          description: Your security emails.
          content:
            application/json:
              schema:
                type: array
                items: {$ref: '#/components/schemas/SecurityEmail'}
        '401': {$ref: '#/components/responses/Unauthenticated'}
    put:
      tags: [Account]
      operationId: setMySecurityEmails
      summary: Choose the security emails you get
      description: Replaces the list of security emails you turned off. Only `new_sign_in` can be in it; your organization decides the others.
      security: *personal
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                'off': {type: array, items: {type: string, enum: [new_sign_in]}}
      responses:
        '200':
          description: Your security emails after the change.
          content:
            application/json:
              schema:
                type: array
                items: {$ref: '#/components/schemas/SecurityEmail'}
        '401': {$ref: '#/components/responses/ReauthRequired'}
        '403': {$ref: '#/components/responses/CrossSite'}
        '422': {$ref: '#/components/responses/Invalid'}
  /me/locale:
    put:
      tags: [Account]
      operationId: setMyLocale
      summary: Choose the language of your pages and emails
      description: 'Null clears your choice: pages follow your browser''s language, then the organization''s, and emails follow the organization''s.'
      security: *personal
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [locale]
              properties:
                locale: {oneOf: [{$ref: '#/components/schemas/Locale'}, {type: 'null'}]}
      responses:
        '200':
          description: Your profile after the change.
          content:
            application/json:
              schema: {$ref: '#/components/schemas/User'}
        '400': {$ref: '#/components/responses/BadJSON'}
        '401': {$ref: '#/components/responses/Unauthenticated'}
        '403': {$ref: '#/components/responses/CrossSite'}
        '422': {$ref: '#/components/responses/Invalid'}
  /me/applications:
    get:
      tags: [Account]
      operationId: listMyApplications
      summary: List the active applications and bookmarks you can open
      security: *personal
      responses:
        '200':
          description: Your applications in the order you arranged them. Applications you never placed come last, by name.
          content:
            application/json:
              schema:
                type: array
                items: {$ref: '#/components/schemas/MyApplication'}
        '401': {$ref: '#/components/responses/Unauthenticated'}
    put:
      tags: [Account]
      operationId: arrangeMyApplications
      summary: Set the order of your applications and which are favourites
      description: Replaces your arrangement. Every ID must be one of your active applications.
      security: *personal
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                order:
                  type: array
                  description: Application IDs in the order you want them. Applications left out come after these, by name.
                  items: {type: string}
                favourites:
                  type: array
                  description: Application IDs to mark as favourites. Every other application stops being a favourite.
                  items: {type: string}
      responses:
        '200':
          description: Your applications in their new order.
          content:
            application/json:
              schema:
                type: array
                items: {$ref: '#/components/schemas/MyApplication'}
        '400': {$ref: '#/components/responses/BadJSON'}
        '401': {$ref: '#/components/responses/Unauthenticated'}
        '422': {$ref: '#/components/responses/Invalid'}
  /me/collections:
    get:
      tags: [Account]
      operationId: listMyCollections
      summary: List the collections assigned to your groups
      description: Each collection lists only the active applications you can open, in your order. Collections with none of them are left out.
      security: *personal
      responses:
        '200':
          description: Your collections, by name.
          content:
            application/json:
              schema:
                type: array
                items:
                  type: object
                  required: [id, name, applicationIds]
                  properties:
                    id: {type: string}
                    name: {type: string}
                    applicationIds:
                      type: array
                      items: {type: string}
        '401': {$ref: '#/components/responses/Unauthenticated'}
  /me/groups:
    get:
      tags: [Account]
      operationId: listMyGroups
      summary: List the groups you belong to
      security: *personal
      responses:
        '200':
          description: Your groups.
          content:
            application/json:
              schema:
                type: array
                items: {$ref: '#/components/schemas/Group'}
        '401': {$ref: '#/components/responses/Unauthenticated'}
  /me/groups/{id}/join:
    parameters:
      - {$ref: '#/components/parameters/Id'}
    post:
      tags: [Account, Groups]
      operationId: joinGroup
      summary: Join a group, or ask its owners to add you
      description: 'Open groups add you straight away. On groups that take requests, the owners approve or decline; asking again while a request is pending changes nothing. Closed and rule-based groups refuse with `403`.'
      security: *personal
      responses:
        '200':
          description: Whether you joined or your request is waiting for an owner.
          content:
            application/json:
              schema:
                type: object
                required: [status]
                properties:
                  status: {type: string, enum: [joined, requested]}
        '401': {$ref: '#/components/responses/Unauthenticated'}
        '403': {$ref: '#/components/responses/Forbidden'}
        '404': {$ref: '#/components/responses/NotFound'}
  /me/joinable-groups:
    get:
      tags: [Account, Groups]
      operationId: listJoinableGroups
      summary: List the groups you can join or ask to join
      description: Assigned groups that are open or take requests, and that you are not in.
      security: *personal
      responses:
        '200':
          description: The groups.
          content:
            application/json:
              schema:
                type: array
                items: {$ref: '#/components/schemas/JoinableGroup'}
        '401': {$ref: '#/components/responses/Unauthenticated'}
  /me/owned-groups:
    get:
      tags: [Account, Groups]
      operationId: listOwnedGroups
      summary: List the groups you own
      security: *personal
      responses:
        '200':
          description: The groups, with the number of pending requests to join each.
          content:
            application/json:
              schema:
                type: array
                items: {$ref: '#/components/schemas/OwnedGroup'}
        '401': {$ref: '#/components/responses/Unauthenticated'}
  /me/owned-groups/{id}:
    parameters:
      - {$ref: '#/components/parameters/Id'}
    get:
      tags: [Account, Groups]
      operationId: getOwnedGroup
      summary: Get a group you own with its members and pending requests
      description: '`404` when you do not own the group. `people` lists everyone else in the directory who is not deprovisioned, to choose new members from.'
      security: *personal
      responses:
        '200':
          description: The group.
          content:
            application/json:
              schema:
                type: object
                required: [group, members, requests, people]
                properties:
                  group: {$ref: '#/components/schemas/OwnedGroup'}
                  members:
                    type: array
                    items: {$ref: '#/components/schemas/NamedRef'}
                  requests:
                    type: array
                    items: {$ref: '#/components/schemas/JoinRequest'}
                  people:
                    type: array
                    items: {$ref: '#/components/schemas/NamedRef'}
        '401': {$ref: '#/components/responses/Unauthenticated'}
        '404': {$ref: '#/components/responses/NotFound'}
  /me/sign-ins:
    get:
      tags: [Account]
      operationId: listMySignIns
      summary: List your 100 most recent sign-in events
      security: *personal
      responses:
        '200':
          description: Your sign-in events, newest first.
          content:
            application/json:
              schema:
                type: array
                items: {$ref: '#/components/schemas/SignInEvent'}
        '401': {$ref: '#/components/responses/Unauthenticated'}
  /me/export:
    get:
      tags: [Account]
      operationId: exportMyPersonalData
      summary: Download everything Halo stores about you as JSON
      description: Signed in with a session only, so not with an access token, an API key or during an impersonation. Returns the same document as `GET /users/{id}/export`. Writes a `user.export` audit event.
      security:
        - session: []
      responses:
        '200':
          description: A JSON attachment named `halo-personal-data-<id>-YYYY-MM-DD.json`.
          content:
            application/json:
              schema: {$ref: '#/components/schemas/PersonalData'}
        '401': {$ref: '#/components/responses/Unauthenticated'}
        '403': {$ref: '#/components/responses/Forbidden'}
  /me/attributes:
    patch:
      tags: [Account]
      operationId: updateMyAttributes
      summary: Change your own custom attributes
      description: 'Only attributes with `selfService` on; any other returns 403 and nothing is saved. Send the attribute names to change; `null`, an empty string or an empty list clears one. Writes a `user.update` audit event with the old and new values.'
      security: *personal
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: '#/components/schemas/AttributeValues'}
      responses:
        '200':
          description: Your updated profile.
          content:
            application/json:
              schema: {$ref: '#/components/schemas/User'}
        '400': {$ref: '#/components/responses/BadJSON'}
        '401': {$ref: '#/components/responses/Unauthenticated'}
        '403': {$ref: '#/components/responses/Forbidden'}
        '422': {$ref: '#/components/responses/Invalid'}
  /me/consents:
    get:
      tags: [Account]
      operationId: listMyConsents
      summary: List the applications you allowed to access your account
      security: *personal
      responses:
        '200':
          description: Your remembered consents, by application name.
          content:
            application/json:
              schema:
                type: array
                items: {$ref: '#/components/schemas/Consent'}
        '401': {$ref: '#/components/responses/Unauthenticated'}
  /me/consents/{id}:
    parameters:
      - {name: id, in: path, required: true, schema: {type: string}, description: The application id.}
    delete:
      tags: [Account]
      operationId: revokeMyConsent
      summary: Remove an application's access to your account
      description: 'Forgets the allowed scopes, revokes the access and refresh tokens the application holds for you, and drops your sign-in requests to it that were not exchanged yet, so it asks again at the next sign-in. JWT access tokens stay valid at APIs that check them offline until they expire. Recorded as `consent.revoke`.'
      security: *personal
      responses:
        '204': {$ref: '#/components/responses/NoContent'}
        '401': {$ref: '#/components/responses/Unauthenticated'}
        '403': {$ref: '#/components/responses/CrossSite'}
        '404': {$ref: '#/components/responses/NotFound'}
  /me/identities:
    get:
      tags: [Account]
      operationId: listMyIdentities
      summary: List the identity provider accounts linked to you
      security: *personal
      responses:
        '200':
          description: Your linked accounts.
          content:
            application/json:
              schema:
                type: array
                items: {$ref: '#/components/schemas/FederatedIdentity'}
        '401': {$ref: '#/components/responses/Unauthenticated'}
  /me/identities/{id}:
    parameters:
      - {$ref: '#/components/parameters/Id'}
    delete:
      tags: [Account]
      operationId: unlinkMyIdentity
      summary: Unlink an identity provider account
      description: Refused when it is your last way to sign in. Recovery codes do not count.
      security: *personal
      responses:
        '204': {$ref: '#/components/responses/NoContent'}
        '401': {$ref: '#/components/responses/Unauthenticated'}
        '403': {$ref: '#/components/responses/CrossSite'}
        '404': {$ref: '#/components/responses/NotFound'}
        '409': {$ref: '#/components/responses/LastMethod'}
  /me/devices:
    get:
      tags: [Account]
      operationId: listMyDevices
      summary: List the browsers and devices you signed in from
      security: *personal
      responses:
        '200':
          description: Your devices. `current` marks the browser making the request.
          content:
            application/json:
              schema:
                type: array
                items: {$ref: '#/components/schemas/Device'}
        '401': {$ref: '#/components/responses/Unauthenticated'}
  /me/terms:
    get:
      tags: [Account]
      operationId: listMyTerms
      summary: List the terms of use you must accept and the versions you accepted
      security: *personal
      responses:
        '200':
          description: '`terms` are the documents enforced policies ask of you, with `acceptedAt` set when you accepted the current version. `accepted` is every version you accepted, newest first.'
          content:
            application/json:
              schema:
                type: object
                required: [terms, accepted]
                properties:
                  terms:
                    type: array
                    items:
                      allOf:
                        - {$ref: '#/components/schemas/Terms'}
                        - type: object
                          required: [acceptedAt]
                          properties:
                            acceptedAt: {type: [string, 'null'], format: date-time}
                  accepted:
                    type: array
                    items: {$ref: '#/components/schemas/TermsAcceptance'}
        '401': {$ref: '#/components/responses/Unauthenticated'}
  /me/terms/{id}/accept:
    parameters:
      - {$ref: '#/components/parameters/Id'}
    post:
      tags: [Account]
      operationId: acceptTerms
      summary: Accept the current version of terms of use
      security: *personal
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [version]
              properties:
                version: {type: integer, description: The version you read. Refused with `409` when a newer one was published.}
      responses:
        '204': {$ref: '#/components/responses/NoContent'}
        '400': {$ref: '#/components/responses/BadJSON'}
        '401': {$ref: '#/components/responses/Unauthenticated'}
        '404': {$ref: '#/components/responses/NotFound'}
        '409': {$ref: '#/components/responses/Conflict'}
  /me/ssh/certificates:
    post:
      tags: [Account, SSH]
      operationId: issueSSHCertificate
      summary: Get an SSH user certificate for a public key
      description: Signs the key with Halo's SSH certificate authority for every principal mapped to your groups, valid for the configured lifetime. When one of your groups is in a host group rule it also names `halo:<uidNumber>`, which `halo-hostd principals` accepts for your Linux account on those hosts. `halo ssh-cert` calls this route and writes `knownHosts` to `~/.ssh/known_hosts`.
      security: *personal
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [publicKey]
              properties:
                publicKey: {type: string, description: An OpenSSH public key. RSA keys need at least 2048 bits., examples: ['ssh-ed25519 AAAAC3NzaC1lZDI1NTE5AAAAI… sam@laptop']}
      responses:
        '201':
          description: The certificate.
          content:
            application/json:
              schema: {$ref: '#/components/schemas/SSHCertificateIssued'}
        '400': {$ref: '#/components/responses/BadJSON'}
        '401': {$ref: '#/components/responses/Unauthenticated'}
        '403':
          description: '`ERR_NO_PRINCIPALS`: none of your groups maps to a server account. Also `ERR_CROSS_SITE`.'
          content:
            application/json:
              schema: {$ref: '#/components/schemas/Error'}
        '422': {$ref: '#/components/responses/Invalid'}
  /me/access-packages:
    get:
      tags: [Account, Access requests]
      operationId: listRequestablePackages
      summary: List the access packages you can request
      description: Every package that is not archived.
      security: *personal
      responses:
        '200':
          description: The packages.
          content:
            application/json:
              schema:
                type: array
                items: {$ref: '#/components/schemas/AccessPackage'}
        '401': {$ref: '#/components/responses/Unauthenticated'}
  /me/access-requests:
    get:
      tags: [Account, Access requests]
      operationId: listMyRequests
      summary: List your access requests
      security: *personal
      responses:
        '200':
          description: Your requests, newest first.
          content:
            application/json:
              schema:
                type: array
                items: {$ref: '#/components/schemas/AccessRequest'}
        '401': {$ref: '#/components/responses/Unauthenticated'}
    post:
      tags: [Account, Access requests]
      operationId: createAccessRequest
      summary: Request an access package
      description: Emails the approvers of the package's first stage. Nobody decides a request they made or that is for them. Send `beneficiaryId` to request for someone who reports to you, or for a guest you sponsor who has no manager; they get an email and see the request in their account. Send `extendsId` to ask for more time on access you hold that has an end date; the extension goes through the package's stages again and, when approved, adds its duration to the current end date.
      security: *personal
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                packageId: {type: string, description: Required unless you send `extendsId`.}
                beneficiaryId: {type: string, description: 'The person who gets the access, when it is not you. They must report to you: their manager is you, or they are a guest you sponsor with no manager.'}
                extendsId: {type: string, description: The id of the active grant to extend. The package and the beneficiary come from it.}
                durationDays:
                  type: [integer, 'null']
                  minimum: 1
                  maximum: 365
                  description: How long you need access, or how many more days for an extension. Required, and at most the package's `maxDays`, when the package sets one. `null` asks for access until it is revoked.
                justification: {type: string, maxLength: 2000, description: 'Required when the package sets `requireJustification`.'}
                answers:
                  type: object
                  description: Answers to the package's questions, keyed by question id. Required questions need an answer, and a choice question takes one of its choices.
                  additionalProperties: {type: string, maxLength: 500}
      responses:
        '201':
          description: The pending request.
          content:
            application/json:
              schema: {$ref: '#/components/schemas/AccessRequest'}
        '400': {$ref: '#/components/responses/BadJSON'}
        '401': {$ref: '#/components/responses/Unauthenticated'}
        '403':
          description: '`ERR_FORBIDDEN`: `beneficiaryId` is not someone who reports to you, or you are a guest. `ERR_CROSS_SITE`.'
          content:
            application/json:
              schema: {$ref: '#/components/schemas/Error'}
        '409':
          description: '`ERR_CONFLICT`: the package is archived, the person already has a pending request for it, or the grant to extend has ended or lasts until it is revoked.'
          content:
            application/json:
              schema: {$ref: '#/components/schemas/Error'}
        '422': {$ref: '#/components/responses/Invalid'}
  /me/access-requests/{id}/cancel:
    parameters:
      - {$ref: '#/components/parameters/Id'}
    post:
      tags: [Account, Access requests]
      operationId: cancelAccessRequest
      summary: Cancel your pending request
      security: *personal
      responses:
        '200':
          description: The cancelled request.
          content:
            application/json:
              schema: {$ref: '#/components/schemas/AccessRequest'}
        '401': {$ref: '#/components/responses/Unauthenticated'}
        '403': {$ref: '#/components/responses/CrossSite'}
        '404': {$ref: '#/components/responses/NotFound'}
        '409': {$ref: '#/components/responses/Conflict'}
  /me/access-grants:
    get:
      tags: [Account, Access requests]
      operationId: listMyGrants
      summary: List your active access grants
      description: Approved requests that have not expired or been revoked.
      security: *personal
      responses:
        '200':
          description: Your grants.
          content:
            application/json:
              schema:
                type: array
                items: {$ref: '#/components/schemas/AccessRequest'}
        '401': {$ref: '#/components/responses/Unauthenticated'}
  /me/direct-reports:
    get:
      tags: [Account, Access requests]
      operationId: listMyDirectReports
      summary: List the people you can request access for
      description: Active and invited people whose manager is you, and guests you sponsor who have no manager. Empty for guests.
      security: *personal
      responses:
        '200':
          description: The people, by name.
          content:
            application/json:
              schema:
                type: array
                items: {$ref: '#/components/schemas/NamedRef'}
        '401': {$ref: '#/components/responses/Unauthenticated'}
  /me/approvals:
    get:
      tags: [Account, Access requests]
      operationId: listMyApprovals
      summary: List the pending requests you can decide
      security: *personal
      responses:
        '200':
          description: Pending requests where you are an approver of the current stage and neither the beneficiary nor the person who asked, or every such pending request for a global administrator.
          content:
            application/json:
              schema:
                type: array
                items: {$ref: '#/components/schemas/AccessRequest'}
        '401': {$ref: '#/components/responses/Unauthenticated'}
  /me/role-activations:
    post:
      tags: [Account, Users]
      operationId: activateRole
      summary: Activate a role you are eligible for
      description: 'Gives you the role for 1 to 8 hours. It takes effect on your next request and stops on the first request after it ends. Needs the `halo_session` cookie; CLI access tokens are refused. The activation and its reason are written to the audit log, and so is its end.'
      security:
        - session: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [role, durationHours, justification]
              properties:
                role: {$ref: '#/components/schemas/RoleKey'}
                durationHours: {type: integer, minimum: 1, maximum: 8}
                justification: {type: string, minLength: 1, maxLength: 2000, description: Why you need the role. Recorded in the audit log.}
      responses:
        '201':
          description: The activation.
          content:
            application/json:
              schema: {$ref: '#/components/schemas/RoleActivation'}
        '400': {$ref: '#/components/responses/BadJSON'}
        '401': {$ref: '#/components/responses/ReauthRequired'}
        '403':
          description: '`ERR_NOT_ELIGIBLE`: you are not eligible for the role. `ERR_CROSS_SITE` on requests from another website.'
          content:
            application/json:
              schema: {$ref: '#/components/schemas/Error'}
        '409':
          description: '`ERR_CONFLICT`: you already hold the role, or it is already active.'
          content:
            application/json:
              schema: {$ref: '#/components/schemas/Error'}
        '422': {$ref: '#/components/responses/Invalid'}
  /me/role-activations/{id}/deactivate:
    parameters:
      - {$ref: '#/components/parameters/Id'}
    post:
      tags: [Account, Users]
      operationId: deactivateRole
      summary: End your role activation before its time limit
      security: *personal
      responses:
        '204': {$ref: '#/components/responses/NoContent'}
        '401': {$ref: '#/components/responses/Unauthenticated'}
        '403': {$ref: '#/components/responses/CrossSite'}
        '409': {$ref: '#/components/responses/Conflict'}
  /me/reviews:
    get:
      tags: [Account, Access reviews]
      operationId: listMyReviews
      summary: List the open access reviews you are a reviewer of
      security: *personal
      responses:
        '200':
          description: Your open reviews, without their items.
          content:
            application/json:
              schema:
                type: array
                items: {$ref: '#/components/schemas/AccessReview'}
        '401': {$ref: '#/components/responses/Unauthenticated'}
  /me/guests:
    get:
      tags: [Account, Users]
      operationId: listMySponsoredGuests
      summary: List the guests you sponsor
      security: *personal
      responses:
        '200':
          description: Guests whose sponsor you are, sorted by name, including suspended ones.
          content:
            application/json:
              schema:
                type: array
                items: {$ref: '#/components/schemas/User'}
        '401': {$ref: '#/components/responses/Unauthenticated'}
  /users:
    get:
      tags: [Users]
      operationId: listUsers
      summary: List every person
      description: 'Roles: any administrator. Service accounts are not included. Limited roles apply.'
      responses:
        '200':
          description: Every person, sorted by name.
          content:
            application/json:
              schema:
                type: array
                items: {$ref: '#/components/schemas/User'}
        '401': {$ref: '#/components/responses/Unauthenticated'}
        '403': {$ref: '#/components/responses/Forbidden'}
    post:
      tags: [Users]
      operationId: inviteUser
      summary: Invite a person
      description: 'Roles: user administrator; including `roles` requires global administrator and a recent strong sign-in, and `global_admin` is refused while granting it needs approval. Creates the account with status `invited` and a setup link, and emails the link when SMTP is configured. With `guest`, the account is a guest: any email address works, `sponsorId` and `expiresAt` are required, and `roles` must be empty. Limited roles apply.'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [email, name]
              properties:
                email: {type: string, format: email, maxLength: 254}
                name: {type: string, maxLength: 200}
                title: {type: string, maxLength: 200}
                department: {type: string, maxLength: 200}
                location: {type: string, maxLength: 200}
                managerId: {type: string, description: Id of another person.}
                groupIds:
                  type: array
                  description: Assigned groups only.
                  items: {type: string}
                roles:
                  type: array
                  items: {$ref: '#/components/schemas/RoleKey'}
                guest: {type: boolean, description: 'Creates a guest: an external person with a sponsor and an end date, who never holds an administrator role and joins only the groups chosen for them.'}
                sponsorId: {type: string, description: 'Guests only. Id of an active person who is not a guest, who is responsible for the guest and can extend their access.'}
                expiresAt: {type: string, format: date-time, description: 'Guests only. When access ends, within 365 days. Halo emails the sponsor 14 days before, and suspends the account then.'}
      responses:
        '201':
          description: The new person and their setup link.
          content:
            application/json:
              schema:
                type: object
                required: [user, enrollUrl, expiresAt, emailed]
                properties:
                  user: {$ref: '#/components/schemas/User'}
                  enrollUrl: {type: string, format: uri}
                  expiresAt: {type: string, format: date-time}
                  emailed: {type: boolean, description: True when Halo also emailed the link.}
        '400': {$ref: '#/components/responses/BadJSON'}
        '401': {$ref: '#/components/responses/ReauthRequired'}
        '403': {$ref: '#/components/responses/Forbidden'}
        '409': {$ref: '#/components/responses/Conflict'}
        '422': {$ref: '#/components/responses/Invalid'}
  /users/import:
    post:
      tags: [Users]
      operationId: importUsers
      summary: Import people from a CSV file or JSON
      description: 'Roles: user administrator. Creates each valid row as an invited person with a setup link, exactly like `POST /users`, in one transaction, and records `user.invite` for each person and one `user.import` summary. Rows with a problem are skipped and reported. Imports never grant administrator roles: a `roles` column is refused and a `roles` field is an unknown field. Send `dryRun=true` first to validate every row without writing anything. Up to 500 rows and 1 MiB per request. Counted under the `bulk` rate limit. Limited roles apply.'
      parameters:
        - name: dryRun
          in: query
          description: Validate every row and return the result without creating anyone.
          schema: {type: boolean, default: false}
        - name: sendInvitations
          in: query
          description: Email each new person their setup link. When false, the invitations are held and Halo emails nothing; share each `enrollUrl` yourself, or create a new link later with reset authentication.
          schema: {type: boolean, default: false}
      requestBody:
        required: true
        content:
          text/csv:
            schema:
              type: string
              description: 'UTF-8 CSV with a header row; a byte order mark is ignored. Columns, matched without regard to case, spaces, hyphens or underscores: `email` and `name` (required), `title`, `department`, `location`, `manager email` and `groups`. Separate several groups with semicolons, by name or id. The manager is a person already in Halo or another row in the file. Blank rows are skipped. Values are stored as plain text.'
              examples: ["email,name,title,manager email,groups\nsam@example.com,Sam Lee,Engineer,ana@example.com,Engineering;On-call\n"]
          application/json:
            schema:
              type: object
              required: [people]
              properties:
                people:
                  type: array
                  maxItems: 500
                  items: {$ref: '#/components/schemas/ImportPerson'}
      responses:
        '200':
          description: 'One result per row, in the order received. After a dry run nothing has changed; otherwise every row without an `error` was created.'
          content:
            application/json:
              schema:
                type: object
                required: [dryRun, ready, skipped, rows]
                properties:
                  dryRun: {type: boolean}
                  ready: {type: integer, description: Rows without a problem; created unless this was a dry run.}
                  skipped: {type: integer, description: Rows with a problem; never created.}
                  rows:
                    type: array
                    items:
                      allOf:
                        - {$ref: '#/components/schemas/ImportPerson'}
                        - type: object
                          required: [row, emailed]
                          properties:
                            row: {type: integer, description: The line in the CSV file, or the position in `people` counting from 1.}
                            error: {$ref: '#/components/schemas/ItemError'}
                            userId: {type: string, description: Set once the person is created.}
                            enrollUrl: {type: string, format: uri, description: The new person's setup link.}
                            expiresAt: {type: string, format: date-time}
                            emailed: {type: boolean, description: True when Halo emailed the setup link.}
        '400': {$ref: '#/components/responses/BadJSON'}
        '401': {$ref: '#/components/responses/Unauthenticated'}
        '403': {$ref: '#/components/responses/Forbidden'}
        '409': {$ref: '#/components/responses/Conflict'}
        '413':
          description: '`ERR_TOO_LARGE`: the CSV file is larger than 1 MiB.'
          content:
            application/json:
              schema: {$ref: '#/components/schemas/Error'}
        '422': {$ref: '#/components/responses/Invalid'}
  /users/bulk/suspend:
    post:
      tags: [Users]
      operationId: bulkSuspendUsers
      summary: Suspend many people
      description: 'Roles: user or security administrator. Runs the checks of `POST /users/{id}/suspend` for each person, in its own transaction with its own `user.suspend` audit event, so one refusal does not stop the rest. Counted under the `bulk` rate limit. Limited roles apply.'
      requestBody: {$ref: '#/components/requestBodies/BulkUserIds'}
      responses:
        '200': {$ref: '#/components/responses/BulkResults'}
        '400': {$ref: '#/components/responses/BadJSON'}
        '401': {$ref: '#/components/responses/Unauthenticated'}
        '403': {$ref: '#/components/responses/Forbidden'}
  /users/bulk/restore:
    post:
      tags: [Users]
      operationId: bulkRestoreUsers
      summary: Restore many suspended people
      description: 'Roles: user administrator. Runs `POST /users/{id}/restore` for each person, with a result per person. Counted under the `bulk` rate limit. Limited roles apply.'
      requestBody: {$ref: '#/components/requestBodies/BulkUserIds'}
      responses:
        '200': {$ref: '#/components/responses/BulkResults'}
        '400': {$ref: '#/components/responses/BadJSON'}
        '401': {$ref: '#/components/responses/Unauthenticated'}
        '403': {$ref: '#/components/responses/Forbidden'}
  /users/bulk/revoke-sessions:
    post:
      tags: [Users]
      operationId: bulkRevokeUserSessions
      summary: End many people's sessions
      description: 'Roles: user, helpdesk or security administrator. Runs `POST /users/{id}/revoke-sessions` for each person, with a result per person. Counted under the `bulk` rate limit. Limited roles apply.'
      requestBody: {$ref: '#/components/requestBodies/BulkUserIds'}
      responses:
        '200': {$ref: '#/components/responses/BulkResults'}
        '400': {$ref: '#/components/responses/BadJSON'}
        '401': {$ref: '#/components/responses/Unauthenticated'}
        '403': {$ref: '#/components/responses/Forbidden'}
  /users/{id}:
    parameters:
      - {$ref: '#/components/parameters/Id'}
    get:
      tags: [Users]
      operationId: getUser
      summary: Get one person
      description: 'Roles: any administrator. Limited roles apply.'
      responses:
        '200':
          description: The person.
          content:
            application/json:
              schema: {$ref: '#/components/schemas/User'}
        '401': {$ref: '#/components/responses/Unauthenticated'}
        '403': {$ref: '#/components/responses/Forbidden'}
        '404': {$ref: '#/components/responses/NotFound'}
    patch:
      tags: [Users]
      operationId: updateUser
      summary: Change a person's profile
      description: 'Roles: user or helpdesk administrator. Helpdesk administrators can change title, department, location and custom attributes only. Only a global administrator can change a person who holds an administrator role. Send only the fields to change; an empty `managerId` removes the manager. Limited roles apply. Refused with `ERR_CONFLICT` for people synced from an LDAP directory, whose `directory` is set: change them in the directory.'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                email: {type: string, format: email}
                name: {type: string, maxLength: 200}
                title: {type: string, maxLength: 200}
                department: {type: string, maxLength: 200}
                location: {type: string, maxLength: 200}
                managerId: {type: string}
                attributes: {$ref: '#/components/schemas/AttributeValues'}
      responses:
        '200':
          description: The updated person.
          content:
            application/json:
              schema: {$ref: '#/components/schemas/User'}
        '400': {$ref: '#/components/responses/BadJSON'}
        '401': {$ref: '#/components/responses/Unauthenticated'}
        '403': {$ref: '#/components/responses/Forbidden'}
        '404': {$ref: '#/components/responses/NotFound'}
        '409': {$ref: '#/components/responses/Conflict'}
        '422': {$ref: '#/components/responses/Invalid'}
    delete:
      tags: [Users]
      operationId: deleteUser
      summary: Delete a person permanently
      description: 'Roles: global administrator. Cannot be undone. Removes the person with their sign-in methods, sessions, tokens, devices, group memberships, consents, access requests, sign-ups and queued email, and their profile picture. In the sign-in log, the audit log, approval requests, queued webhook deliveries and SSH certificates their ID, name and email address are replaced with a pseudonym such as `deleted_01J…`, which the response returns; access policies stop listing them. Refused for yourself, a service account, an emergency access account, the last active global administrator, and someone who still has active accounts in other applications through provisioning. Needs approval when `user-deletion` is in `approvalActions`. Writes a `user.delete` audit event that names only the pseudonym.'
      responses:
        '200':
          description: The person was deleted.
          content:
            application/json:
              schema:
                type: object
                required: [pseudonym]
                properties:
                  pseudonym: {type: string, description: What the logs show instead of the person.}
        '202': {$ref: '#/components/responses/ApprovalPending'}
        '401': {$ref: '#/components/responses/ReauthRequired'}
        '403': {$ref: '#/components/responses/Forbidden'}
        '404': {$ref: '#/components/responses/NotFound'}
        '409': {$ref: '#/components/responses/Conflict'}
        '422': {$ref: '#/components/responses/Invalid'}
  /users/{id}/export:
    parameters:
      - {$ref: '#/components/parameters/Id'}
    get:
      tags: [Users]
      operationId: exportUser
      summary: Download everything Halo stores about a person as JSON
      description: 'Roles: global administrator. For access and portability requests. Includes no password hashes, secrets, token hashes or recovery codes. Writes a `user.export` audit event.'
      responses:
        '200':
          description: A JSON attachment named `halo-personal-data-<id>-YYYY-MM-DD.json`.
          content:
            application/json:
              schema: {$ref: '#/components/schemas/PersonalData'}
        '401': {$ref: '#/components/responses/ReauthRequired'}
        '403': {$ref: '#/components/responses/Forbidden'}
        '404': {$ref: '#/components/responses/NotFound'}
  /users/{id}/avatar:
    parameters:
      - {$ref: '#/components/parameters/Id'}
    get:
      tags: [Users]
      operationId: getUserAvatar
      summary: Get a person's profile picture
      description: No authentication. This is the URL in the OpenID Connect `picture` claim and the SAML `picture` attribute. The `v` query is a cache version.
      security: []
      responses:
        '200':
          description: The picture. Cached for one day.
          content:
            image/png:
              schema: {type: string, contentMediaType: image/png}
            image/jpeg:
              schema: {type: string, contentMediaType: image/jpeg}
            image/webp:
              schema: {type: string, contentMediaType: image/webp}
        '404': {$ref: '#/components/responses/NotFound'}
    put:
      tags: [Users]
      operationId: uploadUserAvatar
      summary: Set a person's profile picture
      description: 'Roles: user or helpdesk administrator. Only a global administrator can change the picture of a person who holds an administrator role. Send the image bytes as the body: PNG, JPEG or WebP, at most 512 KB. Limited roles apply.'
      requestBody:
        required: true
        content:
          image/png:
            schema: {type: string, contentMediaType: image/png}
          image/jpeg:
            schema: {type: string, contentMediaType: image/jpeg}
          image/webp:
            schema: {type: string, contentMediaType: image/webp}
      responses:
        '200':
          description: The picture URL.
          content:
            application/json:
              schema:
                type: object
                required: [avatarUrl]
                properties:
                  avatarUrl: {type: string}
        '401': {$ref: '#/components/responses/Unauthenticated'}
        '403': {$ref: '#/components/responses/Forbidden'}
        '404': {$ref: '#/components/responses/NotFound'}
        '413':
          description: '`ERR_TOO_LARGE`: the image is larger than 512 KB.'
          content:
            application/json:
              schema: {$ref: '#/components/schemas/Error'}
        '422': {$ref: '#/components/responses/Invalid'}
    delete:
      tags: [Users]
      operationId: removeUserAvatar
      summary: Remove a person's profile picture
      description: 'Roles: user or helpdesk administrator. Only a global administrator can remove the picture of a person who holds an administrator role. Limited roles apply.'
      responses:
        '200':
          description: The picture was removed.
          content:
            application/json:
              schema:
                type: object
                required: [avatarUrl]
                properties:
                  avatarUrl: {type: 'null'}
        '401': {$ref: '#/components/responses/Unauthenticated'}
        '403': {$ref: '#/components/responses/Forbidden'}
        '404': {$ref: '#/components/responses/NotFound'}
  /users/{id}/sessions:
    parameters:
      - {$ref: '#/components/parameters/Id'}
    get:
      tags: [Users]
      operationId: listUserSessions
      summary: List a person's active sessions
      description: 'Roles: any administrator. Limited roles apply.'
      responses:
        '200':
          description: The sessions.
          content:
            application/json:
              schema:
                type: array
                items: {$ref: '#/components/schemas/Session'}
        '401': {$ref: '#/components/responses/Unauthenticated'}
        '403': {$ref: '#/components/responses/Forbidden'}
        '404': {$ref: '#/components/responses/NotFound'}
  /users/{id}/sign-ins:
    parameters:
      - {$ref: '#/components/parameters/Id'}
    get:
      tags: [Users]
      operationId: listUserSignIns
      summary: List a person's sign-in events
      description: 'Roles: any administrator. The 500 most recent. Limited roles apply.'
      responses:
        '200':
          description: The events, newest first.
          content:
            application/json:
              schema:
                type: array
                items: {$ref: '#/components/schemas/SignInEvent'}
        '401': {$ref: '#/components/responses/Unauthenticated'}
        '403': {$ref: '#/components/responses/Forbidden'}
        '404': {$ref: '#/components/responses/NotFound'}
  /users/{id}/relationships:
    parameters:
      - {$ref: '#/components/parameters/Id'}
    get:
      tags: [Users]
      operationId: listUserRelationships
      summary: List the authorization tuples that name a person or one of their groups
      description: 'Roles: any administrator. Limited roles apply. Up to 1,000, across every application, so access reviews and offboarding see application permissions. `groupId` is set when the tuple names one of the person''s groups rather than the person.'
      responses:
        '200':
          description: The tuples.
          content:
            application/json:
              schema:
                type: array
                items: {$ref: '#/components/schemas/PersonRelationship'}
        '401': {$ref: '#/components/responses/Unauthenticated'}
        '403': {$ref: '#/components/responses/Forbidden'}
        '404': {$ref: '#/components/responses/NotFound'}
  /users/{id}/suspend:
    parameters:
      - {$ref: '#/components/parameters/Id'}
    post:
      tags: [Users]
      operationId: suspendUser
      summary: Suspend a person and end their sessions
      description: 'Roles: user or security administrator. Refused for your own account and for the last active global administrator. Limited roles apply.'
      responses:
        '200': {$ref: '#/components/responses/UserResponse'}
        '401': {$ref: '#/components/responses/Unauthenticated'}
        '403': {$ref: '#/components/responses/Forbidden'}
        '404': {$ref: '#/components/responses/NotFound'}
        '422': {$ref: '#/components/responses/Invalid'}
  /users/{id}/restore:
    parameters:
      - {$ref: '#/components/parameters/Id'}
    post:
      tags: [Users]
      operationId: restoreUser
      summary: Restore a suspended person
      description: 'Roles: user administrator. The person becomes `active`, or `invited` when they never signed in and have no sign-in method. A guest whose access ended answers `409`; change `expiresAt` with `PUT /users/{id}/guest` first. Limited roles apply.'
      responses:
        '200': {$ref: '#/components/responses/UserResponse'}
        '401': {$ref: '#/components/responses/Unauthenticated'}
        '403': {$ref: '#/components/responses/Forbidden'}
        '404': {$ref: '#/components/responses/NotFound'}
        '409': {$ref: '#/components/responses/Conflict'}
  /users/{id}/revoke-sessions:
    parameters:
      - {$ref: '#/components/parameters/Id'}
    post:
      tags: [Users]
      operationId: revokeUserSessions
      summary: End a person's sessions
      description: 'Roles: user, helpdesk or security administrator. When you target yourself, your current session stays. Limited roles apply.'
      responses:
        '200': {$ref: '#/components/responses/Revoked'}
        '401': {$ref: '#/components/responses/Unauthenticated'}
        '403': {$ref: '#/components/responses/Forbidden'}
        '404': {$ref: '#/components/responses/NotFound'}
  /users/{id}/impersonations:
    parameters:
      - {$ref: '#/components/parameters/Id'}
    post:
      tags: [Users]
      operationId: requestImpersonation
      summary: Ask to see Halo as a person
      description: 'Roles: helpdesk administrator, signed in to the console; API keys are refused. The person must be active, in one of `impersonationGroupIds`, and must not be you, a service account, an emergency access account, or hold or be eligible for any administrator role. Global administrators get no exemption. Creates an impersonation that must be started within 30 minutes with `POST /impersonations/{id}/start`. While `impersonation` is in `approvalActions`, it waits for a global administrator instead, and the impersonation is created when they approve.'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [reason]
              properties:
                reason: {type: string, maxLength: 500, description: Why you need it. Shown to the person in the email and recorded in the audit and sign-in logs.}
      responses:
        '201':
          description: The impersonation, ready to start.
          content:
            application/json:
              schema: {$ref: '#/components/schemas/Impersonation'}
        '202': {$ref: '#/components/responses/ApprovalPending'}
        '400': {$ref: '#/components/responses/BadJSON'}
        '401': {$ref: '#/components/responses/Unauthenticated'}
        '403': {$ref: '#/components/responses/Forbidden'}
        '404': {$ref: '#/components/responses/NotFound'}
        '422': {$ref: '#/components/responses/Invalid'}
  /impersonations:
    get:
      tags: [Users]
      operationId: listImpersonations
      summary: List impersonations
      description: 'Roles: any administrator.'
      parameters:
        - {name: user, in: query, schema: {type: string}, description: Only impersonations of this person.}
      responses:
        '200':
          description: The 100 most recent, newest first.
          content:
            application/json:
              schema:
                type: array
                items: {$ref: '#/components/schemas/Impersonation'}
        '401': {$ref: '#/components/responses/Unauthenticated'}
        '403': {$ref: '#/components/responses/Forbidden'}
  /impersonations/{id}/start:
    parameters:
      - {$ref: '#/components/parameters/Id'}
    post:
      tags: [Users]
      operationId: startImpersonation
      summary: Start an impersonation
      description: 'Roles: helpdesk administrator, and only the one who asked for it, from a browser session. Works once. Ends your own session and replaces the session cookie with one for the person that lasts 30 minutes. It can read `/me`, `/me/*`, `/organization`, avatars and logos, and end itself; everything else, including changing sign-in methods, passwords, sessions or roles, approving anything, the admin console and signing in to applications, is refused with `ERR_IMPERSONATING`. It also ends as soon as you or the person no longer qualify. Emails the person, and records `impersonation.start` in the audit log and a sign-in with `impersonatorId` in the sign-in log.'
      responses:
        '200':
          description: Started. Go to `redirect`.
          headers:
            Set-Cookie: {schema: {type: string}, description: The impersonation session.}
          content:
            application/json:
              schema:
                type: object
                required: [redirect]
                properties:
                  redirect: {type: string, examples: [/account]}
        '401': {$ref: '#/components/responses/Unauthenticated'}
        '403': {$ref: '#/components/responses/Forbidden'}
        '404': {$ref: '#/components/responses/NotFound'}
        '409': {$ref: '#/components/responses/Conflict'}
  /impersonations/{id}/end:
    parameters:
      - {$ref: '#/components/parameters/Id'}
    post:
      tags: [Users]
      operationId: endImpersonation
      summary: End or cancel an impersonation
      description: 'Roles: user, helpdesk or security administrator, or the impersonation session itself, which is then signed out. Records `impersonation.end` with the administrator who ended it, or with the impersonating administrator when the session ends itself. Ending one that already ended does nothing.'
      responses:
        '204': {$ref: '#/components/responses/NoContent'}
        '401': {$ref: '#/components/responses/Unauthenticated'}
        '403': {$ref: '#/components/responses/Forbidden'}
        '404': {$ref: '#/components/responses/NotFound'}
  /users/{id}/reset-authentication:
    parameters:
      - {$ref: '#/components/parameters/Id'}
    post:
      tags: [Users]
      operationId: resetAuthentication
      summary: Remove every sign-in method and create a new setup link
      description: 'Roles: user or helpdesk administrator. Also ends every session and emails the link when SMTP is configured. Limited roles apply.'
      responses:
        '200':
          description: The new setup link.
          content:
            application/json:
              schema:
                type: object
                required: [enrollUrl, expiresAt, emailed]
                properties:
                  enrollUrl: {type: string, format: uri}
                  expiresAt: {type: string, format: date-time}
                  emailed: {type: boolean}
        '401': {$ref: '#/components/responses/ReauthRequired'}
        '403': {$ref: '#/components/responses/Forbidden'}
        '404': {$ref: '#/components/responses/NotFound'}
  /users/{id}/methods/{methodId}:
    parameters:
      - {$ref: '#/components/parameters/Id'}
      - name: methodId
        in: path
        required: true
        schema: {type: string}
    delete:
      tags: [Users]
      operationId: deleteUserMethod
      summary: Remove one of a person's sign-in methods
      description: 'Roles: user or helpdesk administrator; only a global administrator can remove one from an administrator. The id `access-pass` revokes the person''s temporary access pass. Limited roles apply.'
      responses:
        '204': {$ref: '#/components/responses/NoContent'}
        '401': {$ref: '#/components/responses/ReauthRequired'}
        '403': {$ref: '#/components/responses/Forbidden'}
        '404': {$ref: '#/components/responses/NotFound'}
  /users/{id}/identity-proofs:
    parameters:
      - {$ref: '#/components/parameters/Id'}
    get:
      tags: [Users]
      operationId: listIdentityProofs
      summary: List a person's identity checks
      description: 'Roles: any administrator. Newest first. Limited roles apply. The same records are in the `identityProofs` section of `GET /users/{id}/export`, and permanent deletion deletes them.'
      responses:
        '200':
          description: The identity checks.
          content:
            application/json:
              schema:
                type: array
                items: {$ref: '#/components/schemas/IdentityProof'}
        '401': {$ref: '#/components/responses/Unauthenticated'}
        '403': {$ref: '#/components/responses/Forbidden'}
        '404': {$ref: '#/components/responses/NotFound'}
    post:
      tags: [Users]
      operationId: checkIdentity
      summary: Record an in-person identity check
      description: 'Roles: user or helpdesk administrator, with a recent sign-in; only a global administrator can check someone who holds or is eligible for an administrator role, and nobody can check themselves. Limited roles apply. For invited, active and suspended people. While `identityProofingInvites` applies to an invitation, Halo requires a successful check before the person can become active. Recorded as `user.identity_proof`.'
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: '#/components/schemas/InPersonCheck'}
      responses:
        '201': {$ref: '#/components/responses/IdentityProofResponse'}
        '400': {$ref: '#/components/responses/BadJSON'}
        '401': {$ref: '#/components/responses/Unauthenticated'}
        '403': {$ref: '#/components/responses/Forbidden'}
        '404': {$ref: '#/components/responses/NotFound'}
        '409': {$ref: '#/components/responses/Conflict'}
        '422': {$ref: '#/components/responses/Invalid'}
  /users/{id}/access-pass:
    parameters:
      - {$ref: '#/components/parameters/Id'}
    post:
      tags: [Users]
      operationId: createAccessPass
      summary: Create a temporary access pass
      description: 'Roles: user or helpdesk administrator; only a global administrator can create one for an administrator, and nobody can create one for themselves. The person signs in with it at `/auth/access-pass` to set up a new passkey. A new pass replaces the person''s active one. Halo stores only a hash, so the pass is shown once in this response; give it to the person in person or by phone after checking who they are. Halo emails the person that a pass was created, without the pass. Revoke it with `DELETE /users/{id}/methods/access-pass`. Limited roles apply.'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                lifetimeMinutes: {type: integer, minimum: 10, maximum: 10080, default: 60}
                uses: {type: integer, minimum: 1, maximum: 10, default: 1, description: How many times the pass works before it ends.}
      responses:
        '201':
          description: The pass, shown only this once.
          content:
            application/json:
              schema:
                type: object
                required: [pass, expiresAt, uses]
                properties:
                  pass: {type: string, examples: [k7mq-x2pd-r4tn-wb6e]}
                  expiresAt: {type: string, format: date-time}
                  uses: {type: integer}
        '400': {$ref: '#/components/responses/BadJSON'}
        '401': {$ref: '#/components/responses/Unauthenticated'}
        '403': {$ref: '#/components/responses/Forbidden'}
        '404': {$ref: '#/components/responses/NotFound'}
        '422': {$ref: '#/components/responses/Invalid'}
  /users/{id}/password:
    parameters:
      - {$ref: '#/components/parameters/Id'}
    put:
      tags: [Users]
      operationId: setTemporaryPassword
      summary: Set a temporary password
      description: 'Roles: user or helpdesk administrator; only a global administrator can set one for an administrator. The person must choose a new password at their next sign-in. Their sessions end and their tokens are revoked. The same length and breach rules apply as for `PUT /me/password`. Limited roles apply.'
      requestBody: {$ref: '#/components/requestBodies/Password'}
      responses:
        '204': {$ref: '#/components/responses/NoContent'}
        '400': {$ref: '#/components/responses/BadJSON'}
        '401': {$ref: '#/components/responses/ReauthRequired'}
        '403': {$ref: '#/components/responses/Forbidden'}
        '404': {$ref: '#/components/responses/NotFound'}
        '422': {$ref: '#/components/responses/Invalid'}
  /users/{id}/posix:
    parameters:
      - {$ref: '#/components/parameters/Id'}
    put:
      tags: [Users]
      operationId: setUserPOSIX
      summary: Change a person's Linux account
      description: 'Roles: user administrator; only a global administrator can change an administrator''s account. The user and group numbers never change. The user name must be unique across people and groups and must not be a system account such as `root`. Limited roles apply. Recorded as `user.posix`.'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [username, loginShell, homeDirectory]
              properties:
                username: {type: string, pattern: '^[a-z_][a-z0-9_.-]{0,31}$', examples: [ada]}
                loginShell: {type: string, description: An absolute path of letters, digits and _ . / -., examples: [/bin/bash]}
                homeDirectory: {type: string, description: An absolute path of letters, digits and _ . / -., examples: [/home/ada]}
      responses:
        '200': {$ref: '#/components/responses/UserResponse'}
        '400': {$ref: '#/components/responses/BadJSON'}
        '401': {$ref: '#/components/responses/Unauthenticated'}
        '403': {$ref: '#/components/responses/Forbidden'}
        '404': {$ref: '#/components/responses/NotFound'}
        '409': {$ref: '#/components/responses/Conflict'}
        '422': {$ref: '#/components/responses/Invalid'}
  /users/{id}/roles:
    parameters:
      - {$ref: '#/components/parameters/Id'}
    put:
      tags: [Users]
      operationId: setUserRoles
      summary: Replace a person's administrator roles
      description: 'Roles: global administrator. Send the complete list; an empty list removes every role. You cannot remove your own global administrator role or give yourself a role or widen its groups, including one you activated. A role left out of `scopes` keeps the groups it has. Guests cannot hold roles. While `global-admin` is in `approvalActions`, granting `global_admin` to someone who does not hold it, or holds it only through an activation, waits for another global administrator.'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [roles]
              properties:
                roles:
                  type: array
                  items: {$ref: '#/components/schemas/RoleKey'}
                scopes: {$ref: '#/components/schemas/RoleScopes'}
      responses:
        '200': {$ref: '#/components/responses/UserResponse'}
        '202': {$ref: '#/components/responses/ApprovalPending'}
        '400': {$ref: '#/components/responses/BadJSON'}
        '401': {$ref: '#/components/responses/ReauthRequired'}
        '403': {$ref: '#/components/responses/Forbidden'}
        '404': {$ref: '#/components/responses/NotFound'}
        '422': {$ref: '#/components/responses/Invalid'}
  /users/{id}/eligible-roles:
    parameters:
      - {$ref: '#/components/parameters/Id'}
    put:
      tags: [Users]
      operationId: setUserEligibleRoles
      summary: Replace the roles a person can activate
      description: 'Roles: global administrator. Send the complete list; an empty list removes every eligibility and ends any activation of a role that is no longer listed. You cannot change your own eligible roles. Guests cannot be eligible for roles. A role left out of `scopes` keeps the groups it has, and an open activation follows a change to them. While `global-admin` is in `approvalActions`, making someone eligible for `global_admin` waits for another global administrator, because they could then activate it themselves.'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [roles]
              properties:
                roles:
                  type: array
                  items: {$ref: '#/components/schemas/RoleKey'}
                scopes: {$ref: '#/components/schemas/RoleScopes'}
      responses:
        '200': {$ref: '#/components/responses/UserResponse'}
        '202': {$ref: '#/components/responses/ApprovalPending'}
        '400': {$ref: '#/components/responses/BadJSON'}
        '401': {$ref: '#/components/responses/ReauthRequired'}
        '403': {$ref: '#/components/responses/Forbidden'}
        '404': {$ref: '#/components/responses/NotFound'}
        '422': {$ref: '#/components/responses/Invalid'}
  /users/{id}/guest:
    parameters:
      - {$ref: '#/components/parameters/Id'}
    put:
      tags: [Users]
      operationId: updateGuest
      summary: Extend a guest's access or change their sponsor
      description: 'Roles: user administrator, or the guest''s sponsor. Anyone else gets `404`. The sponsor can change `expiresAt` only, and only until access ends; after that a user administrator extends it and restores the account. `expiresAt` must be within 365 days. Recorded as `guest.extend` and `guest.sponsor.change`. Limited roles apply.'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                expiresAt: {type: string, format: date-time}
                sponsorId: {type: string, description: User administrators only.}
      responses:
        '200': {$ref: '#/components/responses/UserResponse'}
        '400': {$ref: '#/components/responses/BadJSON'}
        '401': {$ref: '#/components/responses/ReauthRequired'}
        '403': {$ref: '#/components/responses/Forbidden'}
        '404': {$ref: '#/components/responses/NotFound'}
        '409': {$ref: '#/components/responses/Conflict'}
        '422': {$ref: '#/components/responses/Invalid'}
  /sign-ups:
    get:
      tags: [Users]
      operationId: listSignUps
      summary: List sign-ups waiting for approval
      description: 'Roles: any administrator. Only sign-ups whose address is confirmed and that hold a passkey, oldest first.'
      responses:
        '200':
          description: The sign-ups.
          content:
            application/json:
              schema:
                type: array
                items: {$ref: '#/components/schemas/SignUp'}
        '401': {$ref: '#/components/responses/Unauthenticated'}
        '403': {$ref: '#/components/responses/Forbidden'}
  /sign-ups/{id}/approve:
    parameters:
      - {$ref: '#/components/parameters/Id'}
    post:
      tags: [Users]
      operationId: approveSignUp
      summary: Approve a sign-up
      description: 'Roles: user administrator. Creates an active account with the confirmed address and the passkey from the sign-up, in the assigned groups in `signUpGroupIds` at the time of approval and no others, with no roles. Identity checks of the sign-up move to the account. While `identityProofingSignUps` applies and the sign-up has no successful identity check, answers `409 ERR_IDENTITY_CHECK_REQUIRED`. Recorded as `user.sign_up.approve`.'
      responses:
        '200': {$ref: '#/components/responses/UserResponse'}
        '401': {$ref: '#/components/responses/Unauthenticated'}
        '403': {$ref: '#/components/responses/Forbidden'}
        '404': {$ref: '#/components/responses/NotFound'}
        '409': {$ref: '#/components/responses/Conflict'}
  /sign-ups/{id}:
    parameters:
      - {$ref: '#/components/parameters/Id'}
    delete:
      tags: [Users]
      operationId: rejectSignUp
      summary: Reject a sign-up
      description: 'Roles: user administrator. Deletes the sign-up and its passkey. The person can sign up again. Recorded as `user.sign_up.reject`.'
      responses:
        '204': {$ref: '#/components/responses/NoContent'}
        '401': {$ref: '#/components/responses/Unauthenticated'}
        '403': {$ref: '#/components/responses/Forbidden'}
        '404': {$ref: '#/components/responses/NotFound'}
  /sign-ups/{id}/identity-proofs:
    parameters:
      - {$ref: '#/components/parameters/Id'}
    post:
      tags: [Users]
      operationId: checkSignUpIdentity
      summary: Record an in-person identity check for a sign-up
      description: 'Roles: user administrator, with a recent sign-in. Records that you checked the person''s identity in person or on a video call, with the kind of document you saw. The check moves to the account when the sign-up is approved, and is deleted with the sign-up when it is rejected. Recorded as `user.identity_proof`.'
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: '#/components/schemas/InPersonCheck'}
      responses:
        '201': {$ref: '#/components/responses/IdentityProofResponse'}
        '400': {$ref: '#/components/responses/BadJSON'}
        '401': {$ref: '#/components/responses/Unauthenticated'}
        '403': {$ref: '#/components/responses/Forbidden'}
        '404': {$ref: '#/components/responses/NotFound'}
        '422': {$ref: '#/components/responses/Invalid'}
  /attributes:
    get:
      tags: [Users]
      operationId: listAttributes
      summary: List the custom user attributes
      description: 'Anyone signed in. Administrators get every attribute, with `people` counted for organization-wide roles and 0 for limited roles. Anyone else gets only the attributes they can change themselves or hold a value for, with `people` 0.'
      responses:
        '200':
          description: The attributes, by display name.
          content:
            application/json:
              schema:
                type: array
                items: {$ref: '#/components/schemas/Attribute'}
        '401': {$ref: '#/components/responses/Unauthenticated'}
    post:
      tags: [Users]
      operationId: createAttribute
      summary: Define a custom user attribute
      description: 'Roles: global administrator. Up to 50 attributes. The name and type can''t be changed later. Writes an `attribute.create` audit event.'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [name, label, type]
              properties:
                name: {type: string, pattern: '^[A-Za-z][A-Za-z0-9_]{0,63}$', description: 'Applications receive values under `attribute.<name>` claim sources, and outbound SCIM under this name in the `urn:ietf:params:scim:schemas:extension:halo:2.0:User` extension.', examples: [employeeNumber]}
                label: {type: string, maxLength: 100, examples: [Employee number]}
                type: {$ref: '#/components/schemas/AttributeType'}
                selfService: {type: boolean, default: false}
      responses:
        '201':
          description: The new attribute.
          content:
            application/json:
              schema: {$ref: '#/components/schemas/Attribute'}
        '400': {$ref: '#/components/responses/BadJSON'}
        '401': {$ref: '#/components/responses/Unauthenticated'}
        '403': {$ref: '#/components/responses/Forbidden'}
        '409': {$ref: '#/components/responses/Conflict'}
        '422': {$ref: '#/components/responses/Invalid'}
  /attributes/{id}:
    parameters:
      - {$ref: '#/components/parameters/Id'}
    patch:
      tags: [Users]
      operationId: updateAttribute
      summary: Rename a custom attribute or change who can edit it
      description: 'Roles: global administrator. Writes an `attribute.update` audit event with the old and new values.'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                label: {type: string, maxLength: 100}
                selfService: {type: boolean}
      responses:
        '200':
          description: The attribute.
          content:
            application/json:
              schema: {$ref: '#/components/schemas/Attribute'}
        '400': {$ref: '#/components/responses/BadJSON'}
        '401': {$ref: '#/components/responses/Unauthenticated'}
        '403': {$ref: '#/components/responses/Forbidden'}
        '404': {$ref: '#/components/responses/NotFound'}
        '422': {$ref: '#/components/responses/Invalid'}
    delete:
      tags: [Users]
      operationId: deleteAttribute
      summary: Delete a custom attribute and every value of it
      description: 'Roles: global administrator. Refused with 409 while an application maps it to a claim. Writes an `attribute.delete` audit event.'
      responses:
        '204': {$ref: '#/components/responses/NoContent'}
        '401': {$ref: '#/components/responses/Unauthenticated'}
        '403': {$ref: '#/components/responses/Forbidden'}
        '404': {$ref: '#/components/responses/NotFound'}
        '409': {$ref: '#/components/responses/Conflict'}
  /groups:
    get:
      tags: [Groups]
      operationId: listGroups
      summary: List every group with its member count
      description: 'Roles: any administrator. Limited roles apply.'
      responses:
        '200':
          description: The groups.
          content:
            application/json:
              schema:
                type: array
                items: {$ref: '#/components/schemas/Group'}
        '401': {$ref: '#/components/responses/Unauthenticated'}
        '403': {$ref: '#/components/responses/Forbidden'}
    post:
      tags: [Groups]
      operationId: createGroup
      summary: Create a group
      description: 'Roles: user administrator.'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [name, kind]
              properties:
                name: {type: string, maxLength: 200}
                description: {type: string, maxLength: 2000}
                kind: {type: string, enum: [assigned, dynamic]}
                rule: {type: string, description: Required for dynamic groups., examples: ['user.department == "Engineering"']}
      responses:
        '201':
          description: The group.
          content:
            application/json:
              schema: {$ref: '#/components/schemas/Group'}
        '400': {$ref: '#/components/responses/BadJSON'}
        '401': {$ref: '#/components/responses/Unauthenticated'}
        '403': {$ref: '#/components/responses/Forbidden'}
        '409': {$ref: '#/components/responses/Conflict'}
        '422': {$ref: '#/components/responses/Invalid'}
  /groups/{id}:
    parameters:
      - {$ref: '#/components/parameters/Id'}
    get:
      tags: [Groups]
      operationId: getGroup
      summary: Get one group
      description: 'Roles: any administrator. Limited roles apply.'
      responses:
        '200':
          description: The group.
          content:
            application/json:
              schema: {$ref: '#/components/schemas/Group'}
        '401': {$ref: '#/components/responses/Unauthenticated'}
        '403': {$ref: '#/components/responses/Forbidden'}
        '404': {$ref: '#/components/responses/NotFound'}
    patch:
      tags: [Groups]
      operationId: updateGroup
      summary: Rename a group, or change its description, rule or who can join
      description: 'Roles: user administrator. The kind cannot change.'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                name: {type: string, maxLength: 200}
                description: {type: string, maxLength: 2000}
                kind: {type: string, enum: [assigned, dynamic], description: Accepted only when it equals the current kind.}
                rule: {type: string, description: Dynamic groups only.}
                joinPolicy: {$ref: '#/components/schemas/JoinPolicy'}
      responses:
        '200':
          description: The updated group.
          content:
            application/json:
              schema: {$ref: '#/components/schemas/Group'}
        '400': {$ref: '#/components/responses/BadJSON'}
        '401': {$ref: '#/components/responses/Unauthenticated'}
        '403': {$ref: '#/components/responses/Forbidden'}
        '404': {$ref: '#/components/responses/NotFound'}
        '409': {$ref: '#/components/responses/Conflict'}
        '422': {$ref: '#/components/responses/Invalid'}
    delete:
      tags: [Groups]
      operationId: deleteGroup
      summary: Delete a group
      description: 'Roles: user administrator. Refused with `409`, naming each one, while an application, access package, policy, identity provider (for accounts created on first sign-in), open access review or lifecycle rule still uses the group, or while an administrator role is limited to it. Completed access reviews are kept with the group''s name.'
      responses:
        '204': {$ref: '#/components/responses/NoContent'}
        '401': {$ref: '#/components/responses/Unauthenticated'}
        '403': {$ref: '#/components/responses/Forbidden'}
        '404': {$ref: '#/components/responses/NotFound'}
        '409': {$ref: '#/components/responses/Conflict'}
  /groups/{id}/members:
    parameters:
      - {$ref: '#/components/parameters/Id'}
    get:
      tags: [Groups]
      operationId: listGroupMembers
      summary: List a group's members, or preview a rule
      description: 'Roles: any administrator. Deprovisioned people are left out. Limited roles apply.'
      parameters:
        - name: rule
          in: query
          description: Dynamic groups only. Returns who would match this rule instead of the saved one.
          schema: {type: string}
      responses:
        '200':
          description: The members.
          content:
            application/json:
              schema:
                type: array
                items: {$ref: '#/components/schemas/User'}
        '401': {$ref: '#/components/responses/Unauthenticated'}
        '403': {$ref: '#/components/responses/Forbidden'}
        '404': {$ref: '#/components/responses/NotFound'}
        '422': {$ref: '#/components/responses/Invalid'}
    post:
      tags: [Groups]
      operationId: addGroupMember
      summary: Add a person to an assigned group
      description: 'Roles: user administrator, or an owner of the group. Adding someone who is already a member succeeds.'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [userId]
              properties:
                userId: {type: string}
      responses:
        '204': {$ref: '#/components/responses/NoContent'}
        '400': {$ref: '#/components/responses/BadJSON'}
        '401': {$ref: '#/components/responses/Unauthenticated'}
        '403': {$ref: '#/components/responses/Forbidden'}
        '404': {$ref: '#/components/responses/NotFound'}
        '409': {$ref: '#/components/responses/DynamicGroup'}
        '422': {$ref: '#/components/responses/Invalid'}
  /groups/{id}/members/{userId}:
    parameters:
      - {$ref: '#/components/parameters/Id'}
      - {$ref: '#/components/parameters/UserId'}
    delete:
      tags: [Groups]
      operationId: removeGroupMember
      summary: Remove a person from an assigned group
      description: 'Roles: user administrator, or an owner of the group.'
      responses:
        '204': {$ref: '#/components/responses/NoContent'}
        '401': {$ref: '#/components/responses/Unauthenticated'}
        '403': {$ref: '#/components/responses/Forbidden'}
        '404': {$ref: '#/components/responses/NotFound'}
        '409': {$ref: '#/components/responses/DynamicGroup'}
  /groups/{id}/members/bulk/add:
    parameters:
      - {$ref: '#/components/parameters/Id'}
    post:
      tags: [Groups]
      operationId: bulkAddGroupMembers
      summary: Add many people to an assigned group
      description: 'Roles: user administrator, or an owner of the group. Runs `POST /groups/{id}/members` for each person, with a result per person. The whole request is refused with `404`, `403` or `409` when the group is missing, not yours or dynamic. Counted under the `bulk` rate limit.'
      requestBody: {$ref: '#/components/requestBodies/BulkUserIds'}
      responses:
        '200': {$ref: '#/components/responses/BulkResults'}
        '400': {$ref: '#/components/responses/BadJSON'}
        '401': {$ref: '#/components/responses/Unauthenticated'}
        '403': {$ref: '#/components/responses/Forbidden'}
        '404': {$ref: '#/components/responses/NotFound'}
        '409': {$ref: '#/components/responses/DynamicGroup'}
  /groups/{id}/members/bulk/remove:
    parameters:
      - {$ref: '#/components/parameters/Id'}
    post:
      tags: [Groups]
      operationId: bulkRemoveGroupMembers
      summary: Remove many people from an assigned group
      description: 'Roles: user administrator, or an owner of the group. Runs `DELETE /groups/{id}/members/{userId}` for each person, with a result per person. Counted under the `bulk` rate limit.'
      requestBody: {$ref: '#/components/requestBodies/BulkUserIds'}
      responses:
        '200': {$ref: '#/components/responses/BulkResults'}
        '400': {$ref: '#/components/responses/BadJSON'}
        '401': {$ref: '#/components/responses/Unauthenticated'}
        '403': {$ref: '#/components/responses/Forbidden'}
        '404': {$ref: '#/components/responses/NotFound'}
        '409': {$ref: '#/components/responses/DynamicGroup'}
  /groups/{id}/owners:
    parameters:
      - {$ref: '#/components/parameters/Id'}
    put:
      tags: [Groups]
      operationId: setGroupOwners
      summary: Replace an assigned group's owners
      description: 'Roles: user administrator. Owners add and remove members of this group and decide requests to join it, without an administrator role. Rule-based groups cannot have owners. A group that takes requests keeps at least one owner.'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [userIds]
              properties:
                userIds:
                  type: array
                  items: {type: string}
      responses:
        '200':
          description: The updated group.
          content:
            application/json:
              schema: {$ref: '#/components/schemas/Group'}
        '400': {$ref: '#/components/responses/BadJSON'}
        '401': {$ref: '#/components/responses/Unauthenticated'}
        '403': {$ref: '#/components/responses/Forbidden'}
        '404': {$ref: '#/components/responses/NotFound'}
        '409': {$ref: '#/components/responses/DynamicGroup'}
        '422': {$ref: '#/components/responses/Invalid'}
  /groups/{id}/join-requests/{userId}/approve:
    parameters:
      - {$ref: '#/components/parameters/Id'}
      - {$ref: '#/components/parameters/UserId'}
    post:
      tags: [Groups]
      operationId: approveJoinRequest
      summary: Add a person who asked to join
      description: 'Roles: user administrator, or an owner of the group.'
      responses:
        '204': {$ref: '#/components/responses/NoContent'}
        '401': {$ref: '#/components/responses/Unauthenticated'}
        '403': {$ref: '#/components/responses/Forbidden'}
        '404': {$ref: '#/components/responses/NotFound'}
  /groups/{id}/join-requests/{userId}/deny:
    parameters:
      - {$ref: '#/components/parameters/Id'}
      - {$ref: '#/components/parameters/UserId'}
    post:
      tags: [Groups]
      operationId: denyJoinRequest
      summary: Decline a request to join
      description: 'Roles: user administrator, or an owner of the group.'
      responses:
        '204': {$ref: '#/components/responses/NoContent'}
        '401': {$ref: '#/components/responses/Unauthenticated'}
        '403': {$ref: '#/components/responses/Forbidden'}
        '404': {$ref: '#/components/responses/NotFound'}
  /applications:
    get:
      tags: [Applications]
      operationId: listApplications
      summary: List every application
      description: 'Roles: any administrator. Includes credentials without secret values, assigned groups and sign-in statistics.'
      responses:
        '200':
          description: The applications.
          content:
            application/json:
              schema:
                type: array
                items: {$ref: '#/components/schemas/Application'}
        '401': {$ref: '#/components/responses/Unauthenticated'}
        '403': {$ref: '#/components/responses/Forbidden'}
    post:
      tags: [Applications]
      operationId: createApplication
      summary: Register an application
      description: 'Roles: application administrator. OpenID Connect and OAuth web applications and services get a client secret, returned once, unless configured for private_key_jwt. Organization client policies apply required protections and cap initial token lifetimes. SAML applications take their settings in `saml` and are always `web`. Forward-auth applications take their protected addresses in `redirectUris`, open the first one from the account portal unless `homepage` is set, have no secret and are always `web`. RADIUS clients take the IP addresses or CIDR ranges they send from in `redirectUris`, get a shared secret returned once in `clientSecret` and are always `web`. LDAP applications get a bind password in `clientSecret`, returned once, take no redirect URIs, scopes or SAML settings and are always `web`. Remote access applications take their host, outpost and sign-in in `remote`, take no homepage, redirect URIs, scopes or SAML settings and are always `web`. Bookmarks only open their `homepage` from the account portal, have no sign-in protocol and are always `web`.'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [name, protocol, type]
              properties:
                name: {type: string, maxLength: 200}
                description: {type: string, maxLength: 2000}
                protocol: {type: string, enum: [oidc, oauth, saml, forward-auth, radius, ldap, remote, bookmark]}
                type: {type: string, enum: [web, spa, native, service]}
                homepage: {type: string, format: uri, description: 'Required for bookmarks: the http or https address the bookmark opens.'}
                redirectUris:
                  type: array
                  description: Required for OpenID Connect applications other than services, for forward-auth applications, where they are the protected addresses with only a scheme and host, and for RADIUS clients, where they are the IP addresses or CIDR ranges the client sends from. URIs are https only, except http://localhost and http://127.0.0.1.
                  items: {type: string, format: uri}
                postLogoutUris:
                  type: array
                  items: {type: string, format: uri}
                scopes:
                  type: array
                  items: {type: string}
                groupIds:
                  type: array
                  items: {type: string}
                tokenEndpointAuthMethod: {type: string, enum: [client_secret_basic, private_key_jwt], description: 'Confidential OpenID Connect and OAuth clients only.'}
                jwks: {type: object, description: 'Public JSON Web Key Set for private_key_jwt. Supply this or jwksUri.'}
                jwksUri: {type: string, format: uri, description: 'HTTPS URL of the public key set for private_key_jwt.'}
                fapi2Profile: {type: boolean, description: 'Requires private_key_jwt and applies the FAPI 2.0 client settings supported by Halo.'}
                setupGuide: {type: string, enum: [grafana, forgejo, aether, generic-oidc, kubernetes, generic-saml, aws-iam-identity-center, slack]}
                saml: {$ref: '#/components/schemas/SAMLInput'}
                remote: {$ref: '#/components/schemas/RemoteSettings'}
      responses:
        '201':
          description: The application and, for web applications and services, the client secret, for RADIUS clients the shared secret, or for LDAP applications the bind password.
          content:
            application/json:
              schema:
                type: object
                required: [application, clientSecret]
                properties:
                  application: {$ref: '#/components/schemas/Application'}
                  clientSecret: {type: [string, 'null'], examples: [hls_…]}
        '400': {$ref: '#/components/responses/BadJSON'}
        '401': {$ref: '#/components/responses/Unauthenticated'}
        '403': {$ref: '#/components/responses/Forbidden'}
        '409': {$ref: '#/components/responses/Conflict'}
        '422': {$ref: '#/components/responses/Invalid'}
  /applications/{id}:
    parameters:
      - {$ref: '#/components/parameters/Id'}
    get:
      tags: [Applications]
      operationId: getApplication
      summary: Get one application
      description: 'Roles: any administrator. SAML applications include a `saml` object, RADIUS clients `radiusPort`, LDAP applications `ldap` and remote access applications `remote`.'
      responses:
        '200': {$ref: '#/components/responses/ApplicationResponse'}
        '401': {$ref: '#/components/responses/Unauthenticated'}
        '403': {$ref: '#/components/responses/Forbidden'}
        '404': {$ref: '#/components/responses/NotFound'}
    patch:
      tags: [Applications]
      operationId: updateApplication
      summary: Change an application
      description: 'Roles: application administrator. Send only the fields to change. SAML applications accept only name, description, homepage, maxAuthAge, owner, groupIds and claimMappings, and RADIUS clients only name, description, homepage, redirectUris, maxAuthAge, owner and groupIds. OpenID Connect applications must keep the `openid` scope.'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                name: {type: string, maxLength: 200}
                description: {type: string, maxLength: 2000}
                homepage: {type: string}
                redirectUris:
                  type: array
                  items: {type: string}
                postLogoutUris:
                  type: array
                  items: {type: string}
                scopes:
                  type: array
                  items: {type: string}
                tokenPolicy:
                  type: object
                  properties:
                    accessTokenTtl: {type: integer, minimum: 60, maximum: 86400}
                    idTokenTtl: {type: integer, minimum: 60, maximum: 86400, description: Services may use 0.}
                    idTokenAlg: {type: string, enum: [RS256, ES256, EdDSA], description: The algorithm ID tokens for this application are signed with.}
                    refreshTokenTtl: {type: integer, minimum: 0, maximum: 7776000, description: 0 stops issuing refresh tokens.}
                    rotation: {type: boolean}
                    exchange: {type: boolean, description: Lets a web or service application exchange people's access tokens at the token endpoint. Single-page and native applications can't turn it on.}
                    exchangeFrom:
                      type: array
                      items: {type: string}
                      description: Replaces the API resources, by id, whose access tokens the application may exchange. Each must be an existing API resource. An empty list accepts no tokens.
                maxAuthAge: {type: integer, minimum: 0, maximum: 7776000, description: 'Seconds, 60 or more. 0 turns it off. Service applications and bookmarks have none.'}
                owner: {type: string, description: Id of a person. An empty string removes the owner.}
                groupIds:
                  type: array
                  items: {type: string}
                  description: Replaces the assigned groups. An empty list removes every assignment.
                requiresConsent: {type: boolean, description: Not for SAML applications or bookmarks.}
                claimMappings:
                  type: array
                  maxItems: 50
                  description: Replaces the claim mappings. Not for service applications or bookmarks. An empty list removes every mapping.
                  items: {$ref: '#/components/schemas/ClaimMapping'}
                backchannelLogoutUri: {type: string, description: 'An https:// URL on a public address, or an empty string to stop sending logout tokens. Not for SAML applications, bookmarks or service applications.'}
                backchannelLogoutSessionRequired: {type: boolean, description: Not for SAML applications, bookmarks or service applications.}
                requirePar: {type: boolean, description: 'Only for OpenID Connect and OAuth applications other than the Halo CLI, and not for service applications.'}
                requirePkce: {type: boolean, description: 'Only for OpenID Connect and OAuth applications other than the Halo CLI, and not for service applications.'}
                requireDpop: {type: boolean, description: Only for OpenID Connect and OAuth applications other than the Halo CLI.}
                kerberosSignIn: {type: boolean, description: 'Not for bookmarks, RADIUS, LDAP or service applications.'}
                tokenEndpointAuthMethod: {type: string, enum: [client_secret_basic, private_key_jwt], description: 'Only for web and service applications. `private_key_jwt` needs `jwks` or `jwksUri`, not both. Recorded as `application.update` with a diff.'}
                jwks: {type: [object, 'null'], description: 'A JSON Web Key Set of 1 to 20 public signing keys: RSA of 2048 bits or more, EC on P-256, P-384 or P-521, or Ed25519. `null` removes it.'}
                jwksUri: {type: string, description: 'An https:// URL on a public address that serves the application''s JSON Web Key Set, or an empty string.'}
                fapi2Profile: {type: boolean, description: 'Only for web and service applications using `private_key_jwt`, with only https redirect URIs. See the FAPI 2.0 security profile in Applications.'}
      responses:
        '200': {$ref: '#/components/responses/ApplicationResponse'}
        '400': {$ref: '#/components/responses/BadJSON'}
        '401': {$ref: '#/components/responses/Unauthenticated'}
        '403': {$ref: '#/components/responses/Forbidden'}
        '404': {$ref: '#/components/responses/NotFound'}
        '422': {$ref: '#/components/responses/Invalid'}
    delete:
      tags: [Applications]
      operationId: deleteApplication
      summary: Delete an application with its credentials and group assignments
      description: 'Roles: application administrator.'
      responses:
        '204': {$ref: '#/components/responses/NoContent'}
        '401': {$ref: '#/components/responses/Unauthenticated'}
        '403': {$ref: '#/components/responses/Forbidden'}
        '404': {$ref: '#/components/responses/NotFound'}
        '409':
          description: '`ERR_BUILT_IN`: the Halo CLI application cannot be deleted; disable it instead.'
          content:
            application/json:
              schema: {$ref: '#/components/schemas/Error'}
  /applications/{id}/secrets:
    parameters:
      - {$ref: '#/components/parameters/Id'}
    post:
      tags: [Applications]
      operationId: rotateClientSecret
      summary: Create a new client secret
      description: 'Roles: application administrator. For RADIUS clients this creates a shared secret. Every older secret stops working 24 hours later. For an LDAP application this replaces the bind password, the previous one stops working at once, and the response has no `credential`. The body is optional.'
      requestBody:
        content:
          application/json:
            schema:
              type: object
              properties:
                label: {type: string, maxLength: 100}
      responses:
        '201':
          description: The new credential and its secret, shown once.
          content:
            application/json:
              schema:
                type: object
                required: [clientSecret]
                properties:
                  credential: {$ref: '#/components/schemas/Credential'}
                  clientSecret: {type: string}
        '400': {$ref: '#/components/responses/BadJSON'}
        '401': {$ref: '#/components/responses/ReauthRequired'}
        '403': {$ref: '#/components/responses/Forbidden'}
        '404': {$ref: '#/components/responses/NotFound'}
        '422': {$ref: '#/components/responses/Invalid'}
  /applications/{id}/secrets/{credentialId}:
    parameters:
      - {$ref: '#/components/parameters/Id'}
      - name: credentialId
        in: path
        required: true
        schema: {type: string}
    delete:
      tags: [Applications]
      operationId: revokeClientSecret
      summary: Revoke a client secret immediately
      description: 'Roles: application administrator.'
      responses:
        '204': {$ref: '#/components/responses/NoContent'}
        '401': {$ref: '#/components/responses/Unauthenticated'}
        '403': {$ref: '#/components/responses/Forbidden'}
        '404': {$ref: '#/components/responses/NotFound'}
  /applications/{id}/disable:
    parameters:
      - {$ref: '#/components/parameters/Id'}
    post:
      tags: [Applications]
      operationId: disableApplication
      summary: Stop sign-in and revoke every token issued to the application
      description: 'Roles: application administrator.'
      responses:
        '200': {$ref: '#/components/responses/ApplicationResponse'}
        '401': {$ref: '#/components/responses/Unauthenticated'}
        '403': {$ref: '#/components/responses/Forbidden'}
        '404': {$ref: '#/components/responses/NotFound'}
  /applications/{id}/enable:
    parameters:
      - {$ref: '#/components/parameters/Id'}
    post:
      tags: [Applications]
      operationId: enableApplication
      summary: Allow sign-in again
      description: 'Roles: application administrator. For a client with `awaitingApproval`, this approves it and records `application.registration.approve`. The body must then carry the `redirectUris` and `postLogoutUris` the administrator reviewed; if the client changed them since, the response is `409` and nothing is approved.'
      requestBody:
        required: false
        content:
          application/json:
            schema:
              type: object
              properties:
                redirectUris: {type: array, items: {type: string}}
                postLogoutUris: {type: array, items: {type: string}}
      responses:
        '200': {$ref: '#/components/responses/ApplicationResponse'}
        '401': {$ref: '#/components/responses/Unauthenticated'}
        '403': {$ref: '#/components/responses/Forbidden'}
        '404': {$ref: '#/components/responses/NotFound'}
  /applications/{id}/groups:
    parameters:
      - {$ref: '#/components/parameters/Id'}
    put:
      tags: [Applications]
      operationId: setApplicationGroups
      summary: Replace the groups assigned to an application
      description: 'Roles: application administrator. Send the complete list; an empty list removes every assignment.'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [groupIds]
              properties:
                groupIds:
                  type: array
                  items: {type: string}
      responses:
        '200': {$ref: '#/components/responses/ApplicationResponse'}
        '400': {$ref: '#/components/responses/BadJSON'}
        '401': {$ref: '#/components/responses/Unauthenticated'}
        '403': {$ref: '#/components/responses/Forbidden'}
        '404': {$ref: '#/components/responses/NotFound'}
        '422': {$ref: '#/components/responses/Invalid'}
  /applications/{id}/roles:
    parameters:
      - {$ref: '#/components/parameters/Id'}
    post:
      tags: [Applications]
      operationId: createApplicationRole
      summary: Define a role in an application
      description: 'Roles: application administrator. Not for service applications or bookmarks. People and members of the groups receive the key in a `roles` claim in ID tokens, userinfo and JWT access tokens, a `roles` SAML attribute and the SCIM `roles` attribute. A role doesn''t let anyone sign in: the groups assigned to the application still decide that. Writes an `application.role.create` audit event.'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [key, name]
              properties:
                key: {type: string, pattern: '^[A-Za-z][A-Za-z0-9_.:-]{0,63}$', description: What the application receives. Can't be changed later., examples: [billing.admin]}
                name: {type: string, maxLength: 100, examples: [Billing administrator]}
                description: {type: string, maxLength: 500}
                groupIds:
                  type: array
                  items: {type: string}
                userIds:
                  type: array
                  maxItems: 200
                  items: {type: string}
      responses:
        '201':
          description: The role.
          content:
            application/json:
              schema: {$ref: '#/components/schemas/ApplicationRole'}
        '400': {$ref: '#/components/responses/BadJSON'}
        '401': {$ref: '#/components/responses/Unauthenticated'}
        '403': {$ref: '#/components/responses/Forbidden'}
        '404': {$ref: '#/components/responses/NotFound'}
        '409': {$ref: '#/components/responses/Conflict'}
        '422': {$ref: '#/components/responses/Invalid'}
  /applications/{id}/roles/{roleId}:
    parameters:
      - {$ref: '#/components/parameters/Id'}
      - name: roleId
        in: path
        required: true
        schema: {type: string}
    patch:
      tags: [Applications]
      operationId: updateApplicationRole
      summary: Rename an application role or change who holds it
      description: 'Roles: application administrator. Send only the fields to change; `groupIds` and `userIds` replace the whole list. The key can''t be changed. Writes an `application.role.update` audit event with the old and new values.'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                name: {type: string, maxLength: 100}
                description: {type: string, maxLength: 500}
                groupIds:
                  type: array
                  items: {type: string}
                userIds:
                  type: array
                  maxItems: 200
                  items: {type: string}
      responses:
        '200':
          description: The role.
          content:
            application/json:
              schema: {$ref: '#/components/schemas/ApplicationRole'}
        '400': {$ref: '#/components/responses/BadJSON'}
        '401': {$ref: '#/components/responses/Unauthenticated'}
        '403': {$ref: '#/components/responses/Forbidden'}
        '404': {$ref: '#/components/responses/NotFound'}
        '422': {$ref: '#/components/responses/Invalid'}
    delete:
      tags: [Applications]
      operationId: deleteApplicationRole
      summary: Delete an application role and its assignments
      description: 'Roles: application administrator. The role leaves tokens and assertions issued from now on. Writes an `application.role.delete` audit event.'
      responses:
        '204': {$ref: '#/components/responses/NoContent'}
        '401': {$ref: '#/components/responses/Unauthenticated'}
        '403': {$ref: '#/components/responses/Forbidden'}
        '404': {$ref: '#/components/responses/NotFound'}
  /applications/{id}/authorization:
    parameters:
      - {$ref: '#/components/parameters/Id'}
    get:
      tags: [Authorization]
      operationId: getAuthorizationModel
      summary: Get an application's authorization model
      description: 'Roles: any administrator. An application without a model answers with empty `types` and a null `updatedAt`.'
      responses:
        '200':
          description: The model.
          content:
            application/json:
              schema: {$ref: '#/components/schemas/AuthorizationModel'}
        '401': {$ref: '#/components/responses/Unauthenticated'}
        '403': {$ref: '#/components/responses/Forbidden'}
        '404': {$ref: '#/components/responses/NotFound'}
    put:
      tags: [Authorization]
      operationId: saveAuthorizationModel
      summary: Replace an application's authorization model
      description: 'Roles: application administrator. Only web and service applications with OpenID Connect or OAuth. Type and relation names start with a lowercase letter and hold up to 64 lowercase letters, digits, dashes and underscores; `user` and `group` are Halo''s. Up to 50 types and 500 relations. Every relation needs `subjects`, `union`, `roles` or `from`, and each must point at something in the model or at a role of the application. Existing tuples stay; tuples whose subjects a relation no longer takes are ignored. Writes an `application.authorization.update` audit event with the old and new model.'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [types]
              properties:
                types: {$ref: '#/components/schemas/AuthorizationTypes'}
      responses:
        '200':
          description: The saved model.
          content:
            application/json:
              schema: {$ref: '#/components/schemas/AuthorizationModel'}
        '400': {$ref: '#/components/responses/BadJSON'}
        '401': {$ref: '#/components/responses/Unauthenticated'}
        '403': {$ref: '#/components/responses/Forbidden'}
        '404': {$ref: '#/components/responses/NotFound'}
        '422': {$ref: '#/components/responses/Invalid'}
    delete:
      tags: [Authorization]
      operationId: deleteAuthorizationModel
      summary: Remove an application's authorization model and all its tuples
      description: 'Roles: application administrator. The application''s `/authz` requests answer `403` with `ERR_NO_MODEL` from then on. Writes an `application.authorization.delete` audit event with the number of tuples removed.'
      responses:
        '204': {$ref: '#/components/responses/NoContent'}
        '401': {$ref: '#/components/responses/Unauthenticated'}
        '403': {$ref: '#/components/responses/Forbidden'}
        '404': {$ref: '#/components/responses/NotFound'}
  /applications/{id}/authorization/check:
    parameters:
      - {$ref: '#/components/parameters/Id'}
    post:
      tags: [Authorization]
      operationId: inspectAuthorizationCheck
      summary: Run a check for an application from the console
      description: 'Roles: any administrator. The same answer the application gets from `POST /authz/check`, for checking a model and its tuples.'
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: '#/components/schemas/AuthorizationCheck'}
      responses:
        '200':
          description: The answer.
          content:
            application/json:
              schema: {$ref: '#/components/schemas/AuthorizationAnswer'}
        '400': {$ref: '#/components/responses/BadJSON'}
        '401': {$ref: '#/components/responses/Unauthenticated'}
        '403': {$ref: '#/components/responses/Forbidden'}
        '404': {$ref: '#/components/responses/NotFound'}
        '422': {$ref: '#/components/responses/AuthorizationInvalid'}
  /authz/check:
    post:
      tags: [Authorization]
      operationId: checkPermission
      summary: Ask whether a person has a relation on an object
      description: 'The calling application''s model and tuples answer. People who don''t exist, are suspended or deprovisioned, or aren''t assigned to the application are denied, and tuples naming groups the application isn''t assigned are ignored. `path` shows the relations that granted it, ending with the person, group or role, such as `["document:readme#viewer", "folder:eng#viewer", "group:grp_…"]`.'
      security:
        - applicationClient: []
        - applicationAssertion: []
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: '#/components/schemas/AuthorizationCheck'}
      responses:
        '200':
          description: The answer.
          content:
            application/json:
              schema: {$ref: '#/components/schemas/AuthorizationAnswer'}
        '400': {$ref: '#/components/responses/BadJSON'}
        '401': {$ref: '#/components/responses/ApplicationUnauthenticated'}
        '403': {$ref: '#/components/responses/NoModel'}
        '422': {$ref: '#/components/responses/AuthorizationInvalid'}
  /authz/expand:
    post:
      tags: [Authorization]
      operationId: expandRelation
      summary: Show the tree of who has a relation on an object
      description: 'For debugging. Each node lists the people, groups and roles that hold the relation directly, and children for the usersets, unions and parents it follows. A node already shown elsewhere in the tree appears again without children. People and groups no longer assigned to the application are left out.'
      security:
        - applicationClient: []
        - applicationAssertion: []
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: '#/components/schemas/AuthorizationTarget'}
      responses:
        '200':
          description: The tree.
          content:
            application/json:
              schema: {$ref: '#/components/schemas/AuthorizationNode'}
        '400': {$ref: '#/components/responses/BadJSON'}
        '401': {$ref: '#/components/responses/ApplicationUnauthenticated'}
        '403': {$ref: '#/components/responses/NoModel'}
        '422': {$ref: '#/components/responses/AuthorizationInvalid'}
  /authz/list-subjects:
    post:
      tags: [Authorization]
      operationId: listSubjects
      summary: List the people who have a relation on an object
      description: 'Groups and roles expand to their current members and holders. Suspended and deprovisioned people and people not assigned to the application are left out, and groups the application isn''t assigned don''t expand. Up to 1,000 people; `truncated` says whether there were more.'
      security:
        - applicationClient: []
        - applicationAssertion: []
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: '#/components/schemas/AuthorizationTarget'}
      responses:
        '200':
          description: The people, as `user:id`.
          content:
            application/json:
              schema:
                type: object
                required: [subjects, truncated]
                properties:
                  subjects:
                    type: array
                    items: {type: string, examples: ['user:usr_01J9Z8Q4M2N5P7R9T1V3X5Z7B9']}
                  truncated: {type: boolean}
        '400': {$ref: '#/components/responses/BadJSON'}
        '401': {$ref: '#/components/responses/ApplicationUnauthenticated'}
        '403': {$ref: '#/components/responses/NoModel'}
        '422': {$ref: '#/components/responses/AuthorizationInvalid'}
  /authz/list-objects:
    post:
      tags: [Authorization]
      operationId: listObjects
      summary: List the objects of a type on which a person has a relation
      description: 'Halo checks the first 1,000 objects of the type that appear in the application''s tuples, in order of their ids; `truncated` says whether there were more.'
      security:
        - applicationClient: []
        - applicationAssertion: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [type, relation, subject]
              properties:
                type: {type: string, examples: [document]}
                relation: {type: string, examples: [viewer]}
                subject: {type: string, examples: ['user:usr_01J9Z8Q4M2N5P7R9T1V3X5Z7B9']}
      responses:
        '200':
          description: The objects, as `type:id`.
          content:
            application/json:
              schema:
                type: object
                required: [objects, truncated]
                properties:
                  objects:
                    type: array
                    items: {type: string, examples: ['document:readme']}
                  truncated: {type: boolean}
        '400': {$ref: '#/components/responses/BadJSON'}
        '401': {$ref: '#/components/responses/ApplicationUnauthenticated'}
        '403': {$ref: '#/components/responses/NoModel'}
        '422': {$ref: '#/components/responses/AuthorizationInvalid'}
  /authz/tuples:
    get:
      tags: [Authorization]
      operationId: readTuples
      summary: Read the application's tuples
      description: 'Up to 1,000 tuples in order of object, relation and subject; `truncated` says whether there were more. Every filter is optional.'
      security:
        - applicationClient: []
        - applicationAssertion: []
      parameters:
        - {name: object, in: query, schema: {type: string, examples: [document, 'document:readme']}, description: A type, or an object as `type:id`.}
        - {name: relation, in: query, schema: {type: string}}
        - {name: subject, in: query, schema: {type: string, examples: ['user:usr_01J9Z8Q4M2N5P7R9T1V3X5Z7B9', 'team:design#member']}}
      responses:
        '200':
          description: The tuples.
          content:
            application/json:
              schema:
                type: object
                required: [tuples, truncated]
                properties:
                  tuples:
                    type: array
                    items: {$ref: '#/components/schemas/Tuple'}
                  truncated: {type: boolean}
        '401': {$ref: '#/components/responses/ApplicationUnauthenticated'}
        '403': {$ref: '#/components/responses/NoModel'}
        '422': {$ref: '#/components/responses/Invalid'}
    post:
      tags: [Authorization]
      operationId: writeTuples
      summary: Write and delete tuples in one transaction
      description: 'Up to 100 writes and deletes together. Deletes run first. Writing a tuple that exists does nothing, and neither does deleting one that doesn''t. Each written tuple must fit the model: its relation takes the kind of subject, such as `user`, `group`, `folder` or `team#member`. People and groups are named by their Halo ids and must be assigned to the application: one of its groups or a member of one. Others are refused with `422`. Deletes don''t check the model, so tuples a changed model no longer takes can still be removed.'
      security:
        - applicationClient: []
        - applicationAssertion: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                writes:
                  type: array
                  items: {$ref: '#/components/schemas/TupleKey'}
                deletes:
                  type: array
                  items: {$ref: '#/components/schemas/TupleKey'}
      responses:
        '204': {$ref: '#/components/responses/NoContent'}
        '400': {$ref: '#/components/responses/BadJSON'}
        '401': {$ref: '#/components/responses/ApplicationUnauthenticated'}
        '403': {$ref: '#/components/responses/NoModel'}
        '422': {$ref: '#/components/responses/Invalid'}
  /applications/{id}/logo:
    parameters:
      - {$ref: '#/components/parameters/Id'}
    get:
      tags: [Applications]
      operationId: getApplicationLogo
      summary: Get an application's logo
      description: No authentication, so the sign-in page can show it. The `v` query is a cache version. The response carries a Content-Security-Policy with `sandbox`, so scripts in an SVG logo do not run when the URL is opened directly.
      security: []
      responses:
        '200':
          description: The logo. Cached for one day.
          content:
            image/png:
              schema: {type: string, contentMediaType: image/png}
            image/jpeg:
              schema: {type: string, contentMediaType: image/jpeg}
            image/webp:
              schema: {type: string, contentMediaType: image/webp}
            image/svg+xml:
              schema: {type: string, contentMediaType: image/svg+xml}
        '404': {$ref: '#/components/responses/NotFound'}
    put:
      tags: [Applications]
      operationId: uploadApplicationLogo
      summary: Set an application's logo
      description: 'Roles: application administrator. Send the image bytes as the body: PNG, JPEG, WebP or SVG, at most 512 KB. Halo detects the type from the content; an SVG needs the SVG namespace on its root element.'
      requestBody:
        required: true
        content:
          image/png:
            schema: {type: string, contentMediaType: image/png}
          image/jpeg:
            schema: {type: string, contentMediaType: image/jpeg}
          image/webp:
            schema: {type: string, contentMediaType: image/webp}
          image/svg+xml:
            schema: {type: string, contentMediaType: image/svg+xml}
      responses:
        '200':
          description: The logo URL, including a version so caches fetch the new image.
          content:
            application/json:
              schema:
                type: object
                required: [logoUrl]
                properties:
                  logoUrl: {type: string, examples: ['/api/v1/applications/app_01J9Z8Q4M2N5P7R9T1V3X5Z7B9/logo?v=1790000000']}
        '401': {$ref: '#/components/responses/Unauthenticated'}
        '403': {$ref: '#/components/responses/Forbidden'}
        '404': {$ref: '#/components/responses/NotFound'}
        '413':
          description: '`ERR_TOO_LARGE`: the image is larger than 512 KB.'
          content:
            application/json:
              schema: {$ref: '#/components/schemas/Error'}
        '422': {$ref: '#/components/responses/Invalid'}
    delete:
      tags: [Applications]
      operationId: removeApplicationLogo
      summary: Remove an application's logo
      description: 'Roles: application administrator.'
      responses:
        '200':
          description: The logo was removed.
          content:
