  /access-requests/{id}/deny:
    parameters:
      - {$ref: '#/components/parameters/Id'}
    post:
      tags: [Access requests]
      operationId: denyAccessRequest
      summary: Deny a pending request
      description: 'Roles: an approver of the current stage or a global administrator, who is neither the beneficiary nor the person who asked. A denial at any stage ends the request. Emails the beneficiary. The body is optional.'
      requestBody: {$ref: '#/components/requestBodies/DecisionNote'}
      responses:
        '200': {$ref: '#/components/responses/AccessRequestResponse'}
        '400': {$ref: '#/components/responses/BadJSON'}
        '401': {$ref: '#/components/responses/Unauthenticated'}
        '403': {$ref: '#/components/responses/DecisionForbidden'}
        '404': {$ref: '#/components/responses/NotFound'}
        '409': {$ref: '#/components/responses/Conflict'}
        '422': {$ref: '#/components/responses/Invalid'}
  /access-requests/{id}/revoke:
    parameters:
      - {$ref: '#/components/parameters/Id'}
    post:
      tags: [Access requests]
      operationId: revokeAccessGrant
      summary: End an active grant early
      description: 'Roles: user administrator. Removes the group memberships the grant added, unless another active grant still covers them.'
      responses:
        '200': {$ref: '#/components/responses/AccessRequestResponse'}
        '401': {$ref: '#/components/responses/Unauthenticated'}
        '403': {$ref: '#/components/responses/Forbidden'}
        '404': {$ref: '#/components/responses/NotFound'}
        '409': {$ref: '#/components/responses/Conflict'}
  /approvals:
    get:
      tags: [Approvals]
      operationId: listApprovals
      summary: List changes waiting for approval and past decisions
      description: 'Roles: any administrator. `canDecide` says whether you may approve or reject each one.'
      responses:
        '200':
          description: The 500 most recent requests, newest first.
          content:
            application/json:
              schema:
                type: array
                items: {$ref: '#/components/schemas/ApprovalRequest'}
        '401': {$ref: '#/components/responses/Unauthenticated'}
        '403': {$ref: '#/components/responses/Forbidden'}
  /approvals/{id}/approve:
    parameters:
      - {$ref: '#/components/parameters/Id'}
    post:
      tags: [Approvals]
      operationId: approveChange
      summary: Approve a change and apply it
      description: 'Roles: a global administrator who is not the requester, signed in to the console; API keys cannot decide. Applies the saved change once, as the requester. If the target changed since the request, or the change no longer passes validation, nothing is applied, the request becomes `failed`, `approval.fail` is recorded and the response is `ERR_NOT_APPLIED`.'
      responses:
        '200': {$ref: '#/components/responses/ApprovalResponse'}
        '401': {$ref: '#/components/responses/ReauthRequired'}
        '403': {$ref: '#/components/responses/ApprovalForbidden'}
        '404': {$ref: '#/components/responses/NotFound'}
        '409':
          description: '`ERR_CONFLICT`: the request was already decided or has expired. `ERR_NOT_APPLIED`: the request was approved but the change could not be applied.'
          content:
            application/json:
              schema: {$ref: '#/components/schemas/Error'}
  /approvals/{id}/reject:
    parameters:
      - {$ref: '#/components/parameters/Id'}
    post:
      tags: [Approvals]
      operationId: rejectChange
      summary: Reject a change
      description: 'Roles: a global administrator who is not the requester, signed in to the console; API keys cannot decide.'
      responses:
        '200': {$ref: '#/components/responses/ApprovalResponse'}
        '401': {$ref: '#/components/responses/Unauthenticated'}
        '403': {$ref: '#/components/responses/ApprovalForbidden'}
        '404': {$ref: '#/components/responses/NotFound'}
        '409': {$ref: '#/components/responses/Conflict'}
  /access-reviews:
    get:
      tags: [Access reviews]
      operationId: listAccessReviews
      summary: List every access review
      description: 'Roles: any administrator. Items are left out; get a single review for them.'
      responses:
        '200':
          description: The reviews.
          content:
            application/json:
              schema:
                type: array
                items: {$ref: '#/components/schemas/AccessReview'}
        '401': {$ref: '#/components/responses/Unauthenticated'}
        '403': {$ref: '#/components/responses/Forbidden'}
    post:
      tags: [Access reviews]
      operationId: createAccessReview
      summary: Start an access review of an assigned group
      description: 'Roles: user administrator. Every current member who is not deprovisioned becomes an item.'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [name, groupId, reviewerIds, dueAt]
              properties:
                name: {type: string, maxLength: 200}
                groupId: {type: string, description: An assigned group with at least one member.}
                reviewerIds:
                  type: array
                  minItems: 1
                  items: {type: string}
                dueAt: {type: string, format: date-time, description: In the future and within one year.}
                autoApply: {type: boolean, description: Remove people marked for removal when the review is completed.}
      responses:
        '201': {$ref: '#/components/responses/AccessReviewResponse'}
        '400': {$ref: '#/components/responses/BadJSON'}
        '401': {$ref: '#/components/responses/Unauthenticated'}
        '403': {$ref: '#/components/responses/Forbidden'}
        '422': {$ref: '#/components/responses/Invalid'}
  /access-reviews/{id}:
    parameters:
      - {$ref: '#/components/parameters/Id'}
    get:
      tags: [Access reviews]
      operationId: getAccessReview
      summary: Get a review with its items
      description: 'Roles: a reviewer of this review, or any administrator. Others get `404`.'
      security: &signedIn
        - session: []
        - apiKey: []
      responses:
        '200': {$ref: '#/components/responses/AccessReviewResponse'}
        '401': {$ref: '#/components/responses/Unauthenticated'}
        '404': {$ref: '#/components/responses/NotFound'}
  /access-reviews/{id}/decisions/{userId}:
    parameters:
      - {$ref: '#/components/parameters/Id'}
      - {$ref: '#/components/parameters/UserId'}
    put:
      tags: [Access reviews]
      operationId: decideReviewItem
      summary: Record whether a member keeps access
      description: 'Roles: a reviewer of this review, or a global administrator. A decision can change until the review is completed.'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [decision]
              properties:
                decision: {type: string, enum: [keep, remove]}
                note: {type: string, maxLength: 2000}
      responses:
        '200': {$ref: '#/components/responses/AccessReviewResponse'}
        '400': {$ref: '#/components/responses/BadJSON'}
        '401': {$ref: '#/components/responses/Unauthenticated'}
        '403': {$ref: '#/components/responses/Forbidden'}
        '404': {$ref: '#/components/responses/NotFound'}
        '409': {$ref: '#/components/responses/Conflict'}
        '422': {$ref: '#/components/responses/Invalid'}
  /access-reviews/{id}/complete:
    parameters:
      - {$ref: '#/components/parameters/Id'}
    post:
      tags: [Access reviews]
      operationId: completeAccessReview
      summary: Complete a review
      description: 'Roles: a reviewer of this review, or a user administrator. With `autoApply`, removes the people marked for removal from the group. Members without a decision keep access.'
      responses:
        '200': {$ref: '#/components/responses/AccessReviewResponse'}
        '401': {$ref: '#/components/responses/Unauthenticated'}
        '403': {$ref: '#/components/responses/Forbidden'}
        '404': {$ref: '#/components/responses/NotFound'}
        '409': {$ref: '#/components/responses/Conflict'}
  /lifecycle/rules:
    get:
      tags: [Lifecycle]
      operationId: listLifecycleRules
      summary: List lifecycle rules
      description: 'Roles: any administrator.'
      responses:
        '200':
          description: The rules.
          content:
            application/json:
              schema:
                type: array
                items: {$ref: '#/components/schemas/LifecycleRule'}
        '401': {$ref: '#/components/responses/Unauthenticated'}
        '403': {$ref: '#/components/responses/Forbidden'}
    post:
      tags: [Lifecycle]
      operationId: createLifecycleRule
      summary: Create a lifecycle rule
      description: 'Roles: user administrator.'
      requestBody: {$ref: '#/components/requestBodies/LifecycleRuleInput'}
      responses:
        '201': {$ref: '#/components/responses/LifecycleRuleResponse'}
        '400': {$ref: '#/components/responses/BadJSON'}
        '401': {$ref: '#/components/responses/Unauthenticated'}
        '403': {$ref: '#/components/responses/Forbidden'}
        '422': {$ref: '#/components/responses/Invalid'}
  /lifecycle/rules/{id}:
    parameters:
      - {$ref: '#/components/parameters/Id'}
    put:
      tags: [Lifecycle]
      operationId: updateLifecycleRule
      summary: Replace a lifecycle rule
      description: 'Roles: user administrator. Set `enabled` to false to pause a rule and keep its history.'
      requestBody: {$ref: '#/components/requestBodies/LifecycleRuleInput'}
      responses:
        '200': {$ref: '#/components/responses/LifecycleRuleResponse'}
        '400': {$ref: '#/components/responses/BadJSON'}
        '401': {$ref: '#/components/responses/Unauthenticated'}
        '403': {$ref: '#/components/responses/Forbidden'}
        '404': {$ref: '#/components/responses/NotFound'}
        '422': {$ref: '#/components/responses/Invalid'}
    delete:
      tags: [Lifecycle]
      operationId: deleteLifecycleRule
      summary: Delete a lifecycle rule
      description: 'Roles: user administrator. Also removes the rule''s runs from the run history; the audit log keeps an event for each run. Writes an audit event.'
      responses:
        '204': {$ref: '#/components/responses/NoContent'}
        '401': {$ref: '#/components/responses/Unauthenticated'}
        '403': {$ref: '#/components/responses/Forbidden'}
        '404': {$ref: '#/components/responses/NotFound'}
  /lifecycle/preview:
    post:
      tags: [Lifecycle]
      operationId: previewLifecycleRule
      summary: Preview who a date or inactivity rule would run for
      description: 'Roles: user administrator. Takes the same body as creating a rule and lists the people the rule would run for if Halo checked now. Writes nothing: no runs, no audit events, no changes to anyone.'
      parameters:
        - name: rule
          in: query
          required: false
          description: The ID of a saved rule, to leave out people it already ran for.
          schema: {type: string}
      requestBody: {$ref: '#/components/requestBodies/LifecycleRuleInput'}
      responses:
        '200':
          description: The people the rule would run for.
          content:
            application/json:
              schema:
                type: array
                items:
                  type: object
                  required: [user, change]
                  properties:
                    user: {$ref: '#/components/schemas/NamedRef'}
                    change: {type: string, examples: ['Last signed in 2026-08-13, 100 days ago']}
        '400': {$ref: '#/components/responses/BadJSON'}
        '401': {$ref: '#/components/responses/Unauthenticated'}
        '403': {$ref: '#/components/responses/Forbidden'}
        '422': {$ref: '#/components/responses/Invalid'}
  /lifecycle/runs:
    get:
      tags: [Lifecycle]
      operationId: listLifecycleRuns
      summary: List the 500 most recent lifecycle runs
      description: 'Roles: any administrator.'
      responses:
        '200':
          description: The runs, newest first.
          content:
            application/json:
              schema:
                type: array
                items: {$ref: '#/components/schemas/LifecycleRun'}
        '401': {$ref: '#/components/responses/Unauthenticated'}
        '403': {$ref: '#/components/responses/Forbidden'}
  /policies:
    get:
      tags: [Policies]
      operationId: listPolicies
      summary: List access policies with their activity in the past 24 hours
      description: 'Roles: any administrator.'
      responses:
        '200':
          description: The policies in their saved order.
          content:
            application/json:
              schema:
                type: array
                items: {$ref: '#/components/schemas/Policy'}
        '401': {$ref: '#/components/responses/Unauthenticated'}
        '403': {$ref: '#/components/responses/Forbidden'}
    post:
      tags: [Policies]
      operationId: createPolicy
      summary: Create an access policy
      description: 'Roles: security administrator. An enforced policy that blocks or requires a passkey is refused with `ERR_LOCKOUT` when afterwards no active global administrator, emergency access account or you could sign in to Halo from your network and device with a method they have.'
      requestBody: {$ref: '#/components/requestBodies/PolicyInput'}
      responses:
        '201': {$ref: '#/components/responses/PolicyResponse'}
        '400': {$ref: '#/components/responses/BadJSON'}
        '401': {$ref: '#/components/responses/ReauthRequired'}
        '403': {$ref: '#/components/responses/Forbidden'}
        '409': {$ref: '#/components/responses/Conflict'}
        '422': {$ref: '#/components/responses/Invalid'}
  /policies/order:
    put:
      tags: [Policies]
      operationId: reorderPolicies
      summary: Change the order of the policies
      description: 'Roles: security administrator. Send every policy id exactly once. Refused with `ERR_LOCKOUT` like creating a policy, although the order never changes whether a sign-in is blocked: the most restrictive matching policy decides.'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [ids]
              properties:
                ids:
                  type: array
                  items: {type: string}
      responses:
        '204': {$ref: '#/components/responses/NoContent'}
        '400': {$ref: '#/components/responses/BadJSON'}
        '401': {$ref: '#/components/responses/ReauthRequired'}
        '403': {$ref: '#/components/responses/Forbidden'}
        '409': {$ref: '#/components/responses/Conflict'}
        '422': {$ref: '#/components/responses/Invalid'}
  /policies/simulate:
    post:
      tags: [Policies]
      operationId: simulatePolicies
      summary: Show what the policies would decide for a sign-in
      description: 'Roles: any administrator. Records nothing.'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [userId, appId, ip, method, deviceTrust]
              properties:
                userId: {type: string}
                appId: {type: string, description: 'An application id, or `halo` for the console and account portal.'}
                ip: {type: string, examples: [203.0.113.7]}
                method: {$ref: '#/components/schemas/MethodKind'}
                deviceTrust: {type: string, enum: [unknown, trusted, blocked]}
                deviceCompliance: {type: string, enum: [unknown, compliant, non-compliant], default: unknown}
      responses:
        '200':
          description: The decision, the risk signals and each policy's result.
          content:
            application/json:
              schema: {$ref: '#/components/schemas/Simulation'}
        '400': {$ref: '#/components/responses/BadJSON'}
        '401': {$ref: '#/components/responses/Unauthenticated'}
        '403': {$ref: '#/components/responses/Forbidden'}
        '422': {$ref: '#/components/responses/Invalid'}
  /policies/{id}:
    parameters:
      - {$ref: '#/components/parameters/Id'}
