    parameters:
      - {$ref: '#/components/parameters/Id'}
    post:
      tags: [Service accounts]
      operationId: createFederatedCredential
      summary: Trust a workload's tokens
      description: 'Roles: security administrator, holding every role of the account. Workloads whose tokens match the issuer, subject, audience and every claim condition exactly can sign in as the account at `POST /oauth2/token`. Recorded as `federated_credential.create`.'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [name, issuer, subject, scopes]
              properties:
                name: {type: string, maxLength: 100, examples: [Deploy workflow]}
                issuer: {type: string, format: uri, maxLength: 500, examples: ['https://token.actions.githubusercontent.com'], description: 'The `iss` claim, exactly. Must start with `https://`.'}
                subject: {type: string, maxLength: 500, examples: ['repo:acme/infra:ref:refs/heads/main', 'system:serviceaccount:ci:deployer'], description: 'The `sub` claim, exactly.'}
                audience: {type: string, maxLength: 500, description: 'A value the `aud` claim must contain. Defaults to the Halo URL.'}
                conditions:
                  type: object
                  maxProperties: 20
                  additionalProperties: {type: string, maxLength: 500}
                  examples: [{repository_owner_id: '1342004'}]
                  description: Top-level string claims and the exact value each must have.
                scopes:
                  type: array
                  minItems: 1
                  items: {type: string, enum: [api, scim, registration]}
      responses:
