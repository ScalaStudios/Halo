        '403': {$ref: '#/components/responses/Forbidden'}
        '404': {$ref: '#/components/responses/NotConfigured'}
        '422':
          description: '`ERR_TOKEN_UNREADABLE`: the saved token cannot be decrypted with the current `HALO_SECRET_KEY`. `ERR_INVALID`: the application cannot be provisioned.'
          content:
            application/json:
              schema: {$ref: '#/components/schemas/Error'}
        '502':
          description: '`ERR_SCIM_CONNECTION`: the endpoint could not be reached or answered with an error.'
          content:
            application/json:
              schema: {$ref: '#/components/schemas/Error'}
  /provisioning/applications/{id}/sync:
    parameters:
      - {$ref: '#/components/parameters/Id'}
    post:
      tags: [Provisioning]
      operationId: syncProvisioning
      summary: Push the assigned people and selected groups now
      description: 'Roles: application administrator. Runs even when provisioning is paused. Failures are reported in `lastError` with status 200.'
      responses:
        '200': {$ref: '#/components/responses/AppProvisioningResponse'}
        '401': {$ref: '#/components/responses/Unauthenticated'}
        '403': {$ref: '#/components/responses/Forbidden'}
        '404': {$ref: '#/components/responses/NotConfigured'}
        '422': {$ref: '#/components/responses/Invalid'}
  /ldap-directories:
    get:
      tags: [Provisioning]
      operationId: listLDAPDirectories
      summary: List LDAP directories
      description: 'Roles: any administrator. Bind passwords are never returned.'
      responses:
        '200':
          description: The directories, by name.
          content:
            application/json:
              schema:
                type: array
                items: {$ref: '#/components/schemas/LDAPDirectory'}
        '401': {$ref: '#/components/responses/Unauthenticated'}
        '403': {$ref: '#/components/responses/Forbidden'}
    post:
      tags: [Provisioning]
      operationId: createLDAPDirectory
      summary: Add an LDAP directory to sync people and groups from
      description: 'Roles: user administrator (not limited to groups), with a recent sign-in. Halo reads the directory with a read-only bind account and never writes to it or creates passwords. The bind password is stored sealed with `HALO_SECRET_KEY` and re-sealed when the key rotates. Saving doesn''t sync: preview with `POST /ldap-directories/{id}/sync?dryRun=true`, then turn on `enabled` or sync now.'
      requestBody: {$ref: '#/components/requestBodies/LDAPDirectoryInput'}
      responses:
        '201':
          description: The directory.
          content:
            application/json:
              schema: {$ref: '#/components/schemas/LDAPDirectory'}
        '400': {$ref: '#/components/responses/BadJSON'}
        '401': {$ref: '#/components/responses/Unauthenticated'}
        '403': {$ref: '#/components/responses/Forbidden'}
        '409':
          description: '`ERR_CONFLICT`: a directory with that name exists.'
          content:
            application/json:
              schema: {$ref: '#/components/schemas/Error'}
        '422': {$ref: '#/components/responses/Invalid'}
  /ldap-directories/{id}:
    parameters:
      - {$ref: '#/components/parameters/Id'}
    put:
      tags: [Provisioning]
      operationId: updateLDAPDirectory
      summary: Replace a directory's settings
      description: 'Roles: user administrator (not limited to groups), with a recent sign-in. Leave `password` empty to keep the current one.'
      requestBody: {$ref: '#/components/requestBodies/LDAPDirectoryInput'}
      responses:
        '200':
          description: The directory.
          content:
            application/json:
              schema: {$ref: '#/components/schemas/LDAPDirectory'}
        '400': {$ref: '#/components/responses/BadJSON'}
        '401': {$ref: '#/components/responses/Unauthenticated'}
        '403': {$ref: '#/components/responses/Forbidden'}
        '404': {$ref: '#/components/responses/NotFound'}
        '409':
          description: '`ERR_CONFLICT`: a directory with that name exists.'
          content:
            application/json:
              schema: {$ref: '#/components/schemas/Error'}
        '422': {$ref: '#/components/responses/Invalid'}
    delete:
      tags: [Provisioning]
      operationId: deleteLDAPDirectory
      summary: Delete a directory and its sync history
      description: 'Roles: user administrator (not limited to groups), with a recent sign-in. The people and groups it synced stay in Halo, keep their status and memberships, and can be edited in Halo again.'
      responses:
        '204': {$ref: '#/components/responses/NoContent'}
        '401': {$ref: '#/components/responses/Unauthenticated'}
        '403': {$ref: '#/components/responses/Forbidden'}
        '404': {$ref: '#/components/responses/NotFound'}
  /ldap-directories/{id}/sync:
    parameters:
      - {$ref: '#/components/parameters/Id'}
    post:
      tags: [Provisioning]
      operationId: syncLDAPDirectory
      summary: Sync a directory now, or preview the sync
      description: |-
        Roles: user administrator (not limited to groups). Runs even when scheduled syncs are off, and also every `intervalMinutes` while `enabled` is on. Halo connects over LDAPS or StartTLS unless `security` is `none`, binds, and reads people and groups with the simple paged results control, 500 entries a page. It then compares every entry with Halo and changes only what differs, in one transaction:

        - Creates people as invited, with their mapped profile fields, manager and custom attributes, marked as synced from the directory so their profile can't be changed in Halo. Someone already in Halo with the same email address who isn't synced from this directory is left alone and listed in `skipped`.
        - Updates people whose mapped attributes changed.
        - Suspends people and ends their sessions when they leave the directory, fall outside the people filter, or are disabled in Active Directory (`userAccountControl` flag 2), and restores people it suspended when they are back. It never suspends an emergency access account or the last active global administrator. Leaver and joiner lifecycle rules run for these changes as for any other.
        - Creates an assigned group for each directory group and keeps its members from this directory in step. A Halo group with the same name that isn't synced from this directory is left alone. Members added in Halo who aren't synced from this directory stay.

        When the search returns nobody but people were synced before, the sync fails and suspends nobody. Each change writes an `ldap.*` audit event. With `dryRun=true` nothing is changed or recorded, and the response shows what a sync would do. A failed connection, bind or search changes nothing and is reported in `error` with status 200.
      parameters:
        - {name: dryRun, in: query, schema: {type: boolean}}
      responses:
        '200':
          description: The result.
          content:
            application/json:
              schema: {$ref: '#/components/schemas/LDAPSyncReport'}
        '401': {$ref: '#/components/responses/Unauthenticated'}
        '403': {$ref: '#/components/responses/Forbidden'}
        '404': {$ref: '#/components/responses/NotFound'}
  /ldap-directories/{id}/syncs:
    parameters:
      - {$ref: '#/components/parameters/Id'}
    get:
      tags: [Provisioning]
      operationId: listLDAPSyncs
      summary: List a directory's recent syncs
      description: 'Roles: any administrator. The 50 most recent syncs, newest first. Syncs are kept for 90 days; dry runs are not recorded.'
      responses:
        '200':
          description: The syncs.
          content:
            application/json:
              schema:
                type: array
                items: {$ref: '#/components/schemas/LDAPSync'}
        '401': {$ref: '#/components/responses/Unauthenticated'}
        '403': {$ref: '#/components/responses/Forbidden'}
        '404': {$ref: '#/components/responses/NotFound'}
  /identity-providers:
    get:
      tags: [Identity providers]
      operationId: listIdentityProviders
      summary: List identity providers and the callback URL to register with them
      description: 'Roles: any administrator.'
      responses:
        '200':
          description: The providers.
          content:
            application/json:
              schema:
                type: object
                required: [callbackUrl, providers]
                properties:
                  callbackUrl: {type: string, format: uri, examples: [https://auth.example.com/api/v1/auth/federated/callback]}
                  providers:
                    type: array
                    items: {$ref: '#/components/schemas/IdentityProvider'}
        '401': {$ref: '#/components/responses/Unauthenticated'}
        '403': {$ref: '#/components/responses/Forbidden'}
    post:
      tags: [Identity providers]
      operationId: createIdentityProvider
      summary: Add an identity provider
      description: 'Roles: security administrator.'
      requestBody: {$ref: '#/components/requestBodies/IdentityProviderInput'}
      responses:
        '201': {$ref: '#/components/responses/IdentityProviderResponse'}
        '202': {$ref: '#/components/responses/ApprovalPending'}
        '400': {$ref: '#/components/responses/BadJSON'}
        '401': {$ref: '#/components/responses/ReauthRequired'}
        '403': {$ref: '#/components/responses/Forbidden'}
        '409': {$ref: '#/components/responses/Conflict'}
        '422': {$ref: '#/components/responses/Invalid'}
  /identity-providers/{id}:
    parameters:
      - {$ref: '#/components/parameters/Id'}
    put:
      tags: [Identity providers]
      operationId: updateIdentityProvider
      summary: Replace an identity provider's settings
      description: 'Roles: security administrator. The kind cannot change. Omit `clientSecret` to keep the saved one.'
      requestBody: {$ref: '#/components/requestBodies/IdentityProviderInput'}
      responses:
        '200': {$ref: '#/components/responses/IdentityProviderResponse'}
        '202': {$ref: '#/components/responses/ApprovalPending'}
        '400': {$ref: '#/components/responses/BadJSON'}
        '401': {$ref: '#/components/responses/ReauthRequired'}
        '403': {$ref: '#/components/responses/Forbidden'}
        '404': {$ref: '#/components/responses/NotFound'}
        '409': {$ref: '#/components/responses/Conflict'}
        '422': {$ref: '#/components/responses/Invalid'}
    delete:
      tags: [Identity providers]
      operationId: deleteIdentityProvider
      summary: Delete an identity provider and unlink its accounts
      description: 'Roles: security administrator.'
      responses:
        '204': {$ref: '#/components/responses/NoContent'}
        '202': {$ref: '#/components/responses/ApprovalPending'}
        '401': {$ref: '#/components/responses/ReauthRequired'}
        '403': {$ref: '#/components/responses/Forbidden'}
        '404': {$ref: '#/components/responses/NotFound'}
  /identity-providers/{id}/enable:
    parameters:
      - {$ref: '#/components/parameters/Id'}
    post:
      tags: [Identity providers]
      operationId: enableIdentityProvider
      summary: Turn on sign-in with a provider
      description: 'Roles: security administrator.'
      responses:
        '200': {$ref: '#/components/responses/IdentityProviderResponse'}
        '202': {$ref: '#/components/responses/ApprovalPending'}
        '401': {$ref: '#/components/responses/ReauthRequired'}
        '403': {$ref: '#/components/responses/Forbidden'}
        '404': {$ref: '#/components/responses/NotFound'}
  /identity-providers/{id}/disable:
    parameters:
      - {$ref: '#/components/parameters/Id'}
    post:
      tags: [Identity providers]
      operationId: disableIdentityProvider
      summary: Turn off sign-in with a provider
      description: 'Roles: security administrator. Linked accounts stay linked.'
      responses:
        '200': {$ref: '#/components/responses/IdentityProviderResponse'}
        '202': {$ref: '#/components/responses/ApprovalPending'}
        '401': {$ref: '#/components/responses/ReauthRequired'}
        '403': {$ref: '#/components/responses/Forbidden'}
        '404': {$ref: '#/components/responses/NotFound'}
  /certificate-authorities:
    get:
      tags: [Policies]
      operationId: listCertificateAuthorities
      summary: List certificate authorities trusted for client certificate sign-in
      description: 'Roles: any administrator.'
      responses:
        '200':
          description: The authorities, oldest first.
          content:
            application/json:
              schema:
                type: array
                items: {$ref: '#/components/schemas/CertificateAuthority'}
        '401': {$ref: '#/components/responses/Unauthenticated'}
        '403': {$ref: '#/components/responses/Forbidden'}
    post:
      tags: [Policies]
      operationId: createCertificateAuthority
      summary: Trust a certificate authority for client certificate sign-in
      description: 'Roles: security administrator. Every certificate in the bundle must be a current certificate authority. A client certificate that chains to any of them signs in the person whose email address matches the field `mapping` names: the first `email` address in the subject alternative name, the `upn` (user principal name) in the subject alternative name, or the `subject` common name.'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [name, mapping, certificates]
              properties:
                name: {type: string, maxLength: 200}
                mapping: {type: string, enum: [email, upn, subject]}
                certificates: {type: string, description: 'One or more PEM certificates of the authorities that sign client certificates. Each one is trusted on its own, so a root alone does not trust certificates its issuing authorities signed.'}
      responses:
        '201':
          description: The authority is trusted.
          content:
            application/json:
              schema: {$ref: '#/components/schemas/CertificateAuthority'}
        '400': {$ref: '#/components/responses/BadJSON'}
        '401': {$ref: '#/components/responses/ReauthRequired'}
        '403': {$ref: '#/components/responses/Forbidden'}
        '409': {$ref: '#/components/responses/Conflict'}
        '422': {$ref: '#/components/responses/Invalid'}
  /certificate-authorities/{id}:
    parameters:
      - {$ref: '#/components/parameters/Id'}
    delete:
      tags: [Policies]
      operationId: deleteCertificateAuthority
      summary: Stop trusting a certificate authority
      description: 'Roles: security administrator. People who signed in with its certificates stay signed in.'
      responses:
        '204': {$ref: '#/components/responses/NoContent'}
        '401': {$ref: '#/components/responses/ReauthRequired'}
        '403': {$ref: '#/components/responses/Forbidden'}
        '404': {$ref: '#/components/responses/NotFound'}
  /kerberos:
    get:
      tags: [Policies]
      operationId: getKerberos
      summary: Get the Windows sign-in setup
      description: 'Roles: any administrator. `null` until a security administrator sets it up. The keytab itself is never returned.'
      responses:
        '200':
          description: The setup, or `null`.
          content:
            application/json:
              schema:
                oneOf:
                  - {$ref: '#/components/schemas/KerberosSource'}
                  - {type: 'null'}
        '401': {$ref: '#/components/responses/Unauthenticated'}
        '403': {$ref: '#/components/responses/Forbidden'}
    put:
      tags: [Policies]
      operationId: saveKerberos
      summary: Set up or change Windows sign-in
      description: 'Roles: security administrator. Halo keeps only the keytab''s AES and RC4 keys for `servicePrincipal`, sealed with `HALO_SECRET_KEY`. Omit `keytab` to keep the stored one; it must still hold a key for `servicePrincipal`.'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [servicePrincipal, realms]
              properties:
                servicePrincipal: {type: string, examples: [HTTP/auth.example.com@CORP.EXAMPLE.COM], description: 'The principal browsers ask the domain controller for, `HTTP/` and the host name in `HALO_PUBLIC_URL`, with the realm.'}
                realms:
                  type: array
                  minItems: 1
                  description: The realms whose people can sign in, each with the email domain their principal names map to.
                  items: {$ref: '#/components/schemas/KerberosRealm'}
                zoneIds: {type: array, items: {type: string}, description: Trusted network zones where the sign-in page tries Windows sign-in without a click. Empty by default.}
                keytab: {type: string, contentEncoding: base64, description: 'The keytab file, as `ktpass` or `ktutil` writes it. Required the first time.'}
      responses:
        '200':
          description: The saved setup.
          content:
            application/json:
              schema: {$ref: '#/components/schemas/KerberosSource'}
        '400': {$ref: '#/components/responses/BadJSON'}
        '401': {$ref: '#/components/responses/ReauthRequired'}
        '403': {$ref: '#/components/responses/Forbidden'}
        '422': {$ref: '#/components/responses/Invalid'}
    delete:
      tags: [Policies]
      operationId: deleteKerberos
      summary: Remove Windows sign-in and its keytab
      description: 'Roles: security administrator. People who signed in with Windows stay signed in. Linked principals are kept for when it is set up again.'
      responses:
        '204': {$ref: '#/components/responses/NoContent'}
        '401': {$ref: '#/components/responses/ReauthRequired'}
        '403': {$ref: '#/components/responses/Forbidden'}
        '404': {$ref: '#/components/responses/NotFound'}
  /settings:
    get:
      tags: [Settings]
      operationId: getSettings
      summary: Get the organization settings
      description: 'Roles: any administrator.'
      responses:
        '200': {$ref: '#/components/responses/SettingsResponse'}
        '401': {$ref: '#/components/responses/Unauthenticated'}
        '403': {$ref: '#/components/responses/Forbidden'}
    patch:
      tags: [Settings]
      operationId: updateSettings
      summary: Change organization settings
      description: 'Roles: security administrator. Only a global administrator can change `organizationName`, `contactEmail`, `locale`, `signInMessage`, `theme`, `customCss`, `consoleBranding`, `approvalActions`, `emergencyAccessIds`, `impersonationGroupIds` and `featuresOff`. Send only the fields to change. Token lifetimes apply to applications created afterwards.'
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: '#/components/schemas/Settings'}
      responses:
        '200': {$ref: '#/components/responses/SettingsResponse'}
        '202': {$ref: '#/components/responses/ApprovalPending'}
        '400': {$ref: '#/components/responses/BadJSON'}
        '401': {$ref: '#/components/responses/ReauthRequired'}
        '403': {$ref: '#/components/responses/Forbidden'}
        '409':
          description: '`ERR_FEATURE_IN_USE`: a feature in `featuresOff` is still in use, and the message says how. Send `confirmFeatures` to turn it off anyway.'
          content:
            application/json:
              schema: {$ref: '#/components/schemas/Error'}
        '422': {$ref: '#/components/responses/Invalid'}
  /features:
    get:
      tags: [Settings]
      operationId: listFeatures
      summary: List the features that can be turned off
      description: 'Roles: any administrator. Turn features off with `featuresOff` in `PATCH /settings`. While a feature is off, its routes answer `404`, with `ERR_NO_ROUTE` under `/api/v1`, its background jobs do not run, and its settings are kept for when it is turned back on.'
      responses:
        '200':
          description: The features, in the order the console shows them.
          content:
            application/json:
              schema:
                type: array
                items: {$ref: '#/components/schemas/Feature'}
        '401': {$ref: '#/components/responses/Unauthenticated'}
        '403': {$ref: '#/components/responses/Forbidden'}
  /domains:
    get:
      tags: [Settings]
      operationId: listDomains
      summary: List domains and their verification state
      description: 'Roles: any administrator.'
      responses:
        '200':
          description: The domains.
          content:
            application/json:
              schema:
                type: array
                items: {$ref: '#/components/schemas/Domain'}
        '401': {$ref: '#/components/responses/Unauthenticated'}
        '403': {$ref: '#/components/responses/Forbidden'}
    post:
      tags: [Settings]
      operationId: addDomain
      summary: Add a domain to verify
      description: 'Roles: global administrator. Publish `halo-verification=<token>` as a TXT record on the domain, then verify it.'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [name]
              properties:
                name: {type: string, examples: [example.com]}
      responses:
        '201':
          description: The domain with its verification token.
          content:
            application/json:
              schema: {$ref: '#/components/schemas/Domain'}
        '400': {$ref: '#/components/responses/BadJSON'}
        '401': {$ref: '#/components/responses/Unauthenticated'}
        '403': {$ref: '#/components/responses/Forbidden'}
        '409': {$ref: '#/components/responses/Conflict'}
        '422': {$ref: '#/components/responses/Invalid'}
  /domains/{id}/verify:
    parameters:
      - {$ref: '#/components/parameters/Id'}
    post:
      tags: [Settings]
      operationId: verifyDomain
      summary: Check the domain's TXT record
      description: 'Roles: global administrator.'
      responses:
        '200':
          description: The verified domain.
          content:
            application/json:
              schema: {$ref: '#/components/schemas/Domain'}
        '401': {$ref: '#/components/responses/Unauthenticated'}
        '403': {$ref: '#/components/responses/Forbidden'}
        '404': {$ref: '#/components/responses/NotFound'}
        '422':
          description: '`ERR_NOT_VERIFIED`: no TXT record with the token was found.'
          content:
            application/json:
              schema: {$ref: '#/components/schemas/Error'}
  /domains/{id}:
    parameters:
      - {$ref: '#/components/parameters/Id'}
    delete:
      tags: [Settings]
      operationId: deleteDomain
      summary: Remove a domain
      description: 'Roles: global administrator.'
      responses:
        '204': {$ref: '#/components/responses/NoContent'}
        '401': {$ref: '#/components/responses/Unauthenticated'}
        '403': {$ref: '#/components/responses/Forbidden'}
        '404': {$ref: '#/components/responses/NotFound'}
  /email-templates:
    get:
      tags: [Settings]
      operationId: listEmailTemplates
      summary: List the email templates
      description: 'Roles: any administrator. Each email Halo sends for invitations, resets, sign-in links and codes, access requests and security notices, with its variables, Halo''s default subject and body, and the custom subject and body when one is saved.'
      responses:
        '200':
          description: The email templates.
          content:
            application/json:
              schema:
                type: array
                items: {$ref: '#/components/schemas/EmailTemplate'}
        '401': {$ref: '#/components/responses/Unauthenticated'}
        '403': {$ref: '#/components/responses/Forbidden'}
  /email-templates/{kind}:
    parameters:
      - {$ref: '#/components/parameters/EmailTemplateKind'}
    put:
      tags: [Settings]
      operationId: saveEmailTemplate
      summary: Save a custom subject and body
      description: 'Roles: global administrator. Halo renders the template with example values before saving and refuses variables the email does not have and anything other than `{{.Variable}}` and `{{if .Variable}}…{{else}}…{{end}}`. Values are inserted as plain text and never run as template code. Writes an `email_template.update` audit event.'
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: '#/components/schemas/EmailTemplateText'}
      responses:
        '200':
          description: The email template with the saved custom subject and body.
          content:
            application/json:
              schema: {$ref: '#/components/schemas/EmailTemplate'}
        '400': {$ref: '#/components/responses/BadJSON'}
        '401': {$ref: '#/components/responses/Unauthenticated'}
        '403': {$ref: '#/components/responses/Forbidden'}
        '404': {$ref: '#/components/responses/NotFound'}
        '422': {$ref: '#/components/responses/Invalid'}
    delete:
      tags: [Settings]
      operationId: resetEmailTemplate
      summary: Go back to Halo's default subject and body
      description: 'Roles: global administrator. Writes an `email_template.reset` audit event when a custom template was removed.'
      responses:
        '200':
          description: The email template without a custom subject and body.
          content:
            application/json:
              schema: {$ref: '#/components/schemas/EmailTemplate'}
        '401': {$ref: '#/components/responses/Unauthenticated'}
        '403': {$ref: '#/components/responses/Forbidden'}
        '404': {$ref: '#/components/responses/NotFound'}
  /email-templates/{kind}/preview:
    parameters:
      - {$ref: '#/components/parameters/EmailTemplateKind'}
    post:
      tags: [Settings]
      operationId: previewEmailTemplate
      summary: Render a subject and body with example values
      description: 'Roles: any administrator. Applies the same checks as saving, uses the organization name, and adds the footer every email ends with. Saves nothing.'
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: '#/components/schemas/EmailTemplateText'}
      responses:
        '200':
          description: The rendered email.
          content:
            application/json:
              schema:
                type: object
                required: [subject, text]
                properties:
                  subject: {type: string}
                  text: {type: string}
        '400': {$ref: '#/components/responses/BadJSON'}
        '401': {$ref: '#/components/responses/Unauthenticated'}
        '403': {$ref: '#/components/responses/Forbidden'}
        '404': {$ref: '#/components/responses/NotFound'}
        '422': {$ref: '#/components/responses/Invalid'}
  /export:
    get:
      tags: [Settings]
      operationId: exportOrganization
      summary: Download the organization as JSON
      description: 'Roles: global administrator. Streams the organization, settings, users, groups, memberships, roles, applications, policies, access packages, access reviews and the audit log, with the changes each event recorded, as one JSON document, without secrets. Writes an audit event.'
      responses:
        '200':
          description: A JSON attachment named `halo-export-YYYY-MM-DD.json`.
          content:
            application/json:
              schema:
                type: object
                properties:
                  exportedAt: {type: string, format: date-time}
                  organization: {$ref: '#/components/schemas/Organization'}
                  settings: {$ref: '#/components/schemas/Settings'}
                  users: {type: array, items: {type: object}}
                  groups: {type: array, items: {type: object}}
                  memberships: {type: array, items: {type: object}}
                  roles: {type: array, items: {type: object}}
                  applications: {type: array, items: {type: object}}
                  policies: {type: array, items: {type: object}}
                  accessPackages: {type: array, items: {type: object}}
                  accessReviews: {type: array, items: {type: object}}
                  auditEvents: {type: array, items: {type: object}}
        '401': {$ref: '#/components/responses/ReauthRequired'}
        '403': {$ref: '#/components/responses/Forbidden'}
  /import:
    post:
      tags: [Settings]
      operationId: importConfiguration
      summary: Import configuration from a JSON export
      description: 'Roles: global administrator, signed in recently. Reads a document from `GET /export` and brings settings, attributes, groups with their owners and members, terms of use, applications, policies and access packages in line with it. Each object is matched by id, then by name, and created, changed or, with `remove`, deleted through the same API routes and checks as a change in the console, in one transaction: if any object is refused, nothing changes. Objects that are the same are left alone, so importing an export of the same installation changes nothing. Role assignments are never changed: an import that would grant a role is refused. Neither is an import that would stop every global administrator, including you, from signing in. Secrets are not in exports, so existing applications keep theirs and new OpenID Connect and OAuth applications get a new client ID and secret, listed in `secrets`. People, application roles, terms acceptances, access reviews and the audit log are not imported. Send `dryRun` first to see every change and error without writing anything. With any change under `approvalActions` turned on, the import needs approval from another global administrator. Writes the audit event of each change and one `organization.import`. Up to 16 MiB.'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [configuration]
              properties:
                configuration: {type: object, description: 'The document from `GET /export`. Sections that are left out are not touched.'}
                remove: {type: boolean, default: false, description: Delete objects in the sections of the file that the file does not have, and members of the file's assigned groups who are not in it.}
                dryRun: {type: boolean, default: false, description: Check every change and return the report without writing anything.}
      responses:
        '200':
          description: The report. After a dry run, or when nothing differs, nothing has changed.
          content:
            application/json:
              schema: {$ref: '#/components/schemas/ImportReport'}
        '202': {$ref: '#/components/responses/ApprovalPending'}
        '400': {$ref: '#/components/responses/BadJSON'}
        '401': {$ref: '#/components/responses/ReauthRequired'}
        '403': {$ref: '#/components/responses/Forbidden'}
        '413':
          description: '`ERR_TOO_LARGE`: the request is larger than 16 MiB. Leave out the sections that are not imported.'
          content:
            application/json:
              schema: {$ref: '#/components/schemas/Error'}
        '422':
          description: 'Some objects were refused, so nothing was imported. Each refused object has an `error` in `changes`. A file that is not a Halo export gets the usual `ERR_INVALID` error instead.'
          content:
            application/json:
              schema: {$ref: '#/components/schemas/ImportReport'}
