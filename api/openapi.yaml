      - {$ref: '#/components/parameters/Id'}
      - {name: credentialId, in: path, required: true, schema: {type: string}}
    delete:
      tags: [Service accounts]
      operationId: deleteFederatedCredential
      summary: Stop trusting a workload's tokens
      description: 'Roles: security administrator, holding every role of the account. API keys issued through the credential stop working at once. Recorded as `federated_credential.delete`.'
      responses:
