  /devices/{id}:
    parameters:
      - {$ref: '#/components/parameters/Id'}
    put:
      tags: [Policies]
      operationId: setDeviceTrust
      summary: Set a device's trust
      description: 'Roles: security administrator. `blocked` refuses every sign-in from the device and ends the owner''s sessions that started on it, with their access and refresh tokens. The audit event says how many sessions ended.'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [trust]
              properties:
                trust: {type: string, enum: [unknown, trusted, blocked]}
      responses:
        '200':
          description: The device.
          content:
            application/json:
              schema: {$ref: '#/components/schemas/Device'}
        '400': {$ref: '#/components/responses/BadJSON'}
        '401': {$ref: '#/components/responses/Unauthenticated'}
        '403': {$ref: '#/components/responses/Forbidden'}
        '404': {$ref: '#/components/responses/NotFound'}
        '422': {$ref: '#/components/responses/Invalid'}
  /risk-events:
    get:
      tags: [Policies]
      operationId: listRiskEvents
      summary: List the 1,000 most recent risk events
      description: 'Roles: any administrator.'
      responses:
        '200':
          description: The events, newest first.
          content:
            application/json:
              schema:
                type: array
                items: {$ref: '#/components/schemas/RiskEvent'}
        '401': {$ref: '#/components/responses/Unauthenticated'}
        '403': {$ref: '#/components/responses/Forbidden'}
  /risk-events/{id}/resolve:
    parameters:
      - {$ref: '#/components/parameters/Id'}
    post:
      tags: [Policies]
      operationId: resolveRiskEvent
      summary: Mark a risk event as resolved
      description: 'Roles: security administrator.'
      responses:
        '200': {$ref: '#/components/responses/RiskEventResponse'}
        '401': {$ref: '#/components/responses/Unauthenticated'}
        '403': {$ref: '#/components/responses/Forbidden'}
        '404': {$ref: '#/components/responses/NotFound'}
  /risk-events/{id}/dismiss:
    parameters:
      - {$ref: '#/components/parameters/Id'}
    post:
      tags: [Policies]
      operationId: dismissRiskEvent
      summary: Dismiss a risk event
      description: 'Roles: security administrator.'
      responses:
        '200': {$ref: '#/components/responses/RiskEventResponse'}
        '401': {$ref: '#/components/responses/Unauthenticated'}
        '403': {$ref: '#/components/responses/Forbidden'}
        '404': {$ref: '#/components/responses/NotFound'}
  /service-accounts:
    get:
      tags: [Service accounts]
      operationId: listServiceAccounts
      summary: List service accounts with their keys
      description: 'Roles: any administrator.'
      responses:
        '200':
          description: The service accounts.
          content:
            application/json:
              schema:
                type: array
                items: {$ref: '#/components/schemas/ServiceAccount'}
        '401': {$ref: '#/components/responses/Unauthenticated'}
        '403': {$ref: '#/components/responses/Forbidden'}
    post:
      tags: [Service accounts]
      operationId: createServiceAccount
      summary: Create a service account
      description: 'Roles: security administrator. You can give it only roles you hold yourself; everyone may give `auditor`. `global_admin` is refused while granting it needs approval.'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [name]
              properties:
                name: {type: string, maxLength: 200, examples: [Terraform]}
                description: {type: string, maxLength: 2000}
                ownerId: {type: string, description: Id of the person responsible for it.}
                roles:
                  type: array
                  items: {$ref: '#/components/schemas/RoleKey'}
      responses:
        '201': {$ref: '#/components/responses/ServiceAccountResponse'}
        '400': {$ref: '#/components/responses/BadJSON'}
        '401': {$ref: '#/components/responses/ReauthRequired'}
        '403': {$ref: '#/components/responses/Forbidden'}
        '409': {$ref: '#/components/responses/Conflict'}
        '422': {$ref: '#/components/responses/Invalid'}
  /service-accounts/{id}:
    parameters:
      - {$ref: '#/components/parameters/Id'}
    get:
      tags: [Service accounts]
      operationId: getServiceAccount
      summary: Get one service account
      description: 'Roles: any administrator.'
      responses:
        '200': {$ref: '#/components/responses/ServiceAccountResponse'}
        '401': {$ref: '#/components/responses/Unauthenticated'}
        '403': {$ref: '#/components/responses/Forbidden'}
        '404': {$ref: '#/components/responses/NotFound'}
    patch:
      tags: [Service accounts]
      operationId: updateServiceAccount
      summary: Rename, re-own, rate-limit, disable or enable a service account
      description: 'Roles: security administrator. Disabling stops every key of the account. Any change other than disabling requires that you hold every role of the account.'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                name: {type: string, maxLength: 200}
                description: {type: string, maxLength: 2000}
                ownerId: {type: string}
                rateLimit: {type: integer, minimum: 1, maximum: 100000, description: Requests per minute that each of the account's API keys may send to the management API.}
                disabled: {type: boolean}
      responses:
        '200': {$ref: '#/components/responses/ServiceAccountResponse'}
        '400': {$ref: '#/components/responses/BadJSON'}
        '401': {$ref: '#/components/responses/Unauthenticated'}
        '403': {$ref: '#/components/responses/Forbidden'}
        '404': {$ref: '#/components/responses/NotFound'}
        '422': {$ref: '#/components/responses/Invalid'}
  /service-accounts/{id}/roles:
    parameters:
      - {$ref: '#/components/parameters/Id'}
    put:
      tags: [Service accounts]
      operationId: setServiceAccountRoles
      summary: Replace a service account's roles
      description: 'Roles: security administrator, holding every current and requested role.'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [roles]
              properties:
                roles:
                  type: array
                  items: {$ref: '#/components/schemas/RoleKey'}
      responses:
        '200': {$ref: '#/components/responses/ServiceAccountResponse'}
        '202': {$ref: '#/components/responses/ApprovalPending'}
        '400': {$ref: '#/components/responses/BadJSON'}
        '401': {$ref: '#/components/responses/ReauthRequired'}
        '403': {$ref: '#/components/responses/Forbidden'}
        '404': {$ref: '#/components/responses/NotFound'}
        '422': {$ref: '#/components/responses/Invalid'}
  /service-accounts/{id}/keys:
    parameters:
      - {$ref: '#/components/parameters/Id'}
    post:
      tags: [Service accounts]
      operationId: createApiKey
      summary: Create an API key
      description: 'Roles: security administrator, holding every role of the account. The key value is returned once.'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [label, scopes]
              properties:
                label: {type: string, maxLength: 100, examples: [Production CI]}
                scopes:
                  type: array
                  minItems: 1
                  items: {type: string, enum: [api, scim, registration]}
                expiresAt: {type: [string, 'null'], format: date-time, description: Omit or send null for a key that does not expire.}
      responses:
        '201':
          description: The key and its value.
          content:
            application/json:
              schema:
                type: object
                required: [key, secret]
                properties:
                  key: {$ref: '#/components/schemas/ApiKey'}
                  secret: {type: string, examples: [hlk_…]}
        '400': {$ref: '#/components/responses/BadJSON'}
        '401': {$ref: '#/components/responses/ReauthRequired'}
        '403': {$ref: '#/components/responses/Forbidden'}
        '404': {$ref: '#/components/responses/NotFound'}
        '422': {$ref: '#/components/responses/Invalid'}
  /api-keys:
    get:
      tags: [Service accounts]
      operationId: listApiKeys
      summary: List every API key
      description: 'Roles: any administrator. Revoked and expired keys are included.'
      responses:
        '200':
          description: The keys.
          content:
            application/json:
              schema:
                type: array
                items: {$ref: '#/components/schemas/ApiKey'}
        '401': {$ref: '#/components/responses/Unauthenticated'}
        '403': {$ref: '#/components/responses/Forbidden'}
  /api-keys/{id}:
    parameters:
      - {$ref: '#/components/parameters/Id'}
    delete:
      tags: [Service accounts]
      operationId: revokeApiKey
      summary: Revoke an API key
      description: 'Roles: security administrator. Revoking a revoked key succeeds.'
      responses:
        '204': {$ref: '#/components/responses/NoContent'}
        '401': {$ref: '#/components/responses/Unauthenticated'}
        '403': {$ref: '#/components/responses/Forbidden'}
        '404': {$ref: '#/components/responses/NotFound'}
  /provisioning/applications:
    get:
      tags: [Provisioning]
      operationId: listProvisioning
      summary: List the applications with outbound SCIM provisioning
      description: 'Roles: any administrator.'
      responses:
        '200':
          description: The provisioning configurations.
          content:
            application/json:
              schema:
                type: array
                items: {$ref: '#/components/schemas/AppProvisioning'}
        '401': {$ref: '#/components/responses/Unauthenticated'}
        '403': {$ref: '#/components/responses/Forbidden'}
  /provisioning/applications/{id}:
    parameters:
      - {$ref: '#/components/parameters/Id'}
    put:
      tags: [Provisioning]
      operationId: configureProvisioning
      summary: Set an application's SCIM endpoint, token and pushed groups
      description: 'Roles: application administrator. OpenID Connect and SAML applications that people sign in to only. The token is required the first time; omit it later to keep the saved one. Omit `groupIds` to keep the selected groups; a group removed from the list is deleted in the application at the next sync.'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [baseUrl]
              properties:
                baseUrl: {type: string, format: uri, examples: [https://app.example.com/scim/v2]}
                token: {type: string, maxLength: 4096}
                enabled: {type: boolean}
                groupIds:
                  type: array
                  description: Assigned or rule-based groups to push with their members. Members who are not provisioned to the application are left out.
                  items: {type: string}
      responses:
        '200': {$ref: '#/components/responses/AppProvisioningResponse'}
        '400': {$ref: '#/components/responses/BadJSON'}
        '401': {$ref: '#/components/responses/Unauthenticated'}
        '403': {$ref: '#/components/responses/Forbidden'}
        '404': {$ref: '#/components/responses/NotFound'}
        '422': {$ref: '#/components/responses/Invalid'}
  /provisioning/applications/{id}/test:
    parameters:
      - {$ref: '#/components/parameters/Id'}
    post:
      tags: [Provisioning]
      operationId: testProvisioning
      summary: Test the connection to the SCIM endpoint
      description: 'Roles: application administrator. Reads `/ServiceProviderConfig` with the saved token.'
      responses:
        '200':
          description: The endpoint answered.
          content:
            application/json:
              schema:
                type: object
                required: [ok]
                properties:
                  ok: {type: boolean, const: true}
        '401': {$ref: '#/components/responses/Unauthenticated'}
        '403': {$ref: '#/components/responses/Forbidden'}
        '404': {$ref: '#/components/responses/NotConfigured'}
        '422':
          description: '`ERR_TOKEN_UNREADABLE`: the saved token cannot be decrypted with the current `HALO_SECRET_KEY`. `ERR_INVALID`: the application cannot be provisioned.'
          content:
            application/json:
              schema: {$ref: '#/components/schemas/Error'}
        '502':
          description: '`ERR_SCIM_CONNECTION`: the endpoint could not be reached or answered with an error.'
          content:
            application/json:
              schema: {$ref: '#/components/schemas/Error'}
  /provisioning/applications/{id}/sync:
    parameters:
      - {$ref: '#/components/parameters/Id'}
    post:
      tags: [Provisioning]
      operationId: syncProvisioning
      summary: Push the assigned people and selected groups now
      description: 'Roles: application administrator. Runs even when provisioning is paused. Failures are reported in `lastError` with status 200.'
      responses:
        '200': {$ref: '#/components/responses/AppProvisioningResponse'}
        '401': {$ref: '#/components/responses/Unauthenticated'}
        '403': {$ref: '#/components/responses/Forbidden'}
        '404': {$ref: '#/components/responses/NotConfigured'}
        '422': {$ref: '#/components/responses/Invalid'}
  /identity-providers:
    get:
      tags: [Identity providers]
      operationId: listIdentityProviders
      summary: List identity providers and the callback URL to register with them
      description: 'Roles: any administrator.'
      responses:
        '200':
          description: The providers.
          content:
            application/json:
              schema:
                type: object
                required: [callbackUrl, providers]
                properties:
                  callbackUrl: {type: string, format: uri, examples: [https://auth.example.com/api/v1/auth/federated/callback]}
                  providers:
                    type: array
                    items: {$ref: '#/components/schemas/IdentityProvider'}
        '401': {$ref: '#/components/responses/Unauthenticated'}
        '403': {$ref: '#/components/responses/Forbidden'}
    post:
      tags: [Identity providers]
      operationId: createIdentityProvider
      summary: Add an identity provider
      description: 'Roles: security administrator.'
      requestBody: {$ref: '#/components/requestBodies/IdentityProviderInput'}
      responses:
        '201': {$ref: '#/components/responses/IdentityProviderResponse'}
        '202': {$ref: '#/components/responses/ApprovalPending'}
        '400': {$ref: '#/components/responses/BadJSON'}
        '401': {$ref: '#/components/responses/ReauthRequired'}
        '403': {$ref: '#/components/responses/Forbidden'}
        '409': {$ref: '#/components/responses/Conflict'}
        '422': {$ref: '#/components/responses/Invalid'}
  /identity-providers/{id}:
    parameters:
      - {$ref: '#/components/parameters/Id'}
    put:
      tags: [Identity providers]
      operationId: updateIdentityProvider
      summary: Replace an identity provider's settings
      description: 'Roles: security administrator. The kind cannot change. Omit `clientSecret` to keep the saved one.'
      requestBody: {$ref: '#/components/requestBodies/IdentityProviderInput'}
      responses:
        '200': {$ref: '#/components/responses/IdentityProviderResponse'}
        '202': {$ref: '#/components/responses/ApprovalPending'}
        '400': {$ref: '#/components/responses/BadJSON'}
        '401': {$ref: '#/components/responses/ReauthRequired'}
        '403': {$ref: '#/components/responses/Forbidden'}
        '404': {$ref: '#/components/responses/NotFound'}
        '409': {$ref: '#/components/responses/Conflict'}
        '422': {$ref: '#/components/responses/Invalid'}
    delete:
      tags: [Identity providers]
      operationId: deleteIdentityProvider
      summary: Delete an identity provider and unlink its accounts
      description: 'Roles: security administrator.'
      responses:
        '204': {$ref: '#/components/responses/NoContent'}
        '202': {$ref: '#/components/responses/ApprovalPending'}
        '401': {$ref: '#/components/responses/ReauthRequired'}
        '403': {$ref: '#/components/responses/Forbidden'}
        '404': {$ref: '#/components/responses/NotFound'}
  /identity-providers/{id}/enable:
    parameters:
      - {$ref: '#/components/parameters/Id'}
    post:
      tags: [Identity providers]
      operationId: enableIdentityProvider
      summary: Turn on sign-in with a provider
      description: 'Roles: security administrator.'
      responses:
        '200': {$ref: '#/components/responses/IdentityProviderResponse'}
        '202': {$ref: '#/components/responses/ApprovalPending'}
        '401': {$ref: '#/components/responses/ReauthRequired'}
        '403': {$ref: '#/components/responses/Forbidden'}
        '404': {$ref: '#/components/responses/NotFound'}
  /identity-providers/{id}/disable:
    parameters:
      - {$ref: '#/components/parameters/Id'}
    post:
      tags: [Identity providers]
      operationId: disableIdentityProvider
      summary: Turn off sign-in with a provider
      description: 'Roles: security administrator. Linked accounts stay linked.'
      responses:
        '200': {$ref: '#/components/responses/IdentityProviderResponse'}
        '202': {$ref: '#/components/responses/ApprovalPending'}
        '401': {$ref: '#/components/responses/ReauthRequired'}
        '403': {$ref: '#/components/responses/Forbidden'}
        '404': {$ref: '#/components/responses/NotFound'}
  /certificate-authorities:
    get:
      tags: [Policies]
      operationId: listCertificateAuthorities
      summary: List certificate authorities trusted for client certificate sign-in
      description: 'Roles: any administrator.'
      responses:
        '200':
          description: The authorities, oldest first.
          content:
            application/json:
              schema:
                type: array
                items: {$ref: '#/components/schemas/CertificateAuthority'}
        '401': {$ref: '#/components/responses/Unauthenticated'}
        '403': {$ref: '#/components/responses/Forbidden'}
    post:
      tags: [Policies]
      operationId: createCertificateAuthority
      summary: Trust a certificate authority for client certificate sign-in
      description: 'Roles: security administrator. Every certificate in the bundle must be a current certificate authority. A client certificate that chains to any of them signs in the person whose email address matches the field `mapping` names: the first `email` address in the subject alternative name, the `upn` (user principal name) in the subject alternative name, or the `subject` common name.'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [name, mapping, certificates]
              properties:
                name: {type: string, maxLength: 200}
                mapping: {type: string, enum: [email, upn, subject]}
                certificates: {type: string, description: 'One or more PEM certificates of the authorities that sign client certificates. Each one is trusted on its own, so a root alone does not trust certificates its issuing authorities signed.'}
      responses:
        '201':
          description: The authority is trusted.
          content:
            application/json:
              schema: {$ref: '#/components/schemas/CertificateAuthority'}
        '400': {$ref: '#/components/responses/BadJSON'}
        '401': {$ref: '#/components/responses/ReauthRequired'}
        '403': {$ref: '#/components/responses/Forbidden'}
        '409': {$ref: '#/components/responses/Conflict'}
        '422': {$ref: '#/components/responses/Invalid'}
  /certificate-authorities/{id}:
    parameters:
      - {$ref: '#/components/parameters/Id'}
    delete:
      tags: [Policies]
      operationId: deleteCertificateAuthority
      summary: Stop trusting a certificate authority
      description: 'Roles: security administrator. People who signed in with its certificates stay signed in.'
      responses:
        '204': {$ref: '#/components/responses/NoContent'}
        '401': {$ref: '#/components/responses/ReauthRequired'}
        '403': {$ref: '#/components/responses/Forbidden'}
        '404': {$ref: '#/components/responses/NotFound'}
  /settings:
    get:
      tags: [Settings]
      operationId: getSettings
      summary: Get the organization settings
      description: 'Roles: any administrator.'
      responses:
        '200': {$ref: '#/components/responses/SettingsResponse'}
        '401': {$ref: '#/components/responses/Unauthenticated'}
        '403': {$ref: '#/components/responses/Forbidden'}
    patch:
      tags: [Settings]
      operationId: updateSettings
      summary: Change organization settings
      description: 'Roles: security administrator. Only a global administrator can change `organizationName`, `contactEmail`, `signInMessage`, `theme`, `customCss`, `consoleBranding`, `approvalActions`, `emergencyAccessIds` and `impersonationGroupIds`. Send only the fields to change. Token lifetimes apply to applications created afterwards.'
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: '#/components/schemas/Settings'}
      responses:
        '200': {$ref: '#/components/responses/SettingsResponse'}
        '202': {$ref: '#/components/responses/ApprovalPending'}
        '400': {$ref: '#/components/responses/BadJSON'}
        '401': {$ref: '#/components/responses/ReauthRequired'}
        '403': {$ref: '#/components/responses/Forbidden'}
        '422': {$ref: '#/components/responses/Invalid'}
  /domains:
    get:
      tags: [Settings]
      operationId: listDomains
      summary: List domains and their verification state
      description: 'Roles: any administrator.'
      responses:
        '200':
          description: The domains.
          content:
            application/json:
              schema:
                type: array
                items: {$ref: '#/components/schemas/Domain'}
        '401': {$ref: '#/components/responses/Unauthenticated'}
        '403': {$ref: '#/components/responses/Forbidden'}
    post:
      tags: [Settings]
      operationId: addDomain
      summary: Add a domain to verify
      description: 'Roles: global administrator. Publish `halo-verification=<token>` as a TXT record on the domain, then verify it.'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [name]
              properties:
                name: {type: string, examples: [example.com]}
      responses:
        '201':
          description: The domain with its verification token.
          content:
            application/json:
              schema: {$ref: '#/components/schemas/Domain'}
        '400': {$ref: '#/components/responses/BadJSON'}
        '401': {$ref: '#/components/responses/Unauthenticated'}
        '403': {$ref: '#/components/responses/Forbidden'}
        '409': {$ref: '#/components/responses/Conflict'}
        '422': {$ref: '#/components/responses/Invalid'}
  /domains/{id}/verify:
    parameters:
      - {$ref: '#/components/parameters/Id'}
    post:
      tags: [Settings]
      operationId: verifyDomain
      summary: Check the domain's TXT record
      description: 'Roles: global administrator.'
      responses:
        '200':
          description: The verified domain.
          content:
            application/json:
              schema: {$ref: '#/components/schemas/Domain'}
        '401': {$ref: '#/components/responses/Unauthenticated'}
        '403': {$ref: '#/components/responses/Forbidden'}
        '404': {$ref: '#/components/responses/NotFound'}
        '422':
          description: '`ERR_NOT_VERIFIED`: no TXT record with the token was found.'
          content:
            application/json:
              schema: {$ref: '#/components/schemas/Error'}
  /domains/{id}:
    parameters:
      - {$ref: '#/components/parameters/Id'}
    delete:
      tags: [Settings]
      operationId: deleteDomain
      summary: Remove a domain
      description: 'Roles: global administrator.'
      responses:
        '204': {$ref: '#/components/responses/NoContent'}
        '401': {$ref: '#/components/responses/Unauthenticated'}
        '403': {$ref: '#/components/responses/Forbidden'}
        '404': {$ref: '#/components/responses/NotFound'}
  /email-templates:
    get:
      tags: [Settings]
      operationId: listEmailTemplates
      summary: List the email templates
      description: 'Roles: any administrator. Each email Halo sends for invitations, resets, sign-in links and codes and access requests, with its variables, Halo''s default subject and body, and the custom subject and body when one is saved.'
      responses:
        '200':
          description: The email templates.
          content:
            application/json:
              schema:
                type: array
                items: {$ref: '#/components/schemas/EmailTemplate'}
        '401': {$ref: '#/components/responses/Unauthenticated'}
        '403': {$ref: '#/components/responses/Forbidden'}
  /email-templates/{kind}:
    parameters:
      - {$ref: '#/components/parameters/EmailTemplateKind'}
    put:
      tags: [Settings]
      operationId: saveEmailTemplate
      summary: Save a custom subject and body
      description: 'Roles: global administrator. Halo renders the template with example values before saving and refuses variables the email does not have and anything other than `{{.Variable}}` and `{{if .Variable}}…{{else}}…{{end}}`. Values are inserted as plain text and never run as template code. Writes an `email_template.update` audit event.'
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: '#/components/schemas/EmailTemplateText'}
      responses:
        '200':
          description: The email template with the saved custom subject and body.
          content:
            application/json:
              schema: {$ref: '#/components/schemas/EmailTemplate'}
        '400': {$ref: '#/components/responses/BadJSON'}
        '401': {$ref: '#/components/responses/Unauthenticated'}
        '403': {$ref: '#/components/responses/Forbidden'}
        '404': {$ref: '#/components/responses/NotFound'}
        '422': {$ref: '#/components/responses/Invalid'}
    delete:
      tags: [Settings]
      operationId: resetEmailTemplate
      summary: Go back to Halo's default subject and body
      description: 'Roles: global administrator. Writes an `email_template.reset` audit event when a custom template was removed.'
      responses:
        '200':
          description: The email template without a custom subject and body.
          content:
            application/json:
              schema: {$ref: '#/components/schemas/EmailTemplate'}
        '401': {$ref: '#/components/responses/Unauthenticated'}
        '403': {$ref: '#/components/responses/Forbidden'}
        '404': {$ref: '#/components/responses/NotFound'}
  /email-templates/{kind}/preview:
    parameters:
      - {$ref: '#/components/parameters/EmailTemplateKind'}
    post:
      tags: [Settings]
      operationId: previewEmailTemplate
      summary: Render a subject and body with example values
      description: 'Roles: any administrator. Applies the same checks as saving, uses the organization name, and adds the footer every email ends with. Saves nothing.'
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: '#/components/schemas/EmailTemplateText'}
      responses:
        '200':
          description: The rendered email.
          content:
            application/json:
              schema:
                type: object
                required: [subject, text]
                properties:
                  subject: {type: string}
                  text: {type: string}
        '400': {$ref: '#/components/responses/BadJSON'}
        '401': {$ref: '#/components/responses/Unauthenticated'}
        '403': {$ref: '#/components/responses/Forbidden'}
        '404': {$ref: '#/components/responses/NotFound'}
        '422': {$ref: '#/components/responses/Invalid'}
  /export:
    get:
      tags: [Settings]
      operationId: exportOrganization
      summary: Download the organization as JSON
      description: 'Roles: global administrator. Streams the organization, settings, users, groups, memberships, roles, applications, policies, access packages, access reviews and the audit log, with the changes each event recorded, as one JSON document, without secrets. Writes an audit event.'
      responses:
        '200':
          description: A JSON attachment named `halo-export-YYYY-MM-DD.json`.
          content:
            application/json:
              schema:
                type: object
                properties:
                  exportedAt: {type: string, format: date-time}
                  organization: {$ref: '#/components/schemas/Organization'}
                  settings: {$ref: '#/components/schemas/Settings'}
                  users: {type: array, items: {type: object}}
                  groups: {type: array, items: {type: object}}
                  memberships: {type: array, items: {type: object}}
                  roles: {type: array, items: {type: object}}
                  applications: {type: array, items: {type: object}}
                  policies: {type: array, items: {type: object}}
                  accessPackages: {type: array, items: {type: object}}
                  accessReviews: {type: array, items: {type: object}}
                  auditEvents: {type: array, items: {type: object}}
        '401': {$ref: '#/components/responses/ReauthRequired'}
        '403': {$ref: '#/components/responses/Forbidden'}
  /signing-keys:
    get:
      tags: [Settings]
      operationId: listSigningKeys
      summary: List the OpenID Connect signing keys and SAML certificates
      description: 'Roles: any administrator.'
      responses:
        '200': {$ref: '#/components/responses/SigningKeysResponse'}
        '401': {$ref: '#/components/responses/Unauthenticated'}
        '403': {$ref: '#/components/responses/Forbidden'}
  /signing-keys/rotate:
    post:
      tags: [Settings]
      operationId: rotateSigningKey
      summary: Create a new OpenID Connect signing key
      description: 'Roles: global administrator. Creates a new key for RS256 and for every other algorithm with a signing key, in one transaction; each new key signs tokens of its algorithm from now on. Previous keys stay in the JWKS for 7 days so tokens they signed still verify, then an hourly job retires them. Writes an audit event.'
      responses:
        '200': {$ref: '#/components/responses/SigningKeysResponse'}
        '401': {$ref: '#/components/responses/ReauthRequired'}
        '403': {$ref: '#/components/responses/Forbidden'}
  /saml/certificate/rotate:
    post:
      tags: [Settings]
      operationId: rotateSAMLCertificate
      summary: Create a new SAML signing certificate
      description: 'Roles: global administrator. The new key and certificate sign SAML responses from now on, and the previous certificate is listed with `retiredAt` until you remove it. Update every SAML application with the new certificate. Writes an audit event.'
      responses:
        '200': {$ref: '#/components/responses/SigningKeysResponse'}
        '401': {$ref: '#/components/responses/ReauthRequired'}
        '403': {$ref: '#/components/responses/Forbidden'}
  /saml/certificates/{id}:
    parameters:
      - {$ref: '#/components/parameters/Id'}
    delete:
      tags: [Settings]
      operationId: deleteSAMLCertificate
      summary: Remove a previous SAML certificate
      description: 'Roles: global administrator. Only certificates replaced by a rotation can be removed; the current one answers `404`. Writes an audit event.'
      responses:
        '204': {$ref: '#/components/responses/NoContent'}
        '401': {$ref: '#/components/responses/Unauthenticated'}
        '403': {$ref: '#/components/responses/Forbidden'}
        '404': {$ref: '#/components/responses/NotFound'}
  /webhooks:
    get:
      tags: [Webhooks]
      operationId: listWebhooks
      summary: List webhook endpoints
      description: 'Roles: any administrator.'
      responses:
        '200':
          description: The endpoints.
          content:
            application/json:
              schema:
                type: array
                items: {$ref: '#/components/schemas/Webhook'}
        '401': {$ref: '#/components/responses/Unauthenticated'}
        '403': {$ref: '#/components/responses/Forbidden'}
    post:
      tags: [Webhooks]
      operationId: createWebhook
      summary: Add a webhook endpoint
      description: 'Roles: security administrator. The signing secret is returned once.'
      requestBody: {$ref: '#/components/requestBodies/WebhookInput'}
      responses:
        '201':
          description: The endpoint and its signing secret.
          content:
            application/json:
              schema:
                type: object
                required: [webhook, secret]
                properties:
                  webhook: {$ref: '#/components/schemas/Webhook'}
                  secret: {type: string, examples: [whsec_…]}
        '400': {$ref: '#/components/responses/BadJSON'}
        '401': {$ref: '#/components/responses/Unauthenticated'}
        '403': {$ref: '#/components/responses/Forbidden'}
        '422': {$ref: '#/components/responses/Invalid'}
  /webhooks/event-types:
    get:
      tags: [Webhooks]
      operationId: listWebhookEventTypes
      summary: List the event families and event types you can subscribe to
      description: 'Roles: any administrator.'
      responses:
        '200':
          description: Each family, such as `user.*`, with its event types. A family also covers types added to it in later versions; a single type covers only itself.
          content:
            application/json:
              schema:
                type: array
                items:
                  type: object
                  required: [family, types]
                  properties:
                    family: {type: string, examples: ['user.*']}
                    types:
                      type: array
                      items:
                        type: object
                        required: [type, description]
                        properties:
                          type: {type: string, examples: [user.suspend]}
                          description: {type: string, examples: [A person was suspended]}
        '401': {$ref: '#/components/responses/Unauthenticated'}
        '403': {$ref: '#/components/responses/Forbidden'}
  /webhooks/{id}:
    parameters:
      - {$ref: '#/components/parameters/Id'}
    get:
      tags: [Webhooks]
      operationId: getWebhook
      summary: Get an endpoint with its 50 most recent deliveries
      description: 'Roles: any administrator.'
      responses:
        '200':
          description: The endpoint and its deliveries.
          content:
            application/json:
              schema:
                type: object
                required: [webhook, deliveries]
                properties:
                  webhook: {$ref: '#/components/schemas/Webhook'}
                  deliveries:
                    type: array
                    items: {$ref: '#/components/schemas/WebhookDelivery'}
        '401': {$ref: '#/components/responses/Unauthenticated'}
        '403': {$ref: '#/components/responses/Forbidden'}
        '404': {$ref: '#/components/responses/NotFound'}
    put:
      tags: [Webhooks]
      operationId: updateWebhook
      summary: Replace an endpoint's settings
      description: 'Roles: security administrator. Omitting `enabled` turns the endpoint on. The secret does not change.'
      requestBody: {$ref: '#/components/requestBodies/WebhookInput'}
      responses:
        '200':
          description: The endpoint.
          content:
            application/json:
              schema: {$ref: '#/components/schemas/Webhook'}
        '400': {$ref: '#/components/responses/BadJSON'}
        '401': {$ref: '#/components/responses/Unauthenticated'}
        '403': {$ref: '#/components/responses/Forbidden'}
        '404': {$ref: '#/components/responses/NotFound'}
        '422': {$ref: '#/components/responses/Invalid'}
    delete:
      tags: [Webhooks]
      operationId: deleteWebhook
      summary: Delete an endpoint and its delivery log
      description: 'Roles: security administrator.'
      responses:
        '204': {$ref: '#/components/responses/NoContent'}
        '401': {$ref: '#/components/responses/Unauthenticated'}
        '403': {$ref: '#/components/responses/Forbidden'}
        '404': {$ref: '#/components/responses/NotFound'}
  /webhooks/{id}/test:
    parameters:
      - {$ref: '#/components/parameters/Id'}
    post:
      tags: [Webhooks]
      operationId: testWebhook
      summary: Send a `webhook.test` event now
      description: 'Roles: security administrator. Answers with the delivery after the first attempt; a failed attempt is retried like any other delivery.'
      responses:
        '200':
          description: The delivery.
          content:
            application/json:
              schema: {$ref: '#/components/schemas/WebhookDelivery'}
        '401': {$ref: '#/components/responses/Unauthenticated'}
        '403': {$ref: '#/components/responses/Forbidden'}
        '404': {$ref: '#/components/responses/NotFound'}
  /api-resources:
    get:
      tags: [API resources]
      operationId: listApiResources
      summary: List API resources
      description: 'Roles: any administrator.'
      responses:
        '200':
          description: The resources with their scopes and grants.
          content:
            application/json:
              schema:
                type: array
                items: {$ref: '#/components/schemas/ApiResource'}
        '401': {$ref: '#/components/responses/Unauthenticated'}
        '403': {$ref: '#/components/responses/Forbidden'}
    post:
      tags: [API resources]
      operationId: createApiResource
      summary: Add an API resource
      description: 'Roles: application administrator.'
      requestBody: {$ref: '#/components/requestBodies/ApiResourceInput'}
      responses:
        '201': {$ref: '#/components/responses/ApiResourceResponse'}
        '400': {$ref: '#/components/responses/BadJSON'}
        '401': {$ref: '#/components/responses/Unauthenticated'}
        '403': {$ref: '#/components/responses/Forbidden'}
        '409': {$ref: '#/components/responses/Conflict'}
        '422': {$ref: '#/components/responses/Invalid'}
  /api-resources/{id}:
    parameters:
      - {$ref: '#/components/parameters/Id'}
    get:
      tags: [API resources]
      operationId: getApiResource
      summary: Get one API resource
      description: 'Roles: any administrator.'
      responses:
        '200': {$ref: '#/components/responses/ApiResourceResponse'}
        '401': {$ref: '#/components/responses/Unauthenticated'}
        '403': {$ref: '#/components/responses/Forbidden'}
        '404': {$ref: '#/components/responses/NotFound'}
    put:
      tags: [API resources]
      operationId: updateApiResource
      summary: Replace an API resource
      description: 'Roles: application administrator.'
      requestBody: {$ref: '#/components/requestBodies/ApiResourceInput'}
      responses:
        '200': {$ref: '#/components/responses/ApiResourceResponse'}
        '400': {$ref: '#/components/responses/BadJSON'}
        '401': {$ref: '#/components/responses/Unauthenticated'}
        '403': {$ref: '#/components/responses/Forbidden'}
        '404': {$ref: '#/components/responses/NotFound'}
        '409': {$ref: '#/components/responses/Conflict'}
        '422': {$ref: '#/components/responses/Invalid'}
    delete:
      tags: [API resources]
      operationId: deleteApiResource
      summary: Delete an API resource and its grants
      description: 'Roles: application administrator.'
      responses:
        '204': {$ref: '#/components/responses/NoContent'}
        '401': {$ref: '#/components/responses/Unauthenticated'}
        '403': {$ref: '#/components/responses/Forbidden'}
        '404': {$ref: '#/components/responses/NotFound'}
  /api-resources/{id}/grants/{appId}:
    parameters:
      - {$ref: '#/components/parameters/Id'}
      - name: appId
        in: path
        required: true
        schema: {type: string}
    put:
      tags: [API resources]
      operationId: setApiResourceGrant
      summary: Replace the scopes an application may request on an API
      description: 'Roles: application administrator. OpenID Connect and OAuth applications only. Send the complete list; an empty list removes the grant.'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [scopes]
              properties:
                scopes:
                  type: array
                  items: {type: string, examples: ['billing:read']}
      responses:
        '200': {$ref: '#/components/responses/ApiResourceResponse'}
        '400': {$ref: '#/components/responses/BadJSON'}
        '401': {$ref: '#/components/responses/Unauthenticated'}
        '403': {$ref: '#/components/responses/Forbidden'}
        '404': {$ref: '#/components/responses/NotFound'}
        '422': {$ref: '#/components/responses/Invalid'}
  /ssh/ca.pub:
    get:
      tags: [SSH]
      operationId: getSSHCAPublicKey
      summary: Get the SSH certificate authority's public key
      description: The line to put in sshd's `TrustedUserCAKeys` file. Halo creates the authority the first time it is needed.
      security: []
      responses:
        '200':
          description: One OpenSSH public key line.
          content:
            text/plain:
              schema: {type: string, examples: ['ssh-ed25519 AAAAC3NzaC1lZDI1NTE5AAAAI…']}
  /ssh/authority:
    get:
      tags: [SSH]
      operationId: getSSHAuthority
      summary: Get the SSH certificate authority
      description: 'Roles: any administrator.'
      responses:
        '200': {$ref: '#/components/responses/SSHAuthorityResponse'}
        '401': {$ref: '#/components/responses/Unauthenticated'}
        '403': {$ref: '#/components/responses/Forbidden'}
    put:
      tags: [SSH]
      operationId: setSSHCertificateLifetime
      summary: Set how long certificates last
      description: 'Roles: security administrator.'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [certificateLifetime]
              properties:
                certificateLifetime: {type: integer, minimum: 300, maximum: 86400, description: Seconds.}
      responses:
        '200': {$ref: '#/components/responses/SSHAuthorityResponse'}
        '400': {$ref: '#/components/responses/BadJSON'}
        '401': {$ref: '#/components/responses/Unauthenticated'}
        '403': {$ref: '#/components/responses/Forbidden'}
        '422': {$ref: '#/components/responses/Invalid'}
  /ssh/principal-mappings:
    get:
      tags: [SSH]
      operationId: listSSHPrincipalMappings
      summary: List group to principal mappings
      description: 'Roles: any administrator.'
      responses:
        '200':
          description: The mappings.
          content:
            application/json:
              schema:
                type: array
                items: {$ref: '#/components/schemas/SSHPrincipalMapping'}
        '401': {$ref: '#/components/responses/Unauthenticated'}
        '403': {$ref: '#/components/responses/Forbidden'}
    post:
      tags: [SSH]
      operationId: createSSHPrincipalMapping
      summary: Map a group to unix account names
      description: 'Roles: security administrator. One mapping per group.'
      requestBody: {$ref: '#/components/requestBodies/SSHPrincipalMappingInput'}
      responses:
        '201': {$ref: '#/components/responses/SSHPrincipalMappingResponse'}
        '400': {$ref: '#/components/responses/BadJSON'}
        '401': {$ref: '#/components/responses/Unauthenticated'}
        '403': {$ref: '#/components/responses/Forbidden'}
        '409': {$ref: '#/components/responses/Conflict'}
        '422': {$ref: '#/components/responses/Invalid'}
  /ssh/principal-mappings/{id}:
    parameters:
      - {$ref: '#/components/parameters/Id'}
    put:
      tags: [SSH]
      operationId: updateSSHPrincipalMapping
      summary: Replace a mapping
      description: 'Roles: security administrator.'
      requestBody: {$ref: '#/components/requestBodies/SSHPrincipalMappingInput'}
      responses:
        '200': {$ref: '#/components/responses/SSHPrincipalMappingResponse'}
        '400': {$ref: '#/components/responses/BadJSON'}
        '401': {$ref: '#/components/responses/Unauthenticated'}
        '403': {$ref: '#/components/responses/Forbidden'}
        '404': {$ref: '#/components/responses/NotFound'}
        '409': {$ref: '#/components/responses/Conflict'}
        '422': {$ref: '#/components/responses/Invalid'}
    delete:
      tags: [SSH]
      operationId: deleteSSHPrincipalMapping
      summary: Remove a mapping
      description: 'Roles: security administrator. Certificates already issued stay valid until they expire.'
      responses:
        '204': {$ref: '#/components/responses/NoContent'}
        '401': {$ref: '#/components/responses/Unauthenticated'}
        '403': {$ref: '#/components/responses/Forbidden'}
        '404': {$ref: '#/components/responses/NotFound'}
  /ssh/certificates:
    get:
      tags: [SSH]
      operationId: listSSHCertificates
      summary: List the 200 most recently issued certificates
      description: 'Roles: any administrator.'
      responses:
        '200':
          description: The certificates, newest first.
          content:
            application/json:
              schema:
                type: array
                items: {$ref: '#/components/schemas/SSHCertificate'}
        '401': {$ref: '#/components/responses/Unauthenticated'}
        '403': {$ref: '#/components/responses/Forbidden'}
  /dev/outbox:
    get:
      tags: [Development]
      operationId: listOutbox
      summary: List the 50 most recent emails in the outbox
      description: 'Roles: global administrator. Exists only when the server runs with `HALO_DEV=1`.'
      responses:
        '200':
          description: The messages, newest first, with their decrypted text.
          content:
            application/json:
              schema:
                type: array
                items: {$ref: '#/components/schemas/OutboxMessage'}
        '401': {$ref: '#/components/responses/Unauthenticated'}
        '403': {$ref: '#/components/responses/Forbidden'}
components:
  securitySchemes:
    session:
      type: apiKey
      in: cookie
      name: halo_session
      description: The session cookie Halo sets when a person signs in.
    apiKey:
      type: http
      scheme: bearer
      description: An API key of a service account, starting with `hlk_`, with the `api` scope. Requests act with the service account's roles.
    initialAccessToken:
      type: http
      scheme: bearer
      description: An API key with the `registration` scope. Required by `/oauth2/register` when `clientRegistration` is `token`.
    registrationAccessToken:
      type: http
      scheme: bearer
      description: The `registration_access_token`, starting with `hlr_`, that `/oauth2/register` returned for the client.
    cliAccessToken:
      type: http
      scheme: bearer
      bearerFormat: JWT
      description: An access token that `halo login` obtained for the built-in Halo CLI application. Accepted only on routes under `/me/`.
  parameters:
    Id:
      name: id
      in: path
      required: true
      schema: {type: string}
    EmailTemplateKind:
      name: kind
      in: path
      required: true
      schema: {type: string, enum: [invite, reset, magic_link, magic_code, sign_up, access_request, access_approved, access_denied, access_pass]}
    UserId:
      name: userId
      in: path
      required: true
      schema: {type: string, examples: [usr_01J9Z8Q4M2N5P7R9T1V3X5Z7B9]}
    DeviceCode:
      name: code
      in: path
      required: true
      description: The user code shown by the device, such as `BCDF-GHJK`. Case, spaces and the dash are ignored.
      schema: {type: string}
    Limit:
      name: limit
      in: query
      description: How many events to return, 1 to 1000. Defaults to 500.
      schema: {type: integer, minimum: 1, maximum: 1000, default: 500}
  requestBodies:
    CodeSignIn:
      required: true
      content:
        application/json:
          schema:
            type: object
            required: [email, code]
            properties:
              email: {type: string, format: email}
              code: {type: string}
              authRequest: {$ref: '#/components/schemas/AuthRequestId'}
              challenge: {$ref: '#/components/schemas/ChallengeToken'}
    Password:
      required: true
      content:
        application/json:
          schema:
            type: object
            required: [password]
            properties:
              password: {type: string, minLength: 15, maxLength: 256}
    DecisionNote:
      content:
        application/json:
          schema:
            type: object
            properties:
              note: {type: string, maxLength: 2000, description: Shown to the requester.}
    CollectionInput:
      required: true
      content:
        application/json:
          schema:
            type: object
            required: [name]
            properties:
              name: {type: string, maxLength: 100}
              applicationIds:
                type: array
                description: Any application or bookmark except OAuth services.
                items: {type: string}
              groupIds:
                type: array
                description: Assigned or rule-based groups whose members see the collection.
                items: {type: string}
    AccessPackageInput:
      required: true
      content:
        application/json:
          schema:
            type: object
            required: [name, groupIds]
            properties:
              name: {type: string, maxLength: 200}
              description: {type: string, maxLength: 2000}
              ownerId: {type: [string, 'null']}
              groupIds:
                type: array
                minItems: 1
                description: Assigned groups only.
                items: {type: string}
              approverIds:
                type: array
                description: Without approvers, only a global administrator can decide requests.
                items: {type: string}
              maxDays:
                type: [integer, 'null']
                minimum: 1
                maximum: 365
                description: The longest duration people can request. `null` allows access until it is revoked.
              requireJustification: {type: boolean}
              archived: {type: boolean}
    LifecycleRuleInput:
      required: true
      content:
        application/json:
          schema:
            type: object
            required: [name, trigger, actions]
            properties:
              name: {type: string, maxLength: 200}
              trigger: {type: string, enum: [joiner, mover, leaver]}
              condition:
                type: [string, 'null']
                description: A group rule the person must match. Empty or null matches everyone.
                examples: ['user.department == "Engineering"']
              actions:
                type: array
                minItems: 1
                maxItems: 10
                items: {$ref: '#/components/schemas/LifecycleAction'}
              enabled: {type: boolean}
    PolicyInput:
      required: true
      content:
        application/json:
          schema:
            type: object
            required: [name, mode, effect, conditions]
            properties:
              name: {type: string, maxLength: 200}
              description: {type: string, maxLength: 2000}
              enabled: {type: boolean}
              mode: {type: string, enum: [enforce, report]}
              effect: {type: string, enum: [allow, require-phishing-resistant, require-terms, block]}
              termsId: {type: [string, 'null'], description: 'The terms of use to accept. Required when `effect` is `require-terms`, ignored otherwise.'}
              conditions: {$ref: '#/components/schemas/PolicyConditions'}
    TermsInput:
      required: true
      content:
        application/json:
          schema:
            type: object
            required: [name]
            properties:
              name: {type: string, maxLength: 200}
              text: {type: string, maxLength: 100000, description: Plain text. Give the text, the link, or both.}
              url: {type: string, format: uri, description: An http or https link to the full document.}
    NetworkZoneInput:
      required: true
      content:
        application/json:
          schema:
            type: object
            required: [name, kind, cidrs]
            properties:
              name: {type: string, maxLength: 200}
              kind: {type: string, enum: [trusted, risky]}
              cidrs:
                type: array
                minItems: 1
                maxItems: 500
                description: IPv4 or IPv6 ranges or single addresses. Halo normalizes them to CIDR notation.
                items: {type: string, examples: [203.0.113.0/24]}
    IdentityProviderInput:
      required: true
      content:
        application/json:
          schema:
            type: object
            required: [kind, name, clientId]
            properties:
              kind: {$ref: '#/components/schemas/ProviderKind'}
              name: {type: string, maxLength: 100, description: 'Shown on the button, as in "Continue with Google".'}
              issuer:
                type: string
                description: 'Ignored for Google. For Microsoft, `https://login.microsoftonline.com/<tenant id>/v2.0`. For GitHub, the GitHub Enterprise address, defaulting to https://github.com. For generic OpenID Connect, the issuer with discovery.'
              clientId: {type: string}
              clientSecret: {type: string, description: Required except for generic OpenID Connect providers. Omit on update to keep the saved secret.}
              scopes:
                type: array
                description: Defaults to openid, email and profile; read:user and user:email for GitHub. Halo adds openid for every kind except GitHub.
                items: {type: string}
              enabled: {type: boolean}
              showOnSignIn: {type: boolean}
              routeByDomain: {type: boolean, description: 'Send people who enter an address at an allowed domain straight to this provider, even when its button is hidden. Requires at least one allowed domain, and each domain can be routed by one provider.'}
              allowedDomains:
                type: array
                description: Email domains allowed to sign in with this provider. Empty allows every domain.
                items: {type: string, examples: [example.com]}
              jit: {type: boolean, description: Create an account on first sign-in. Requires at least one allowed domain.}
              jitGroupIds:
                type: array
                description: Assigned groups that accounts created on first sign-in join.
                items: {type: string}
    WebhookInput:
      required: true
      content:
        application/json:
          schema:
            type: object
            required: [url, events]
            properties:
              url: {type: string, format: uri, maxLength: 2048, description: 'https, or http for localhost while you test.'}
              description: {type: string, maxLength: 200}
              events:
                type: array
                minItems: 1
                maxItems: 50
                description: Event types such as `user.invite`, families such as `user.*`, or `*` for every event.
                items: {type: string}
              enabled: {type: boolean, default: true}
    ApiResourceInput:
      required: true
      content:
        application/json:
          schema:
            type: object
            required: [name, identifier, accessTokenTtl, scopes]
            properties:
              name: {type: string, maxLength: 200}
              identifier: {type: string, format: uri, maxLength: 300, description: 'The audience access tokens carry in `aud`.', examples: [https://billing.example.com]}
              description: {type: string, maxLength: 500}
              accessTokenTtl: {type: integer, minimum: 60, maximum: 86400}
              accessTokenAlg: {type: string, enum: [RS256, ES256, EdDSA], description: 'The algorithm access tokens addressed to this API are signed with. Defaults to RS256 on create and keeps the current value on update. One token can''t be addressed to APIs with different algorithms; such a request fails with `invalid_target`.'}
              scopes:
                type: array
                minItems: 1
                maxItems: 100
                items: {$ref: '#/components/schemas/ApiScope'}
    SSHPrincipalMappingInput:
      required: true
      content:
        application/json:
          schema:
            type: object
            required: [groupId, principals]
            properties:
              groupId: {type: string}
              principals:
                type: array
                minItems: 1
                maxItems: 32
                items: {type: string, pattern: '^[a-z_][a-z0-9_.-]{0,31}$', examples: [ops]}
  responses:
    NoContent:
      description: Done. No body.
    BadJSON:
      description: '`ERR_INVALID_JSON`: the body is not valid JSON or is larger than 1 MiB. `ERR_UNKNOWN_FIELD`: the body has a field the endpoint does not accept; the message names it.'
      content:
        application/json:
          schema: {$ref: '#/components/schemas/Error'}
    RegistrationTokenInvalid:
      description: '`invalid_token`: the registration access token is missing or does not belong to this client.'
      content:
        application/json:
          schema: {$ref: '#/components/schemas/OAuthError'}
    RegistrationOff:
      description: '`invalid_request`: client registration is off.'
      content:
        application/json:
          schema: {$ref: '#/components/schemas/OAuthError'}
    Unauthenticated:
      description: '`ERR_UNAUTHENTICATED`: no valid session or key.'
      content:
        application/json:
          schema: {$ref: '#/components/schemas/Error'}
    ReauthRequired:
      description: '`ERR_UNAUTHENTICATED`: no valid session or key. `ERR_REAUTH_REQUIRED`: this sensitive change needs a recent strong sign-in; confirm it''s you through `/me/reauthenticate` and send the request again. A person without a passkey, security key or authenticator app gets `403` with `ERR_REAUTH_UNAVAILABLE`.'
      content:
        application/json:
          schema: {$ref: '#/components/schemas/Error'}
    ReauthUnavailable:
      description: '`ERR_REAUTH_UNAVAILABLE`: you have no passkey, security key or authenticator app to confirm with. `ERR_CROSS_SITE`: the request came from another website.'
      content:
        application/json:
          schema: {$ref: '#/components/schemas/Error'}
    Forbidden:
      description: '`ERR_FORBIDDEN`: your roles do not allow this. `ERR_CROSS_SITE` on changes from another website. `ERR_APPROVAL_REQUIRED`: the change needs approval, and an API key cannot ask for it. `ERR_IMPERSONATING`: the session is an impersonation, which can only read the account portal.'
      content:
        application/json:
          schema: {$ref: '#/components/schemas/Error'}
    CrossSite:
      description: '`ERR_CROSS_SITE`: the request came from another website.'
      content:
        application/json:
          schema: {$ref: '#/components/schemas/Error'}
    NotFound:
      description: '`ERR_NOT_FOUND`: the item does not exist.'
      content:
        application/json:
          schema: {$ref: '#/components/schemas/Error'}
    Conflict:
      description: '`ERR_CONFLICT`: the change conflicts with the current state, such as a name that is already used.'
      content:
        application/json:
          schema: {$ref: '#/components/schemas/Error'}
    DynamicGroup:
      description: '`ERR_CONFLICT`: the group is dynamic, so its members come from its rule.'
      content:
        application/json:
          schema: {$ref: '#/components/schemas/Error'}
    Invalid:
      description: '`ERR_INVALID`: a field is missing or invalid. The message names it.'
      content:
        application/json:
          schema: {$ref: '#/components/schemas/Error'}
    NotConfigured:
      description: '`ERR_NOT_CONFIGURED`: provisioning is not set up for the application. `ERR_NOT_FOUND`: the application does not exist.'
      content:
        application/json:
          schema: {$ref: '#/components/schemas/Error'}
    LastMethod:
      description: '`ERR_LAST_METHOD`: it is your last way to sign in. Recovery codes do not count.'
      content:
        application/json:
          schema: {$ref: '#/components/schemas/Error'}
    AuthRequestExpired:
      description: '`ERR_AUTH_REQUEST_EXPIRED`: the application''s sign-in request expired or was already used.'
      content:
        application/json:
          schema: {$ref: '#/components/schemas/Error'}
    LinkExpired:
      description: '`ERR_LINK_EXPIRED`: the invite or reset link expired, was used, or was replaced by a newer one.'
      content:
        application/json:
          schema: {$ref: '#/components/schemas/Error'}
    SignUpOff:
      description: '`ERR_SIGN_UP_OFF`: sign-up is turned off. `ERR_LINK_EXPIRED`: the sign-up link expired, was used, or was replaced by a newer one.'
      content:
        application/json:
          schema: {$ref: '#/components/schemas/Error'}
    SignUpRefused:
      description: '`ERR_SIGN_UP_DOMAIN`: the address is not at an allowed domain. `ERR_CHALLENGE_REQUIRED` or `ERR_CHALLENGE_FAILED` (see `ChallengeToken`); failed checks on sign-up are not recorded in the sign-in log. Also `ERR_CROSS_SITE`.'
      content:
        application/json:
          schema: {$ref: '#/components/schemas/Error'}
    Suspended:
      description: '`ERR_ACCOUNT_SUSPENDED`: the account is suspended or deprovisioned. Also `ERR_CROSS_SITE`.'
      content:
        application/json:
          schema: {$ref: '#/components/schemas/Error'}
    SignInRefused:
      description: '`ERR_ACCOUNT_SUSPENDED`, `ERR_NOT_ASSIGNED` (not in a group assigned to the application), `ERR_BLOCKED_BY_POLICY`, `ERR_STRONGER_AUTH_REQUIRED` (a policy requires a passkey or security key), `ERR_SESSION_LIMIT` (the person holds as many sessions as the session limit allows), `ERR_CHALLENGE_REQUIRED` or `ERR_CHALLENGE_FAILED` (see `ChallengeToken`), or `ERR_CROSS_SITE`. Refused sign-ins are recorded in the sign-in log.'
      content:
        application/json:
          schema: {$ref: '#/components/schemas/Error'}
    TermsExpired:
      description: '`ERR_TERMS_EXPIRED`: the step expired after 15 minutes, was already used, or belongs to another session. Sign in again.'
      content:
        application/json:
          schema: {$ref: '#/components/schemas/Error'}
    CodeMismatch:
      description: '`ERR_CODE_MISMATCH`: the code did not match, was already used, or no account uses the address.'
      content:
        application/json:
          schema: {$ref: '#/components/schemas/Error'}
    ChallengeRefused:
      description: '`ERR_CHALLENGE_REQUIRED`: bot protection is on and the request has no `challenge`. `ERR_CHALLENGE_FAILED`: the provider did not confirm the check; failed checks are recorded in the sign-in log. Also `ERR_CROSS_SITE`.'
      content:
        application/json:
          schema: {$ref: '#/components/schemas/Error'}
    ChallengeUnavailable:
      description: '`ERR_CHALLENGE_UNAVAILABLE`: Halo could not verify the check with the bot protection provider, or the provider rejected the secret key, so the request was refused. Recorded in the sign-in log, except on `/auth/sign-up`. Passkeys are never checked.'
      content:
        application/json:
          schema: {$ref: '#/components/schemas/Error'}
    TooManyAttempts:
      description: '`ERR_TOO_MANY_ATTEMPTS`: too many failed passwords or codes for this address, or failed passwords from this IP address, within the lockout window.'
      content:
        application/json:
          schema: {$ref: '#/components/schemas/Error'}
    AuthenticatorRefused:
      description: '`ERR_AUTHENTICATOR_NOT_ALLOWED`: the key breaks the passkey rules in `authenticatorRules` for one of your groups, and the message names the group and the rule. Also `ERR_CROSS_SITE`.'
      content:
        application/json:
          schema: {$ref: '#/components/schemas/Error'}
    MetadataUnavailable:
      description: '`ERR_METADATA_UNAVAILABLE`: one of the person''s groups needs attestation and Halo could not download the FIDO Metadata Service list. Try again later.'
      content:
        application/json:
          schema: {$ref: '#/components/schemas/Error'}
    RegistrationFailed:
      description: '`ERR_CEREMONY_EXPIRED`: the setup step expired; start again. `ERR_REGISTRATION_FAILED`: Halo could not verify the new credential. `ERR_INVALID_JSON`.'
      content:
        application/json:
          schema: {$ref: '#/components/schemas/Error'}
    ApprovalPending:
      description: 'The change needs approval from another global administrator under `approvalActions`. Nothing changed yet: the change is saved as a pending approval request that expires after 72 hours. A service account asking for such a change gets `403 ERR_APPROVAL_REQUIRED` instead, because a person must ask for it.'
      content:
        application/json:
          schema: {$ref: '#/components/schemas/ApprovalRequest'}
    ApprovalResponse:
      description: The approval request.
      content:
        application/json:
          schema: {$ref: '#/components/schemas/ApprovalRequest'}
    ApprovalForbidden:
      description: '`ERR_SELF_APPROVAL`: you asked for the change yourself. `ERR_FORBIDDEN`: you are not a global administrator, or you used an API key. `ERR_CROSS_SITE`.'
      content:
        application/json:
          schema: {$ref: '#/components/schemas/Error'}
    DecisionForbidden:
      description: '`ERR_SELF_APPROVAL`: you made the request yourself, which global administrators cannot decide either; the message names who can. `ERR_FORBIDDEN`: you are not an approver of the package. `ERR_CROSS_SITE`.'
      content:
        application/json:
          schema: {$ref: '#/components/schemas/Error'}
    DeviceCode:
      description: '`ERR_DEVICE_CODE`: the code is wrong, expired or already used.'
      content:
        application/json:
          schema: {$ref: '#/components/schemas/Error'}
    SignedIn:
      description: Signed in. Sets the `halo_session` cookie when a new session starts. `redirect` is the application's callback when the sign-in came from an application, otherwise `/account`. When an enforced policy asks for terms of use the person has not accepted, no session starts yet; `terms` holds the step to finish with `GET /auth/terms/{ceremony}` and `POST /auth/terms`, and `redirect` is the sign-in page that shows them.
      content:
        application/json:
          schema:
            type: object
            required: [redirect]
            properties:
              redirect: {type: string, examples: [/account, '/oauth2/authorize/callback?id=…', '/sign-in?terms=cer_…']}
              terms: {type: string, description: Present only while terms of use wait to be accepted.}
    Ceremony:
      description: A WebAuthn ceremony. Pass `options` to the browser's WebAuthn API and send the result with `ceremony` to the matching finish route within 5 minutes.
      content:
        application/json:
          schema:
            type: object
            required: [ceremony, options]
            properties:
              ceremony: {type: string}
              options: {type: object, description: WebAuthn credential request or creation options.}
    DeviceDecision:
      description: The decision was recorded.
      content:
        application/json:
          schema:
            type: object
            required: [approved, application]
            properties:
              approved: {type: boolean}
              application: {type: string, examples: [Halo CLI]}
    Revoked:
      description: The number of sessions ended.
      content:
        application/json:
          schema:
            type: object
            required: [revoked]
            properties:
              revoked: {type: integer}
    UserResponse:
      description: The person.
      content:
        application/json:
          schema: {$ref: '#/components/schemas/User'}
    ApplicationResponse:
      description: The application.
      content:
        application/json:
          schema: {$ref: '#/components/schemas/Application'}
    CollectionResponse:
      description: The collection.
      content:
        application/json:
          schema: {$ref: '#/components/schemas/Collection'}
    AccessPackageResponse:
      description: The package.
      content:
        application/json:
          schema: {$ref: '#/components/schemas/AccessPackage'}
    AccessRequestResponse:
      description: The request.
      content:
        application/json:
          schema: {$ref: '#/components/schemas/AccessRequest'}
    AccessReviewResponse:
      description: The review with its items.
      content:
        application/json:
          schema: {$ref: '#/components/schemas/AccessReview'}
    LifecycleRuleResponse:
      description: The rule.
      content:
        application/json:
          schema: {$ref: '#/components/schemas/LifecycleRule'}
    PolicyResponse:
      description: The policy. `activity` is zero in this response.
      content:
        application/json:
          schema: {$ref: '#/components/schemas/Policy'}
    NetworkZoneResponse:
      description: The zone.
      content:
        application/json:
          schema: {$ref: '#/components/schemas/NetworkZone'}
    TermsResponse:
      description: The terms of use.
      content:
        application/json:
          schema: {$ref: '#/components/schemas/Terms'}
    RiskEventResponse:
      description: The risk event.
      content:
        application/json:
          schema: {$ref: '#/components/schemas/RiskEvent'}
    ServiceAccountResponse:
      description: The service account.
      content:
        application/json:
          schema: {$ref: '#/components/schemas/ServiceAccount'}
    AppProvisioningResponse:
      description: The provisioning configuration and the result of the last run.
      content:
        application/json:
          schema: {$ref: '#/components/schemas/AppProvisioning'}
    IdentityProviderResponse:
      description: The identity provider.
      content:
        application/json:
          schema: {$ref: '#/components/schemas/IdentityProvider'}
    SettingsResponse:
      description: The settings, the organization name from `HALO_ORGANIZATION` and the issuer.
      content:
        application/json:
          schema:
            type: object
            required: [settings, defaultOrganizationName, issuer, customCssDisabled, botProtectionSecretSet]
            properties:
              settings: {$ref: '#/components/schemas/Settings'}
              defaultOrganizationName: {type: string}
              issuer: {type: string, format: uri}
              customCssDisabled: {type: boolean, description: '`HALO_DISABLE_CUSTOM_CSS=1` is set, so no page uses `customCss`.'}
              botProtectionSecretSet: {type: boolean, description: A secret key for `botProtection` is stored.}
    ApiResourceResponse:
      description: The API resource.
      content:
        application/json:
          schema: {$ref: '#/components/schemas/ApiResource'}
    SSHAuthorityResponse:
      description: The certificate authority.
      content:
        application/json:
          schema: {$ref: '#/components/schemas/SSHAuthority'}
    SSHPrincipalMappingResponse:
      description: The mapping.
      content:
        application/json:
          schema: {$ref: '#/components/schemas/SSHPrincipalMapping'}
    SigningKeysResponse:
      description: The OpenID Connect signing keys, newest first, and the SAML certificates, current first.
      content:
        application/json:
          schema:
            type: object
            required: [oidc, saml]
            properties:
              oidc:
                type: array
                items: {$ref: '#/components/schemas/SigningKey'}
              saml:
                type: array
                items: {$ref: '#/components/schemas/SAMLCertificate'}
  schemas:
    Error:
      type: object
      required: [error]
      properties:
        error:
          type: object
          required: [code, message]
          properties:
            code: {type: string, examples: [ERR_NOT_FOUND]}
            message: {type: string, examples: [This user was not found. It may have been deleted.]}
    AuthRequestId:
      type: string
      description: The id of an application's sign-in request, from the `authRequest` query parameter of the sign-in page. Omit it to sign in to Halo itself.
    MethodKind:
      type: string
      enum: [passkey, security-key, totp, magic-link, recovery-codes, password, federated, certificate]
    RoleKey:
      type: string
      enum: [global_admin, security_admin, user_admin, helpdesk_admin, app_admin, auditor]
    ProviderKind:
      type: string
      enum: [google, microsoft, github, oidc]
    SignInProvider:
      type: object
      required: [id, name, kind]
      properties:
        id: {type: string, examples: [idp_01J9Z8Q4M2N5P7R9T1V3X5Z7B9]}
        name: {type: string, examples: [Google]}
        kind: {$ref: '#/components/schemas/ProviderKind'}
    NamedRef:
      type: object
      required: [id, name]
      properties:
        id: {type: string}
        name: {type: string}
        email: {type: string}
    Organization:
      type: object
      required: [name, issuer, contactEmail, signInMessage, logoUrl, theme, customCss, consoleBranding]
      properties:
        name: {type: string, examples: [Fernway Systems]}
        issuer: {type: string, format: uri, examples: [https://auth.example.com]}
        contactEmail: {type: string}
        signInMessage: {type: string}
        logoUrl: {type: [string, 'null'], examples: ['/api/v1/branding/logo?v=1791100000']}
        theme: {$ref: '#/components/schemas/Theme'}
        customCss: {type: string, description: 'Empty while `HALO_DISABLE_CUSTOM_CSS=1` is set.'}
        consoleBranding: {type: boolean}
    Theme:
      type: object
      description: Colours for the sign-in, setup and account pages. An empty string keeps Halo's colour.
      properties:
        accent: {type: string, pattern: '^(#[0-9a-f]{6})?$', examples: ['#2563eb']}
        background: {type: string, pattern: '^(#[0-9a-f]{6})?$'}
        surface: {type: string, pattern: '^(#[0-9a-f]{6})?$'}
        border: {type: string, pattern: '^(#[0-9a-f]{6})?$'}
        text: {type: string, pattern: '^(#[0-9a-f]{6})?$'}
        link: {type: string, pattern: '^(#[0-9a-f]{6})?$'}
    Method:
      type: object
      required: [id, kind, label, addedAt, lastUsedAt]
      properties:
        id: {type: string, description: '`recovery-codes` for the set of recovery codes, `password` for the password, `access-pass` for an active temporary access pass.'}
        kind: {type: string, enum: [passkey, security-key, totp, recovery-codes, password, access-pass]}
        label: {type: string, examples: [Passkey · Safari on iOS]}
        addedAt: {type: string, format: date-time}
        lastUsedAt: {type: [string, 'null'], format: date-time}
        detail: {type: string, examples: [8 of 10 remaining]}
    User:
      type: object
      required: [id, email, emailVerified, name, title, department, location, status, strength, methods, roles, eligibleRoles, activations, groupIds, appIds, managerId, source, createdAt, lastSignInAt]
      properties:
        id: {type: string, examples: [usr_01J9Z8Q4M2N5P7R9T1V3X5Z7B9]}
        email: {type: string, format: email}
        emailVerified: {type: boolean, description: 'True once the person redeemed a magic link, finished setup from a link Halo emailed, or signed in through an identity provider that verified the same address. Changing the email clears it. With the `email` scope, ID tokens and userinfo carry it as `email_verified`.'}
        name: {type: string}
        title: {type: string}
        department: {type: string}
        location: {type: string}
        status: {type: string, enum: [invited, active, suspended, deprovisioned]}
        strength: {type: string, enum: [phishing-resistant, multi-factor, single-factor]}
        methods:
          type: array
          items: {$ref: '#/components/schemas/Method'}
        roles:
          type: array
          description: Role names, such as `Global administrator`, including roles activated for a limited time. Assign roles with their keys.
          items: {type: string}
        eligibleRoles:
          type: array
          description: Roles the person can activate for a limited time.
          items: {$ref: '#/components/schemas/RoleKey'}
        activations:
          type: array
          description: Eligible roles that are active now. They are also listed in `roles`.
          items: {$ref: '#/components/schemas/RoleActivation'}
        groupIds:
          type: array
          description: Assigned and rule-based groups.
          items: {type: string}
        appIds:
          type: array
          description: Applications the person is assigned to through their groups.
          items: {type: string}
        managerId: {type: [string, 'null']}
        source: {type: string, examples: [Halo, 'SCIM · Okta', Google]}
        createdAt: {type: string, format: date-time}
        lastSignInAt: {type: [string, 'null'], format: date-time}
        avatarUrl: {type: [string, 'null'], description: 'Path of the profile picture, or null. With the `profile` scope, ID tokens and userinfo carry the absolute URL as `picture`.', examples: ['/api/v1/users/usr_01J9Z8Q4M2N5P7R9T1V3X5Z7B9/avatar?v=1790000000']}
    RoleActivation:
      type: object
      required: [id, role, justification, activatedAt, expiresAt]
      properties:
        id: {type: string, examples: [rla_01J9Z8Q4M2N5P7R9T1V3X5Z7B9]}
        role: {$ref: '#/components/schemas/RoleKey'}
        justification: {type: string}
        activatedAt: {type: string, format: date-time}
        expiresAt: {type: string, format: date-time, description: Halo removes the role at this time.}
    Group:
      type: object
      required: [id, name, description, kind, joinPolicy, owners, memberCount, source, createdAt]
      properties:
        id: {type: string, examples: [grp_01J9Z8Q4M2N5P7R9T1V3X5Z7B9]}
        name: {type: string}
        description: {type: string}
        kind: {type: string, enum: [assigned, dynamic]}
        rule: {type: string, description: Dynamic groups only., examples: ['user.department == "Engineering"']}
        joinPolicy: {$ref: '#/components/schemas/JoinPolicy'}
        owners:
          type: array
          description: People who manage the members of this assigned group.
          items: {$ref: '#/components/schemas/NamedRef'}
        memberCount: {type: integer}
        source: {type: string}
        createdAt: {type: string, format: date-time}
    JoinPolicy:
      type: string
      enum: [closed, request, open]
      description: '`closed`: only owners and administrators add members. `request`: people ask and an owner approves. `open`: anyone can join. Rule-based groups are always `closed`.'
    OwnedGroup:
      allOf:
        - {$ref: '#/components/schemas/Group'}
        - type: object
          required: [requestCount]
          properties:
            requestCount: {type: integer, description: Pending requests to join.}
    JoinableGroup:
      allOf:
        - {$ref: '#/components/schemas/Group'}
        - type: object
          required: [requested]
          properties:
            requested: {type: boolean, description: You asked to join and an owner has not decided yet.}
    JoinRequest:
      type: object
      required: [user, createdAt]
      properties:
        user: {$ref: '#/components/schemas/NamedRef'}
        createdAt: {type: string, format: date-time}
    Credential:
      type: object
      required: [id, kind, label, hint, createdAt, expiresAt, lastUsedAt]
      properties:
        id: {type: string}
        kind: {type: string, examples: [secret]}
        label: {type: string}
        hint: {type: string, description: The last characters of the secret.}
        createdAt: {type: string, format: date-time}
        expiresAt: {type: string, format: date-time}
        lastUsedAt: {type: [string, 'null'], format: date-time}
    TokenPolicy:
      type: object
      required: [accessTokenTtl, refreshTokenTtl, idTokenTtl, idTokenAlg, rotation, exchange, exchangeFrom]
      properties:
        accessTokenTtl: {type: integer, description: Seconds.}
        refreshTokenTtl: {type: integer, description: Seconds. 0 means no refresh tokens.}
        idTokenTtl: {type: integer, description: Seconds.}
        idTokenAlg: {type: string, enum: [RS256, ES256, EdDSA], description: 'The algorithm ID tokens are signed with. Halo creates the first key of an algorithm when it first signs with it.'}
        rotation: {type: boolean, description: Replace the refresh token on every use.}
        exchange: {type: boolean, description: 'Allow the urn:ietf:params:oauth:grant-type:token-exchange grant (RFC 8693). The application swaps a person''s access token for one to an API it has scopes on, with itself in the act claim.'}
        exchangeFrom:
          type: array
          items: {type: string}
          description: 'Ids of the API resources whose access tokens the application accepts as subject_token. The subject token''s aud must contain one of their identifiers, otherwise the exchange fails with invalid_request. Empty means no token is accepted.'
    Claim:
      type: object
      required: [name, source]
      properties:
        name: {type: string}
        source: {type: string}
    Application:
      type: object
      required: [id, name, description, protocol, type, status, clientId, homepage, redirectUris, postLogoutUris, scopes, claims, groupIds, userCount, credentials, owner, createdAt, signIns7d, failureRate7d, tokenPolicy, maxAuthAge, setupGuide, logoUrl, registeredDynamically, awaitingApproval, requiresConsent]
      properties:
        id: {type: string, examples: [app_01J9Z8Q4M2N5P7R9T1V3X5Z7B9]}
        name: {type: string}
        description: {type: string}
        protocol: {type: string, enum: [oidc, oauth, saml, bookmark]}
        type: {type: string, enum: [web, spa, native, service]}
        status: {type: string, enum: [active, disabled]}
        clientId: {type: string, description: 'The client ID, such as `hl_…`, or the entity ID for SAML applications.'}
        homepage: {type: string}
        redirectUris:
          type: array
          description: For SAML applications, the ACS URLs.
          items: {type: string}
        postLogoutUris:
          type: array
          items: {type: string}
        scopes:
          type: array
          items: {type: string}
        claims:
          type: array
          items: {$ref: '#/components/schemas/Claim'}
        groupIds:
          type: array
          items: {type: string}
        userCount: {type: integer}
        credentials:
          type: array
          items: {$ref: '#/components/schemas/Credential'}
        owner: {type: [string, 'null'], description: Id of the person responsible.}
        createdAt: {type: string, format: date-time}
        signIns7d: {type: integer}
        failureRate7d: {type: number, description: Percentage of failed sign-ins in the past 7 days.}
        tokenPolicy: {$ref: '#/components/schemas/TokenPolicy'}
        maxAuthAge: {type: integer, description: 'Sign-in frequency in seconds, 0 when off. A person who signed in to Halo longer ago signs in again before the application gets a code, assertion or device approval, `prompt=none` returns `login_required`, and refresh tokens are refused with `invalid_grant`. A shorter `max_age` in the request still applies. Access tokens already issued last until they expire.'}
        setupGuide: {type: string}
        logoUrl: {type: [string, 'null'], description: Path of the logo, or null., examples: ['/api/v1/applications/app_01J9Z8Q4M2N5P7R9T1V3X5Z7B9/logo?v=1790000000']}
        registeredDynamically: {type: boolean, description: The client registered itself at `/oauth2/register` and can change or delete its registration with its registration access token.}
        awaitingApproval: {type: boolean, description: 'The client registered while `clientRegistration` is `approval`, or changed its registration while it is `approval` or while the client is assigned to groups. Its status stays `disabled` until an application administrator enables it.'}
        requiresConsent: {type: boolean, description: 'People see the requested scopes and allow them before their first sign-in, and again when the application asks for scopes they have not allowed. `prompt=none` then fails with `consent_required`. On for clients that registered themselves, off for applications created in the console. Any OpenID Connect application that sends `prompt=consent` gets the screen regardless.'}
        saml: {$ref: '#/components/schemas/SAMLView'}
    SAMLAttributes:
      type: object
      description: The attribute name Halo sends each value under. An empty name stops sending it.
      properties:
        email: {type: string, default: email}
        name: {type: string, default: name}
        givenName: {type: string, default: given_name}
        familyName: {type: string, default: family_name}
        groups: {type: string, default: groups}
    SAMLInput:
      type: object
      properties:
        entityId: {type: string, maxLength: 1024}
        acsUrls:
          type: array
          minItems: 1
          maxItems: 10
          items: {type: string, format: uri}
        nameIdFormat: {type: string, enum: [email, persistent, unspecified]}
        signResponse: {type: boolean, description: Sign the whole response as well as the assertion.}
        attributes: {$ref: '#/components/schemas/SAMLAttributes'}
        metadataXml: {type: string, description: 'The service provider''s metadata. Halo reads the entity ID and ACS URLs from it, and the encryption certificate from a `KeyDescriptor use="encryption"`: the one that expires last, skipping expired certificates. It doesn''t turn on encryption.'}
        encryption:
          type: string
          enum: ['off', aes256-gcm, aes256-cbc]
          description: Encrypt the signed assertion for the service provider with AES-256-GCM, or AES-256-CBC for service providers that don't support GCM. The AES key is sent with RSA-OAEP (`rsa-oaep-mgf1p`, SHA-1). Needs `encryptionCertificate`.
        encryptionCertificate:
          type: string
          description: The service provider's encryption certificate, in PEM or base64. It must hold an RSA key of at least 2048 bits and not have expired when you save it. Halo returns it in PEM.
    SAMLView:
      type: object
      description: SAML applications only.
      properties:
        entityId: {type: string}
        acsUrls:
          type: array
          items: {type: string}
        nameIdFormat: {type: string}
        signResponse: {type: boolean}
        attributes: {$ref: '#/components/schemas/SAMLAttributes'}
        metadataXml: {type: string}
        encryption: {type: string, enum: ['off', aes256-gcm, aes256-cbc]}
        encryptionCertificate: {type: string, description: The service provider's encryption certificate in PEM, or an empty string.}
        idp:
          type: object
          description: What to enter in the service provider.
          properties:
            entityId: {type: string}
            metadataUrl: {type: string, format: uri}
            ssoUrl: {type: string, format: uri}
            certificateUrl: {type: string, format: uri}
            certificateFingerprint: {type: string}
            certificateExpiresAt: {type: string, format: date-time}
    MyApplication:
      type: object
      required: [id, name, description, homepage, launchUrl, logoUrl, favourite]
      properties:
        id: {type: string}
        name: {type: string}
        description: {type: string}
        homepage: {type: string}
        launchUrl: {type: string, description: 'The homepage, or `/saml/launch/{id}` for SAML applications.'}
        logoUrl: {type: [string, 'null']}
        favourite: {type: boolean}
    Collection:
      type: object
      required: [id, name, applicationIds, groupIds, createdAt]
      properties:
        id: {type: string, examples: [col_01J9Z8Q4M2N5P7R9T1V3X5Z7B9]}
        name: {type: string, maxLength: 100}
        applicationIds:
          type: array
          items: {type: string}
        groupIds:
          type: array
          items: {type: string}
        createdAt: {type: string, format: date-time}
    Session:
      type: object
      required: [id, userId, device, os, browser, ip, location, method, createdAt, lastActiveAt]
      properties:
        id: {type: string, examples: [ses_01J9Z8Q4M2N5P7R9T1V3X5Z7B9]}
        userId: {type: string}
        device: {type: string}
        os: {type: string}
        browser: {type: string}
        ip: {type: string}
        location: {type: string}
        method: {$ref: '#/components/schemas/MethodKind'}
        createdAt: {type: string, format: date-time}
        lastActiveAt: {type: string, format: date-time}
        current: {type: boolean, description: Present and true for the session making the request.}
        client: {type: string, enum: [halo-cli], description: 'Present for sessions that `halo login` started through the device flow. Ending such a session, or all of a person''s sessions, also revokes its access and refresh tokens.'}
        impersonationId: {type: string, description: Present when an administrator holds this session through an impersonation. It does not count toward the session limit.}
    SignInEvent:
      type: object
      required: [id, time, userId, email, appId, result, method, ip, location, device, risk]
      properties:
        id: {type: string, examples: [evt_01J9Z8Q4M2N5P7R9T1V3X5Z7B9]}
        time: {type: string, format: date-time}
        userId: {type: [string, 'null']}
        email: {type: string}
        appId: {type: [string, 'null'], description: Null for sign-ins to Halo itself.}
        result: {type: string, enum: [success, failure, interrupted, ended], description: '`ended` records a session that Halo ended to stay within the session limit.'}
        method: {type: string}
        ip: {type: string}
        location: {type: string}
        device: {type: string, examples: [Chrome 130 · macOS]}
        risk: {type: string, enum: [none, low, medium, high]}
        reason: {type: string, description: Why the sign-in failed or the session ended.}
        challenge: {type: string, enum: [passed, failed, unavailable], description: The result of the bot protection check. Absent when no check was asked for.}
        impersonatorId: {type: string, description: 'Present when an administrator started an impersonation session as this person. `reason` then names them and says why.'}
    AuditEvent:
      type: object
      required: [id, time, actorId, action, summary, targetType, targetId, target, ip, changes]
      properties:
        id: {type: string, examples: [aud_01J9Z8Q4M2N5P7R9T1V3X5Z7B9]}
        time: {type: string, format: date-time}
        actorId: {type: [string, 'null'], description: 'Null for changes Halo made itself, such as lifecycle rules and expiring grants.'}
        action: {type: string, examples: [user.invite]}
        summary: {type: string}
        targetType: {type: string, examples: [user]}
        targetId: {type: string}
        target: {type: string, description: The target's name when the change happened.}
        ip: {type: string}
        changes:
          type: array
          description: 'The fields an update changed, with their old and new values, for changes to users, roles, groups, applications, access policies and settings. Empty for other events and for events recorded before Halo kept changes.'
          items: {$ref: '#/components/schemas/AuditChange'}
    AuditChange:
      type: object
      required: [field]
      properties:
        field: {type: string, description: 'The field''s name, with nested fields joined by dots.', examples: [tokenPolicy.accessTokenTtl]}
        before: {description: The value before the change. Absent when the field did not exist.}
        after: {description: The value after the change. Absent when the field was removed.}
        redacted: {type: boolean, description: 'True when the field holds a secret, such as a client secret, key or hash. Halo records that it changed but never its value, so `before` and `after` are absent.'}
    Overview:
      type: object
      required: [weakAdmins, expiringCredentials, highRiskSignIns, recentSignIns, failureRates, counts]
      properties:
        weakAdmins:
          type: array
          items:
            type: object
            properties:
              id: {type: string}
              name: {type: string}
        expiringCredentials:
          type: array
          items:
            type: object
            properties:
              appId: {type: string}
              appName: {type: string}
              credentialId: {type: string}
              label: {type: string}
              expiresAt: {type: string, format: date-time}
              lastUsedAt: {type: [string, 'null'], format: date-time}
              daysLeft: {type: integer}
        highRiskSignIns:
          type: array
          items: {$ref: '#/components/schemas/SignInEvent'}
        recentSignIns:
          type: array
          items: {$ref: '#/components/schemas/SignInEvent'}
        failureRates:
          type: array
          items:
            type: object
            properties:
              appId: {type: string}
              appName: {type: string}
              failureRate7d: {type: number}
        counts:
          type: object
          properties:
            users: {type: integer}
            activeUsers: {type: integer}
            applications: {type: integer}
            activeApplications: {type: integer}
    Recommendation:
      type: object
      required: [id, title, status, detail, href, action, dismissal]
      properties:
        id:
          type: string
          enum: [admin-sign-in, global-admins, global-admin-approval, emergency-access, password-everyone, lockout, session-lifetime, bot-protection, api-key-expiry, api-key-unused, report-only-policies, signing-key-age, unassigned-apps, log-retention]
        title: {type: string, examples: [Limit password sign-in to the groups that need it]}
        status: {type: string, enum: [pass, attention, fail], description: '`fail` for administrators without a passkey or security key, `attention` for every other check that does not pass.'}
        detail: {type: string, description: 'What Halo found, naming the people, keys, policies or applications involved.'}
        href: {type: string, description: The console page that fixes it., examples: [/admin/methods]}
        action: {type: string, description: The label of the link to `href`., examples: [Open sign-in methods]}
        dismissal:
          oneOf:
            - type: object
              required: [reason, by, at]
              properties:
                reason: {type: string}
                by:
                  oneOf:
                    - {$ref: '#/components/schemas/NamedRef'}
                    - {type: 'null'}
                at: {type: string, format: date-time}
            - {type: 'null'}
    AccessPackage:
      type: object
      required: [id, name, description, owner, groups, approvers, maxDays, requireJustification, archived, pendingRequests, activeGrants, createdAt]
      properties:
        id: {type: string, examples: [pkg_01J9Z8Q4M2N5P7R9T1V3X5Z7B9]}
        name: {type: string}
        description: {type: string}
        owner:
          oneOf:
            - {$ref: '#/components/schemas/NamedRef'}
            - {type: 'null'}
        groups:
          type: array
          items: {$ref: '#/components/schemas/NamedRef'}
        approvers:
          type: array
          items: {$ref: '#/components/schemas/NamedRef'}
        maxDays: {type: [integer, 'null']}
        requireJustification: {type: boolean}
        archived: {type: boolean}
        pendingRequests: {type: integer}
        activeGrants: {type: integer}
        createdAt: {type: string, format: date-time}
    AccessRequest:
      type: object
      required: [id, package, requester, justification, durationDays, status, decidedBy, decidedAt, decisionNote, expiresAt, endedAt, endReason, groups, approvers, createdAt, canDecide]
      properties:
        id: {type: string, examples: [req_01J9Z8Q4M2N5P7R9T1V3X5Z7B9]}
        package: {$ref: '#/components/schemas/NamedRef'}
        requester: {$ref: '#/components/schemas/NamedRef'}
        justification: {type: string}
        durationDays: {type: [integer, 'null']}
        status: {type: string, enum: [pending, approved, denied, cancelled]}
        decidedBy:
          oneOf:
            - {$ref: '#/components/schemas/NamedRef'}
            - {type: 'null'}
        decidedAt: {type: [string, 'null'], format: date-time}
        decisionNote: {type: string}
        expiresAt: {type: [string, 'null'], format: date-time, description: When an approved grant ends. Null for grants that last until revoked.}
        endedAt: {type: [string, 'null'], format: date-time}
        endReason: {type: [string, 'null'], enum: [expired, revoked, null]}
        groups:
          type: array
          items: {$ref: '#/components/schemas/NamedRef'}
        approvers:
          type: array
          items: {$ref: '#/components/schemas/NamedRef'}
        createdAt: {type: string, format: date-time}
        canDecide: {type: boolean}
    Impersonation:
      type: object
      required: [id, actor, user, reason, status, createdAt, startedAt, expiresAt]
      properties:
        id: {type: string, examples: [imp_01J9Z8Q4M2N5P7R9T1V3X5Z7B9]}
        actor: {$ref: '#/components/schemas/NamedRef', description: The administrator who impersonates.}
        user: {$ref: '#/components/schemas/NamedRef', description: The person they see Halo as.}
        reason: {type: string}
        status: {type: string, enum: [ready, active, ended, expired], description: '`ready` until started, `expired` if never started in time, `active` while its session lasts, then `ended`.'}
        createdAt: {type: string, format: date-time}
        startedAt: {type: [string, 'null'], format: date-time}
        expiresAt: {type: string, format: date-time, description: When it must be started by, or when its session ends once started.}
    ApprovalRequest:
      type: object
      required: [id, action, summary, targetType, targetId, targetLabel, requester, createdAt, expiresAt, status, decidedBy, decidedAt, outcome, canDecide]
      properties:
        id: {type: string, examples: [apr_01J9Z8Q4M2N5P7R9T1V3X5Z7B9]}
        action: {type: string, enum: [global-admin, policy-disable, password-sign-in, identity-providers, impersonation, approval-settings]}
        summary: {type: string, examples: [Set roles to Global administrator]}
        targetType: {type: string, enum: [user, service_account, policy, method, identity_provider, settings]}
        targetId: {type: string, description: Empty for a new identity provider and for settings.}
        targetLabel: {type: string}
        requester: {$ref: '#/components/schemas/NamedRef'}
        createdAt: {type: string, format: date-time}
        expiresAt: {type: string, format: date-time}
        status: {type: string, enum: [pending, approved, rejected, failed, expired]}
        decidedBy:
          oneOf:
            - {$ref: '#/components/schemas/NamedRef'}
            - {type: 'null'}
        decidedAt: {type: [string, 'null'], format: date-time}
        outcome: {type: string, description: Why an approved change was not applied. Empty otherwise.}
        canDecide: {type: boolean}
    ReviewItem:
      type: object
      required: [user, title, decision, note, decidedBy, decidedAt, outcome]
      properties:
        user: {$ref: '#/components/schemas/NamedRef'}
        title: {type: string}
        decision: {type: [string, 'null'], enum: [keep, remove, null]}
        note: {type: string}
        decidedBy:
          oneOf:
            - {$ref: '#/components/schemas/NamedRef'}
            - {type: 'null'}
        decidedAt: {type: [string, 'null'], format: date-time}
        outcome: {type: [string, 'null'], enum: [kept, removed, not-removed, no-decision, null], description: Set when the review is completed.}
    AccessReview:
      type: object
      required: [id, name, group, reviewers, dueAt, autoApply, status, total, decided, removals, createdBy, createdAt, completedBy, completedAt, canDecide, canComplete]
      properties:
        id: {type: string, examples: [rev_01J9Z8Q4M2N5P7R9T1V3X5Z7B9]}
        name: {type: string}
        group:
          allOf:
            - {$ref: '#/components/schemas/NamedRef'}
          description: For a completed review whose group was deleted, `id` is empty and `name` is the group's name at deletion.
        reviewers:
          type: array
          items: {$ref: '#/components/schemas/NamedRef'}
        dueAt: {type: string, format: date-time}
        autoApply: {type: boolean}
        status: {type: string, enum: [in-progress, overdue, completed]}
        total: {type: integer}
        decided: {type: integer}
        removals: {type: integer}
        createdBy:
          oneOf:
            - {$ref: '#/components/schemas/NamedRef'}
            - {type: 'null'}
        createdAt: {type: string, format: date-time}
        completedBy:
          oneOf:
            - {$ref: '#/components/schemas/NamedRef'}
            - {type: 'null'}
        completedAt: {type: [string, 'null'], format: date-time}
        items:
          type: array
          description: Present when you get a single review.
          items: {$ref: '#/components/schemas/ReviewItem'}
        canDecide: {type: boolean}
        canComplete: {type: boolean}
    LifecycleAction:
      type: object
