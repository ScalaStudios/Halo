    get:
      tags: [Applications]
      operationId: listApplicationLogoutDeliveries
      summary: List an application's 50 most recent back-channel logout deliveries
      description: 'Roles: any administrator. Each delivery is one Halo session that ended, with `eventId` set to the session id and `body` holding its `sub` and `sid`. Halo signs a new logout token for every attempt and retries a failed one like a webhook.'
      responses:
        '200':
          description: The deliveries, newest first.
          content:
            application/json:
              schema:
                type: array
                items: {$ref: '#/components/schemas/WebhookDelivery'}
        '401': {$ref: '#/components/responses/Unauthenticated'}
        '403': {$ref: '#/components/responses/Forbidden'}
        '404': {$ref: '#/components/responses/NotFound'}
  /applications/{id}/shared-signals:
    parameters:
      - {$ref: '#/components/parameters/Id'}
    get:
      tags: [Shared signals]
      operationId: getSharedSignals
      summary: Get a service application's shared signals and its 50 most recent SETs
      description: 'Roles: any administrator. `receiver` is null while shared signals are off. Each delivery''s `eventId` is the SET''s `jti` and `body` holds the person and event Halo signs a SET from on every attempt.'
      responses:
        '200':
          description: The receiver and its deliveries, newest first.
          content:
