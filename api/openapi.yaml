        trigger: {type: string, enum: [joiner, mover, leaver]}
        change: {type: string, examples: [Department changed from Sales to Engineering]}
        steps:
          type: array
          items: {type: string, examples: [Added to Engineering]}
        result: {type: string, enum: [succeeded, failed]}
        createdAt: {type: string, format: date-time}
    PolicyConditions:
      type: object
      properties:
        allUsers: {type: boolean}
        groupIds:
          type: array
          items: {type: string}
        userIds:
          type: array
          items: {type: string}
        excludeGroupIds:
          type: array
          items: {type: string}
        excludeUserIds:
          type: array
          items: {type: string}
        allApps: {type: boolean}
        appIds:
          type: array
          description: Application ids, or `halo` for the console and account portal.
          items: {type: string}
        network: {type: string, enum: ['', any, in, not-in]}
        zoneIds:
          type: array
          items: {type: string}
        device: {type: string, enum: ['', any, trusted, untrusted]}
        risk:
          type: array
          description: Match only these risk levels. Empty matches every level.
          items: {type: string, enum: [none, low, medium, high]}
        methods:
          type: array
          description: Match only these sign-in methods. Empty matches every method.
          items: {$ref: '#/components/schemas/MethodKind'}
    AccessPolicy:
      type: object
      required: [id, name, description, priority, enabled, mode, effect, termsId, conditions, createdAt, updatedAt]
      properties:
        id: {type: string, examples: [pol_01J9Z8Q4M2N5P7R9T1V3X5Z7B9]}
        name: {type: string}
        description: {type: string}
        priority: {type: integer, description: Position in the saved order.}
        enabled: {type: boolean}
        mode: {type: string, enum: [enforce, report]}
        effect: {type: string, enum: [allow, require-phishing-resistant, require-terms, block]}
        termsId: {type: [string, 'null'], description: 'The terms of use a `require-terms` policy asks for.'}
        conditions: {$ref: '#/components/schemas/PolicyConditions'}
        createdAt: {type: string, format: date-time}
        updatedAt: {type: string, format: date-time}
    Policy:
      allOf:
        - {$ref: '#/components/schemas/AccessPolicy'}
        - type: object
          required: [activity]
          properties:
            activity:
              type: object
              required: [matched, stopped]
              properties:
                matched: {type: integer, description: Sign-ins the policy matched in the past 24 hours.}
                stopped: {type: integer, description: 'Matched sign-ins it blocked or would have blocked, or that needed a stronger method or unaccepted terms of use.'}
    Simulation:
      type: object
      required: [effect, outcome, policy, reason, risk, signals, policies]
      properties:
        effect: {type: string, enum: [allow, require-phishing-resistant, require-terms, block]}
        outcome: {type: string, enum: [allow, require, terms, block], description: '`require` when the effect requires a passkey or security key and the simulated method is neither. `terms` when an enforced policy asks for terms of use the person has not accepted.'}
        policy: {type: string, description: 'The name of the deciding policy, if any.'}
        reason: {type: string}
        risk: {type: string, enum: [none, low, medium, high]}
        signals:
          type: array
          items:
            type: object
            properties:
              type: {type: string, enum: [risky-network, failed-sign-ins, new-device, new-network, password]}
              level: {type: string, enum: [low, medium, high]}
              detail: {type: string}
        policies:
          type: array
          items:
            type: object
            properties:
              id: {type: string}
              name: {type: string}
              mode: {type: string, enum: [enforce, report]}
              effect: {type: string}
              matched: {type: boolean}
              outcome: {type: string, enum: ['', allow, require, terms, block]}
              detail: {type: string, description: Why it matched or did not.}
    Terms:
      type: object
      required: [id, name, version, text, url, createdAt, updatedAt]
      properties:
        id: {type: string, examples: [tou_01J9Z8Q4M2N5P7R9T1V3X5Z7B9]}
        name: {type: string}
        version: {type: integer, minimum: 1, description: Goes up by one each time the text or link changes.}
        text: {type: string}
        url: {type: string}
        createdAt: {type: string, format: date-time}
        updatedAt: {type: string, format: date-time}
    TermsAcceptance:
      type: object
      required: [termsId, name, version, acceptedAt]
      properties:
        termsId: {type: string}
        name: {type: string, description: The name of the terms when they were accepted.}
        version: {type: integer}
        acceptedAt: {type: string, format: date-time}
    CertificateAuthority:
      type: object
      required: [id, name, mapping, certificates, createdAt]
      properties:
        id: {type: string}
        name: {type: string}
        mapping: {type: string, enum: [email, upn, subject]}
        certificates:
          type: array
          items:
            type: object
            required: [subject, expiresAt]
            properties:
              subject: {type: string, examples: ['CN=Corporate Issuing CA,O=Example']}
              expiresAt: {type: string, format: date-time}
        createdAt: {type: string, format: date-time}
    NetworkZone:
      type: object
      required: [id, name, kind, cidrs, createdAt, updatedAt]
      properties:
        id: {type: string}
        name: {type: string}
        kind: {type: string, enum: [trusted, risky]}
        cidrs:
          type: array
          items: {type: string}
        createdAt: {type: string, format: date-time}
        updatedAt: {type: string, format: date-time}
    MethodSetting:
      type: object
      required: [method, enabled, updatedAt, users, exclusive]
      properties:
        method: {$ref: '#/components/schemas/MethodKind'}
        enabled: {type: boolean}
        updatedAt: {type: string, format: date-time}
        users: {type: integer}
        exclusive: {type: integer}
    Device:
      type: object
      required: [id, userId, name, os, browser, trust, firstSeenAt, lastSeenAt, lastIp, signIns]
      properties:
        id: {type: string, examples: [dev_01J9Z8Q4M2N5P7R9T1V3X5Z7B9]}
        userId: {type: string}
        name: {type: string}
        os: {type: string}
        browser: {type: string}
        trust: {type: string, enum: [unknown, trusted, blocked]}
        firstSeenAt: {type: string, format: date-time}
        lastSeenAt: {type: string, format: date-time}
        lastIp: {type: string}
        signIns: {type: integer}
        current: {type: boolean}
    RiskEvent:
      type: object
      required: [id, time, type, level, status, userId, ip, deviceId, device, signInId, detail, resolvedBy, resolvedAt]
      properties:
        id: {type: string}
        time: {type: string, format: date-time}
        type: {type: string, enum: [risky-network, failed-sign-ins, new-device]}
        level: {type: string, enum: [medium, high]}
        status: {type: string, enum: [open, resolved, dismissed]}
        userId: {type: [string, 'null']}
        ip: {type: string}
        deviceId: {type: [string, 'null']}
        device: {type: string}
        signInId: {type: [string, 'null']}
        detail: {type: string}
        resolvedBy: {type: [string, 'null']}
        resolvedAt: {type: [string, 'null'], format: date-time}
    ApiKey:
      type: object
      required: [id, serviceAccountId, serviceAccountName, label, prefix, scopes, createdBy, createdAt, expiresAt, lastUsedAt, revokedAt, rateLimitHits]
      properties:
        id: {type: string, examples: [key_01J9Z8Q4M2N5P7R9T1V3X5Z7B9]}
        serviceAccountId: {type: string}
        serviceAccountName: {type: string}
        label: {type: string}
        prefix: {type: string, description: The first 12 characters of the key.}
        scopes:
          type: array
          items: {type: string, enum: [api, scim, registration]}
        createdBy: {type: [string, 'null']}
        createdAt: {type: string, format: date-time}
        expiresAt: {type: [string, 'null'], format: date-time}
        lastUsedAt: {type: [string, 'null'], format: date-time}
        revokedAt: {type: [string, 'null'], format: date-time}
        rateLimitHits: {type: integer, description: Requests with this key that were rejected with `429` in the last 24 hours.}
    ServiceAccount:
      type: object
      required: [id, name, email, description, ownerId, status, rateLimit, roles, keys, createdBy, createdAt]
      properties:
        id: {type: string, examples: [usr_01J9Z8Q4M2N5P7R9T1V3X5Z7B9]}
        name: {type: string}
        email: {type: string, examples: [terraform@service.halo.invalid]}
        description: {type: string}
        ownerId: {type: [string, 'null']}
        status: {type: string, enum: [active, suspended], description: '`suspended` when disabled.'}
        rateLimit: {type: integer, examples: [600], description: Requests per minute that each of the account's API keys may send to the management API.}
        roles:
          type: array
          items: {$ref: '#/components/schemas/RoleKey'}
        keys:
          type: array
          items: {$ref: '#/components/schemas/ApiKey'}
        createdBy: {type: [string, 'null']}
        createdAt: {type: string, format: date-time}
    AppProvisioning:
      type: object
      required: [appId, baseUrl, enabled, lastSyncAt, lastError, created, updated, deactivated, provisioned, groupIds, groupsCreated, groupsUpdated, groupsDeleted, updatedAt]
      properties:
        appId: {type: string}
        baseUrl: {type: string, format: uri}
        enabled: {type: boolean}
        lastSyncAt: {type: [string, 'null'], format: date-time}
        lastError: {type: string}
        created: {type: integer, description: Users created in the last run.}
        updated: {type: integer}
        deactivated: {type: integer}
        provisioned: {type: integer, description: Users currently active in the application.}
        groupIds:
          type: array
          description: Groups pushed to the application, ordered by name.
          items: {type: string}
        groupsCreated: {type: integer, description: Groups created in the last run.}
        groupsUpdated: {type: integer}
        groupsDeleted: {type: integer}
        updatedAt: {type: string, format: date-time}
    IdentityProvider:
      type: object
      required: [id, kind, name, issuer, clientId, hasSecret, scopes, enabled, showOnSignIn, routeByDomain, allowedDomains, jit, jitGroupIds, linkedCount, createdAt, updatedAt]
      properties:
        id: {type: string, examples: [idp_01J9Z8Q4M2N5P7R9T1V3X5Z7B9]}
        kind: {$ref: '#/components/schemas/ProviderKind'}
        name: {type: string}
        issuer: {type: string}
        clientId: {type: string}
        hasSecret: {type: boolean}
        scopes:
          type: array
          items: {type: string}
        enabled: {type: boolean}
        showOnSignIn: {type: boolean}
        routeByDomain: {type: boolean}
        allowedDomains:
          type: array
          items: {type: string}
        jit: {type: boolean}
        jitGroupIds:
          type: array
          items: {type: string}
        linkedCount: {type: integer}
        createdAt: {type: string, format: date-time}
        updatedAt: {type: string, format: date-time}
    FederatedIdentity:
      type: object
      required: [id, providerId, providerName, providerKind, email, createdAt, lastUsedAt]
      properties:
        id: {type: string}
        providerId: {type: string}
        providerName: {type: string}
        providerKind: {$ref: '#/components/schemas/ProviderKind'}
        email: {type: string}
        createdAt: {type: string, format: date-time}
        lastUsedAt: {type: [string, 'null'], format: date-time}
    Settings:
      type: object
      properties:
        organizationName: {type: string, maxLength: 100, description: 'Empty uses `HALO_ORGANIZATION`.'}
        contactEmail: {type: string}
        signInMessage: {type: string, maxLength: 500}
        theme: {$ref: '#/components/schemas/Theme'}
        customCss: {type: string, description: 'At most 32 KB, without `</`. Added after Halo''s stylesheet on the sign-in, setup and account pages.'}
        consoleBranding: {type: boolean, default: false, description: 'Also use `theme` and `customCss` in the admin console.'}
        sessionHours: {type: integer, minimum: 1, maximum: 72, default: 12}
        lockoutThreshold: {type: integer, minimum: 3, maximum: 20, default: 5}
        lockoutMinutes: {type: integer, minimum: 5, maximum: 1440, default: 15}
        inviteDays: {type: integer, minimum: 1, maximum: 30, default: 7}
        accessTokenMinutes: {type: integer, minimum: 5, maximum: 1440, default: 15}
        idTokenMinutes: {type: integer, minimum: 5, maximum: 1440, default: 15}
        refreshTokenHours: {type: integer, minimum: 1, maximum: 2160, default: 8}
        passwordSecondFactor: {type: boolean, default: true, description: Ask for an authenticator app code with every password sign-in.}
        passwordGroupIds: {type: array, items: {type: string}, description: Only members of these groups may use a password. Empty allows everyone.}
        passwordBreachCheck: {type: boolean, default: true, description: 'Refuse new passwords that the Have I Been Pwned range API reports as breached. Only the first 5 characters of the password''s SHA-1 hash leave Halo. Turn it off for installations without internet access; when the API is unreachable, Halo accepts the password and logs a warning.'}
        emailSignIn: {$ref: '#/components/schemas/EmailSignIn'}
        sessionLimit: {type: integer, minimum: 0, maximum: 100, default: 0, description: 'The most sessions a person may hold at once. 0 sets no limit. While a limit applies, signing in again in a browser that holds one of the person''s sessions ends that session and revokes its tokens first, so it is not counted.'}
        sessionLimitAction: {type: string, enum: [refuse, end-oldest], default: refuse, description: 'At the limit, `refuse` turns the new sign-in away with `ERR_SESSION_LIMIT`; `end-oldest` ends the oldest sessions, revokes their tokens and records each in the sign-in log with the result `ended`.'}
        sessionLimitCli: {type: boolean, default: false, description: 'Also limit sessions that `halo login` starts through the device flow. They are counted separately from browser sessions, against the same limit, and checked when the sign-in is approved. When false they are not limited.'}
        sessionLimitGroups:
          type: array
          description: Limits that replace `sessionLimit` for members of these groups. A person in several of these groups gets the lowest of their limits.
          items:
            type: object
            required: [groupId, limit]
            properties:
              groupId: {type: string}
              limit: {type: integer, minimum: 1, maximum: 100}
        authenticatorRules:
          type: array
          default: []
          description: 'Passkey rules for members of these groups, checked whenever a member registers a passkey or security key through the account portal, a setup link or sign-up. A person in several of these groups must meet every rule that applies. Keys registered before a rule keep working.'
          items:
            type: object
            required: [groupId]
            properties:
              groupId: {type: string}
              deviceBound: {type: boolean, default: false, description: 'Refuse passkeys that can sync between devices, such as those kept in iCloud Keychain or Google Password Manager, by their backup eligible flag.'}
              attestation: {type: boolean, default: false, description: 'Ask for direct attestation and refuse keys whose attestation does not verify against the FIDO Metadata Service, including self attestation and none. Halo downloads the service''s list when it first needs it and again each day, so it needs internet access.'}
              aaguids: {type: array, maxItems: 100, default: [], items: {type: string, format: uuid}, description: 'Approved models by AAGUID. Empty accepts any model listed in the FIDO Metadata Service. Needs `attestation`.'}
              minimum: {type: integer, minimum: 0, maximum: 10, default: 0, description: 'Passkeys and security keys that meet the rule a member must keep. Removing a key from your own account below it is refused with `ERR_KEY_MINIMUM`. 0 sets no minimum.'}
        approvalActions:
          type: array
          default: []
          items: {type: string, enum: [global-admin, policy-disable, password-sign-in, identity-providers, impersonation]}
          description: 'Changes that wait for a second global administrator: `global-admin` grants the global administrator role or makes someone eligible to activate it, `policy-disable` turns off, switches to report-only or deletes an enforced access policy, `password-sign-in` turns on password sign-in, `identity-providers` adds, changes, turns on or off or deletes an identity provider, `impersonation` lets a helpdesk administrator see Halo as someone. While any is on, changing this list or `emergencyAccessIds` also needs approval. Turning approval on needs a second active global administrator.'
        emergencyAccessIds:
          type: array
          default: []
          maxItems: 5
          items: {type: string}
          description: People whose changes skip approval. Each use is recorded as `approval.bypass` in the audit log and emailed to the other global administrators.
        impersonationGroupIds:
          type: array
          default: []
          items: {type: string}
          description: Helpdesk administrators can impersonate active members of these groups who hold no administrator role and are not eligible for one. Empty turns impersonation off.
        reauthMinutes: {type: integer, minimum: 1, maximum: 1440, default: 10, description: 'How long a sign-in with a passkey, security key or recovery code, or a confirmation through `/me/reauthenticate`, lets a person make sensitive changes before Halo asks them to confirm it''s them again. Only a global administrator can change it.'}
        clientRegistration: {type: string, enum: ['off', open, token, approval], default: 'off', description: 'Who can register OAuth clients at `/oauth2/register`: nobody, anyone, clients that send an API key with the `registration` scope as the initial access token, or anyone with each new or changed client disabled until an application administrator approves it.'}
        emailTemplates:
          type: object
          readOnly: true
          additionalProperties: {$ref: '#/components/schemas/EmailTemplateText'}
          description: Custom email subjects and bodies by template kind, left out when there are none. Change them through `/email-templates/{kind}`.
        botProtection: {type: string, enum: ['', turnstile, hcaptcha], default: '', description: 'Ask for a check from Cloudflare Turnstile or hCaptcha on `/auth/magic-link` and `/auth/sign-up`, and on `/auth/password`, `/auth/totp`, `/auth/recovery`, `/auth/magic-link/code` and `/auth/access-pass` once the client IP address has `lockoutThreshold` failed sign-ins within the lockout window. Passkeys are never checked. Empty turns it off. Turning it on needs `botProtectionSiteKey` and a stored `botProtectionSecret`.'}
        botProtectionSiteKey: {type: string, pattern: '^[A-Za-z0-9_-]{1,100}$', description: The public site key from the provider. The sign-in page uses it to show the check.}
        signUp: {type: string, enum: ['off', open, approval], default: 'off', description: 'Who can create an account at `/auth/sign-up`: nobody, anyone at an allowed domain once they confirm their address and create a passkey, or the same people after a user administrator approves them under `/sign-ups`. Turning it on with an empty `signUpDomains` needs a verified domain.'}
        signUpDomains: {type: array, default: [], maxItems: 100, items: {type: string, examples: [example.com]}, description: 'Email domains people can sign up with, matched exactly and without case. Empty allows the verified domains under `/domains`.'}
        signUpGroupIds: {type: array, default: [], items: {type: string}, description: 'Assigned groups that new accounts from sign-up join. Dynamic groups are skipped.'}
        botProtectionSecret: {type: string, maxLength: 200, writeOnly: true, description: The secret key from the provider. Stored encrypted and never returned; `botProtectionSecretSet` in the response says whether one is stored. Omit it or send an empty string to keep the stored one.}
        signInLogDays: {type: integer, minimum: 0, maximum: 3650, default: 0, description: 'Days to keep sign-in log entries, between 7 and 3,650. 0 keeps them forever. Once a day Halo deletes older entries in batches and records the count as `log.prune` in the audit log. Only a global administrator can change it.'}
        auditLogDays: {type: integer, minimum: 0, maximum: 3650, default: 0, description: 'Days to keep audit log entries, between 30 and 3,650. 0 keeps them forever. Once a day Halo deletes older entries in batches and records the count as `log.prune` in the audit log. Only a global administrator can change it.'}
    EmailTemplateText:
      type: object
      required: [subject, body]
      properties:
        subject: {type: string, maxLength: 200, description: 'One line.', examples: ['Welcome to {{.Organization}}']}
        body: {type: string, maxLength: 10000, description: 'Plain text. Halo adds a footer with the organization name.', examples: ['Hi {{if .Name}}{{.Name}}{{else}}there{{end}}, set up your account: {{.Link}}']}
    EmailTemplate:
      type: object
      required: [kind, label, description, variables, default, custom]
      properties:
        kind: {type: string, enum: [invite, reset, magic_link, magic_code, sign_up, access_request, access_approved, access_denied, access_pass]}
        label: {type: string, examples: [Invitation]}
        description: {type: string}
        variables:
          type: array
          items:
            type: object
            required: [name, description, example]
            properties:
              name: {type: string, examples: [Link]}
              description: {type: string}
              example: {type: string, description: The value previews and the check on save use.}
        required: {type: string, description: 'A variable the body must use, such as `Link` for an invitation or `Code` for a sign-in code.'}
        default: {$ref: '#/components/schemas/EmailTemplateText'}
        custom:
          oneOf:
            - {$ref: '#/components/schemas/EmailTemplateText'}
            - {type: 'null'}
          description: The saved subject and body, or null when Halo sends its default.
    ChallengeToken:
      type: string
      description: 'The token from the bot protection check on the sign-in page. Needed only while `botProtection` is on: always for `/auth/magic-link` and `/auth/sign-up`, and for password and code sign-ins once the client IP address has `lockoutThreshold` failed sign-ins within the lockout window. Without it the request is refused with `ERR_CHALLENGE_REQUIRED`; Halo verifies it with the provider, and the result is recorded in the sign-in log as `challenge`. If the provider cannot be reached, the request is refused with `ERR_CHALLENGE_UNAVAILABLE`.'
    ClientMetadata:
      type: object
      description: 'Client metadata from RFC 7591. Halo ignores fields it does not list here. Requests are at most 16 KB.'
      properties:
        client_name: {type: string, maxLength: 200, description: One line. Defaults to the host of the first redirect URI.}
        client_uri: {type: string, format: uri, maxLength: 200}
        redirect_uris:
          type: array
          minItems: 1
          maxItems: 10
          items: {type: string, format: uri, description: 'An absolute https:// address without a fragment; http:// only for localhost and 127.0.0.1.'}
        post_logout_redirect_uris:
          type: array
          maxItems: 10
          items: {type: string, format: uri}
        grant_types:
          type: array
          items: {type: string, enum: [authorization_code, refresh_token]}
          description: Must include `authorization_code`. Any other grant type is refused with `invalid_client_metadata`.
        response_types:
          type: array
          items: {type: string, enum: [code]}
        token_endpoint_auth_method: {type: string, enum: [client_secret_basic, client_secret_post, none], default: client_secret_basic, description: '`none` registers a public client that must use PKCE.'}
        application_type: {type: string, enum: [web, native], default: web, description: '`native` needs `token_endpoint_auth_method` `none`.'}
        scope: {type: string, description: 'Space-separated. Halo keeps only `openid`, `profile` and `email` and always includes `openid`.', examples: [openid profile email]}
        id_token_signed_response_alg: {type: string, enum: [RS256, ES256, EdDSA], default: RS256, description: 'Any other value is refused with `invalid_client_metadata`.'}
    ClientRegistration:
      allOf:
        - {$ref: '#/components/schemas/ClientMetadata'}
        - type: object
          required: [client_id, client_id_issued_at, registration_client_uri, redirect_uris, grant_types, response_types, token_endpoint_auth_method, application_type, scope]
          properties:
            client_id: {type: string, examples: [hl_01J9Z8Q4M2N5P7R9T1V3X5Z7B9]}
            client_id_issued_at: {type: integer, description: Unix time.}
            client_secret: {type: string, description: 'Only in the registration response, for confidential clients.'}
            client_secret_expires_at: {type: integer, description: 'Unix time, with `client_secret`.'}
            registration_access_token: {type: string, description: 'Only in the registration response. Send it as a bearer token to `registration_client_uri`.'}
            registration_client_uri: {type: string, format: uri}
    OAuthError:
      type: object
      required: [error, error_description]
      properties:
        error: {type: string, enum: [invalid_request, invalid_token, invalid_redirect_uri, invalid_client_metadata, temporarily_unavailable, server_error]}
        error_description: {type: string}
    EmailSignIn:
      type: string
      enum: [link, code, both]
      default: link
      description: 'What sign-in emails from `/auth/magic-link` contain: a link, a six-digit code to enter on the sign-in page that asked for it, or both. A code works when the email is read on another device, and a mail scanner that opens the link does not use up the code.'
    SignUp:
      type: object
      required: [id, email, name, createdAt, verifiedAt]
      properties:
        id: {type: string}
        email: {type: string}
        name: {type: string}
        createdAt: {type: string, format: date-time, description: When the person last asked for the sign-up link.}
        verifiedAt: {type: string, format: date-time, description: When the person confirmed the address and created the passkey.}
    Domain:
      type: object
      required: [id, name, token, createdAt, verifiedAt]
      properties:
        id: {type: string}
        name: {type: string}
        token: {type: string, description: 'Publish `halo-verification=<token>` as a TXT record.'}
        createdAt: {type: string, format: date-time}
        verifiedAt: {type: [string, 'null'], format: date-time}
    Webhook:
      type: object
      required: [id, url, description, events, enabled, createdAt, updatedAt, lastStatus, lastDeliveryAt]
      properties:
        id: {type: string, examples: [whk_01J9Z8Q4M2N5P7R9T1V3X5Z7B9]}
        url: {type: string, format: uri}
        description: {type: string}
        events:
          type: array
          items: {type: string}
        enabled: {type: boolean}
        createdAt: {type: string, format: date-time}
        updatedAt: {type: string, format: date-time}
        lastStatus: {type: [string, 'null'], enum: [pending, delivered, failed, null]}
        lastDeliveryAt: {type: [string, 'null'], format: date-time}
    WebhookDelivery:
      type: object
      required: [id, endpointId, eventId, eventType, body, status, attempts, nextAttemptAt, lastAttemptAt, responseStatus, error, createdAt]
      properties:
        id: {type: string, examples: [whd_01J9Z8Q4M2N5P7R9T1V3X5Z7B9]}
        endpointId: {type: string}
        eventId: {type: string}
        eventType: {type: string}
        body: {type: string, description: The exact JSON body Halo sends.}
        status: {type: string, enum: [pending, delivered, failed]}
        attempts: {type: integer}
        nextAttemptAt: {type: string, format: date-time}
        lastAttemptAt: {type: [string, 'null'], format: date-time}
        responseStatus: {type: [integer, 'null']}
        error: {type: string}
        createdAt: {type: string, format: date-time}
    ConsentScope:
      type: object
      required: [name, description]
      properties:
        name: {type: string, examples: [email]}
        description: {type: string, description: 'The API resource''s description of the scope, or empty for the standard OpenID Connect scopes.'}
    Consent:
      type: object
      required: [appId, name, homepage, logoUrl, scopes, grantedAt]
      properties:
        appId: {type: string}
        name: {type: string}
        homepage: {type: string}
        logoUrl: {type: [string, 'null']}
        scopes:
          type: array
          items: {$ref: '#/components/schemas/ConsentScope'}
        grantedAt: {type: string, format: date-time, description: When you last allowed more scopes.}
    ApiScope:
      type: object
      required: [name]
      properties:
        name: {type: string, pattern: '^[a-z0-9][a-z0-9:._/-]{0,99}$', examples: ['billing:read']}
        description: {type: string, maxLength: 200}
    ApiResource:
      type: object
      required: [id, name, identifier, description, accessTokenTtl, accessTokenAlg, scopes, grants, createdAt, updatedAt]
      properties:
        id: {type: string}
        name: {type: string}
        identifier: {type: string, format: uri}
        description: {type: string}
        accessTokenTtl: {type: integer}
        accessTokenAlg: {type: string, enum: [RS256, ES256, EdDSA]}
        scopes:
          type: array
          items: {$ref: '#/components/schemas/ApiScope'}
        grants:
          type: array
          items:
            type: object
            required: [appId, scopes]
            properties:
              appId: {type: string}
              scopes:
                type: array
                items: {type: string}
        createdAt: {type: string, format: date-time}
        updatedAt: {type: string, format: date-time}
    SSHAuthority:
      type: object
      required: [publicKey, fingerprint, createdAt, certificateLifetime]
      properties:
        publicKey: {type: string}
        fingerprint: {type: string, examples: ['SHA256:…']}
        createdAt: {type: string, format: date-time}
        certificateLifetime: {type: integer, description: Seconds. Defaults to 28800 (8 hours).}
    SSHPrincipalMapping:
      type: object
      required: [id, groupId, principals, createdAt, updatedAt]
      properties:
        id: {type: string}
        groupId: {type: string}
        principals:
          type: array
          items: {type: string}
        createdAt: {type: string, format: date-time}
        updatedAt: {type: string, format: date-time}
    SSHCertificate:
      type: object
      required: [serial, keyId, userId, userName, principals, fingerprint, keyType, ip, validAfter, validBefore, createdAt]
      properties:
        serial: {type: integer}
        keyId: {type: string, examples: ['halo:usr_01J9Z8Q4M2N5P7R9T1V3X5Z7B9:42']}
        userId: {type: [string, 'null']}
        userName: {type: string}
        principals:
          type: array
          items: {type: string}
        fingerprint: {type: string}
        keyType: {type: string, examples: [ssh-ed25519]}
        ip: {type: string}
        validAfter: {type: string, format: date-time}
        validBefore: {type: string, format: date-time}
        createdAt: {type: string, format: date-time}
    SSHCertificateIssued:
      type: object
      required: [certificate, serial, keyId, principals, fingerprint, validAfter, validBefore]
      properties:
        certificate: {type: string, description: 'One line in OpenSSH format. Save it next to the key as `<key>-cert.pub`.'}
        serial: {type: integer}
        keyId: {type: string}
        principals:
          type: array
          items: {type: string}
        fingerprint: {type: string}
        validAfter: {type: string, format: date-time, description: '5 minutes before issue, to allow for clock skew.'}
        validBefore: {type: string, format: date-time}
    DeviceAuthorization:
      type: object
      required: [userCode, application, logoUrl, clientId, scopes, ip, userAgent, requestedAt, expiresAt]
      properties:
        userCode: {type: string, examples: [BCDF-GHJK]}
        application: {type: string}
        logoUrl: {type: [string, 'null']}
        clientId: {type: string, examples: [halo-cli]}
        scopes:
          type: array
          items: {type: string}
        ip: {type: string, description: The address the device requested the code from.}
        userAgent: {type: string}
        requestedAt: {type: string, format: date-time}
        expiresAt: {type: string, format: date-time}
    OutboxMessage:
      type: object
      required: [id, to, subject, text, attempts, lastError, createdAt, sentAt]
      properties:
        id: {type: string, examples: [msg_01J9Z8Q4M2N5P7R9T1V3X5Z7B9]}
        to: {type: string}
        subject: {type: string}
        text: {type: string}
        attempts: {type: integer}
        lastError: {type: string}
        createdAt: {type: string, format: date-time}
        sentAt: {type: [string, 'null'], format: date-time}
    SigningKey:
      type: object
      required: [kid, algorithm, active, createdAt, retiresAt, retiredAt]
      properties:
        kid: {type: string, description: The key id in the JWKS and in the `kid` header of tokens.}
        algorithm: {type: string, enum: [RS256, ES256, EdDSA]}
        active: {type: boolean, description: True for the newest key of its algorithm, which signs new tokens.}
        createdAt: {type: string, format: date-time}
        retiresAt: {type: [string, 'null'], format: date-time, description: 'For a replaced key, when it leaves the JWKS: 7 days after the next key was created.'}
