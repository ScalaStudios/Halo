  /identity-proofing/webhook:
    post:
      tags: [Users]
      operationId: receiveIdentityProofResult
      summary: Receive an identity check result from the verification provider
      description: |-
        Without a session or API key. Register this address at the provider and save its signing secret as `identityProofingWebhookSecret`; without one, every event is refused and Halo asks the provider for results instead.

        With `identityProofingProvider` set to `stripe`, send Stripe Identity events with the `Stripe-Signature` header Stripe adds. Halo reads `identity.verification_session.verified` as a success, and `identity.verification_session.requires_input` and `identity.verification_session.canceled` as a failure, and answers other events without acting on them.

        With `generic`, the provider signs the raw body like Halo signs webhooks: `Halo-Signature: t=<unix seconds>,v1=<hex HMAC-SHA256 of "<t>.<body>" with the signing secret>`, and sends `{"id": "<unique event id>", "session": "<session id>", "status": "verified" | "failed"}`. Halo creates sessions with `POST <identityProofingEndpoint>`, `Authorization: Bearer <identityProofingApiKey>` and `{"returnUrl": "…"}`, and expects `{"id": "…", "url": "https://…"}` back; it asks for a result with `GET <identityProofingEndpoint>/<id>` and reads `status` as `pending`, `verified` or `failed`.

        The signature must be within 5 minutes of Halo's clock, and each event id is used once, so a replayed event is answered `200` without acting on it again. Only the first result of a session counts. Halo reads only the event id, the session id and the result, never the person's details. Each result is recorded as `user.identity_proof.result`.
      security: []
      parameters:
        - {name: Halo-Signature, in: header, schema: {type: string, examples: ['t=1763640000,v1=5f2b…']}}
        - {name: Stripe-Signature, in: header, schema: {type: string}}
      requestBody:
        required: true
        content:
          application/json:
            schema: {type: object}
      responses:
        '200':
          description: The event was received.
          content:
            application/json:
              schema:
                type: object
                properties:
                  received: {type: boolean}
        '401':
          description: '`ERR_SIGNATURE`: the signature header is missing, older than 5 minutes or does not match, or no provider or signing secret is saved.'
          content:
            application/json:
              schema: {$ref: '#/components/schemas/Error'}
        '422': {$ref: '#/components/responses/Invalid'}
  /compliance-sources/{id}/reports:
    parameters:
      - {$ref: '#/components/parameters/Id'}
    post:
      tags: [Policies]
      operationId: reportCompliance
      summary: Report device compliance from an agent
      description: 'For `agent` sources, without a session or API key. Sign the raw body like Halo signs webhooks: send `Halo-Signature: t=<unix seconds>,v1=<hex HMAC-SHA256 of "<t>.<body>" with the signing secret>`, within 5 minutes of Halo''s clock. Each report replaces the record with the same `id` and counts as fresh for the source''s `maxAgeMinutes`. A changed state writes a `device.compliance` audit event for each linked device.'
      security: []
      parameters:
        - {name: Halo-Signature, in: header, required: true, schema: {type: string, examples: ['t=1763640000,v1=5f2b…']}}
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [devices]
              properties:
                devices:
                  type: array
                  minItems: 1
                  maxItems: 1000
                  items:
                    type: object
                    required: [id, state]
                    properties:
                      id: {type: string, maxLength: 200, description: 'The agent''s id for the device, such as its serial number.'}
                      name: {type: string, maxLength: 200}
                      owner: {type: string, maxLength: 320, description: The email address of the person who uses the device.}
                      state: {type: string, enum: [compliant, non-compliant, unknown]}
                      osVersion: {type: string, maxLength: 100, examples: [macOS 15.1]}
                      diskEncrypted: {type: boolean}
                      patchLevel: {type: string, maxLength: 100, examples: ['2026-11-01']}
      responses:
        '200':
          description: The number of devices stored.
          content:
            application/json:
              schema:
                type: object
                required: [accepted]
                properties:
                  accepted: {type: integer}
        '400': {$ref: '#/components/responses/BadJSON'}
        '401':
          description: '`ERR_SIGNATURE`: the source does not exist, is not an agent source, or the signature is missing, expired or wrong.'
          content:
            application/json:
              schema: {$ref: '#/components/schemas/Error'}
        '422': {$ref: '#/components/responses/Invalid'}
