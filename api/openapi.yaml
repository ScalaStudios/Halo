openapi: 3.1.0
info:
  title: Halo management API
  version: 0.1.0
  license:
    name: Apache-2.0
    identifier: Apache-2.0
  description: |
    The JSON API behind the Halo console and account portal. Anything the web interface does, a script can do with the same requests.

    **Authentication.** Send either the `halo_session` cookie of a signed-in person, or an API key of a service account as `Authorization: Bearer hlk_…`. API keys work only when they have the `api` scope, act with the roles of their service account, and are ignored on the personal routes under `/me` and on the sign-in routes under `/auth`. The personal routes under `/me/` (with a trailing segment, not `/me` itself) also accept an access token that `halo login` obtained for the built-in Halo CLI application.

    **Roles.** Each operation states the roles it requires. A global administrator passes every role check. "Any administrator" means security, user, helpdesk or application administrator, or auditor.

    **Errors.** Every error is `{"error": {"code": "ERR_…", "message": "…"}}`. Match on `code`; show `message` to people. Besides the codes listed per operation, any request can fail with `500` and `ERR_INTERNAL`, and unknown routes answer `404` with `ERR_NO_ROUTE`. Requests with a method other than GET, HEAD or OPTIONS that come from another website get `403` with `ERR_CROSS_SITE`.

    **Conventions.** Bodies are JSON with camelCase names, at most 1 MiB, and unknown fields are rejected. Times are RFC 3339. Ids are a prefix and a 26-character ULID, such as `usr_01J9Z…`.
servers:
  - url: /api/v1
security:
  - session: []
  - apiKey: []
tags:
  - name: Organization
    description: Public information about the organization.
  - name: Sign-in
    description: Passkey, code, magic link, federated and enrollment sign-in. These routes work without a session unless noted, and ignore API keys.
  - name: Device sign-in
    description: The confirmation page of the device flow that `halo login` uses.
  - name: Account
    description: The signed-in person's own profile, sign-in methods, sessions, access and certificates. API keys cannot use these routes.
  - name: Users
    description: Invitations, profiles, suspension, sign-in methods and roles of the people in the directory.
  - name: Groups
    description: Assigned and rule-based groups and their members.
  - name: Applications
    description: OpenID Connect, OAuth and SAML applications, their secrets and group assignments.
  - name: Activity
    description: Sessions, the sign-in log, the audit log and the overview.
  - name: Access packages
    description: Bundles of groups that people can request.
  - name: Access requests
    description: Requests for access packages and the grants they create.
  - name: Access reviews
    description: Periodic reviews of who stays in an assigned group.
  - name: Lifecycle
    description: Joiner, mover and leaver rules.
  - name: Policies
    description: Conditional access policies, network zones, sign-in methods, devices and risk events.
  - name: Service accounts
    description: Non-human accounts and their API keys.
  - name: Provisioning
    description: Outbound SCIM provisioning to applications.
  - name: Identity providers
    description: Google, Microsoft Entra, GitHub and generic OpenID Connect providers people sign in with.
  - name: Settings
    description: Organization settings, branding, domains and data export.
  - name: Webhooks
    description: Signed HTTP delivery of audit and sign-in events.
  - name: API resources
    description: Your own APIs, their scopes, and which applications may request them.
  - name: SSH
    description: The SSH certificate authority, principal mappings and issued certificates.
  - name: Development
    description: Routes that exist only with HALO_DEV=1.
paths:
  /organization:
    get:
      tags: [Organization]
      operationId: getOrganization
      summary: Get the organization name, issuer and branding
      security: []
      responses:
        '200':
          description: The organization.
          content:
            application/json:
              schema: {$ref: '#/components/schemas/Organization'}
  /openapi.yaml:
    get:
      tags: [Organization]
      operationId: getOpenAPI
      summary: Get this OpenAPI document
      security: []
      responses:
        '200':
          description: The OpenAPI document.
          content:
            application/yaml:
              schema: {type: string}
  /branding/logo:
    get:
      tags: [Organization]
      operationId: getLogo
      summary: Get the sign-in logo
      security: []
      responses:
        '200':
          description: The logo image. Cached for 5 minutes.
          content:
            image/png:
              schema: {type: string, contentMediaType: image/png}
            image/jpeg:
              schema: {type: string, contentMediaType: image/jpeg}
            image/webp:
              schema: {type: string, contentMediaType: image/webp}
        '404': {$ref: '#/components/responses/NotFound'}
    put:
      tags: [Settings]
      operationId: uploadLogo
      summary: Upload the sign-in logo
      description: 'Roles: global administrator. Send the image bytes as the body: PNG, JPEG or WebP, at most 256 KB. Halo detects the type from the content.'
      requestBody:
        required: true
        content:
          image/png:
            schema: {type: string, contentMediaType: image/png}
          image/jpeg:
            schema: {type: string, contentMediaType: image/jpeg}
          image/webp:
            schema: {type: string, contentMediaType: image/webp}
      responses:
        '200':
          description: The organization with its new `logoUrl`.
          content:
            application/json:
              schema: {$ref: '#/components/schemas/Organization'}
        '401': {$ref: '#/components/responses/Unauthenticated'}
        '403': {$ref: '#/components/responses/Forbidden'}
        '413':
          description: '`ERR_TOO_LARGE`: the image is larger than 256 KB.'
          content:
            application/json:
              schema: {$ref: '#/components/schemas/Error'}
        '422': {$ref: '#/components/responses/Invalid'}
    delete:
      tags: [Settings]
      operationId: deleteLogo
      summary: Remove the sign-in logo
      description: 'Roles: global administrator.'
      responses:
        '204': {$ref: '#/components/responses/NoContent'}
        '401': {$ref: '#/components/responses/Unauthenticated'}
        '403': {$ref: '#/components/responses/Forbidden'}
        '404': {$ref: '#/components/responses/NotFound'}
  /auth/methods:
    get:
      tags: [Sign-in]
      operationId: listEnabledMethods
      summary: List the sign-in methods that are turned on
      security: []
      responses:
        '200':
          description: The enabled methods.
          content:
            application/json:
              schema:
                type: object
                required: [methods]
                properties:
                  methods:
                    type: array
                    items: {$ref: '#/components/schemas/MethodKind'}
  /auth/providers:
    get:
      tags: [Sign-in]
      operationId: listSignInProviders
      summary: List the identity providers shown on the sign-in page
      description: Only providers that are enabled and set to show on the sign-in page.
      security: []
      responses:
        '200':
          description: The providers.
          content:
            application/json:
              schema:
                type: array
                items:
                  type: object
                  required: [id, name, kind]
                  properties:
                    id: {type: string, examples: [idp_01J9Z8Q4M2N5P7R9T1V3X5Z7B9]}
                    name: {type: string, examples: [Google]}
                    kind: {$ref: '#/components/schemas/ProviderKind'}
  /auth/request/{id}:
    parameters:
      - {$ref: '#/components/parameters/Id'}
    get:
      tags: [Sign-in]
      operationId: getAuthRequest
      summary: Get the application behind a sign-in request
      security: []
      responses:
        '200':
          description: The application's name and homepage.
          content:
            application/json:
              schema:
                type: object
                required: [application]
                properties:
                  application:
                    type: object
                    required: [name, homepage]
                    properties:
                      name: {type: string}
                      homepage: {type: string}
        '404': {$ref: '#/components/responses/AuthRequestExpired'}
  /auth/passkey/begin:
    post:
      tags: [Sign-in]
      operationId: beginPasskeySignIn
      summary: Start a passkey sign-in
      security: []
      responses:
        '200': {$ref: '#/components/responses/Ceremony'}
        '403': {$ref: '#/components/responses/CrossSite'}
  /auth/passkey/finish:
    post:
      tags: [Sign-in]
      operationId: finishPasskeySignIn
      summary: Complete a passkey sign-in
      description: Sets the `halo_session` cookie on success.
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [ceremony, credential]
              properties:
                ceremony: {type: string, description: The ceremony id from the begin step.}
                credential: {type: object, description: 'The browser''s PublicKeyCredential response, as JSON.'}
                authRequest: {$ref: '#/components/schemas/AuthRequestId'}
      responses:
        '200': {$ref: '#/components/responses/SignedIn'}
        '400': {$ref: '#/components/responses/BadJSON'}
        '401':
          description: '`ERR_PASSKEY_REJECTED`: the prompt expired, the passkey is not registered, its signature did not verify, or its counter went backwards.'
          content:
            application/json:
              schema: {$ref: '#/components/schemas/Error'}
        '403': {$ref: '#/components/responses/SignInRefused'}
        '404': {$ref: '#/components/responses/AuthRequestExpired'}
  /auth/identify:
    post:
      tags: [Sign-in]
      operationId: identify
      summary: List the methods to offer for an email address
      description: Answers `["passkey", "totp"]` for addresses without an account, so the response does not reveal whether an account exists.
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [email]
              properties:
                email: {type: string, format: email}
      responses:
        '200':
          description: The methods the person has, out of passkey, security-key, totp and recovery-codes.
          content:
            application/json:
              schema:
                type: object
                required: [methods]
                properties:
                  methods:
                    type: array
                    items: {$ref: '#/components/schemas/MethodKind'}
        '400': {$ref: '#/components/responses/BadJSON'}
  /auth/totp:
    post:
      tags: [Sign-in]
      operationId: signInWithTOTP
      summary: Sign in with an authenticator code
      security: []
      requestBody: {$ref: '#/components/requestBodies/CodeSignIn'}
      responses:
        '200': {$ref: '#/components/responses/SignedIn'}
        '400': {$ref: '#/components/responses/BadJSON'}
        '401': {$ref: '#/components/responses/CodeMismatch'}
        '403': {$ref: '#/components/responses/SignInRefused'}
        '404': {$ref: '#/components/responses/AuthRequestExpired'}
        '429': {$ref: '#/components/responses/TooManyAttempts'}
  /auth/recovery:
    post:
      tags: [Sign-in]
      operationId: signInWithRecoveryCode
      summary: Sign in with a recovery code
      description: Uses up the code. Case, dashes and spaces are ignored.
      security: []
      requestBody: {$ref: '#/components/requestBodies/CodeSignIn'}
      responses:
        '200': {$ref: '#/components/responses/SignedIn'}
        '400': {$ref: '#/components/responses/BadJSON'}
        '401': {$ref: '#/components/responses/CodeMismatch'}
        '403': {$ref: '#/components/responses/SignInRefused'}
        '404': {$ref: '#/components/responses/AuthRequestExpired'}
        '429': {$ref: '#/components/responses/TooManyAttempts'}
  /auth/magic-link:
    post:
      tags: [Sign-in]
      operationId: requestMagicLink
      summary: Email a sign-in link
      description: Emails a link that works once for 10 minutes, to active accounts only, at most 5 times per person in 15 minutes, and only while magic links are turned on under `/methods`. Answers `202` the same way whether or not the account exists or magic links are on.
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [email]
              properties:
                email: {type: string, format: email}
                authRequest: {$ref: '#/components/schemas/AuthRequestId'}
      responses:
        '202':
          description: Accepted. The body is an empty object.
          content:
            application/json:
              schema: {type: object}
        '400': {$ref: '#/components/responses/BadJSON'}
        '404': {$ref: '#/components/responses/AuthRequestExpired'}
  /auth/magic-link/redeem:
    post:
      tags: [Sign-in]
      operationId: redeemMagicLink
      summary: Sign in with an emailed link
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [token]
              properties:
                token: {type: string, description: The token query parameter of the link.}
      responses:
        '200': {$ref: '#/components/responses/SignedIn'}
        '400': {$ref: '#/components/responses/BadJSON'}
        '403': {$ref: '#/components/responses/SignInRefused'}
        '404':
          description: '`ERR_LINK_EXPIRED`: the link expired or was already used. `ERR_AUTH_REQUEST_EXPIRED`: the application''s sign-in request expired.'
          content:
            application/json:
              schema: {$ref: '#/components/schemas/Error'}
  /auth/continue:
    post:
      tags: [Sign-in]
      operationId: continueAuthRequest
      summary: Continue an application's sign-in request with the current session
      security:
        - session: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [authRequest]
              properties:
                authRequest: {$ref: '#/components/schemas/AuthRequestId'}
      responses:
        '200': {$ref: '#/components/responses/SignedIn'}
        '400': {$ref: '#/components/responses/BadJSON'}
        '401':
          description: '`ERR_UNAUTHENTICATED`: no session. `ERR_REAUTH_REQUIRED`: the application sent `prompt=login`, or a `max_age` shorter than the session''s age.'
          content:
            application/json:
              schema: {$ref: '#/components/schemas/Error'}
        '403': {$ref: '#/components/responses/SignInRefused'}
        '404': {$ref: '#/components/responses/AuthRequestExpired'}
        '422': {$ref: '#/components/responses/Invalid'}
  /auth/enroll:
    get:
      tags: [Sign-in]
      operationId: getEnrollment
      summary: Get the person an invite or reset link belongs to
      security: []
      parameters:
        - name: token
          in: query
          required: true
          schema: {type: string}
      responses:
        '200':
          description: The person and the link's purpose.
          content:
            application/json:
              schema:
                type: object
                required: [user, purpose]
                properties:
                  user:
                    type: object
                    required: [name, email]
                    properties:
                      name: {type: string}
                      email: {type: string}
                  purpose: {type: string, enum: [invite, reset]}
        '403': {$ref: '#/components/responses/Suspended'}
        '404': {$ref: '#/components/responses/LinkExpired'}
  /auth/enroll/begin:
    post:
      tags: [Sign-in]
      operationId: beginEnrollment
      summary: Start registering the first passkey or security key
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [token]
              properties:
                token: {type: string}
      responses:
        '200': {$ref: '#/components/responses/Ceremony'}
        '400': {$ref: '#/components/responses/BadJSON'}
        '403': {$ref: '#/components/responses/Suspended'}
        '404': {$ref: '#/components/responses/LinkExpired'}
  /auth/enroll/finish:
    post:
      tags: [Sign-in]
      operationId: finishEnrollment
      summary: Save the first credential and sign in
      description: Uses up the link in the same transaction that saves the credential, and sets the `halo_session` cookie.
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [token, ceremony, credential]
              properties:
                token: {type: string}
                ceremony: {type: string}
                credential: {type: object, description: 'The browser''s PublicKeyCredential creation response, as JSON.'}
                label: {type: string, description: 'Defaults to the kind, browser and operating system, such as "Passkey · Chrome on macOS".'}
      responses:
        '200': {$ref: '#/components/responses/SignedIn'}
        '400': {$ref: '#/components/responses/RegistrationFailed'}
        '403': {$ref: '#/components/responses/SignInRefused'}
        '404': {$ref: '#/components/responses/LinkExpired'}
  /auth/sign-out:
    post:
      tags: [Sign-in]
      operationId: signOut
      summary: End the current session
      description: Ends the session, if there is one, and clears the cookie.
      security: []
      responses:
        '204': {$ref: '#/components/responses/NoContent'}
        '403': {$ref: '#/components/responses/CrossSite'}
  /auth/federated/{id}/start:
    parameters:
      - {$ref: '#/components/parameters/Id'}
    get:
      tags: [Sign-in]
      operationId: startFederatedSignIn
      summary: Redirect to an identity provider
      description: A browser navigation, not a JSON call. On failure Halo redirects to `/sign-in?error=CODE` with `ERR_PROVIDER_UNAVAILABLE`, `ERR_PROVIDER_UNREACHABLE` or `ERR_AUTH_REQUEST_EXPIRED`.
      security: []
      parameters:
        - name: authRequest
          in: query
          schema: {$ref: '#/components/schemas/AuthRequestId'}
        - name: next
          in: query
          description: A local path to open after signing in, when there is no `authRequest`.
          schema: {type: string, examples: [/account/security]}
      responses:
        '302':
          description: Redirect to the provider's authorization endpoint, or to the sign-in page with an error.
  /auth/federated/callback:
    get:
      tags: [Sign-in]
      operationId: federatedCallback
      summary: Receive the identity provider's response
      description: The redirect URI to register at the provider. On success Halo sets the `halo_session` cookie and redirects to the application, `next` or `/account`. On failure it redirects to `/sign-in?error=CODE` with `ERR_FEDERATION_STATE`, `ERR_PROVIDER_UNAVAILABLE`, `ERR_FEDERATION_CANCELLED`, `ERR_FEDERATION_FAILED`, `ERR_FEDERATION_EMAIL`, `ERR_FEDERATION_DOMAIN`, `ERR_FEDERATION_NO_ACCOUNT`, or one of the codes that refuse any sign-in.
      security: []
      parameters:
        - {name: state, in: query, schema: {type: string}}
        - {name: code, in: query, schema: {type: string}}
        - {name: error, in: query, schema: {type: string}}
      responses:
        '302':
          description: Redirect after the sign-in or its failure.
  /device/{code}:
    parameters:
      - {$ref: '#/components/parameters/DeviceCode'}
    get:
      tags: [Device sign-in]
      operationId: getDeviceAuthorization
      summary: Show a pending device sign-in
      security:
        - session: []
      responses:
        '200':
          description: The pending request.
          content:
            application/json:
              schema: {$ref: '#/components/schemas/DeviceAuthorization'}
        '401': {$ref: '#/components/responses/Unauthenticated'}
        '404': {$ref: '#/components/responses/DeviceCode'}
  /device/{code}/approve:
    parameters:
      - {$ref: '#/components/parameters/DeviceCode'}
    post:
      tags: [Device sign-in]
      operationId: approveDeviceAuthorization
      summary: Approve a device sign-in
      description: Checks application assignment and the access policies against the current session, records a sign-in event, and lets the waiting device collect its tokens.
      security:
        - session: []
      responses:
        '200': {$ref: '#/components/responses/DeviceDecision'}
        '401': {$ref: '#/components/responses/Unauthenticated'}
        '403':
          description: '`ERR_NOT_ASSIGNED`, `ERR_BLOCKED_BY_POLICY`, `ERR_STRONGER_AUTH_REQUIRED` or `ERR_CROSS_SITE`.'
          content:
            application/json:
              schema: {$ref: '#/components/schemas/Error'}
        '404': {$ref: '#/components/responses/DeviceCode'}
  /device/{code}/deny:
    parameters:
      - {$ref: '#/components/parameters/DeviceCode'}
    post:
      tags: [Device sign-in]
      operationId: denyDeviceAuthorization
      summary: Deny a device sign-in
      security:
        - session: []
      responses:
        '200': {$ref: '#/components/responses/DeviceDecision'}
        '401': {$ref: '#/components/responses/Unauthenticated'}
        '403': {$ref: '#/components/responses/CrossSite'}
        '404': {$ref: '#/components/responses/DeviceCode'}
  /me:
    get:
      tags: [Account]
      operationId: getMe
      summary: Get your profile, sign-in methods, roles, groups and applications
      security:
        - session: []
      responses:
        '200':
          description: You.
          content:
            application/json:
              schema: {$ref: '#/components/schemas/User'}
        '401': {$ref: '#/components/responses/Unauthenticated'}
  /me/passkeys/begin:
    post:
      tags: [Account]
      operationId: beginAddPasskey
      summary: Start registering another passkey or security key
      security: &personal
        - session: []
        - cliAccessToken: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [kind]
              properties:
                kind: {type: string, enum: [passkey, security-key]}
      responses:
        '200': {$ref: '#/components/responses/Ceremony'}
        '400': {$ref: '#/components/responses/BadJSON'}
        '401': {$ref: '#/components/responses/Unauthenticated'}
        '403': {$ref: '#/components/responses/CrossSite'}
        '422': {$ref: '#/components/responses/Invalid'}
  /me/passkeys/finish:
    post:
      tags: [Account]
      operationId: finishAddPasskey
      summary: Save the new passkey or security key
      security: *personal
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [ceremony, credential]
              properties:
                ceremony: {type: string}
                credential: {type: object}
                label: {type: string}
      responses:
        '200':
          description: The new sign-in method.
          content:
            application/json:
              schema: {$ref: '#/components/schemas/Method'}
        '400': {$ref: '#/components/responses/RegistrationFailed'}
        '401': {$ref: '#/components/responses/Unauthenticated'}
        '403': {$ref: '#/components/responses/CrossSite'}
  /me/methods/{id}:
    parameters:
      - {$ref: '#/components/parameters/Id'}
    delete:
      tags: [Account]
      operationId: removeMyMethod
      summary: Remove one of your sign-in methods
      description: The id `recovery-codes` removes your recovery codes.
      security: *personal
      responses:
        '204': {$ref: '#/components/responses/NoContent'}
        '401': {$ref: '#/components/responses/Unauthenticated'}
        '403': {$ref: '#/components/responses/CrossSite'}
        '404': {$ref: '#/components/responses/NotFound'}
        '409': {$ref: '#/components/responses/LastMethod'}
  /me/avatar:
    put:
      tags: [Account]
      operationId: uploadMyAvatar
      summary: Set your profile picture
      description: Send the image bytes as the body, PNG, JPEG or WebP, at most 512 KB. Halo detects the type from the content. Applications that request the `profile` scope receive the picture's URL as the `picture` claim, and SAML assertions include it as a `picture` attribute.
      security: *personal
      requestBody:
        required: true
        content:
          image/png:
            schema: {type: string, contentMediaType: image/png}
          image/jpeg:
            schema: {type: string, contentMediaType: image/jpeg}
          image/webp:
            schema: {type: string, contentMediaType: image/webp}
      responses:
        '200':
          description: The picture URL, including a version so caches fetch the new image.
          content:
            application/json:
              schema:
                type: object
                required: [avatarUrl]
                properties:
                  avatarUrl: {type: string, examples: ['/api/v1/users/usr_01J9Z8Q4M2N5P7R9T1V3X5Z7B9/avatar?v=1790000000']}
        '401': {$ref: '#/components/responses/Unauthenticated'}
        '403': {$ref: '#/components/responses/CrossSite'}
        '413':
          description: '`ERR_TOO_LARGE`: the image is larger than 512 KB.'
          content:
            application/json:
              schema: {$ref: '#/components/schemas/Error'}
        '422': {$ref: '#/components/responses/Invalid'}
    delete:
      tags: [Account]
      operationId: removeMyAvatar
      summary: Remove your profile picture
      security: *personal
      responses:
        '200':
          description: The picture was removed.
          content:
            application/json:
              schema:
                type: object
                required: [avatarUrl]
                properties:
                  avatarUrl: {type: 'null'}
        '401': {$ref: '#/components/responses/Unauthenticated'}
        '403': {$ref: '#/components/responses/CrossSite'}
        '404': {$ref: '#/components/responses/NotFound'}
  /me/totp/begin:
    post:
      tags: [Account]
      operationId: beginTOTP
      summary: Start adding an authenticator app
      security: *personal
      responses:
        '200':
          description: The ceremony, the shared secret and an otpauth URI for a QR code.
          content:
            application/json:
              schema:
                type: object
                required: [ceremony, secret, uri]
                properties:
                  ceremony: {type: string}
                  secret: {type: string, description: Base32 secret.}
                  uri: {type: string, examples: ['otpauth://totp/Halo:sam@example.com?issuer=Halo&secret=…']}
        '401': {$ref: '#/components/responses/Unauthenticated'}
        '403': {$ref: '#/components/responses/CrossSite'}
  /me/totp/confirm:
    post:
      tags: [Account]
      operationId: confirmTOTP
      summary: Confirm the authenticator app with a current code
      security: *personal
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [ceremony, code]
              properties:
                ceremony: {type: string}
                code: {type: string, examples: ['123456']}
                label: {type: string, default: Authenticator app}
      responses:
        '200':
          description: The new sign-in method.
          content:
            application/json:
              schema: {$ref: '#/components/schemas/Method'}
        '400':
          description: '`ERR_CEREMONY_EXPIRED` or `ERR_INVALID_JSON`.'
          content:
            application/json:
              schema: {$ref: '#/components/schemas/Error'}
        '401':
          description: '`ERR_UNAUTHENTICATED`, or `ERR_CODE_MISMATCH` when the code did not match.'
          content:
            application/json:
              schema: {$ref: '#/components/schemas/Error'}
        '403': {$ref: '#/components/responses/CrossSite'}
  /me/recovery-codes:
    post:
      tags: [Account]
      operationId: createRecoveryCodes
      summary: Create new recovery codes
      description: Replaces every earlier code. Halo shows the codes only in this response.
      security: *personal
      responses:
        '200':
          description: The new codes.
          content:
            application/json:
              schema:
                type: object
                required: [codes]
                properties:
                  codes:
                    type: array
                    items: {type: string}
        '401': {$ref: '#/components/responses/Unauthenticated'}
        '403': {$ref: '#/components/responses/CrossSite'}
  /me/sessions:
    get:
      tags: [Account]
      operationId: listMySessions
      summary: List your active sessions
      security: *personal
      responses:
        '200':
          description: Your sessions. `current` marks the one making the request.
          content:
            application/json:
              schema:
                type: array
                items: {$ref: '#/components/schemas/Session'}
        '401': {$ref: '#/components/responses/Unauthenticated'}
  /me/sessions/{id}:
    parameters:
      - {$ref: '#/components/parameters/Id'}
    delete:
      tags: [Account]
      operationId: revokeMySession
      summary: End one of your sessions
      description: Ending the current session also clears its cookie.
      security: *personal
      responses:
        '204': {$ref: '#/components/responses/NoContent'}
        '401': {$ref: '#/components/responses/Unauthenticated'}
        '403': {$ref: '#/components/responses/CrossSite'}
        '404': {$ref: '#/components/responses/NotFound'}
  /me/sessions/revoke-others:
    post:
      tags: [Account]
      operationId: revokeMyOtherSessions
      summary: End every session except the current one
      security: *personal
      responses:
        '200': {$ref: '#/components/responses/Revoked'}
        '401': {$ref: '#/components/responses/Unauthenticated'}
        '403': {$ref: '#/components/responses/CrossSite'}
  /me/applications:
    get:
      tags: [Account]
      operationId: listMyApplications
      summary: List the active applications you can sign in to
      security: *personal
      responses:
        '200':
          description: Your applications.
          content:
            application/json:
              schema:
                type: array
                items: {$ref: '#/components/schemas/MyApplication'}
        '401': {$ref: '#/components/responses/Unauthenticated'}
  /me/groups:
    get:
      tags: [Account]
      operationId: listMyGroups
      summary: List the groups you belong to
      security: *personal
      responses:
        '200':
          description: Your groups.
          content:
            application/json:
              schema:
                type: array
                items: {$ref: '#/components/schemas/Group'}
        '401': {$ref: '#/components/responses/Unauthenticated'}
  /me/sign-ins:
    get:
      tags: [Account]
      operationId: listMySignIns
      summary: List your 100 most recent sign-in events
      security: *personal
      responses:
        '200':
          description: Your sign-in events, newest first.
          content:
            application/json:
              schema:
                type: array
                items: {$ref: '#/components/schemas/SignInEvent'}
        '401': {$ref: '#/components/responses/Unauthenticated'}
  /me/identities:
    get:
      tags: [Account]
      operationId: listMyIdentities
      summary: List the identity provider accounts linked to you
      security: *personal
      responses:
        '200':
          description: Your linked accounts.
          content:
            application/json:
              schema:
                type: array
                items: {$ref: '#/components/schemas/FederatedIdentity'}
        '401': {$ref: '#/components/responses/Unauthenticated'}
  /me/identities/{id}:
    parameters:
      - {$ref: '#/components/parameters/Id'}
    delete:
      tags: [Account]
      operationId: unlinkMyIdentity
      summary: Unlink an identity provider account
      description: Refused when it is your last way to sign in. Recovery codes do not count.
      security: *personal
      responses:
        '204': {$ref: '#/components/responses/NoContent'}
        '401': {$ref: '#/components/responses/Unauthenticated'}
        '403': {$ref: '#/components/responses/CrossSite'}
        '404': {$ref: '#/components/responses/NotFound'}
        '409': {$ref: '#/components/responses/LastMethod'}
  /me/devices:
    get:
      tags: [Account]
      operationId: listMyDevices
      summary: List the browsers and devices you signed in from
      security: *personal
      responses:
        '200':
          description: Your devices. `current` marks the browser making the request.
          content:
            application/json:
              schema:
                type: array
                items: {$ref: '#/components/schemas/Device'}
        '401': {$ref: '#/components/responses/Unauthenticated'}
  /me/ssh/certificates:
    post:
      tags: [Account, SSH]
      operationId: issueSSHCertificate
      summary: Get an SSH user certificate for a public key
      description: Signs the key with Halo's SSH certificate authority for every principal mapped to your groups, valid for the configured lifetime. `halo ssh-cert` calls this route.
      security: *personal
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [publicKey]
              properties:
                publicKey: {type: string, description: An OpenSSH public key. RSA keys need at least 2048 bits., examples: ['ssh-ed25519 AAAAC3NzaC1lZDI1NTE5AAAAI… sam@laptop']}
      responses:
        '201':
          description: The certificate.
          content:
            application/json:
              schema: {$ref: '#/components/schemas/SSHCertificateIssued'}
        '400': {$ref: '#/components/responses/BadJSON'}
        '401': {$ref: '#/components/responses/Unauthenticated'}
        '403':
          description: '`ERR_NO_PRINCIPALS`: none of your groups maps to a server account. Also `ERR_CROSS_SITE`.'
          content:
            application/json:
              schema: {$ref: '#/components/schemas/Error'}
        '422': {$ref: '#/components/responses/Invalid'}
  /me/access-packages:
    get:
      tags: [Account, Access requests]
      operationId: listRequestablePackages
      summary: List the access packages you can request
      description: Every package that is not archived.
      security: *personal
      responses:
        '200':
          description: The packages.
          content:
            application/json:
              schema:
                type: array
                items: {$ref: '#/components/schemas/AccessPackage'}
        '401': {$ref: '#/components/responses/Unauthenticated'}
  /me/access-requests:
    get:
      tags: [Account, Access requests]
      operationId: listMyRequests
      summary: List your access requests
      security: *personal
      responses:
        '200':
          description: Your requests, newest first.
          content:
            application/json:
              schema:
                type: array
                items: {$ref: '#/components/schemas/AccessRequest'}
        '401': {$ref: '#/components/responses/Unauthenticated'}
    post:
      tags: [Account, Access requests]
      operationId: createAccessRequest
      summary: Request an access package
      description: Emails the package's approvers. Approvers cannot decide their own requests.
      security: *personal
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [packageId]
              properties:
                packageId: {type: string}
                durationDays:
                  type: [integer, 'null']
                  minimum: 1
                  maximum: 365
                  description: How long you need access. Required, and at most the package's `maxDays`, when the package sets one. `null` asks for access until it is revoked.
                justification: {type: string, maxLength: 2000, description: 'Required when the package sets `requireJustification`.'}
      responses:
        '201':
          description: The pending request.
          content:
            application/json:
              schema: {$ref: '#/components/schemas/AccessRequest'}
        '400': {$ref: '#/components/responses/BadJSON'}
        '401': {$ref: '#/components/responses/Unauthenticated'}
        '403': {$ref: '#/components/responses/CrossSite'}
        '409':
          description: '`ERR_CONFLICT`: the package is archived, or you already have a pending request for it.'
          content:
            application/json:
              schema: {$ref: '#/components/schemas/Error'}
        '422': {$ref: '#/components/responses/Invalid'}
  /me/access-requests/{id}/cancel:
    parameters:
      - {$ref: '#/components/parameters/Id'}
    post:
      tags: [Account, Access requests]
      operationId: cancelAccessRequest
      summary: Cancel your pending request
      security: *personal
      responses:
        '200':
          description: The cancelled request.
          content:
            application/json:
              schema: {$ref: '#/components/schemas/AccessRequest'}
        '401': {$ref: '#/components/responses/Unauthenticated'}
        '403': {$ref: '#/components/responses/CrossSite'}
        '404': {$ref: '#/components/responses/NotFound'}
        '409': {$ref: '#/components/responses/Conflict'}
  /me/access-grants:
    get:
      tags: [Account, Access requests]
      operationId: listMyGrants
      summary: List your active access grants
      description: Approved requests that have not expired or been revoked.
      security: *personal
      responses:
        '200':
          description: Your grants.
          content:
            application/json:
              schema:
                type: array
                items: {$ref: '#/components/schemas/AccessRequest'}
        '401': {$ref: '#/components/responses/Unauthenticated'}
  /me/approvals:
    get:
      tags: [Account, Access requests]
      operationId: listMyApprovals
      summary: List the pending requests you can decide
      security: *personal
      responses:
        '200':
          description: Pending requests where you are an approver and not the requester, or every pending request for a global administrator.
          content:
            application/json:
              schema:
                type: array
                items: {$ref: '#/components/schemas/AccessRequest'}
        '401': {$ref: '#/components/responses/Unauthenticated'}
  /me/reviews:
    get:
      tags: [Account, Access reviews]
      operationId: listMyReviews
      summary: List the open access reviews you are a reviewer of
      security: *personal
      responses:
        '200':
          description: Your open reviews, without their items.
          content:
            application/json:
              schema:
                type: array
                items: {$ref: '#/components/schemas/AccessReview'}
        '401': {$ref: '#/components/responses/Unauthenticated'}
  /users:
    get:
      tags: [Users]
      operationId: listUsers
      summary: List every person
      description: 'Roles: any administrator. Service accounts are not included.'
      responses:
        '200':
          description: Every person, sorted by name.
          content:
            application/json:
              schema:
                type: array
                items: {$ref: '#/components/schemas/User'}
        '401': {$ref: '#/components/responses/Unauthenticated'}
        '403': {$ref: '#/components/responses/Forbidden'}
    post:
      tags: [Users]
      operationId: inviteUser
      summary: Invite a person
      description: 'Roles: user administrator. Creates the account with status `invited` and a setup link, and emails the link when SMTP is configured.'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [email, name]
              properties:
                email: {type: string, format: email, maxLength: 254}
                name: {type: string, maxLength: 200}
                title: {type: string, maxLength: 200}
                department: {type: string, maxLength: 200}
                location: {type: string, maxLength: 200}
                managerId: {type: string, description: Id of another person.}
                groupIds:
                  type: array
                  description: Assigned groups only.
                  items: {type: string}
      responses:
        '201':
          description: The new person and their setup link.
          content:
            application/json:
              schema:
                type: object
                required: [user, enrollUrl, expiresAt, emailed]
                properties:
                  user: {$ref: '#/components/schemas/User'}
                  enrollUrl: {type: string, format: uri}
                  expiresAt: {type: string, format: date-time}
                  emailed: {type: boolean, description: True when Halo also emailed the link.}
        '400': {$ref: '#/components/responses/BadJSON'}
        '401': {$ref: '#/components/responses/Unauthenticated'}
        '403': {$ref: '#/components/responses/Forbidden'}
        '409': {$ref: '#/components/responses/Conflict'}
        '422': {$ref: '#/components/responses/Invalid'}
  /users/{id}:
    parameters:
      - {$ref: '#/components/parameters/Id'}
    get:
      tags: [Users]
      operationId: getUser
      summary: Get one person
      description: 'Roles: any administrator.'
      responses:
        '200':
          description: The person.
          content:
            application/json:
              schema: {$ref: '#/components/schemas/User'}
        '401': {$ref: '#/components/responses/Unauthenticated'}
        '403': {$ref: '#/components/responses/Forbidden'}
        '404': {$ref: '#/components/responses/NotFound'}
    patch:
      tags: [Users]
      operationId: updateUser
      summary: Change a person's profile
      description: 'Roles: user or helpdesk administrator. Helpdesk administrators can change title, department and location only. Only a global administrator can change a person who holds an administrator role. Send only the fields to change; an empty `managerId` removes the manager.'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                email: {type: string, format: email}
                name: {type: string, maxLength: 200}
                title: {type: string, maxLength: 200}
                department: {type: string, maxLength: 200}
                location: {type: string, maxLength: 200}
                managerId: {type: string}
      responses:
        '200':
          description: The updated person.
          content:
            application/json:
              schema: {$ref: '#/components/schemas/User'}
        '400': {$ref: '#/components/responses/BadJSON'}
        '401': {$ref: '#/components/responses/Unauthenticated'}
        '403': {$ref: '#/components/responses/Forbidden'}
        '404': {$ref: '#/components/responses/NotFound'}
        '409': {$ref: '#/components/responses/Conflict'}
        '422': {$ref: '#/components/responses/Invalid'}
  /users/{id}/avatar:
    parameters:
      - {$ref: '#/components/parameters/Id'}
    get:
      tags: [Users]
      operationId: getUserAvatar
      summary: Get a person's profile picture
      description: No authentication. This is the URL in the OpenID Connect `picture` claim and the SAML `picture` attribute. The `v` query is a cache version.
      security: []
      responses:
        '200':
          description: The picture. Cached for one day.
          content:
            image/png:
              schema: {type: string, contentMediaType: image/png}
            image/jpeg:
              schema: {type: string, contentMediaType: image/jpeg}
            image/webp:
              schema: {type: string, contentMediaType: image/webp}
        '404': {$ref: '#/components/responses/NotFound'}
    put:
      tags: [Users]
      operationId: uploadUserAvatar
      summary: Set a person's profile picture
      description: 'Roles: user or helpdesk administrator. Only a global administrator can change the picture of a person who holds an administrator role. Send the image bytes as the body: PNG, JPEG or WebP, at most 512 KB.'
      requestBody:
        required: true
        content:
          image/png:
            schema: {type: string, contentMediaType: image/png}
          image/jpeg:
            schema: {type: string, contentMediaType: image/jpeg}
          image/webp:
            schema: {type: string, contentMediaType: image/webp}
      responses:
        '200':
          description: The picture URL.
          content:
            application/json:
              schema:
                type: object
                required: [avatarUrl]
                properties:
                  avatarUrl: {type: string}
        '401': {$ref: '#/components/responses/Unauthenticated'}
        '403': {$ref: '#/components/responses/Forbidden'}
        '404': {$ref: '#/components/responses/NotFound'}
        '413':
          description: '`ERR_TOO_LARGE`: the image is larger than 512 KB.'
          content:
            application/json:
              schema: {$ref: '#/components/schemas/Error'}
        '422': {$ref: '#/components/responses/Invalid'}
    delete:
      tags: [Users]
      operationId: removeUserAvatar
      summary: Remove a person's profile picture
      description: 'Roles: user or helpdesk administrator. Only a global administrator can remove the picture of a person who holds an administrator role.'
      responses:
        '200':
          description: The picture was removed.
          content:
            application/json:
              schema:
                type: object
                required: [avatarUrl]
                properties:
                  avatarUrl: {type: 'null'}
        '401': {$ref: '#/components/responses/Unauthenticated'}
        '403': {$ref: '#/components/responses/Forbidden'}
        '404': {$ref: '#/components/responses/NotFound'}
  /users/{id}/sessions:
    parameters:
      - {$ref: '#/components/parameters/Id'}
    get:
      tags: [Users]
      operationId: listUserSessions
      summary: List a person's active sessions
      description: 'Roles: any administrator.'
      responses:
        '200':
          description: The sessions.
          content:
            application/json:
              schema:
                type: array
                items: {$ref: '#/components/schemas/Session'}
        '401': {$ref: '#/components/responses/Unauthenticated'}
        '403': {$ref: '#/components/responses/Forbidden'}
        '404': {$ref: '#/components/responses/NotFound'}
  /users/{id}/sign-ins:
    parameters:
      - {$ref: '#/components/parameters/Id'}
    get:
      tags: [Users]
      operationId: listUserSignIns
      summary: List a person's sign-in events
      description: 'Roles: any administrator. The 500 most recent.'
      responses:
        '200':
          description: The events, newest first.
          content:
            application/json:
              schema:
                type: array
                items: {$ref: '#/components/schemas/SignInEvent'}
        '401': {$ref: '#/components/responses/Unauthenticated'}
        '403': {$ref: '#/components/responses/Forbidden'}
        '404': {$ref: '#/components/responses/NotFound'}
  /users/{id}/suspend:
    parameters:
      - {$ref: '#/components/parameters/Id'}
    post:
      tags: [Users]
      operationId: suspendUser
      summary: Suspend a person and end their sessions
      description: 'Roles: user or security administrator. Refused for your own account and for the last active global administrator.'
      responses:
        '200': {$ref: '#/components/responses/UserResponse'}
        '401': {$ref: '#/components/responses/Unauthenticated'}
        '403': {$ref: '#/components/responses/Forbidden'}
        '404': {$ref: '#/components/responses/NotFound'}
        '422': {$ref: '#/components/responses/Invalid'}
  /users/{id}/restore:
    parameters:
      - {$ref: '#/components/parameters/Id'}
    post:
      tags: [Users]
      operationId: restoreUser
      summary: Restore a suspended person
      description: 'Roles: user administrator. The person becomes `active`, or `invited` when they never signed in and have no sign-in method.'
      responses:
        '200': {$ref: '#/components/responses/UserResponse'}
        '401': {$ref: '#/components/responses/Unauthenticated'}
        '403': {$ref: '#/components/responses/Forbidden'}
        '404': {$ref: '#/components/responses/NotFound'}
        '409': {$ref: '#/components/responses/Conflict'}
  /users/{id}/revoke-sessions:
    parameters:
      - {$ref: '#/components/parameters/Id'}
    post:
      tags: [Users]
      operationId: revokeUserSessions
      summary: End a person's sessions
      description: 'Roles: user, helpdesk or security administrator. When you target yourself, your current session stays.'
      responses:
        '200': {$ref: '#/components/responses/Revoked'}
        '401': {$ref: '#/components/responses/Unauthenticated'}
        '403': {$ref: '#/components/responses/Forbidden'}
        '404': {$ref: '#/components/responses/NotFound'}
  /users/{id}/reset-authentication:
    parameters:
      - {$ref: '#/components/parameters/Id'}
    post:
      tags: [Users]
      operationId: resetAuthentication
      summary: Remove every sign-in method and create a new setup link
      description: 'Roles: user or helpdesk administrator. Also ends every session and emails the link when SMTP is configured.'
      responses:
        '200':
          description: The new setup link.
          content:
            application/json:
              schema:
                type: object
                required: [enrollUrl, expiresAt, emailed]
                properties:
                  enrollUrl: {type: string, format: uri}
                  expiresAt: {type: string, format: date-time}
                  emailed: {type: boolean}
        '401': {$ref: '#/components/responses/Unauthenticated'}
        '403': {$ref: '#/components/responses/Forbidden'}
        '404': {$ref: '#/components/responses/NotFound'}
  /users/{id}/methods/{methodId}:
    parameters:
      - {$ref: '#/components/parameters/Id'}
      - name: methodId
        in: path
        required: true
        schema: {type: string}
    delete:
      tags: [Users]
      operationId: deleteUserMethod
      summary: Remove one of a person's sign-in methods
      description: 'Roles: user or helpdesk administrator.'
      responses:
        '204': {$ref: '#/components/responses/NoContent'}
        '401': {$ref: '#/components/responses/Unauthenticated'}
        '403': {$ref: '#/components/responses/Forbidden'}
        '404': {$ref: '#/components/responses/NotFound'}
  /users/{id}/roles:
    parameters:
      - {$ref: '#/components/parameters/Id'}
    put:
      tags: [Users]
      operationId: setUserRoles
      summary: Replace a person's administrator roles
      description: 'Roles: global administrator. Send the complete list; an empty list removes every role. You cannot remove your own global administrator role.'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [roles]
              properties:
                roles:
                  type: array
                  items: {$ref: '#/components/schemas/RoleKey'}
      responses:
        '200': {$ref: '#/components/responses/UserResponse'}
        '400': {$ref: '#/components/responses/BadJSON'}
        '401': {$ref: '#/components/responses/Unauthenticated'}
        '403': {$ref: '#/components/responses/Forbidden'}
        '404': {$ref: '#/components/responses/NotFound'}
        '422': {$ref: '#/components/responses/Invalid'}
  /groups:
    get:
      tags: [Groups]
      operationId: listGroups
      summary: List every group with its member count
      description: 'Roles: any administrator.'
      responses:
        '200':
          description: The groups.
          content:
            application/json:
              schema:
                type: array
                items: {$ref: '#/components/schemas/Group'}
        '401': {$ref: '#/components/responses/Unauthenticated'}
        '403': {$ref: '#/components/responses/Forbidden'}
    post:
      tags: [Groups]
      operationId: createGroup
      summary: Create a group
      description: 'Roles: user administrator.'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [name, kind]
              properties:
                name: {type: string, maxLength: 200}
                description: {type: string, maxLength: 2000}
                kind: {type: string, enum: [assigned, dynamic]}
                rule: {type: string, description: Required for dynamic groups., examples: ['user.department == "Engineering"']}
      responses:
        '201':
          description: The group.
          content:
            application/json:
              schema: {$ref: '#/components/schemas/Group'}
        '400': {$ref: '#/components/responses/BadJSON'}
        '401': {$ref: '#/components/responses/Unauthenticated'}
        '403': {$ref: '#/components/responses/Forbidden'}
        '409': {$ref: '#/components/responses/Conflict'}
        '422': {$ref: '#/components/responses/Invalid'}
  /groups/{id}:
    parameters:
      - {$ref: '#/components/parameters/Id'}
    get:
      tags: [Groups]
      operationId: getGroup
      summary: Get one group
      description: 'Roles: any administrator.'
      responses:
        '200':
          description: The group.
          content:
            application/json:
              schema: {$ref: '#/components/schemas/Group'}
        '401': {$ref: '#/components/responses/Unauthenticated'}
        '403': {$ref: '#/components/responses/Forbidden'}
        '404': {$ref: '#/components/responses/NotFound'}
    patch:
      tags: [Groups]
      operationId: updateGroup
      summary: Rename a group, or change its description or rule
      description: 'Roles: user administrator. The kind cannot change.'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                name: {type: string, maxLength: 200}
                description: {type: string, maxLength: 2000}
                kind: {type: string, enum: [assigned, dynamic], description: Accepted only when it equals the current kind.}
                rule: {type: string, description: Dynamic groups only.}
      responses:
        '200':
          description: The updated group.
          content:
            application/json:
              schema: {$ref: '#/components/schemas/Group'}
